const STORE='BAI301_BAI10_PROGRESS_V1';
const NOTE_STORE='BAI301_BAI10_NOTES_V1';
let state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};
const letters=['A','B','C','D'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:]/g,'')}
function key(sec,i){return `${sec}-${i}`}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function restoreProgress(showMsg=false){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&typeof x==='object'){state={...state,...x};if(showMsg)alert('Đã khôi phục tiến độ.')}}catch(e){}renderAll()}
function setAnswer(sec,i,v){state.answers[key(sec,i)]=v;delete state.checked[key(sec,i)];save();renderNav()}
function acceptedFor(it){return [it.answer,...(it.accepted||[])].filter(Boolean)}
function isAccepted(it,v){return acceptedFor(it).some(a=>norm(a)===norm(v))}
function sectionNames(){return ['','Phiên âm','Điền từ','Câu hỏi chính phản','Chọn từ điền','Hoàn thành đối thoại','Viết chữ Hán','Chữ có 心','Dịch Việt → Hoa']}
function itemCount(sec){
 const ex=exercises[sec-1];
 if(sec===5)return ex.groups.reduce((n,g)=>n+g.items.length,0);
 return ex.data?ex.data.length:0;
}
function dialogueFlat(){return exercises[4].groups.flatMap(g=>g.items)}
function answeredCount(sec){let n=0,t=itemCount(sec);for(let i=0;i<t;i++)if(String(state.answers[key(sec,i)]??'').trim())n++;return n}
function totalCount(){let n=0;for(let s=1;s<=8;s++)n+=itemCount(s);return n}
function totalAnswered(){let n=0;for(let s=1;s<=8;s++)n+=answeredCount(s);return n}
function renderNav(){let h='';for(let s=1;s<=8;s++)h+=`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`;document.getElementById('sectionNav').innerHTML=h}
function goSection(s){if(s<1||s>8)return;state.section=s;save();renderSection();renderNav()}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
function clearOne(sec,i){delete state.answers[key(sec,i)];delete state.checked[key(sec,i)];save();renderSection();renderNav()}
function checkOne(sec,i){state.checked[key(sec,i)]=true;save();renderSection();renderNav()}
function standardFeedback(sec,i,it,label='Đáp án tham khảo'){
 if(!state.checked[key(sec,i)])return `<div class="feedback" id="fb-${sec}-${i}"></div>`;
 const ok=isAccepted(it,state.answers[key(sec,i)]||'');
 return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Đúng':'△ Chưa khớp đáp án tham khảo'}</div><div><b>${label}:</b> <span class="correct-answer">${esc(it.answer)}</span></div>${it.ex?`<div><b>Giải thích:</b> ${esc(it.ex)}</div>`:''}</div>`
}
function cardClass(sec,i,it){if(!state.checked[key(sec,i)])return 'question-card';return 'question-card checked '+(isAccepted(it,state.answers[key(sec,i)]||'')?'correct':'wrong')}
function selectOptions(arr,val,placeholder='-- Chọn --'){return `<option value="">${placeholder}</option>`+arr.map(x=>`<option value="${esc(x)}" ${val===x?'selected':''}>${esc(x)}</option>`).join('')}

function renderPinyin(ex){let h=`<div class="section-instruction"><strong>给下面的词注音</strong><br>Phiên âm cho những từ dưới đây</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(1,i)]||'';h+=`<div class="${cardClass(1,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="hanzi-big">${esc(it.hanzi)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(1,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(1,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(1,${i})">Làm lại câu</button></div>${standardFeedback(1,i,it)}</div>`});return h}
function renderFill(ex){let h=`<div class="section-instruction"><strong>用上面的词填空</strong><br>Dùng những từ ngữ trên điền vào chỗ trống.<div class="word-bank">${ex.wordBank.map(w=>`<span class="word-chip">${esc(w)}</span>`).join('')}</div></div>`;
 h+=`<div class="question-card"><div class="qtext" style="line-height:2"><div style="display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px;margin-bottom:8px">${ex.mapRows.flatMap((row,ri)=>row.map((x,ci)=>`<div style="grid-column:${ci+1};grid-row:${ri+1};padding:7px;border:1px solid #e0e0e0;border-radius:4px;text-align:center">${esc(x)}</div>`)).join('')}</div><div class="muted">Hướng lên là hướng bắc, hướng qua phải là hướng đông.</div></div></div>`;
 let idx=0;h+=`<div class="question-card"><div class="passage" style="line-height:2.7">`;ex.pieces.forEach(p=>{if(typeof p==='number'){const i=p,it=ex.data[i],v=state.answers[key(2,i)]||'';h+=`<select class="input-text" style="display:inline-block;width:auto;min-width:110px;max-width:145px;margin:0 3px;padding:5px 7px" onchange="setAnswer(2,${i},this.value)">${selectOptions(ex.wordBank,v,`(${i+1})`)}</select>`}else h+=esc(p)});h+=`</div></div>`;
 ex.data.forEach((it,i)=>{const checked=!!state.checked[key(2,i)],ok=isAccepted(it,state.answers[key(2,i)]||'');h+=`<div class="question-card ${checked?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">Chỗ trống ${i+1}</div></div><div class="check-row"><button class="check-btn" onclick="checkOne(2,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(2,${i})">Làm lại câu</button></div>${standardFeedback(2,i,it)}</div>`});return h}
function renderZhengfan(ex){let h=`<div class="section-instruction"><strong>${esc(ex.sourceNote)}</strong><br>Dựa vào phần mở rộng của Bài 10, đặt 4 câu hỏi chính phản.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(3,i)]||'',checked=!!state.checked[key(3,i)];h+=`<div class="${cardClass(3,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">————————————————————</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(3,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(3,${i})">Đối chiếu câu</button><button class="clear-btn" onclick="clearOne(3,${i})">Làm lại câu</button></div>${checked?`<div class="feedback show ${isAccepted(it,v)?'correct':'sample'}"><div class="status">${isAccepted(it,v)?'✓ Khớp mẫu tham khảo':'△ Chưa khớp mẫu tham khảo'}</div><div><b>Đáp án tham khảo GPT:</b> <span class="correct-answer">${esc(it.answer)}</span></div><div><b>Giải thích:</b> ${esc(it.ex)}</div><div class="muted">Nguồn DOCX chỉ dẫn chiếu sang phần “扩展”, nhưng không kèm nội dung đoạn đó; câu trên là mẫu GPT để luyện cấu trúc 正反疑问句, không phải đáp án trích từ sách.</div></div>`:''}</div>`});return h}
function renderChoose(ex){let h=`<div class="section-instruction"><strong>选词填空</strong><br>Chọn từ điền vào chỗ trống.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(4,i)]||'',checked=!!state.checked[key(4,i)],ok=isAccepted(it,v);h+=`<div class="question-card ${checked?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.sentence)}</div></div><div class="options-horizontal">${it.options.map((o,j)=>`<label class="option"><input type="radio" name="choose-${i}" value="${esc(o)}" ${v===o?'checked':''} onchange="setAnswer(4,${i},this.value)"><span class="letter">${letters[j]||''}.</span><span class="option-text">${esc(o)}</span></label>`).join('')}</div><div class="check-row"><button class="check-btn" onclick="checkOne(4,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(4,${i})">Làm lại câu</button></div>${standardFeedback(4,i,it)}</div>`});return h}
function dInput(flatIndex,w=250){return `<input class="input-text" style="display:inline-block;width:min(${w}px,70vw);margin:2px 4px" value="${esc(state.answers[key(5,flatIndex)]||'')}" oninput="setAnswer(5,${flatIndex},this.value)">`}
function renderDialogue(ex){let h=`<div class="section-instruction"><strong>完成对话</strong><br>Hoàn thành đối thoại.</div>`;let offset=0;ex.groups.forEach((g,gi)=>{const inds=g.items.map((_,j)=>offset+j);let lineHtml='';g.lines.forEach(line=>{let [sp,a,b,c]=line;if(typeof b==='number')lineHtml+=`<div><b>${esc(sp)}：</b>${esc(a)}${dInput(inds[b])}${esc(c||'')}</div>`;else lineHtml+=`<div><b>${esc(sp)}：</b>${esc(a)}</div>`});const checked=inds.some(i=>state.checked[key(5,i)]);const all=inds.every((i,j)=>isAccepted(g.items[j],state.answers[key(5,i)]||''));let fb='';if(checked){fb=`<div class="feedback show ${all?'correct':'sample'}">`+g.items.map((it,j)=>{const i=inds[j],ok=isAccepted(it,state.answers[key(5,i)]||'');return `<div style="margin:6px 0"><b>${j+1}.</b> ${ok?'✓':'△'} Đáp án tham khảo: <span class="correct-answer">${esc(it.answer)}</span><br><b>Giải thích:</b> ${esc(it.ex)}</div>`}).join('')+'</div>'}h+=`<div class="question-card ${checked?'checked '+(all?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${gi+1}</div><div class="qtext" style="line-height:2">${lineHtml}</div></div><div class="check-row"><button class="check-btn" onclick="checkDialogue([${inds.join(',')}])">Kiểm tra đoạn</button></div>${fb}</div>`;offset+=g.items.length});return h}
function checkDialogue(inds){inds.forEach(i=>state.checked[key(5,i)]=true);save();renderSection();renderNav()}
function renderHanzi(ex){let h=`<div class="section-instruction"><strong>根据拼音写出汉字</strong><br>Viết chữ Hán dựa theo phiên âm.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(6,i)]||'';h+=`<div class="${cardClass(6,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.pinyin)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(6,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(6,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(6,${i})">Làm lại câu</button></div>${standardFeedback(6,i,it)}</div>`});return h}
function renderRadical(ex){let h=`<div class="section-instruction"><strong>请写出含有偏旁 “心” 的汉子</strong><br>Viết những chữ Hán có chứa thiên bàng “心”.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(7,i)]||'';h+=`<div class="${cardClass(7,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.prompt)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(7,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(7,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(7,${i})">Làm lại câu</button></div>${standardFeedback(7,i,it)}</div>`});return h}
function renderTranslation(ex){let h=`<div class="section-instruction"><strong>越汉翻译练习</strong><br>Luyện dịch Việt → Hoa.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(8,i)]||'';h+=`<div class="${cardClass(8,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAnswer(8,${i},this.value)">${esc(v)}</textarea><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Đối chiếu câu</button><button class="clear-btn" onclick="clearOne(8,${i})">Làm lại câu</button></div>${standardFeedback(8,i,it)}</div>`});return h}
function renderSection(){const s=state.section,ex=exercises[s-1];document.getElementById('sectionBadge').textContent=`Bài ${s}`;document.getElementById('sectionTitle').textContent=ex.title;let h='';if(s===1)h=renderPinyin(ex);else if(s===2)h=renderFill(ex);else if(s===3)h=renderZhengfan(ex);else if(s===4)h=renderChoose(ex);else if(s===5)h=renderDialogue(ex);else if(s===6)h=renderHanzi(ex);else if(s===7)h=renderRadical(ex);else h=renderTranslation(ex);h+=`<div class="navigation-buttons"><button class="nav-btn" ${s===1?'disabled':''} onclick="goSection(${s-1})">← Bài trước</button><button class="nav-btn next" ${s===8?'disabled':''} onclick="goSection(${s+1})">Bài sau →</button></div>`;document.getElementById('contentBody').innerHTML=h}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;document.getElementById('progressText').textContent=`${a}/${t}`;document.getElementById('progressFill').style.width=p+'%'}
function openAnswerCard(){let h='',names=sectionNames();for(let s=1;s<=8;s++){let a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${esc(names[s])}<br><span class="muted">${a}/${t} đã làm</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restartExam(){if(!confirm('Xóa toàn bộ đáp án và làm lại từ đầu?'))return;try{localStorage.removeItem(STORE)}catch(e){}state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};renderAll()}
function submitExam(){let correct=0,scored=0;for(let sec=1;sec<=8;sec++){const ex=exercises[sec-1];if(sec===5){const items=dialogueFlat();items.forEach((it,i)=>{scored++;if(isAccepted(it,state.answers[key(5,i)]||''))correct++});continue}ex.data.forEach((it,i)=>{scored++;if(isAccepted(it,state.answers[key(sec,i)]||''))correct++})}const pct=scored?Math.round(correct/scored*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${scored}</div><div style="text-align:center;font-weight:700">Kết quả đối chiếu: ${pct}%</div><div style="margin-top:15px;line-height:1.7"><b>Tiến độ:</b> ${totalAnswered()}/${totalCount()} mục đã làm.<br><b>Lưu ý:</b> Bài đặt câu và dịch có thể có nhiều cách đúng; hệ thống đối chiếu với đáp án tham khảo GPT. Riêng Bài 3, nguồn DOCX không kèm đoạn “扩展” được dẫn chiếu.</div>`;document.getElementById('resultModal').classList.add('show')}
function tick(){const e=Math.floor((Date.now()-(state.startAt||Date.now()))/1000),m=Math.floor(e/60),s=e%60;document.getElementById('timerText').textContent=`Thời gian ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('timerProgress').style.width=Math.min(100,(e%3600)/36)+'%'}
let noteSaveTimer=null;
function openNoteEditor(){const o=document.getElementById('note-editor-overlay'),ed=document.getElementById('rich-editor');if(!o||!ed)return;try{const x=localStorage.getItem(NOTE_STORE);if(x!==null)ed.innerHTML=x}catch(e){}o.classList.add('show');document.body.classList.add('note-open');ed.focus()}
function closeNoteEditor(){const o=document.getElementById('note-editor-overlay');if(o)o.classList.remove('show');document.body.classList.remove('note-open')}
function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor')?.focus();scheduleNoteAutosave()}
function scheduleNoteAutosave(){clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>saveNotes(false),350)}
function saveNotes(closeAfter=false){const ed=document.getElementById('rich-editor');if(!ed)return;try{localStorage.setItem(NOTE_STORE,ed.innerHTML)}catch(e){}if(closeAfter)closeNoteEditor()}
function clearNoteEditor(){if(!confirm('Xóa toàn bộ ghi chú?'))return;const ed=document.getElementById('rich-editor');if(ed){ed.innerHTML='';ed.focus();scheduleNoteAutosave()}}
document.getElementById('rich-editor')?.addEventListener('input',scheduleNoteAutosave);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('note-editor-overlay')?.classList.contains('show'))closeNoteEditor()});
restoreProgress(false);setInterval(tick,1000);tick();
</script>
</body></html>
