function renderStudy(){return `<div class="section-instruction"><strong>熟读词语 — Đọc thuộc những cụm từ bên dưới.</strong><div class="muted">Pinyin và nghĩa Việt là phần hỗ trợ học tập bổ sung; chữ Hán và thứ tự cụm từ giữ theo nguồn Bài 16.</div></div><div class="read-grid">`+DATA.study.map(g=>`<div class="read-group"><div class="read-head">${g.head}</div><div class="read-pinyin">${g.p}</div><div class="read-meaning">${g.m}</div>${g.lines.map(x=>`<div class="read-line"><div class="read-cn">${x.cn}</div><div class="read-pinyin">${x.p}</div><div class="read-meaning">${x.m}</div></div>`).join('')}</div>`).join('')+'</div>'}
function part2Flat(){let out=[];DATA.fill2.forEach(x=>{if(Array.isArray(x.a))x.a.forEach((a,j)=>out.push({s:x.s,a,o:x.o,e:x.e[j]}));else out.push(x)});return out}
function renderPart2(){let h=`<div class="section-instruction"><strong>给下面的词注音，然后选词填空。</strong></div><div class="subsection-title">A. Phiên âm</div>`;DATA.pinyin.forEach((x,i)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${x[0]}</b></div></div>${inp(2,i)}<div class="check-row"><button class="check-btn" onclick="check(2,${i})">Kiểm tra</button></div>${fb(2,i,x[1],[x[1]],x[0]+' đọc '+x[1]+'.')}</div>`});let off=DATA.pinyin.length,flat=part2Flat();h+=`<div class="subsection-title">B. 选词填空 — Chọn từ điền vào chỗ trống</div>`;flat.forEach((x,j)=>{let i=off+j;h+=`<div class="question-card"><div class="qhead"><div class="qnum">${j+1}</div><div class="qtext">${x.s}</div></div>${radio(2,i,x.o)}<div class="check-row"><button class="check-btn" onclick="check(2,${i})">Kiểm tra câu</button></div>${fb(2,i,x.a,[x.a],x.e,false)}</div>`});return h}
function renderComplete(){return `<div class="section-instruction"><strong>完成句子 — Hoàn thành câu.</strong></div>`+DATA.complete3.map((x,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${x.s}</div></div>${inp(3,i)}<div class="check-row"><button class="check-btn" onclick="check(3,${i})">Đối chiếu</button></div>${fb(3,i,x.a,x.acc,x.e,true)}</div>`).join('')}
function renderDialogue(){let idx=0,h=`<div class="section-instruction"><strong>完成对话 — Hoàn thành đối thoại.</strong></div>`;DATA.dialogue.forEach((g,gi)=>{let ids=[];let lines=g.lines.map(line=>{if(!line.includes('____'))return `<div>${line}</div>`;let parts=line.split('____'),id=idx++;ids.push(id);return `<div>${parts[0]}<span style="display:inline-block;min-width:250px">${inp(4,id)}</span>${parts[1]||''}</div>`}).join('');h+=`<div class="question-card"><div class="qhead"><div class="qnum">${gi+1}</div><div class="qtext" style="width:100%;line-height:2.2">${lines}</div></div><div class="check-row"><button class="check-btn" onclick="checkGroup(${JSON.stringify(ids)})">Kiểm tra đoạn</button></div>${ids.some(id=>state.checked[key(4,id)])?`<div class="feedback show sample">${ids.map((id,j)=>`<div style="margin:8px 0"><b>Đáp án tham khảo:</b> <span class="correct-answer">${g.items[j].a}</span><br><b>Giải thích:</b> ${g.items[j].e}</div>`).join('')}</div>`:''}</div>`});return h}
function checkGroup(ids){ids.forEach(i=>state.checked[key(4,i)]=true);save();renderSection();renderNav()}
function renderErrors(){return `<div class="section-instruction"><strong>改错句 — Sửa câu sai.</strong></div>`+DATA.errors.map((x,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="wrong-sentence">${x.orig}</div></div></div>${inp(5,i)}<div class="check-row"><button class="check-btn" onclick="check(5,${i})">Kiểm tra câu</button></div>${state.checked[key(5,i)]?`<div class="feedback show sample"><div class="status">${acc(state.answers[key(5,i)]||'',x.acc)?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div><b>Lỗi sai:</b> ${x.err}</div><div><b>Đáp án tham khảo:</b> <span class="correct-answer">${x.a}</span></div><div><b>Vì sao sửa:</b> ${x.fix}</div></div>`:''}</div>`).join('')}
function renderHanzi(){return `<div class="section-instruction"><strong>根据拼音写出汉字 — Viết chữ Hán dựa theo Pinyin.</strong></div>`+DATA.hanzi.map((x,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${x.p}</b></div></div>${inp(6,i)}<div class="check-row"><button class="check-btn" onclick="check(6,${i})">Kiểm tra</button></div>${fb(6,i,x.a,x.acc,x.e,true)}</div>`).join('')}
function renderContext(){let h=`<div class="section-instruction"><strong>根据上下文的意思用词填空。</strong><div class="source-note">Nguồn có 6 số thứ tự nhưng còn 2 chỗ trống không đánh số; bản tương tác giữ đủ cả 8 chỗ, không tự bỏ.</div></div><div class="question-card"><div class="passage">${DATA.context.source}</div></div>`;DATA.context.items.forEach((x,i)=>h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${x.label}</div></div>${radio(7,i,x.o)}<div class="check-row"><button class="check-btn" onclick="check(7,${i})">Kiểm tra câu</button></div>${fb(7,i,x.a,[x.a],x.e,false)}</div>`);return h}
function renderRadical(){let h=`<div class="section-instruction"><strong>请写出含有偏旁 “氵” 或 “土” 的汉字</strong><div class="source-note">Nguồn tiếng Việt ghi nhầm “纟 / 人”, trong khi tiêu đề Trung và toàn bộ 7 mục bên dưới đều là 氵 / 土. Bản tương tác thao tác theo chính tiêu đề Trung + các mục nguồn, không đổi sang bộ khác.</div></div>`;DATA.radical.forEach((x,i)=>h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${x.pr}</div></div>${inp(8,i)}<div class="check-row"><button class="check-btn" onclick="check(8,${i})">Kiểm tra</button></div>${fb(8,i,x.a,[x.a],x.e,true)}</div>`);let ci=DATA.radical.length;h+=`<div class="section-instruction"><strong>你猜猜</strong><div>上下在一起，少了一个“一”。这是个什么字？</div></div><div class="question-card">${inp(8,ci)}<div class="check-row"><button class="check-btn" onclick="check(8,${ci})">Kiểm tra</button></div>${fb(8,ci,DATA.challenge.a,[DATA.challenge.a],DATA.challenge.e,true)}</div>`;return h}
function renderTrans(){return `<div class="section-instruction"><strong>越汉翻译练习 — Luyện dịch Việt → Hoa.</strong></div>`+DATA.trans.map((x,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${x[0]}</div></div><textarea class="input-area" oninput="setAns(9,${i},this.value)">${esc(state.answers[key(9,i)]||'')}</textarea><div class="check-row"><button class="check-btn" onclick="check(9,${i})">Đối chiếu</button></div>${fb(9,i,x[1],x[2],'Đây là đáp án tham khảo; có thể có cách dịch đúng tương đương.',true)}</div>`).join('')}
function renderSection(){let s=state.section;sectionBadge.textContent='Bài '+s;sectionTitle.textContent=sectionNames()[s];let h=s===1?renderStudy():s===2?renderPart2():s===3?renderComplete():s===4?renderDialogue():s===5?renderErrors():s===6?renderHanzi():s===7?renderContext():s===8?renderRadical():renderTrans();h+=`<div class="navigation-buttons"><button class="nav-btn" ${s===1?'disabled':''} onclick="goSection(${s-1})">← Bài trước</button><button class="nav-btn next" ${s===SECTION_COUNT?'disabled':''} onclick="goSection(${s+1})">Bài sau →</button></div>`;contentBody.innerHTML=h}
function itemCount(s){if(s===1)return 0;if(s===2)return DATA.pinyin.length+part2Flat().length;if(s===3)return DATA.complete3.length;if(s===4)return DATA.dialogue.reduce((n,g)=>n+g.items.length,0);if(s===5)return DATA.errors.length;if(s===6)return DATA.hanzi.length;if(s===7)return DATA.context.items.length;if(s===8)return DATA.radical.length+1;return DATA.trans.length}
function answeredCount(s){let n=0;for(let i=0;i<itemCount(s);i++)if(String(state.answers[key(s,i)]||'').trim())n++;return n}
function updateProgress(){let a=0,t=0;for(let s=1;s<=SECTION_COUNT;s++){a+=answeredCount(s);t+=itemCount(s)}progressText.textContent=a+'/'+t;progressFill.style.width=(t?a/t*100:0)+'%'}
function openAnswerCard(){answerGrid.innerHTML=Array.from({length:SECTION_COUNT},(_,i)=>i+1).map(s=>`<div class="answer-cell ${answeredCount(s)===itemCount(s)&&itemCount(s)?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${sectionNames()[s]}<br><span class="muted">${itemCount(s)?answeredCount(s)+'/'+itemCount(s)+' đã làm':'Tài liệu đọc'}</span></div>`).join('');answerModal.classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')} function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restoreProgress(show=false){try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x)Object.assign(state,x)}catch(e){}renderAll();if(show)alert('Đã khôi phục tiến độ (nếu có).')}
function restartExam(){if(!confirm('Làm lại toàn bộ Bài 16? Ghi chú vẫn được giữ.'))return;state.answers={};state.checked={};state.section=1;state.startAt=Date.now();save();renderAll()}
function submitExam(){let t=0,c=0;function add(ok){t++;if(ok)c++} DATA.pinyin.forEach((x,i)=>add(norm(state.answers[key(2,i)]||'')===norm(x[1])));part2Flat().forEach((x,j)=>add(norm(state.answers[key(2,DATA.pinyin.length+j)]||'')===norm(x.a)));DATA.complete3.forEach((x,i)=>add(acc(state.answers[key(3,i)]||'',x.acc)));let d=0;DATA.dialogue.forEach(g=>g.items.forEach(x=>add(acc(state.answers[key(4,d++)]||'',x.acc))));DATA.errors.forEach((x,i)=>add(acc(state.answers[key(5,i)]||'',x.acc)));DATA.hanzi.forEach((x,i)=>add(acc(state.answers[key(6,i)]||'',x.acc)));DATA.context.items.forEach((x,i)=>add(norm(state.answers[key(7,i)]||'')===norm(x.a)));DATA.radical.forEach((x,i)=>add(norm(state.answers[key(8,i)]||'')===norm(x.a)));add(norm(state.answers[key(8,DATA.radical.length)]||'')===norm(DATA.challenge.a));DATA.trans.forEach((x,i)=>add(acc(state.answers[key(9,i)]||'',x[2])));resultBody.innerHTML=`<div class="result-score">${c}/${t}</div><div style="text-align:center">Kết quả đối chiếu đáp án tham khảo.</div>`;resultModal.classList.add('show')}
function openNoteEditor(){richEditor=document.getElementById('rich-editor');richEditor.innerHTML=localStorage.getItem(NOTE_STORE)||'';document.getElementById('note-editor-overlay').classList.add('show');document.body.classList.add('note-open')}function closeNoteEditor(){document.getElementById('note-editor-overlay').classList.remove('show');document.body.classList.remove('note-open')}function saveNotes(show=false){localStorage.setItem(NOTE_STORE,document.getElementById('rich-editor').innerHTML);if(show)alert('Đã lưu ghi chú.')}function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor').focus()}function clearNoteEditor(){document.getElementById('rich-editor').innerHTML=''}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
setInterval(()=>{let s=Math.floor((Date.now()-state.startAt)/1000),m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');if(timerText)timerText.textContent='Thời gian '+m+':'+ss},1000);window.addEventListener('load',()=>restoreProgress(false));
</script></body></html>
