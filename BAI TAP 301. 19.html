const SECTION_COUNT=9, STORE='BAI_TAP_301_19_FINAL_V1', NOTE_STORE='BAI301_BAI19_NOTES_FINAL_V1';
const state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:；/]/g,'')}
function key(s,i){return s+'-'+i}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function setAns(s,i,v){state.answers[key(s,i)]=v;delete state.checked[key(s,i)];save();renderNav()}
function accepted(v,arr){return (arr||[]).some(a=>norm(a)===norm(v))}
function isOk(it,v){return accepted(v,it.acc||[it.a])}
function feedback(s,i,it,sample=false){if(!state.checked[key(s,i)])return '<div class="feedback"></div>';let v=state.answers[key(s,i)]||'',ok=isOk(it,v);return `<div class="feedback show ${ok?'correct':(sample||it.sample?'sample':'wrong')}"><div class="status">${ok?'✓ Đúng':'△ Chưa khớp đáp án tham khảo'}</div>${ok?'':`<div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.a)}</span></div>`}<div><b>Giải thích:</b> ${esc(it.e||'')}</div></div>`}
function check(s,i){state.checked[key(s,i)]=true;save();renderSection();renderNav()}
function clearOne(s,i){delete state.answers[key(s,i)];delete state.checked[key(s,i)];save();renderSection();renderNav()}
function inputBox(s,i,ph='Nhập câu trả lời'){return `<input class="input-text" value="${esc(state.answers[key(s,i)]||'')}" placeholder="${esc(ph)}" oninput="setAns(${s},${i},this.value)">`}
function radio(s,i,opts){let v=state.answers[key(s,i)]||'';return `<div class="radio-choice-list" role="radiogroup">${opts.map((o,j)=>`<label class="radio-choice"><input type="radio" name="q-${s}-${i}" value="${esc(o)}" ${norm(v)===norm(o)?'checked':''} onchange="setAns(${s},${i},this.value)"><span>${letters[j]}. ${esc(o)}</span></label>`).join('')}</div>`}
function sectionNames(){return ['','熟读词语','用上面的词填空','完成句子','组词成句','完成对话','根据拼音写汉字','根据上下文填空','忄 + 你会吗','越汉翻译']}
function renderNav(){document.getElementById('sectionNav').innerHTML=Array.from({length:SECTION_COUNT},(_,i)=>i+1).map(s=>`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`).join('')}
function goSection(s){if(s<1||s>SECTION_COUNT)return;state.section=s;save();renderNav();renderSection()}
function renderStudy(){return `<div class="section-instruction"><strong>熟读词语 — Đọc thuộc những cụm từ bên dưới.</strong><div class="muted">Pinyin và nghĩa tiếng Việt là phần hỗ trợ học tập được bổ sung; chữ Hán và thứ tự cụm từ giữ theo nguồn Bài 19.</div><div class="source-note">Nguồn ghi dòng Việt “Bài 18 : Chào mừng (2)”, trong khi tiêu đề Trung là 第十九课. Giao diện dùng số Bài 19 để đúng với tiêu đề Trung và vị trí file, đồng thời công khai bất nhất này.</div></div>`+DATA.study.map(g=>`<div class="question-card"><div class="qtext"><b style="font-size:27px">${esc(g.head)}</b><div style="color:#1976d2">${esc(g.p)}</div><div>${esc(g.m)}</div><div style="margin-top:10px">${g.lines.map(x=>`<div style="padding:7px 0;border-top:1px dashed #e2e2e2"><b>${esc(x.cn)}</b><br><span style="color:#1976d2">${esc(x.p)}</span><br><span>${esc(x.m)}</span>${x.note?`<div class="source-note">${esc(x.note)}</div>`:''}</div>`).join('')}</div></div></div>`).join('')}
function renderFill2(){let h=`<div class="section-instruction"><strong>用上面的词填空</strong><br>Dùng những từ/cụm từ ở trên điền vào chỗ trống. Theo sửa đổi đã duyệt, phần lựa chọn dùng <b>radio hiển thị trực tiếp</b>, không dùng dropdown.<div class="word-bank">${DATA.fill2.options.map(x=>`<span class="word-chip">${esc(x)}</span>`).join('')}</div></div>`;DATA.fill2.data.forEach((it,i)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.s)}</div></div>${radio(2,i,DATA.fill2.options)}<div class="check-row"><button class="check-btn" onclick="check(2,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(2,${i})">Làm lại câu</button></div>${feedback(2,i,it)}</div>`});return h}
function renderComplete3(){return `<div class="section-instruction"><strong>完成句子 — Hoàn thành câu</strong><br>Đây là dạng tự viết của nguồn nên dùng ô nhập, không tự đổi thành trắc nghiệm.<div class="source-note">Nguồn có hai chỗ bất thường: câu 1 ghi gợi ý “弟，次” (rất có khả năng là “第，次”); câu 6 ghi “从我这人去” (rất có khả năng là “从我这儿去”). Câu nguồn vẫn được giữ nguyên bên dưới.</div></div>`+DATA.complete3.map((it,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.s)}</div></div>${inputBox(3,i,'Nhập phần hoàn thành')}<div class="check-row"><button class="check-btn" onclick="check(3,${i})">Đối chiếu câu</button><button class="clear-btn" onclick="clearOne(3,${i})">Làm lại câu</button></div>${feedback(3,i,it,true)}</div>`).join('')}
function arrSel(i){return (state.answers[key(4,i)]||'').split('|||').filter(Boolean)}
function tokenId(i,j){return DATA.arrange[i].words[j]+'#'+j}
function setArr(i,a){state.answers[key(4,i)]=a.join('|||');delete state.checked[key(4,i)];save();renderSection();renderNav()}
function arrValue(i){return arrSel(i).map(id=>id.replace(/#\d+$/,'')).join('')}
function arrOk(i,it){return accepted(arrValue(i),it.acc||[it.a])}
let drag=null;
function beginDrag(e,i,j,from){drag={i,j,from};e.currentTarget.classList.add('dragging');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(j))}catch(_){}}
function endDrag(e){e.currentTarget?.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));drag=null}
function allowDrop(e,el){e.preventDefault();if(el)el.classList.add('drag-over')}
function moveTok(i,j,to,pos=null){let a=arrSel(i),id=tokenId(i,j),old=a.indexOf(id);if(old>=0)a.splice(old,1);if(to==='answer'){let p=pos==null?a.length:Number(pos);p=Math.max(0,Math.min(p,a.length));a.splice(p,0,id)}setArr(i,a)}
function dropEnd(e,i){e.preventDefault();e.stopPropagation();if(drag&&drag.i===i)moveTok(i,drag.j,'answer');drag=null}
function dropBank(e,i){e.preventDefault();e.stopPropagation();if(drag&&drag.i===i)moveTok(i,drag.j,'bank');drag=null}
let pointerDrag=null;
function startPointer(e,i,j,from){if(e.pointerType==='mouse')return;e.preventDefault();const src=e.currentTarget,ghost=src.cloneNode(true);ghost.classList.add('arrange-drag-ghost');ghost.style.width=src.getBoundingClientRect().width+'px';document.body.appendChild(ghost);pointerDrag={i,j,from,ghost};moveGhost(e.clientX,e.clientY);document.addEventListener('pointermove',pointerMove,{passive:false});document.addEventListener('pointerup',pointerEnd,{once:true,passive:false});document.addEventListener('pointercancel',pointerEnd,{once:true,passive:false})}
function moveGhost(x,y){if(pointerDrag?.ghost){pointerDrag.ghost.style.left=x+'px';pointerDrag.ghost.style.top=y+'px'}}
function pointerMove(e){if(!pointerDrag)return;e.preventDefault();moveGhost(e.clientX,e.clientY);document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));const el=document.elementFromPoint(e.clientX,e.clientY);const zone=el?.closest?.('.arrange-answer-zone,.arrange-bank-zone');if(zone&&Number(zone.dataset.i)===pointerDrag.i)zone.classList.add('drag-over')}
function pointerEnd(e){if(!pointerDrag)return;e.preventDefault();const p=pointerDrag;document.removeEventListener('pointermove',pointerMove);p.ghost?.remove();const el=document.elementFromPoint(e.clientX,e.clientY);const az=el?.closest?.('.arrange-answer-zone'),bz=el?.closest?.('.arrange-bank-zone');pointerDrag=null;document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(az&&Number(az.dataset.i)===p.i)moveTok(p.i,p.j,'answer');else if(bz&&Number(bz.dataset.i)===p.i)moveTok(p.i,p.j,'bank')}
function renderArrange(){return `<div class="section-instruction"><strong>组词成句 — Sắp xếp từ thành câu</strong><br>Giữ đúng dạng nguồn: kéo–thả thật bằng chuột và hỗ trợ thao tác cảm ứng.</div>`+DATA.arrange.map((it,i)=>{let sel=arrSel(i),selected=new Set(sel),val=arrValue(i),checked=!!state.checked[key(4,i)],ok=arrOk(i,it);return `<div class="question-card ${checked?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div></div><div class="arrange-answer-zone" data-i="${i}" ondragover="allowDrop(event,this)" ondrop="dropEnd(event,${i})">${sel.map(id=>{let j=Number(id.match(/#(\d+)$/)?.[1]??-1),t=DATA.arrange[i].words[j];return `<button type="button" class="token arrange-token answer-token" draggable="true" ondragstart="beginDrag(event,${i},${j},'answer')" ondragend="endDrag(event)" onpointerdown="startPointer(event,${i},${j},'answer')" onclick="moveTok(${i},${j},'bank')">${esc(t)}</button>`}).join('')}</div><div class="arrange-separator"></div><div class="arrange-bank-zone" data-i="${i}" ondragover="allowDrop(event,this)" ondrop="dropBank(event,${i})">${it.words.map((t,j)=>selected.has(tokenId(i,j))?'':`<button type="button" class="token arrange-token" draggable="true" ondragstart="beginDrag(event,${i},${j},'bank')" ondragend="endDrag(event)" onpointerdown="startPointer(event,${i},${j},'bank')" onclick="moveTok(${i},${j},'answer')">${esc(t)}</button>`).join('')}</div><div class="check-row"><button class="check-btn" onclick="check(4,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="setArr(${i},[])">Làm lại câu</button></div>${feedback(4,i,it)}</div>`}).join('')}
function dialogueFlat(){return DATA.dialogue.flatMap(g=>g.items)}
function renderDialogue(){let idx=0,h=`<div class="section-instruction"><strong>完成对话 — Hoàn thành đối thoại</strong><br>Giữ dạng tự nhập. Đáp án hiển thị sau khi kiểm tra là đáp án GPT tham khảo từ ngữ cảnh nguồn, không phải đáp án có sẵn trong DOCX.</div>`;DATA.dialogue.forEach((g,gi)=>{let ids=[];let body=g.lines.map(line=>{let [sp,pre,slot,suf,slot2,suf2]=line;if(slot===null)return `<div><b>${esc(sp)}：</b>${esc(pre)}</div>`;let id=idx++;ids.push(id);let html=`<div><b>${esc(sp)}：</b>${esc(pre)} <span style="display:inline-block;min-width:260px">${inputBox(5,id)}</span>${esc(suf)}`;if(typeof slot2==='number'){let id2=idx++;ids.push(id2);html+=` <span style="display:inline-block;min-width:220px">${inputBox(5,id2)}</span>${esc(suf2||'')}`;}return html+'</div>'}).join('');let checked=ids.some(id=>state.checked[key(5,id)]);h+=`<div class="question-card"><div class="qhead"><div class="qnum">${gi+1}</div><div class="qtext" style="width:100%;line-height:2.2">${body}</div></div><div class="check-row"><button class="check-btn" onclick="checkDialogue([${ids.join(',')}])">Kiểm tra đoạn</button></div>${checked?`<div class="feedback show sample">${ids.map((id,j)=>{let it=g.items[j],v=state.answers[key(5,id)]||'',ok=isOk(it,v);return `<div style="margin:8px 0"><b>${ok?'✓':'△'} Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.a)}</span><br><b>Giải thích:</b> ${esc(it.e)}</div>`}).join('')}</div>`:''}</div>`});return h}
function checkDialogue(ids){ids.forEach(i=>state.checked[key(5,i)]=true);save();renderSection();renderNav()}
function renderHanzi(){return `<div class="section-instruction"><strong>根据拼音写出汉字 — Dựa vào phiên âm viết chữ Hán</strong></div>`+DATA.hanzi.map((it,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.p)}</b></div></div>${inputBox(6,i,'Viết câu chữ Hán')}<div class="check-row"><button class="check-btn" onclick="check(6,${i})">Kiểm tra câu</button></div>${feedback(6,i,it)}</div>`).join('')}
function renderContext(){let h=`<div class="section-instruction"><strong>根据上下文的意思用词填空</strong><br>Dựa theo ngữ cảnh điền từ. Theo quy tắc đã duyệt, mỗi chỗ trống dùng radio hiển thị trực tiếp; từ có thể lặp lại.<div class="word-bank">${DATA.context7.options.map(x=>`<span class="word-chip">${esc(x)}</span>`).join('')}</div><div class="source-note">${esc(DATA.context7.note)}</div></div><div class="question-card"><div class="passage" style="white-space:pre-line">${esc(DATA.context7.source)}</div></div>`;DATA.context7.data.forEach((it,i)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">Chỗ trống ${i+1}</div></div>${radio(7,i,DATA.context7.options)}<div class="check-row"><button class="check-btn" onclick="check(7,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(7,${i})">Làm lại câu</button></div>${feedback(7,i,it)}</div>`});return h}
function renderRadical(){let h=`<div class="section-instruction"><strong>请写出含有偏旁 “忄” 的汉子</strong><br>Viết chữ Hán chứa bộ 忄 theo Pinyin và cụm từ nguồn.<div class="source-note">Nguồn ghi 汉子; theo nội dung bài tập phải hiểu là 汉字. Giao diện không thay chữ nguồn trong ghi chú đối chiếu.</div></div>`;DATA.radical.forEach((it,i)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.p)}</div></div>${inputBox(8,i,'Nhập 1 chữ Hán')}<div class="check-row"><button class="check-btn" onclick="check(8,${i})">Kiểm tra</button></div>${feedback(8,i,it)}</div>`});let i=DATA.radical.length,c=DATA.challenge;h+=`<div class="section-instruction"><strong>你会吗？</strong><br>${esc(c.prompt)}</div><div class="question-card"><div class="qhead"><div class="qnum">会</div><div class="qtext">Viết hai đoản câu có chữ 的 nhưng cách đọc khác nhau.</div></div><textarea class="input-area" oninput="setAns(8,${i},this.value)" placeholder="Ví dụ: câu 1 / câu 2">${esc(state.answers[key(8,i)]||'')}</textarea><div class="check-row"><button class="check-btn" onclick="check(8,${i})">Đối chiếu</button></div>${feedback(8,i,c,true)}</div>`;return h}
function renderTranslation(){return `<div class="section-instruction"><strong>越汉翻译练习 — Luyện dịch Việt → Hoa</strong><br>Đối chiếu với đáp án tham khảo; câu khác đúng ngữ pháp không mặc nhiên bị coi là sai.</div>`+DATA.translations.map((it,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAns(9,${i},this.value)">${esc(state.answers[key(9,i)]||'')}</textarea><div class="check-row"><button class="check-btn" onclick="check(9,${i})">Đối chiếu đáp án</button><button class="clear-btn" onclick="clearOne(9,${i})">Làm lại câu</button></div>${feedback(9,i,it,true)}</div>`).join('')}
function renderSection(){let s=state.section;document.getElementById('sectionBadge').textContent='Bài '+s;document.getElementById('sectionTitle').textContent=sectionNames()[s];let h=s===1?renderStudy():s===2?renderFill2():s===3?renderComplete3():s===4?renderArrange():s===5?renderDialogue():s===6?renderHanzi():s===7?renderContext():s===8?renderRadical():renderTranslation();h+=`<div class="navigation-buttons"><button class="nav-btn" ${s===1?'disabled':''} onclick="goSection(${s-1})">← Bài trước</button><button class="nav-btn next" ${s===SECTION_COUNT?'disabled':''} onclick="goSection(${s+1})">Bài sau →</button></div>`;document.getElementById('contentBody').innerHTML=h}
function itemCount(s){if(s===1)return 0;if(s===2)return DATA.fill2.data.length;if(s===3)return DATA.complete3.length;if(s===4)return DATA.arrange.length;if(s===5)return dialogueFlat().length;if(s===6)return DATA.hanzi.length;if(s===7)return DATA.context7.data.length;if(s===8)return DATA.radical.length+1;return DATA.translations.length}
function answeredCount(s){let n=0;for(let i=0;i<itemCount(s);i++)if(String(state.answers[key(s,i)]||'').trim())n++;return n}
function updateProgress(){let t=0,a=0;for(let s=1;s<=SECTION_COUNT;s++){t+=itemCount(s);a+=answeredCount(s)}document.getElementById('progressText').textContent=a+'/'+t;document.getElementById('progressFill').style.width=(t?a/t*100:0)+'%'}
function openAnswerCard(){document.getElementById('answerGrid').innerHTML=Array.from({length:SECTION_COUNT},(_,i)=>i+1).map(s=>`<div class="answer-cell ${answeredCount(s)===itemCount(s)&&itemCount(s)?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${sectionNames()[s]}<br><span class="muted">${itemCount(s)?answeredCount(s)+'/'+itemCount(s)+' đã làm':'Tài liệu đọc'}</span></div>`).join('');document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restoreProgress(show=false){try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x)Object.assign(state,x)}catch(e){}renderAll();if(show)alert('Đã khôi phục tiến độ (nếu có).')}
function restartExam(){if(!confirm('Làm lại toàn bộ Bài 19? Ghi chú vẫn được giữ.'))return;state.answers={};state.checked={};state.section=1;state.startAt=Date.now();try{localStorage.removeItem(STORE)}catch(e){}save();renderAll()}
function submitExam(){let total=0,correct=0;function add(ok){total++;if(ok)correct++}DATA.fill2.data.forEach((it,i)=>add(isOk(it,state.answers[key(2,i)]||'')));DATA.complete3.forEach((it,i)=>add(isOk(it,state.answers[key(3,i)]||'')));DATA.arrange.forEach((it,i)=>add(arrOk(i,it)));let d=0;dialogueFlat().forEach(it=>add(isOk(it,state.answers[key(5,d++)]||'')));DATA.hanzi.forEach((it,i)=>add(isOk(it,state.answers[key(6,i)]||'')));DATA.context7.data.forEach((it,i)=>add(isOk(it,state.answers[key(7,i)]||'')));DATA.radical.forEach((it,i)=>add(isOk(it,state.answers[key(8,i)]||'')));/* challenge mở không chấm cứng */DATA.translations.forEach((it,i)=>add(isOk(it,state.answers[key(9,i)]||'')));document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${total}</div><div style="text-align:center;font-weight:700">Kết quả đối chiếu các mục có thể chấm tham khảo.</div><div style="margin-top:14px;line-height:1.65"><b>Lưu ý:</b> mục 你会吗？ và các câu mở có thể có nhiều cách đúng; mục 你会吗？ không được chấm cứng trong tổng điểm.</div>`;document.getElementById('resultModal').classList.add('show')}
function openNoteEditor(){document.getElementById('rich-editor').innerHTML=localStorage.getItem(NOTE_STORE)||'';document.getElementById('note-editor-overlay').classList.add('show');document.body.classList.add('note-open')}
function closeNoteEditor(){document.getElementById('note-editor-overlay').classList.remove('show');document.body.classList.remove('note-open')}
function saveNotes(closeAfter=false){try{localStorage.setItem(NOTE_STORE,document.getElementById('rich-editor').innerHTML)}catch(e){}if(closeAfter)closeNoteEditor()}
function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor').focus()}
function clearNoteEditor(){if(confirm('Xóa toàn bộ ghi chú?'))document.getElementById('rich-editor').innerHTML=''}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
setInterval(()=>{let sec=Math.floor((Date.now()-state.startAt)/1000),m=String(Math.floor(sec/60)).padStart(2,'0'),ss=String(sec%60).padStart(2,'0');let e=document.getElementById('timerText');if(e)e.textContent='Thời gian '+m+':'+ss},1000);
window.addEventListener('load',()=>restoreProgress(false));
</script></body></html>
