const STORE='BAI301_BAI08_PROGRESS_V1';
const NOTE_STORE='BAI301_BAI08_NOTES_V1';
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:]/g,'')}
function key(s,i){return `${s}-${i}`}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function restoreProgress(showMsg=false){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&typeof x==='object'){state={...state,...x};if(showMsg)alert('Đã khôi phục tiến độ.')}}catch(e){}renderAll()}
function setAnswer(s,i,v){state.answers[key(s,i)]=v;delete state.checked[key(s,i)];save();renderNav()}
function setTextAnswer(s,i,v){setAnswer(s,i,v)}
function acceptedFor(it){return [it.answer,...(it.accepted||[])].filter(Boolean)}
function isAccepted(it,v){return acceptedFor(it).some(a=>norm(a)===norm(v))}
function itemCount(sec){
 if(sec===1)return exercises[0].data.length;
 if(sec===2)return exercises[1].groups.reduce((n,g)=>n+g.lines.filter(x=>x.blank).length,0);
 if(sec===3)return exercises[2].data.length;
 if(sec===4)return exercises[3].data.length;
 if(sec===5)return exercises[4].data.length;
 if(sec===6)return exercises[5].data.length;
 if(sec===7)return exercises[6].data.length+3;
 if(sec===8)return exercises[7].data.length;
 return 0;
}
function answeredCount(sec){let n=0,t=itemCount(sec);for(let i=0;i<t;i++)if(String(state.answers[key(sec,i)]??'').trim())n++;return n}
function totalCount(){let n=0;for(let s=1;s<=8;s++)n+=itemCount(s);return n}
function totalAnswered(){let n=0;for(let s=1;s<=8;s++)n+=answeredCount(s);return n}
function sectionNames(){return ['','Hoàn thành câu theo thời gian','Hoàn thành đối thoại','Tìm vị trí','Sửa câu sai','Viết chữ Hán','Viết tân ngữ','Chữ có 见 / 小+冖','Dịch Việt → Hoa']}
function renderNav(){let h='';for(let s=1;s<=8;s++)h+=`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`;document.getElementById('sectionNav').innerHTML=h}
function goSection(s){state.section=s;save();renderSection();renderNav()}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
function cardClass(sec,i,it){if(!state.checked[key(sec,i)])return 'question-card';return 'question-card checked '+(isAccepted(it,state.answers[key(sec,i)]||'')?'correct':'wrong')}
function standardFeedback(sec,i,it,label='Đáp án tham khảo'){
 if(!state.checked[key(sec,i)])return `<div class="feedback" id="fb-${sec}-${i}"></div>`;
 const v=state.answers[key(sec,i)]||'',ok=isAccepted(it,v);
 return `<div class="feedback show ${ok?'correct':'sample'}" id="fb-${sec}-${i}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div><b>${label}:</b> <span class="correct-answer">${esc(it.answer)}</span></div>${it.ex?`<div><b>Giải thích:</b> ${esc(it.ex)}</div>`:''}</div>`
}
function checkOne(sec,i){state.checked[key(sec,i)]=true;save();renderSection();renderNav()}
function renderSentenceComplete(ex){let h=`<div class="section-instruction"><strong>Dựa vào thời gian và từ cho sẵn hoàn thành câu.</strong></div><div class="question-card"><div class="qtext">${esc(ex.example)}</div></div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(1,i)]||'';h+=`<div class="${cardClass(1,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.prompt)}</b> ——》</div></div><input class="input-text" value="${esc(v)}" oninput="setTextAnswer(1,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(1,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(1,${i})">Làm lại câu</button></div>${standardFeedback(1,i,it)}</div>`});return h}
function renderDialogue(ex){let h=`<div class="section-instruction"><strong>Hoàn thành đối thoại.</strong></div>`;let idx=0;ex.groups.forEach(g=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${g.num}</div></div>`;g.lines.forEach(line=>{if(!line.blank){h+=`<div class="dialogue-line"><b>${line.speaker}：</b>${esc(line.text)}${line.pinyin?` <span class="muted">${esc(line.pinyin)}</span>`:''}</div>`}else{const i=idx++,v=state.answers[key(2,i)]||'';h+=`<div class="dialogue-line"><b>${line.speaker}：</b>${line.hint?`<span class="muted">（${esc(line.hint)}）</span>`:''}<input class="input-text" style="margin-top:6px" value="${esc(v)}" oninput="setTextAnswer(2,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(2,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(2,${i})">Làm lại câu</button></div>${standardFeedback(2,i,line)}</div>`}});h+='</div>'});return h}
function renderPosition(ex){let h=`<div class="section-instruction"><strong>Tìm vị trí thích hợp cho từ trong ngoặc.</strong></div>`;ex.data.forEach((it,i)=>{const sel=state.answers[key(3,i)]||'',checked=state.checked[key(3,i)],ok=sel===it.answer;h+=`<div class="question-card ${checked?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.sentence)} <b>（${esc(it.word)}）</b></div></div><div class="options-horizontal">${['A','B','C','D'].map(o=>`<label class="option"><input type="radio" name="q-3-${i}" value="${o}" ${sel===o?'checked':''} onchange="setAnswer(3,${i},this.value)"><span class="letter">${o}.</span><span class="option-text">${o}</span></label>`).join('')}</div><div class="check-row"><button class="check-btn" onclick="checkPosition(${i})">Kiểm tra câu</button></div>${checked?`<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div><div><b>Đáp án:</b> ${it.answer}</div><div><b>Câu hoàn chỉnh:</b> ${esc(it.result)}</div><div><b>Giải thích:</b> ${esc(it.ex)}</div></div>`:''}</div>`});return h}
function checkPosition(i){state.checked[key(3,i)]=true;save();renderSection();renderNav()}
function renderError(ex){let h=`<div class="section-instruction"><strong>Sửa câu sai.</strong></div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(4,i)]||'',checked=state.checked[key(4,i)],ok=isAccepted(it,v);h+=`<div class="question-card ${checked?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="wrong-sentence">${esc(it.original)}</div></div></div><input class="input-text" value="${esc(v)}" oninput="setTextAnswer(4,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(4,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(4,${i})">Làm lại câu</button></div>${checked?`<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div><b>Lỗi sai:</b> ${esc(it.error)}</div><div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span></div><div><b>Vì sao sửa như vậy:</b> ${esc(it.fix)}</div></div>`:''}</div>`});return h}
function renderHanzi(ex){let h=`<div class="section-instruction"><strong>Viết chữ Hán dựa theo phiên âm.</strong></div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(5,i)]||'';h+=`<div class="${cardClass(5,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.pinyin)}</b></div></div><input class="input-text" value="${esc(v)}" oninput="setTextAnswer(5,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(5,${i})">Kiểm tra câu</button></div>${standardFeedback(5,i,it,'Đáp án')}</div>`});return h}
function renderVerbObject(ex){let h=`<div class="section-instruction"><strong>Viết tân ngữ thích hợp cho động từ.</strong></div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(6,i)]||'';h+=`<div class="${cardClass(6,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.verb)}</b> <span class="muted">${esc(it.pinyin)}</span> ______</div></div><input class="input-text" value="${esc(v)}" oninput="setTextAnswer(6,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(6,${i})">Đối chiếu</button></div>${standardFeedback(6,i,it)}</div>`});return h}
function renderRadical(ex){let h=`<div class="section-instruction"><strong>Viết chữ Hán có chứa thành phần “见” hoặc “小 + 冖”.</strong></div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(7,i)]||'';h+=`<div class="${cardClass(7,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.prompt)}</div></div><input class="input-text" maxlength="1" value="${esc(v)}" oninput="setTextAnswer(7,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(7,${i})">Kiểm tra câu</button></div>${standardFeedback(7,i,it,'Đáp án')}</div>`});
 h+=`<div class="question-card"><div class="qhead"><div class="qtext"><b>${esc(ex.challenge.title)}</b><br>${esc(ex.challenge.prompt)}</div></div>`;
 for(let j=0;j<3;j++){const i=ex.data.length+j,v=state.answers[key(7,i)]||'';h+=`<input class="input-text" style="margin-top:8px" maxlength="1" value="${esc(v)}" oninput="setTextAnswer(7,${i},this.value)">`}
 const ready=[0,1,2].every(j=>String(state.answers[key(7,ex.data.length+j)]||'').trim());const checked=state.checked['7-challenge'];
 h+=`<div class="check-row"><button class="check-btn" onclick="checkChallenge()">Đối chiếu</button></div>${checked?challengeFeedback(ex.challenge):''}</div>`;return h}
function checkChallenge(){state.checked['7-challenge']=true;save();renderSection();renderNav()}
function challengeFeedback(ch){const vals=[0,1,2].map(j=>String(state.answers[key(7,exercises[6].data.length+j)]||'').trim());const distinct=new Set(vals.filter(Boolean));const ok=vals.every(v=>ch.accepted.includes(v))&&distinct.size===3;return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Hợp lý':'△ Đối chiếu đáp án tham khảo'}</div><div><b>Đáp án tham khảo:</b> ${ch.reference.join('、')}</div><div><b>Giải thích:</b> ${esc(ch.ex)}</div></div>`}
function renderTranslation(ex){let h=`<div class="section-instruction"><strong>Luyện dịch Việt → Hoa.</strong></div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(8,i)]||'';h+=`<div class="${cardClass(8,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><input class="input-text" value="${esc(v)}" oninput="setTextAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Đối chiếu</button></div>${standardFeedback(8,i,it)}</div>`});return h}
function clearOne(sec,i){delete state.answers[key(sec,i)];delete state.checked[key(sec,i)];save();renderSection();renderNav()}
function renderSection(){const sec=state.section,ex=exercises[sec-1],names=sectionNames();document.getElementById('sectionBadge').textContent=`Bài ${sec}`;document.getElementById('sectionTitle').textContent=names[sec];let h='';if(sec===1)h=renderSentenceComplete(ex);else if(sec===2)h=renderDialogue(ex);else if(sec===3)h=renderPosition(ex);else if(sec===4)h=renderError(ex);else if(sec===5)h=renderHanzi(ex);else if(sec===6)h=renderVerbObject(ex);else if(sec===7)h=renderRadical(ex);else if(sec===8)h=renderTranslation(ex);document.getElementById('contentBody').innerHTML=h;updateProgress()}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;const x=document.getElementById('answeredText');if(x)x.textContent=`${a}/${t}`;const b=document.getElementById('progressBar');if(b)b.style.width=p+'%'}
function openAnswerCard(){let h='',names=sectionNames();for(let s=1;s<=8;s++){let a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${esc(names[s])}<br><span class="muted">${a}/${t} đã làm</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restartExam(){if(!confirm('Xóa toàn bộ đáp án và làm lại từ đầu?'))return;try{localStorage.removeItem(STORE)}catch(e){}state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};renderAll()}
function submitExam(){let correct=0,scored=0;for(let sec=1;sec<=8;sec++){
 if(sec===2){let idx=0;exercises[1].groups.forEach(g=>g.lines.forEach(line=>{if(line.blank){scored++;if(isAccepted(line,state.answers[key(2,idx)]||''))correct++;idx++}}));continue}
 if(sec===7){exercises[6].data.forEach((it,i)=>{scored++;if(isAccepted(it,state.answers[key(7,i)]||''))correct++});const vals=[0,1,2].map(j=>String(state.answers[key(7,exercises[6].data.length+j)]||'').trim());scored+=3;correct+=vals.filter(v=>exercises[6].challenge.accepted.includes(v)).length;continue}
 const ex=exercises[sec-1];if(ex.data)ex.data.forEach((it,i)=>{scored++;if(sec===3){if((state.answers[key(sec,i)]||'')===it.answer)correct++}else if(isAccepted(it,state.answers[key(sec,i)]||''))correct++})}
 const pct=scored?Math.round(correct/scored*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${scored}</div><div style="text-align:center;font-weight:700">Kết quả đối chiếu: ${pct}%</div><div style="margin-top:15px;line-height:1.7"><b>Tiến độ:</b> ${totalAnswered()}/${totalCount()} mục đã làm.<br><b>Lưu ý:</b> Bài 6 và Bài 8 có câu mở; đáp án GPT là đáp án tham khảo, cách diễn đạt hợp lý khác vẫn có thể đúng.</div>`;document.getElementById('resultModal').classList.add('show')}
function tick(){const e=Math.floor((Date.now()-(state.startAt||Date.now()))/1000),m=Math.floor(e/60),s=e%60;document.getElementById('timerText').textContent=`Thời gian ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('timerProgress').style.width=Math.min(100,(e%3600)/36)+'%'}
let noteSaveTimer=null;
function openNoteEditor(){const o=document.getElementById('note-editor-overlay'),ed=document.getElementById('rich-editor');if(!o||!ed)return;try{const x=localStorage.getItem(NOTE_STORE);if(x!==null)ed.innerHTML=x}catch(e){}o.classList.add('show');document.body.classList.add('note-open');ed.focus()}
function closeNoteEditor(){const o=document.getElementById('note-editor-overlay');if(o)o.classList.remove('show');document.body.classList.remove('note-open')}
function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor')?.focus();scheduleNoteAutosave()}
function scheduleNoteAutosave(){clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>saveNotes(false),350)}
function saveNotes(closeAfter=false){const ed=document.getElementById('rich-editor');if(!ed)return;try{localStorage.setItem(NOTE_STORE,ed.innerHTML)}catch(e){}if(closeAfter)closeNoteEditor()}
function clearNoteEditor(){if(!confirm('Xóa toàn bộ ghi chú?'))return;const ed=document.getElementById('rich-editor');if(ed){ed.innerHTML='';ed.focus();scheduleNoteAutosave()}}
document.getElementById('rich-editor')?.addEventListener('input',scheduleNoteAutosave);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('note-editor-overlay')?.classList.contains('show'))closeNoteEditor()});
restoreProgress(false);setInterval(tick,1000);tick();
</script>
</body></html>
