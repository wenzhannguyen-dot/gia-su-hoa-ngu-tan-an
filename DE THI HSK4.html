                            <i class="bi bi-filetype-html"></i> Xuất file HTML (Học viên)
                        </button>
                    </div>
                    <div style="font-size: 11px; color: #aaa; margin-top: 8px; line-height: 1.5;">
                        <i class="bi bi-info-circle"></i> File HTML xuất ra sẽ ẩn hết các chức năng quản trị, 
                        chỉ giữ lại giao diện làm bài thi. Dữ liệu câu hỏi được nhúng sẵn vào file dưới dạng <strong>window.PRELOADED_DATA</strong>.
                    </div>
                </div>`;
            }

            exportHTML() {
                // Kiểm tra dữ liệu trước khi xuất
                if (!this.state.questions || this.state.questions.length === 0) {
                    alert('Không có dữ liệu câu hỏi để xuất! Vui lòng nhập dữ liệu trước.');
                    return;
                }

                try {
                    // Lấy toàn bộ HTML hiện tại
                    let htmlContent = document.documentElement.outerHTML;
                    
                    // Tạo DOM mới để xử lý
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlContent, 'text/html');
                    
                    // 1. XÓA HOÀN TOÀN CÁC PHẦN TỬ ADMIN (giữ lại resultModal cho học viên xem kết quả)
                    const elementsToRemove = [
                        '#adminPanel',
                        '#overlay', 
                        '.admin-btn-header',
                        '#editModal',
                        '.edit-modal', // Modal sửa câu hỏi
                        '.excel-import-section'
                    ];
                    
                    elementsToRemove.forEach(selector => {
                        const els = doc.querySelectorAll(selector);
                        els.forEach(el => el.remove());
                    });
                    
                    // Xóa nút "Quản lý nội dung" trong header nếu còn sót
                    const adminBtns = doc.querySelectorAll('button[onclick*="toggleAdmin"]');
                    adminBtns.forEach(btn => btn.remove());
                    
                    // Xóa các nút sửa câu hỏi trong nội dung
                    const editBtns = doc.querySelectorAll('.edit-question-btn');
                    editBtns.forEach(btn => btn.remove());
                    
                    // 2. THÊM CỜ ĐÁNH DẤU CHẾ ĐỘ HỌC VIÊN
                    const studentModeScript = doc.createElement('script');
                    studentModeScript.textContent = 'window.IS_STUDENT_MODE = true;';
                    doc.head.insertBefore(studentModeScript, doc.head.firstChild);
                    
                    // 3. TẠO DỮ LIỆU NHÚNG AN TOÀN
                    const preloadData = {
                        questions: this.state.questions,
                        logoImage: this.state.logoImage,
                        timestamp: new Date().toISOString(),
                        version: '1.0',
                        exportDate: new Date().toLocaleString('vi-VN')
                    };
                    
                    // Chuyển đổi sang JSON string an toàn
                    const dataScriptContent = `window.PRELOADED_DATA = ${JSON.stringify(preloadData)};`;
                    
                    // Tạo script element và chèn vào đầu head
                    const dataScript = doc.createElement('script');
                    dataScript.textContent = dataScriptContent;
                    doc.head.insertBefore(dataScript, doc.head.firstChild);
                    
                    // 4. SỬA LẠI PHẦN KHỞI TẠO ĐỂ SỬ DỤNG PRELOADED_DATA
                    // Tìm và cập nhật hàm init trong StateManager
                    const scripts = doc.querySelectorAll('script');
                    scripts.forEach(script => {
                        // Thay thế hàm generateInitialData bằng kiểm tra PRELOADED_DATA
                        if (script.textContent.includes('DataGenerator.generateInitialData')) {
                            script.textContent = script.textContent.replace(
                                'DataGenerator.generateInitialData()',
                                '(window.PRELOADED_DATA && window.PRELOADED_DATA.questions ? window.PRELOADED_DATA.questions : DataGenerator.generateInitialData())'
                            );
                        }
                    });
                    
                    // 5. THÊM THÔNG BÁO ĐÃ XUẤT FILE
                    const exportInfo = doc.createElement('div');
                    exportInfo.innerHTML = `
                        <div style="position: fixed; top: 60px; right: 10px; background: #4caf50; color: white; padding: 10px 15px; border-radius: 4px; font-size: 12px; z-index: 9999; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
                            <i class="bi bi-check-circle"></i> File HTML cho học viên | Xuất lúc: ${new Date().toLocaleString('vi-VN')}
                        </div>
                    `;
                    doc.body.appendChild(exportInfo);
                    
                    // 6. TẠO FILE HTML HOÀN CHỈNH
                    const finalHTML = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
                    
                    // Tạo blob và download
                    const blob = new Blob([finalHTML], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    
                    // Tạo tên file có timestamp
                    const now = new Date();
                    const timestamp = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}`;
                    a.download = `HSK4_Exam_Student_${timestamp}.html`;
                    
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    alert(`✅ Đã xuất file HTML cho học viên thành công!\n\nThông tin:\n- Số câu hỏi: ${this.state.questions.length}\n- File: HSK4_Exam_Student_${timestamp}.html\n\nFile này đã ẩn hết chức năng quản trị và chỉ giữ lại giao diện làm bài thi.`);
                } catch (err) {
                    console.error('Export HTML error:', err);
                    alert('❌ Lỗi xuất HTML: ' + err.message);
                }
            }

            renderLogoSection() {
                const hasLogo = !!this.state.logoImage;
                return `<div class="admin-section">
                    <span class="admin-label">Logo trang web:</span>
                    <div class="logo-display-container">
                        <img src="${this.state.logoImage || ''}" alt="Logo" class="logo-preview" id="adminLogoPreview" style="${hasLogo ? '' : 'display:none;'}">
                        <div style="flex: 1;">
                            <button class="admin-btn btn-blue" onclick="document.getElementById('logoUpload').click()" style="width: 100%; margin-bottom: 8px;">
                                <i class="bi bi-upload"></i> Tải logo mới lên
                            </button>
                            <input type="file" id="logoUpload" class="file-input" accept="image/*" onchange="App.Upload.logo(this)">
                            <div style="font-size: 11px; color: #aaa; margin-top: 5px;">
                                <i class="bi bi-info-circle"></i> Logo lưu trong LocalStorage (tối đa 2MB)
                            </div>
                            ${hasLogo ? `<button onclick="App.Admin.resetLogo()" style="width: 100%; margin-top: 8px; background: #666; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 12px;">
                                <i class="bi bi-arrow-counterclockwise"></i> Khôi phục logo mặc định
                            </button>` : ''}
                        </div>
                    </div>
                </div>`;
            }

            renderQuestionList() {
                const items = this.state.questions.map(q => {
                    const strictType = getStrictType(q.num);
                    const preview = (q.statement || '').substring(0, 40);
                    const hasAudio = q.questionAudio || q.audioFile ? '🔊 ' : '';
                    const hasImage = q.pictureFile || q.image ? '🖼️ ' : '';
                    const hasPassage = q.passage ? '📖 ' : '';
                    const hasWords = strictType === 'arrange' && q.words ? `[${q.words.length}t] ` : '';
                    const hasPicWord = strictType === 'picture' && q.pictureWord ? `[${q.pictureWord}] ` : '';
                    
                    return `<div class="question-item ${q.num === this.state.currentQ ? 'active' : ''}" 
                                onclick="App.Navigation.goTo(${q.num}); App.Modals.openEdit(${q.num})">
                        <div class="question-item-number">
                            ${hasAudio}${hasImage}${hasPassage}${hasWords}${hasPicWord}Câu ${q.num} (${CONFIG.TYPE_NAMES[strictType] || 'N/A'}):
                        </div>
                        ${preview}...
                    </div>`;
                }).join('');

                return `<div class="admin-section">
                    <span class="admin-label">Chọn câu hỏi để chỉnh sửa:</span>
                    <div class="question-list">${items}</div>
                    <button class="add-question-btn" onclick="App.Modals.openEdit(null, ${this.state.questions.length + 1})">
                        <i class="bi bi-plus-circle"></i> Thêm câu hỏi mới
                    </button>
                </div>`;
            }

            renderImportExport() {
                return `<div class="admin-section">
                    <span class="admin-label">Import/Export JSON:</span>
                    <div class="admin-btn-group">
                        <button class="admin-btn btn-blue" onclick="App.Admin.exportJSON()">
                            <i class="bi bi-download"></i> Xuất JSON
                        </button>
                        <button class="admin-btn btn-blue" onclick="document.getElementById('importFile').click()">
                            <i class="bi bi-upload"></i> Nhập JSON
                        </button>
                    </div>
                    <input type="file" id="importFile" class="file-input" accept=".json" onchange="App.Admin.importJSON(this)">
                </div>`;
            }

            resetLogo() {
                if (confirm('Bạn có chắc muốn khôi phục logo mặc định?')) {
                    this.state.resetLogo();
                    this.render();
                }
            }

            exportJSON() {
                const data = {
                    questions: this.state.questions,
                    audioFiles: this.state.audioFiles,
                    logoImage: this.state.logoImage,
                    timestamp: new Date().toISOString(),
                    version: '1.0'
                };
                
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `hsk4_exam_${Date.now()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            importJSON(input) {
                const file = input.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.questions?.length) throw new Error('Dữ liệu không hợp lệ');
                        
                        data.questions.forEach(q => { q.type = getStrictType(q.num); });
                        
                        this.state.questions = data.questions;
                        if (data.audioFiles) this.state.audioFiles = data.audioFiles;
                        if (data.logoImage) this.state.saveLogo(data.logoImage);
                        
                        this.state.currentQ = 1;
                        this.state.reset();
                        
                        App.Navigation.buildSidebar();
                        App.Navigation.updateStatus();
                        App.Renderer.render();
                        
                        alert(`Đã nhập ${this.state.questions.length} câu hỏi!`);
                    } catch (err) {
                        alert('Lỗi nhập dữ liệu: ' + err.message);
                    }
                };
                reader.readAsText(file);
                input.value = '';
            }
        }

        // ========== MODAL MANAGER ==========
        class ModalManager {
            constructor(state) {
                this.state = state;
            }

            openEdit(num, forcedNum) {
                const q = num ? this.state.getQuestion(num) : null;
                const editNum = forcedNum || num || 1;
                const strictType = getStrictType(editNum);
                const part = Utils.getQuestionPartId(editNum) || 1;
                
                this.populateEditForm(q, editNum, parseInt(part), strictType);
                document.getElementById('editModal').classList.add('show');
            }

            populateEditForm(q, num, part, strictType) {
                const isReadingPassage = num >= 66 && num <= 85;
                const form = document.getElementById('editForm');
                
                form.innerHTML = `
                    <input type="hidden" id="editQNum" value="${num}">
                    <div class="form-group">
                        <label class="form-label">Loại câu hỏi (Tự động):</label>
                        <input type="text" class="form-input" value="${CONFIG.TYPE_TO_EXCEL[strictType]}" disabled style="background: #f5f5f5; color: #666;">
                        <div style="font-size: 11px; color: #666; margin-top: 4px;">
                            ${num >= 86 && num <= 95 ? 'Câu 86-95 luôn là Sắp xếp từ' : 
                              num >= 96 && num <= 100 ? 'Câu 96-100 luôn là Xem hình viết câu' : 
                              'Loại được xác định tự động theo số câu'}
                        </div>
                    </div>
                    ${isReadingPassage ? `
                    <div class="form-group">
                        <label class="form-label" style="color: #666; font-weight: bold;">📖 Đoạn văn đọc hiểu:</label>
                        <textarea class="form-textarea" id="editPassage" placeholder="Nhập đoạn văn tiếng Trung..." style="min-height: 150px; border: 1px solid #999;">${q?.passage || ''}</textarea>
                        <div style="font-size: 11px; color: #666; margin-top: 4px;">Sẽ hiển thị trong khung viền xám</div>
                    </div>` : ''}
                    ${strictType === 'picture' ? `
                    <div class="form-group">
                        <label class="form-label">Từ khóa yêu cầu:</label>
                        <input type="text" class="form-input" id="editPictureWord" value="${q?.pictureWord || ''}" placeholder="Nhập từ Hán tự học viên phải dùng">
                    </div>` : ''}
                    ${strictType === 'arrange' ? `
                    <div class="form-group">
                        <label class="form-label">Các từ để sắp xếp (cách nhau bằng dấu phẩy):</label>
                        <textarea class="form-textarea" id="editWords">${q?.words ? q.words.join('，') : ''}</textarea>
                    </div>` : ''}
                    <div class="form-group">
                        <label class="form-label">Nội dung gốc / Script:</label>
                        <textarea class="form-textarea" id="editScript" placeholder="Nội dung tiếng Trung...">${q?.script || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nội dung câu hỏi (Statement):</label>
                        <textarea class="form-textarea" id="editChinese">${q?.statement || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Đáp án đúng:</label>
                        <input type="text" class="form-input" id="editAnswer" value="${q?.answer !== undefined ? q.answer : ''}">
                    </div>
                    <div class="edit-actions">
                        ${q ? `<button class="btn-delete" onclick="App.Modals.deleteQ()">Xóa</button>` : ''}
                        <button class="btn-cancel" onclick="App.Modals.closeEdit()">Hủy</button>
                        <button class="btn-save" onclick="App.Modals.save()">Lưu</button>
                    </div>`;
                
                document.getElementById('editModalTitle').textContent = q ? `Chỉnh sửa câu ${q.num}` : 'Thêm câu hỏi mới';
            }

            closeEdit() {
                document.getElementById('editModal').classList.remove('show');
            }

            save() {
                const num = parseInt(document.getElementById('editQNum').value);
                const strictType = getStrictType(num);
                const statement = document.getElementById('editChinese').value;
                const script = document.getElementById('editScript')?.value || '';
                const answer = document.getElementById('editAnswer').value;
                const part = Utils.getQuestionPartId(num) || 1;
                const section = part >= 7 ? 'writing' : part >= 4 ? 'reading' : 'listening';

                const q = {
                    num, part: parseInt(part), type: strictType, section,
                    statement, script,
                    answer: strictType === 'tf' ? answer === 'true' : answer
                };

                if (num >= 66 && num <= 85) {
                    const passageInput = document.getElementById('editPassage');
                    q.passage = passageInput ? passageInput.value : '';
                }
                
                if (strictType === 'picture') {
                    const pictureWordInput = document.getElementById('editPictureWord');
                    q.pictureWord = pictureWordInput ? pictureWordInput.value : '';
                }
                
                if (strictType === 'arrange') {
                    const wordsText = document.getElementById('editWords')?.value || '';
                    q.words = wordsText.split(/[，,]/).map(w => w.trim()).filter(Boolean);
                }

                const idx = this.state.questions.findIndex(x => x.num === num);
                if (idx >= 0) {
                    this.state.questions[idx] = { ...this.state.questions[idx], ...q };
                } else {
                    this.state.questions.push(q);
                    this.state.questions.sort((a, b) => a.num - b.num);
                }

                App.Navigation.updateStatus();
                App.Renderer.render();
                App.Admin.render();
                this.closeEdit();
                alert('Đã lưu câu ' + num + '!');
            }

            deleteQ() {
                const num = parseInt(document.getElementById('editQNum').value);
                if (!confirm(`Xóa câu ${num}?`)) return;

                const idx = this.state.questions.findIndex(q => q.num === num);
                if (idx >= 0) {
                    this.state.questions.splice(idx, 1);
                    delete this.state.userAnswers[num];
                    delete this.state.bookmarks[num];
                    
                    if (this.state.currentQ === num) {
                        this.state.currentQ = this.state.questions[0]?.num || 1;
                    }
                    
                    App.Navigation.updateStatus();
                    App.Renderer.render();
                    App.Admin.render();
                    this.closeEdit();
                }
            }
        }

        // ========== MAIN APPLICATION CONTROLLER ==========
        class AppController {
            constructor() {
                // Initialize State
                this.State = new StateManager();
                
                // Initialize Renderers & Managers
                this.Renderer = new UIRenderer(this.State);
                this.Navigation = new NavigationManager(this.State, this.Renderer);
                this.Audio = new AudioManager(this.State);
                this.Exam = new ExamManager(this.State, this.Renderer, this.Navigation);
                this.Timer = new TimerManager(this.State);
                
                // Initialize Action Handlers
                const actions = new ActionHandlers(this.State, this.Navigation, this.Renderer);
                this.Answer = {
                    select: actions.selectAnswer.bind(actions),
                    inputOrder: actions.inputOrder.bind(actions),
                    inputWriting: actions.inputWriting.bind(actions)
                };
                this.Bookmark = { toggle: actions.toggleBookmark.bind(actions) };
                this.Content = { toggle: actions.toggleContent.bind(actions) };
                
                // Initialize Specialized Managers
                this.DragDrop = new DragDropManager(this.State);
                this.Upload = new UploadManager(this.State);
                this.Excel = new ExcelManager(this.State, this.Navigation, this.Renderer);
                this.Admin = new AdminPanelManager(this.State);
                this.Modals = new ModalManager(this.State);
            }

            init() {
                try {
                    // Generate initial data if empty (chỉ khi không có PRELOADED_DATA)
                    if (this.State.questions.length === 0 && !window.PRELOADED_DATA) {
                        this.State.questions = DataGenerator.generateInitialData();
                    }

                    // Build UI
                    this.Navigation.buildSidebar();
                    this.Navigation.updateStatus();
                    this.Renderer.render();
                    this.Timer.start();

                    // Keyboard shortcuts
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'ArrowLeft') this.Navigation.prev();
                        if (e.key === 'ArrowRight') this.Navigation.next();
                    });
                } catch (err) {
                    console.error('Initialization error:', err);
                    this.Renderer.renderError('Khởi tạo ứng dụng thất bại: ' + err.message);
                }
            }

            // Public API Methods (giữ nguyên để HTML onclick hoạt động)
            toggleAdmin() { this.Admin.toggle(); }
            closeResultModal() { document.getElementById('resultModal').classList.remove('show'); }
        }

        // Initialize Application
        const App = new AppController();
        
        // Expose to global scope for HTML event handlers
        window.App = App;

        // Start when DOM ready
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
