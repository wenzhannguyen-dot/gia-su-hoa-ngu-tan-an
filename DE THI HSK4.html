    <script>
        /**
         * ============================================================
         * HSK4 EXAM SYSTEM - REFACTORED VERSION
         * ============================================================
         * Tổ chức lại code theo module pattern, giữ nguyên 100% giao diện
         * và chức năng so với phiên bản gốc.
         * ============================================================
         */

        // ========== CONSTANTS & CONFIGURATION ==========
        const QUESTION_RULES = {
            isArrange: (num) => num >= 86 && num <= 95,
            isPicture: (num) => num >= 96 && num <= 100,
            isOrder: (num) => num >= 56 && num <= 65,
            isFill: (num) => num >= 46 && num <= 55,
            isTF: (num) => num >= 1 && num <= 10,
            isMC: (num) => (num >= 11 && num <= 45) || (num >= 66 && num <= 85)
        };

        function getStrictType(num) {
            if (QUESTION_RULES.isArrange(num)) return 'arrange';
            if (QUESTION_RULES.isPicture(num)) return 'picture';
            if (QUESTION_RULES.isOrder(num)) return 'order';
            if (QUESTION_RULES.isFill(num)) return 'fill';
            if (QUESTION_RULES.isTF(num)) return 'tf';
            return 'mc';
        }

        const CONFIG = Object.freeze({
            EXAM_DURATION: 105 * 60,
            STORAGE_KEYS: { LOGO: 'hsk4_logo' },
            DEFAULT_LOGO: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgCAYAAAH8yFe7AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABhaSURBVHhe7cExAQAAAMKg9U9tCF8gAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADgNSVJggAAZy0xyQAAABlJREFUSIntwTEBAGAEBBDQ//8U+00K2NMBAAAAAAAAAAAADl0HA80Dw6T/WqYAAAAASUVORK5CYII=",
            
            PARTS: Object.freeze({
                1: { name: '第一部分 听力：判断对错 (1-10)', range: [1, 10], type: 'listening', qType: 'tf', groupSize: 1 },
                2: { name: '第二部分 听力：选择正确答案 (11-25)', range: [11, 25], type: 'listening', qType: 'mc', groupSize: 1 },
                3: { name: '第三部分 听力：选择正确答案 (26-45)', range: [26, 45], type: 'listening', qType: 'mc', groupSize: 1 },
                4: { name: '第一部分 阅读：选词填空 (46-55)', range: [46, 55], type: 'reading', qType: 'fill', groupSize: 5 },
                5: { name: '第二部分 阅读：排列顺序 (56-65)', range: [56, 65], type: 'reading', qType: 'order', groupSize: 5 },
                6: { name: '第三部分 阅读：选择正确答案 (66-85)', range: [66, 85], type: 'reading', qType: 'mc', groupSize: 1, passage: true },
                7: { name: '第一部分 书写：连词成句 (86-95)', range: [86, 95], type: 'writing', qType: 'arrange', groupSize: 5 },
                8: { name: '第二部分 书写：看图写句子 (96-100)', range: [96, 100], type: 'writing', qType: 'picture', groupSize: 5 }
            }),

            TYPE_NAMES: Object.freeze({ tf: 'Đ/S', mc: 'ABCD', fill: 'Điền', order: 'Sắp', arrange: 'Sắp', picture: 'Viết' }),
            
            TYPE_TO_EXCEL: Object.freeze({
                'tf': '判断对错 (Đ/S)', 'mc': '选择 (ABCD)', 'fill': '选词填空 (Điền)',
                'order': '排列顺序 (Sắp xếp)', 'arrange': '书写 - Sắp xếp từ thành câu', 'picture': '书写 - 看图写句子'
            }),

            EXCEL_COLUMNS: Object.freeze({
                NUM: 0, PART: 1, TYPE: 2, STATEMENT: 3, PASSAGE: 4,
                SCRIPT: 5, PINYIN: 6, VIETNAMESE: 7, OPT_A: 8, OPT_B: 9,
                OPT_C: 10, OPT_D: 11, OPT_E: 12, OPT_F: 13, ANSWER: 14, 
                WORDS: 15, PICTURE_WORD: 16, SENTENCES: 17, NOTE: 18
            })
        });

        // ========== UTILITY CLASS ==========
        class Utils {
            static formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            static getPartByNumber(num) {
                return Object.values(CONFIG.PARTS).find(p => num >= p.range[0] && num <= p.range[1]);
            }

            static getQuestionPartId(num) {
                return Object.keys(CONFIG.PARTS).find(key => {
                    const r = CONFIG.PARTS[key].range;
                    return num >= r[0] && num <= r[1];
                });
            }

            static deepClone(obj) {
                return JSON.parse(JSON.stringify(obj));
            }

            static generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            }
        }

        // ========== STATE MANAGER ==========
        class StateManager {
            constructor() {
                this.questions = [];
                this.currentQ = 1;
                this.userAnswers = {};
                this.bookmarks = {};
                this.audioFiles = {};
                this.logoImage = null;
                this.timeLeft = CONFIG.EXAM_DURATION;
                this.timerInterval = null;
                this.currentAudio = null;
                this.contentVisible = {};
                this.examSubmitted = false;
                this.isStudentMode = false; // Cờ đánh dấu chế độ học viên (file HTML đã xuất)
                this.init();
            }

            init() {
                this.loadLogo();
                // Kiểm tra PRELOADED_DATA từ file HTML xuất ra
                if (window.PRELOADED_DATA && window.PRELOADED_DATA.questions) {
                    this.questions = window.PRELOADED_DATA.questions;
                    this.isStudentMode = true; // Đánh dấu là file đã xuất cho học viên
                    if (window.PRELOADED_DATA.logoImage) {
                        this.logoImage = window.PRELOADED_DATA.logoImage;
                        const headerLogo = document.getElementById('headerLogo');
                        if (headerLogo) headerLogo.src = window.PRELOADED_DATA.logoImage;
                    }
                }
            }

            getQuestion(num) {
                return this.questions.find(q => q.num === parseInt(num));
            }

            getCurrentQuestion() {
                return this.getQuestion(this.currentQ);
            }

            loadLogo() {
                try {
                    const savedLogo = localStorage.getItem(CONFIG.STORAGE_KEYS.LOGO);
                    const headerLogo = document.getElementById('headerLogo');
                    if (savedLogo && headerLogo) {
                        headerLogo.src = savedLogo;
                        this.logoImage = savedLogo;
                    } else if (headerLogo) {
                        this.logoImage = headerLogo.src;
                    }
                } catch (e) {
                    console.error('Error loading logo:', e);
                }
            }

            saveLogo(base64Image) {
                try {
                    localStorage.setItem(CONFIG.STORAGE_KEYS.LOGO, base64Image);
                    this.logoImage = base64Image;
                    const headerLogo = document.getElementById('headerLogo');
                    if (headerLogo) headerLogo.src = base64Image;
                    return true;
                } catch (e) {
                    console.error('Error saving logo:', e);
                    return false;
                }
            }

            resetLogo() {
                localStorage.removeItem(CONFIG.STORAGE_KEYS.LOGO);
                this.logoImage = CONFIG.DEFAULT_LOGO;
                const headerLogo = document.getElementById('headerLogo');
                if (headerLogo) headerLogo.src = CONFIG.DEFAULT_LOGO;
            }

            reset() {
                this.userAnswers = {};
                this.bookmarks = {};
                this.contentVisible = {};
                this.examSubmitted = false;
                this.timeLeft = CONFIG.EXAM_DURATION;
            }
        }

        // ========== DATA GENERATOR ==========
        class DataGenerator {
            static generateInitialData() {
                const questions = [
                    ...this.generateRange(1, 10, 1, 'tf'), 
                    ...this.generateRange(11, 15, 2, 'mc'),
                    ...this.generateRange(26, 20, 3, 'mc'), 
                    ...this.generateFillRange(),
                    ...this.generateRange(56, 10, 5, 'order'), 
                    ...this.generateRange(66, 20, 6, 'mc', { passage: '' }),
                    ...this.generateRange(86, 10, 7, 'arrange'), 
                    ...this.generateRange(96, 5, 8, 'picture')
                ];
                return questions.sort((a, b) => a.num - b.num);
            }

            static generateRange(start, count, partNum, type, extra = {}) {
                const section = partNum <= 3 ? 'listening' : partNum <= 6 ? 'reading' : 'writing';
                return Array.from({ length: count }, (_, i) => {
                    const num = start + i;
                    const strictType = getStrictType(num);
                    return this.createQuestion(num, partNum, strictType, section, extra);
                });
            }

            static generateFillRange() {
                return Array.from({ length: 10 }, (_, i) => {
                    const num = 46 + i;
                    const strictType = getStrictType(num);
                    return this.createQuestion(num, 4, strictType, 'reading', { 
                        vocabSet: num <= 50 ? 46 : 51, 
                        vocabList: this.getVocabList(num) 
                    });
                });
            }

            static createQuestion(num, part, type, section, extra = {}) {
                const base = {
                    num, part, type, section,
                    statement: `Câu hỏi ${num}: Nội dung đang chờ cập nhật...`,
                    script: `这是第${num}题的录音内容`,
                    pinyin: `Zhè shì dì ${num} tí de lùyīn nèiróng`,
                    vietnamese: `Đây là nội dung bản ghi âm câu ${num}`,
                    passage: '',
                    ...extra
                };

                const typeDefaults = {
                    mc: { 
                        options: ['A', 'B', 'C', 'D'].map(l => ({ 
                            label: l, 
                            text: `选项 ${l} - Nội dung đáp án mẫu` 
                        })), 
                        answer: 'A' 
                    },
                    tf: { answer: true },
                    fill: { answer: 'A' },
                    order: { 
                        sentences: ['这是句子A的内容', '这是句子B的内容', '这是句子C的内容'], 
                        answer: 'ABC' 
                    },
                    arrange: { 
                        words: ['我', '喜欢', '学习', '汉语'], 
                        answer: '我喜欢学习汉语' 
                    },
                    picture: { pictureWord: '', answer: '' }
                };

                return { ...base, ...(typeDefaults[type] || {}) };
            }

            static getVocabList(num) {
                const set46 = [
                    {l: 'A', w: '拉', m: 'kéo'}, {l: 'B', w: '圆', m: 'tròn'}, 
                    {l: 'C', w: '完全', m: 'hoàn toàn'}, {l: 'D', w: '坚持', m: 'kiên trì'}, 
                    {l: 'E', w: '重点', m: 'trọng điểm'}, {l: 'F', w: '饺子', m: 'sủi cảo'}
                ];
                const set51 = [
                    {l: 'A', w: '样子', m: 'dáng vẻ'}, {l: 'B', w: '超过', m: 'vượt quá'}, 
                    {l: 'C', w: '温度', m: 'nhiệt độ'}, {l: 'D', w: '入口', m: 'lối vào'}, 
                    {l: 'E', w: '严重', m: 'nghiêm trọng'}, {l: 'F', w: '整理', m: 'sắp xếp'}
                ];
                return num <= 50 ? set46 : set51;
            }
        }

        // ========== AUDIO MANAGER ==========
        class AudioManager {
            constructor(state) {
                this.state = state;
                this.audioElement = null;
            }

            toggle() {
                this.play();
            }

            play() {
                const q = this.state.getCurrentQuestion();
                if (!q) return;

                const audioUrl = q.questionAudio || q.audioFile || this.state.audioFiles[this.state.currentQ];
                
                if (audioUrl) {
                    this.playFile(audioUrl);
                } else if (q.script) {
                    this.playTTS(q.script);
                }
            }

            playFile(url) {
                this.stop();
                this.state.currentAudio = new Audio(url);
                const bar = document.getElementById('audioBar');
                const status = document.getElementById('audioStatus');
                
                if (status) status.textContent = '正在播放...';
                
                this.state.currentAudio.onended = () => {
                    if (status) status.textContent = '点击播放录音';
                    if (bar) bar.style.width = '0%';
                };
                
                this.state.currentAudio.onerror = () => {
                    console.error('Audio playback error');
                    if (status) status.textContent = 'Lỗi phát audio';
                };
                
                this.state.currentAudio.ontimeupdate = () => {
                    if (bar && this.state.currentAudio.duration) {
                        const progress = (this.state.currentAudio.currentTime / this.state.currentAudio.duration) * 100;
                        bar.style.width = `${progress}%`;
                    }
                };
                
                this.state.currentAudio.play().catch(err => {
                    console.error('Cannot play audio:', err);
                    if (status) status.textContent = 'Lỗi phát audio';
                });
            }

            playTTS(text) {
                if (!window.speechSynthesis) {
                    alert('Trình duyệt không hỗ trợ phát âm');
                    return;
                }
                
                this.stop();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'zh-CN';
                utter.rate = 0.85;
                utter.pitch = 1;
                
                const status = document.getElementById('audioStatus');
                if (status) status.textContent = '正在播放...';
                
                utter.onend = () => {
                    if (status) status.textContent = '点击播放录音';
                };
                
                utter.onerror = () => {
                    if (status) status.textContent = 'Lỗi phát âm';
                };
                
                window.speechSynthesis.speak(utter);
            }

            stop() {
                if (this.state.currentAudio) {
                    this.state.currentAudio.pause();
                    this.state.currentAudio.currentTime = 0;
                    this.state.currentAudio = null;
                }
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
                const bar = document.getElementById('audioBar');
                if (bar) bar.style.width = '0%';
            }
        }

        // ========== RENDERER ==========
        class UIRenderer {
            constructor(state) {
                this.state = state;
            }

            render() {
                const q = this.state.getCurrentQuestion();
                if (!q) {
                    this.renderError('Không tìm thấy câu hỏi');
                    return;
                }

                q.type = getStrictType(q.num);
                const part = CONFIG.PARTS[q.part];
                
                this.updateHeader(q, part);
                
                let html = '';
                if (part.type === 'listening') {
                    html += this.renderAudio(q);
                }
                if (q.image && q.type !== 'picture') {
                    html += `<img src="${q.image}" alt="Question Image" class="question-image">`;
                }
                
                html += this.routeQuestionRenderer(q, part);
                document.getElementById('contentBody').innerHTML = html;
            }

            updateHeader(q, part) {
                document.getElementById('qBadge').textContent = `第 ${q.num} 题`;
                document.getElementById('qTypeText').textContent = part.name;
            }

            routeQuestionRenderer(q, part) {
                q.type = getStrictType(q.num);

                // Xử lý các trường hợp đặc biệt (câu ghép đôi)
                if (q.part === 3 && this.state.currentQ >= 36 && this.state.currentQ <= 45) {
                    return this.renderPair(36, 45, 2);
                }
                if (q.part === 6 && this.state.currentQ >= 80 && this.state.currentQ <= 85) {
                    return this.renderPassagePair(80);
                }

                // Xử lý câu đơn hoặc nhóm
                if (part.groupSize === 1) {
                    return this.renderSingle(q, part);
                }

                return part.type === 'writing' 
                    ? this.renderWritingGroup(q.part) 
                    : this.renderGroup(q.part);
            }

            renderAudio(q) {
                const hasAudio = this.state.audioFiles[q.num] || q.audioFile || q.questionAudio || q.script;
                const statusText = hasAudio ? '点击播放录音' : '暂无音频';
                const replayBtn = hasAudio 
                    ? `<button class="play-btn" style="width: 36px; height: 36px; font-size: 14px; margin-left: 10px;" onclick="App.Audio.toggle()" title="Phát lại"><i class="bi bi-arrow-repeat"></i></button>` 
                    : '';

                return `
                    <div class="audio-player">
                        <button class="play-btn" id="playBtn" onclick="App.Audio.toggle()" ${(!hasAudio) ? 'disabled title="Chưa có nội dung phát âm"' : ''}>
                            <i class="bi bi-play-fill"></i>
                        </button>
                        <div class="audio-info">
                            <div class="audio-title">第 ${q.num} 题 - <span id="audioStatus">${statusText}</span></div>
                            <div class="audio-progress">
                                <div class="audio-bar" id="audioBar" style="width: 0%"></div>
                            </div>
                        </div>
                        ${replayBtn}
                    </div>`;
            }

            renderSingle(q, part) {
                let html = '';
                
                if (q.part === 6 && q.passage && q.passage.trim()) {
                    html += `<div class="passage-box">${q.passage}</div>`;
                }

                html += `<div class="question-answer-container">${this.renderQuestionHeader(q)}`;
                html += this.renderOptions(q);
                
                if (this.state.examSubmitted && q.answer !== undefined) {
                    html += this.renderAnswerReveal(q);
                }
                
                html += `</div>${this.renderNavigation()}`;
                return html;
            }

            renderGroup(partNum) {
                const part = CONFIG.PARTS[partNum];
                const [start, end] = part.range;
                const groupStart = start + Math.floor((this.state.currentQ - start) / part.groupSize) * part.groupSize;
                const groupEnd = Math.min(groupStart + part.groupSize - 1, end);
                const qs = this.state.questions.filter(q => q.num >= groupStart && q.num <= groupEnd);
                
                qs.forEach(q => q.type = getStrictType(q.num));
                
                let html = '';
                
                // Render từ vựng cho phần điền vào chỗ trống
                if (partNum === 4) {
                    const firstQ = qs[0];
                    if (firstQ?.options && firstQ.options.length > 0) {
                        html += this.renderVocabFromOptions(firstQ.options);
                    } else {
                        const vocabSets = [...new Set(qs.map(q => q.vocabSet).filter(Boolean))];
                        vocabSets.forEach(setId => html += this.renderVocab(setId));
                    }
                }

                if (part.passage && qs[0]?.passage) {
                    html += `<div class="passage-box">${qs[0].passage}</div>`;
                }
                
                html += '<div class="multi-question-container">';
                qs.forEach(q => {
                    html += `<div class="multi-question-item">
                        ${this.renderQuestionHeader(q, true)}
                        ${q.image ? `<img src="${q.image}" alt="Question Image" class="question-image" style="max-height: 200px;">` : ''}
                        ${this.renderOptions(q)}
                        ${this.state.examSubmitted && q.answer !== undefined ? this.renderAnswerReveal(q) : ''}
                    </div>`;
                });
                
                return html + `</div>${this.renderNavigation()}`;
            }

            renderVocabFromOptions(options) {
                if (!options || options.length === 0) return '';
                return `<div class="vocab-list">
                    <div class="vocab-section-title"></div>
                    ${options.map(opt => `<div class="vocab-item"><span class="vocab-letter">${opt.label}.</span> ${opt.text}</div>`).join('')}
                </div>`;
            }

            renderVocab(setId) {
                const firstQ = this.state.questions.find(q => q.vocabSet === setId && q.vocabList);
                const list = firstQ?.vocabList || [];
                if (!list.length) return '';
                
                return `<div class="vocab-list">
                    <div class="vocab-section-title"></div>
                    ${list.map(v => `<div class="vocab-item"><span class="vocab-letter">${v.l}.</span> ${v.w} (${v.m})</div>`).join('')}
                </div>`;
            }

            renderPair(startNum, maxNum, pairSize) {
                const pairStart = startNum + Math.floor((this.state.currentQ - startNum) / pairSize) * pairSize;
                const pairEnd = Math.min(pairStart + pairSize - 1, maxNum);
                const qs = this.state.questions.filter(q => q.num >= pairStart && q.num <= pairEnd);
                qs.forEach(q => q.type = getStrictType(q.num));
                
                return `<div class="multi-question-container">
                    ${qs.map(q => this.renderMultiQuestionItem(q)).join('')}
                </div>${this.renderNavigation()}`;
            }

            renderPassagePair(startNum) {
                const qs = this.state.questions.filter(q => q.num >= startNum && q.num <= startNum + 1);
                qs.forEach(q => q.type = getStrictType(q.num));
                
                let html = qs[0]?.passage ? `<div class="passage-box">${qs[0].passage}</div>` : '';
                html += '<div class="multi-question-container">';
                qs.forEach(q => html += this.renderMultiQuestionItem(q));
                return html + `</div>${this.renderNavigation()}`;
            }

            renderMultiQuestionItem(q) {
                return `<div class="multi-question-item" style="margin-bottom: 20px; border: 1px solid #e0e0e0; border-radius: 6px; padding: 15px;">
                    ${this.renderQuestionHeader(q, true)}
                    ${q.image ? `<img src="${q.image}" alt="Question Image" class="question-image" style="max-height: 200px;">` : ''}
                    ${this.renderOptions(q)}
                    ${this.state.examSubmitted && q.answer !== undefined ? this.renderAnswerReveal(q) : ''}
                </div>`;
            }

            renderWritingGroup(partNum) {
                const part = CONFIG.PARTS[partNum];
                const [start] = part.range;
                const groupStart = start + Math.floor((this.state.currentQ - start) / part.groupSize) * part.groupSize;
                const groupEnd = Math.min(groupStart + part.groupSize - 1, part.range[1]);
                const qs = this.state.questions.filter(q => q.num >= groupStart && q.num <= groupEnd);
                qs.forEach(q => q.type = getStrictType(q.num));
                
                return `<div class="multi-question-container">
                    ${qs.map(q => q.type === 'arrange' 
                        ? this.renderArrangeQuestion(q) 
                        : this.renderPictureQuestion(q)
                    ).join('')}
                </div>${this.renderNavigation()}`;
            }

            renderQuestionHeader(q, inGroup = false) {
                const bookmarked = this.state.bookmarks[q.num];
                const isVisible = this.state.contentVisible[q.num];
                const editBtn = (!inGroup && !this.state.isStudentMode)
                    ? `<button class="edit-question-btn" onclick="App.Modals.openEdit(${q.num})"><i class="bi bi-pencil"></i> Sửa</button>` 
                    : '';
                
                const contentLines = [
                    q.script ? `<div class="chinese-text">📖 ${q.script}</div>` : '',
                    q.pinyin ? `<div class="pinyin-text">🔊 ${q.pinyin}</div>` : '',
                    q.vietnamese ? `<div class="vietnamese-text">🇻🇳 ${q.vietnamese}</div>` : ''
                ].filter(Boolean).join('');

                return `
                    <i class="bi bi-star${bookmarked ? '-fill' : ''} question-star ${bookmarked ? 'active' : ''}" 
                       onclick="App.Bookmark.toggle(event, ${q.num})"></i>
                    ${editBtn}
                    <button class="toggle-content-btn" onclick="App.Content.toggle(${q.num})" title="显示/隐藏原文">
                        <i class="bi bi-eye${isVisible ? '-slash' : ''}"></i> ${isVisible ? '隐藏原文' : '显示原文'}
                    </button>
                    <div class="question-header">
                        <div class="question-number-box">${q.num}</div>
                        <div class="question-text-content">
                            <div style="font-size: 16px; color: #333; line-height: 1.6; font-weight: normal;">${q.statement || ''}</div>
                        </div>
                    </div>
                    <div class="content-display-box ${isVisible ? '' : 'hidden-content'}" id="content-${q.num}">
                        ${contentLines}
                    </div>`;
            }

            renderOptions(q) {
                const selected = this.state.userAnswers[q.num];
                const strictType = getStrictType(q.num);
                
                switch(strictType) {
                    case 'tf': return this.renderTFOptions(q, selected);
                    case 'mc': 
                    case 'fill': 
                        return (q.options?.length > 4 || (strictType === 'fill' && !q.options?.length)) 
                            ? this.renderHorizontalOptions(q, selected) 
                            : this.renderVerticalOptions(q, selected);
                    case 'order': return this.renderSentenceOrder(q);
                    default: return '';
                }
            }

            renderTFOptions(q, selected) {
                return `<div class="options-list">
                    <label class="option-plain">
                        <input type="radio" name="ans-${q.num}" value="true" ${selected === 'true' ? 'checked' : ''} 
                               onchange="App.Answer.select('true', ${q.num})">
                        <span class="option-label-text">√</span>
                    </label>
                    <label class="option-plain">
                        <input type="radio" name="ans-${q.num}" value="false" ${selected === 'false' ? 'checked' : ''} 
                               onchange="App.Answer.select('false', ${q.num})">
                        <span class="option-label-text">×</span>
                    </label>
                </div>`;
            }

            renderVerticalOptions(q, selected) {
                const opts = q.options || ['A', 'B', 'C', 'D'].map(l => ({ label: l, text: '选项' + l }));
                return `<div class="options-list">
                    ${opts.map(opt => `
                        <label class="option-plain">
                            <input type="radio" name="ans-${q.num}" value="${opt.label}" ${selected === opt.label ? 'checked' : ''} 
                                   onchange="App.Answer.select('${opt.label}', ${q.num})">
                            <span class="option-label-text">
                                <span style="font-weight: normal; color: #000;">${opt.label}.</span> ${opt.text}
                            </span>
                        </label>
                    `).join('')}
                </div>`;
            }

            renderHorizontalOptions(q, selected) {
                const strictType = getStrictType(q.num);
                const options = strictType === 'fill' 
                    ? ['A', 'B', 'C', 'D', 'E', 'F'].map(l => ({ label: l, text: '' })) 
                    : (q.options || []);
                
                return `<div class="options-horizontal">
                    ${options.map(opt => `
                        <label class="option-item-horizontal">
                            <input type="radio" name="ans-${q.num}" value="${opt.label}" ${selected === opt.label ? 'checked' : ''} 
                                   onchange="App.Answer.select('${opt.label}', ${q.num})">
                            <span class="option-letter">${opt.label}</span>
                        </label>
                    `).join('')}
                </div>`;
            }

            renderSentenceOrder(q) {
                const userOrder = this.state.userAnswers[q.num] || '';
                const sentences = q.sentences || ['句子A', '句子B', '句子C'];
                const labels = ['A', 'B', 'C'];
                
                return `<div class="sentence-order-container">
                    <div style="font-weight: normal; margin-bottom: 15px; color: #333; font-size: 16px;"></div>
                    <div style="margin-bottom: 20px;">
                        ${sentences.map((sent, idx) => `
                            <div class="sentence-order-item">
                                <span style="font-weight: normal; color: #4472c4; margin-right: 10px;">${labels[idx]}.</span>
                                <span>${sent}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #e0e0e0;">
                        <span style="font-weight: normal; font-size: 16px; color: #333;"></span>
                        <input type="text" id="order-input-${q.num}" value="${userOrder}" placeholder="ABC" maxlength="3" 
                               style="width: 100px; padding: 4px 8px; font-size: 16px; border: 1px solid #999; border-radius: 4px; text-align: center; text-transform: uppercase; font-weight: normal; letter-spacing: 3px; line-height: 1.2; height: auto; background: transparent;"
                               oninput="App.Answer.inputOrder(this.value, ${q.num})">
                        <span style="color: #666; font-size: 13px; font-weight: normal;"></span>
                    </div>
                </div>`;
            }

            renderArrangeQuestion(q) {
                const arranged = this.state.userAnswers[q.num] || [];
                const allWords = q.words || [];
                const usedWords = new Set(arranged);
                
                const wordBankHtml = allWords.map((w, idx) => {
                    const isUsed = usedWords.has(w);
                    return `<div class="word-card ${isUsed ? 'used' : ''}" id="word-${q.num}-${idx}" 
                            draggable="${!isUsed}" data-word="${w}" data-index="${idx}" data-qnum="${q.num}"
                            ondragstart="App.DragDrop.handleStart(event, '${w}', ${idx}, ${q.num}, 'bank')" 
                            ondragend="App.DragDrop.handleEnd(event)">${w}</div>`;
                }).join('');

                const dropZoneHtml = arranged.map((w, idx) => 
                    `<div class="dropped-word" id="dropped-${q.num}-${idx}" draggable="true" 
                          data-word="${w}" data-index="${idx}" data-qnum="${q.num}"
                          ondragstart="App.DragDrop.handleStart(event, '${w}', ${idx}, ${q.num}, 'zone')" 
                          ondragend="App.DragDrop.handleEnd(event)" 
                          ondrop="App.DragDrop.handleDrop(event, ${q.num})" 
                          ondragover="App.DragDrop.allowDrop(event)">${w}</div>`
                ).join('');

                const emptyHint = arranged.length === 0 
                    ? '<div style="color: #666; font-style: italic; pointer-events: none; font-weight: normal;"></div>' 
                    : '';

                return `<div class="writing-question-container" data-arrange-question="true">
                    ${this.renderQuestionHeader(q)}
                    <div class="arrange-content">
                        <div class="arrange-instruction"></div>
                        <div class="word-bank" id="wordBank-${q.num}" 
                             ondrop="App.DragDrop.handleDrop(event, ${q.num})" 
                             ondragover="App.DragDrop.allowDrop(event)">${wordBankHtml}</div>
                        <div class="drop-zone" id="dropZone-${q.num}" 
                             ondrop="App.DragDrop.handleDrop(event, ${q.num})" 
                             ondragover="App.DragDrop.allowDrop(event)">${dropZoneHtml}${emptyHint}</div>
                        <div class="result-area">
                            <div class="result-label"></div>
                            <div class="sentence-result" id="result-${q.num}">${arranged.join('')}</div>
                        </div>
                        ${this.state.examSubmitted && q.answer ? this.renderAnswerReveal(q) : ''}
                    </div>
                </div>`;
            }

            renderPictureQuestion(q) {
                const userAnswer = this.state.userAnswers[q.num] || '';
                const hasImage = q.pictureFile || q.image;
                const isStudentMode = this.state.isStudentMode;
                
                // Ẩn nút upload nếu là chế độ học viên (file HTML đã xuất)
                const showUpload = !isStudentMode;
                
                const imageHtml = hasImage 
                    ? `<div style="text-align: left; margin-bottom: 15px;">
                        <img src="${q.pictureFile || q.image}" alt="Picture" class="picture-writing-image" style="margin: 0;">
                        ${showUpload ? `
                        <div style="margin-top: 5px;">
                            <input type="file" id="picUpload-${q.num}" class="file-input" accept="image/*" style="display: none;" 
                                   onchange="App.Upload.picture(this, ${q.num})">
                            <button onclick="document.getElementById('picUpload-${q.num}').click()" 
                                    style="background: transparent; border: 1px solid #999; color: #666; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;">
                                <i class="bi bi-arrow-clockwise"></i> Đổi ảnh
                            </button>
                        </div>` : ''}
                       </div>`
                    : (showUpload ? `
                       <div class="picture-upload-container">
                        <input type="file" id="picUpload-${q.num}" class="file-input" accept="image/*" style="display: none;" 
                               onchange="App.Upload.picture(this, ${q.num})">
                        <button class="picture-upload-btn" onclick="document.getElementById('picUpload-${q.num}').click()">
                            <i class="bi bi-upload"></i> Tải hình ảnh lên
                        </button>
                        <span style="color: #999; font-size: 12px; margin-left: 10px; font-style: italic; font-weight: normal;">
                            Chưa có hình ảnh cho câu ${q.num}
                        </span>
                       </div>` 
                       : `<div style="color: #999; font-style: italic; margin-bottom: 15px; padding: 10px; background: #f5f5f5; border-radius: 4px;">
                            <i class="bi bi-image"></i> Chưa có hình ảnh cho câu ${q.num}
                          </div>`);

                return `<div class="writing-question-container">
                    ${this.renderQuestionHeader(q)}
                    <div class="picture-writing-container">
                        ${imageHtml}
                        <div class="picture-word-display">${q.pictureWord || '...'}</div>
                        <textarea class="writing-textarea" placeholder="请用上面的词语写句子..." 
                                  oninput="App.Answer.inputWriting(this.value, ${q.num})">${userAnswer}</textarea>
                    </div>
                    ${this.state.examSubmitted && q.answer ? this.renderAnswerReveal(q) : ''}
                </div>`;
            }

            renderAnswerReveal(q) {
                const answerText = q.type === 'tf' ? (q.answer ? '√' : '×') : q.answer;
                return `<div class="answer-reveal show">
                    <div class="answer-reveal-title">Đáp án đúng：</div>
                    <div class="answer-reveal-content">${answerText}</div>
                </div>`;
            }

            renderNavigation() {
                return `<div class="navigation-buttons">
                    <button class="btn btn-prev" onclick="App.Navigation.prev()" ${this.state.currentQ === 1 ? 'disabled' : ''}>上一题</button>
                    <button class="btn btn-next" onclick="App.Navigation.next()" ${this.state.currentQ === 100 ? 'disabled' : ''}>下一题</button>
                </div>`;
            }

            renderError(message) {
                document.getElementById('contentBody').innerHTML = `
                    <div class="error-box">
                        <h3>Lỗi hiển thị câu hỏi</h3>
                        <p>${message}</p>
                        <button onclick="App.Renderer.render()">Thử lại</button>
                    </div>`;
            }
        }

        // ========== NAVIGATION MANAGER ==========
        class NavigationManager {
            constructor(state, renderer) {
                this.state = state;
                this.renderer = renderer;
            }

            buildSidebar() {
                document.getElementById('sidebarLeft').innerHTML = 
                    this.renderListeningSection() + 
                    this.renderReadingSection() + 
                    this.renderWritingSection();
            }

            renderListeningSection() {
                return `<div class="nav-section">
                    <div class="nav-title"><i class="nav-icon bi bi-headphones"></i>听力</div>
                    ${this.renderPartToggle(1, '第一部分', 1, 10)}
                    ${this.renderPartToggle(2, '第二部分', 11, 25)}
                    ${this.renderPartToggle(3, '第三部分', 26, 45, false, true)}
                </div>`;
            }

            renderReadingSection() {
                return `<div class="nav-section">
                    <div class="nav-title"><i class="nav-icon bi bi-book"></i> 阅读</div>
                    ${this.renderPartToggle(4, '第一部分', 46, 55, true)}
                    ${this.renderPartToggle(5, '第二部分', 56, 65, true)}
                    ${this.renderPartToggle(6, '第三部分', 66, 85, false, true)}
                </div>`;
            }

            renderWritingSection() {
                return `<div class="nav-section">
                    <div class="nav-title"><i class="nav-icon bi bi-pencil-square"></i> 书写</div>
                    ${this.renderPartToggle(7, '第一部分', 86, 95, true)}
                    ${this.renderPartToggle(8, '第二部分', 96, 100, true)}
                </div>`;
            }

            renderPartToggle(partNum, title, start, end, isGroup = false, hasPairs = false) {
                let items = '';
                
                if (isGroup) {
                    for (let i = start; i <= end; i += 5) {
                        const groupEnd = Math.min(i + 4, end);
                        items += this.renderNavItem(i, `${i}-${groupEnd}`, false);
                    }
                } else if (hasPairs) {
                    if (partNum === 3) {
                        for (let i = start; i <= 35; i++) items += this.renderNavItem(i, i, true);
                        for (let i = 36; i <= 45; i += 2) items += this.renderNavItem(i, `${i}-${i+1}`, false);
                    } else if (partNum === 6) {
                        for (let i = start; i <= 79; i++) items += this.renderNavItem(i, i, true);
                        for (let i = 80; i <= 85; i += 2) items += this.renderNavItem(i, `${i}-${i+1}`, false);
                    }
                } else {
                    for (let i = start; i <= end; i++) items += this.renderNavItem(i, i, true);
                }

                return `<div class="part-header-simple" onclick="App.Navigation.togglePart(${partNum})" id="part${partNum}-toggle">
                    <span><span class="nav-prefix" id="part${partNum}-prefix">▼</span>${title}</span>
                </div>
                <div class="sub-nav show" id="part${partNum}-sub">${items}</div>`;
            }

            renderNavItem(num, display, isSingle) {
                return `<div class="nav-item ${isSingle ? 'single-question' : ''}" id="nav-${num}" onclick="App.Navigation.goTo(${num})">
                    <span><span class="nav-prefix">❱</span>${isSingle ? `<span class="q-num">${display}</span>` : display}</span>
                    <span class="nav-status">
                        <i class="icon-pen bi bi-pencil"></i>
                        <i class="icon-star bi bi-star"></i>
                    </span>
                </div>`;
            }

            updateStatus() {
                this.state.questions.forEach(q => {
                    q.type = getStrictType(q.num);
                    
                    // Skip special cases
                    if ([81, 83, 85].includes(q.num)) return;
                    if (q.num >= 37 && q.num <= 45 && q.num % 2 === 1) return;

                    const navId = this.resolveNavId(q.num);
                    const navItem = document.getElementById(`nav-${navId}`);
                    if (!navItem) return;

                    const answered = this.state.userAnswers.hasOwnProperty(q.num) && 
                                   this.state.userAnswers[q.num] !== '';
                    const bookmarked = this.state.bookmarks[q.num];

                    navItem.classList.toggle('active', navId === this.state.currentQ);
                    navItem.classList.toggle('answered', answered);
                    navItem.classList.toggle('bookmarked', bookmarked);

                    const penIcon = navItem.querySelector('.icon-pen');
                    const starIcon = navItem.querySelector('.icon-star');
                    
                    if (penIcon) penIcon.className = `icon-pen bi bi-pencil${answered ? '-fill' : ''}`;
                    if (starIcon) starIcon.className = `icon-star bi bi-star${bookmarked ? '-fill' : ''}`;
                });
            }

            resolveNavId(num) {
                if (num === 80 || num === 81) return 80;
                if (num === 82 || num === 83) return 82;
                if (num === 84 || num === 85) return 84;
                if (num >= 36 && num <= 45) return 36 + Math.floor((num - 36) / 2) * 2;
                return num;
            }

            togglePart(partNum) {
                const sub = document.getElementById(`part${partNum}-sub`);
                const prefix = document.getElementById(`part${partNum}-prefix`);
                if (sub && prefix) {
                    sub.classList.toggle('show');
                    prefix.textContent = sub.classList.contains('show') ? '▼' : '❱';
                }
            }

            goTo(num) {
                // Adjust for pairs
                if (num >= 36 && num <= 45) {
                    num = 36 + Math.floor((num - 36) / 2) * 2;
                } else if (num === 81) num = 80;
                else if (num === 83) num = 82;
                else if (num === 85) num = 84;

                App.Audio.stop();
                this.state.currentQ = num;
                this.renderer.render();
                this.updateStatus();
            }

            prev() {
                const q = this.state.getCurrentQuestion();
                if (!q) return;

                if (this.state.currentQ >= 36 && this.state.currentQ <= 45) {
                    const currentPairStart = 36 + Math.floor((this.state.currentQ - 36) / 2) * 2;
                    this.goTo(currentPairStart > 36 ? currentPairStart - 2 : 35);
                } else if (this.state.currentQ > 80 && this.state.currentQ <= 85) {
                    const prevPairStart = 80 + (Math.floor((this.state.currentQ - 80) / 2) - 1) * 2;
                    this.goTo(Math.max(prevPairStart, 80));
                } else if (this.state.currentQ > 1) {
                    this.goTo(this.state.currentQ - 1);
                }
            }

            next() {
                const q = this.state.getCurrentQuestion();
                if (!q) return;

                if (this.state.currentQ >= 36 && this.state.currentQ <= 45) {
                    const currentPairStart = 36 + Math.floor((this.state.currentQ - 36) / 2) * 2;
                    this.goTo(currentPairStart < 44 ? currentPairStart + 2 : 46);
                } else if (this.state.currentQ >= 80 && this.state.currentQ < 85) {
                    const nextPairStart = 80 + (Math.floor((this.state.currentQ - 80) / 2) + 1) * 2;
                    this.goTo(Math.min(nextPairStart, 86));
                } else if (this.state.currentQ < 100) {
                    this.goTo(this.state.currentQ + 1);
                }
            }
        }

        // ========== EXAM MANAGER ==========
        class ExamManager {
            constructor(state, renderer, navigation) {
                this.state = state;
                this.renderer = renderer;
                this.navigation = navigation;
            }

            submit() {
                if (!confirm('Bạn có chắc muốn nộp bài?')) return;
                
                clearInterval(this.state.timerInterval);
                this.state.examSubmitted = true;
                const results = this.calculateResults();
                this.showResultModal(results);
                this.renderer.render();
            }

            calculateResults() {
                const partScores = {};
                const sectionScores = {
                    listening: { correct: 0, total: 0 },
                    reading: { correct: 0, total: 0 },
                    writing: { correct: 0, total: 0 }
                };

                Object.keys(CONFIG.PARTS).forEach(key => {
                    partScores[key] = { name: CONFIG.PARTS[key].name, correct: 0, total: 0, wrong: [] };
                });

                this.state.questions.forEach(q => {
                    q.type = getStrictType(q.num);
                    const isCorrect = this.checkAnswer(q);
                    
                    partScores[q.part].total++;
                    sectionScores[q.section].total++;
                    
                    if (isCorrect) {
                        partScores[q.part].correct++;
                        sectionScores[q.section].correct++;
                    } else {
                        partScores[q.part].wrong.push({
                            num: q.num,
                            userAns: this.state.userAnswers[q.num] || '未作答',
                            correctAns: q.type === 'tf' ? (q.answer ? '√' : '×') : q.answer
                        });
                    }
                });

                return { partScores, sectionScores };
            }

            checkAnswer(q) {
                const userAns = this.state.userAnswers[q.num];
                if (userAns === undefined || userAns === '' || userAns === null) return false;
                
                const strictType = getStrictType(q.num);
                switch(strictType) {
                    case 'arrange':
                        return Array.isArray(userAns) ? userAns.join('') === q.answer : false;
                    case 'order':
                        return userAns.toUpperCase() === q.answer.toUpperCase();
                    case 'picture':
                        if (!q.pictureWord || q.pictureWord === '') return false;
                        return userAns && userAns.includes(q.pictureWord);
                    case 'tf':
                        return userAns === (q.answer ? 'true' : 'false');
                    default:
                        return userAns == q.answer;
                }
            }

            showResultModal(results) {
                const { partScores, sectionScores } = results;
                const calcScore = (s) => s.total === 0 ? 0 : Math.round((s.correct / s.total) * 100);
                const totalScore = calcScore(sectionScores.listening) + 
                                 calcScore(sectionScores.reading) + 
                                 calcScore(sectionScores.writing);

                const sectionCards = [
                    { key: 'listening', cls: 'listening', title: '听力 (Nghe)' },
                    { key: 'reading', cls: 'reading', title: '阅读 (Đọc)' },
                    { key: 'writing', cls: 'writing', title: '书写 (Viết)' }
                ].map(({ key, cls, title }) => `
                    <div class="result-card ${cls}">
                        <div class="result-card-title">${title}</div>
                        <div class="result-card-score">${calcScore(sectionScores[key])}</div>
                        <div class="result-card-detail">${sectionScores[key].correct}/${sectionScores[key].total} câu đúng</div>
                    </div>
                `).join('');

                const partDetails = Object.keys(partScores)
                    .filter(p => partScores[p].total > 0)
                    .map(partNum => {
                        const part = partScores[partNum];
                        const percentage = Math.round((part.correct / part.total) * 100);
                        const wrongList = part.wrong.length 
                            ? `<div style="color: #666; margin-bottom: 5px;">Câu sai (${part.wrong.length} câu):</div>
                               <div class="result-wrong-list">
                                   ${part.wrong.map(w => `
                                       <span class="result-wrong-item" onclick="App.Navigation.goTo(${w.num})" 
                                             title="Đáp án của bạn: ${w.userAns}, Đáp án đúng: ${w.correctAns}">
                                           Câu ${w.num}
                                       </span>
                                   `).join('')}
                               </div>`
                            : '<div style="color: #4caf50;"><i class="bi bi-check-circle"></i> Hoàn hảo! Không có câu sai nào.</div>';
                        
                        return `<div class="result-part">
                            <div class="result-part-header">
                                <span>${part.name}</span>
                                <span>${part.correct}/${part.total} đúng (${percentage}%)</span>
                            </div>
                            <div class="result-part-content">${wrongList}</div>
                        </div>`;
                    }).join('');

                document.getElementById('resultBody').innerHTML = `
                    <div class="result-total-score">
                        <div class="label">Tổng điểm</div>
                        <div class="score">${totalScore}/300</div>
                    </div>
                    <div class="result-summary">${sectionCards}</div>
                    <div class="result-details">
                        <div class="result-details-title">Chi tiết từng phần：</div>
                        ${partDetails}
                    </div>`;
                
                document.getElementById('resultModal').classList.add('show');
            }
        }

        // ========== DRAG & DROP MANAGER ==========
        class DragDropManager {
            constructor(state) {
                this.state = state;
                this.dragSrcData = null;
            }

            handleStart(e, word, index, qNum, source) {
                this.dragSrcData = { word, index, qNum, source };
                e.target.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', JSON.stringify(this.dragSrcData));
            }

            handleEnd(e) {
                e.target.classList.remove('dragging');
                this.dragSrcData = null;
            }

            allowDrop(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            }

            handleDrop(e, qNum) {
                e.preventDefault();
                e.stopPropagation();
                
                if (!this.dragSrcData || this.dragSrcData.qNum !== qNum) return;
                
                const { word, source } = this.dragSrcData;
                let arranged = [...(this.state.userAnswers[qNum] || [])];
                
                const dropTarget = e.target.closest('.dropped-word');
                const dropZone = e.target.closest('.drop-zone');
                const wordBank = e.target.closest('.word-bank');

                if (source === 'bank' && dropZone && !arranged.includes(word)) {
                    if (dropTarget) {
                        const toIndex = arranged.indexOf(dropTarget.dataset.word);
                        if (toIndex > -1) arranged.splice(toIndex, 0, word);
                        else arranged.push(word);
                    } else {
                        arranged.push(word);
                    }
                } else if (source === 'zone') {
                    if (wordBank) {
                        arranged = arranged.filter(w => w !== word);
                    } else if (dropZone && dropTarget) {
                        const toIndex = arranged.indexOf(dropTarget.dataset.word);
                        const fromIndex = arranged.indexOf(word);
                        if (toIndex > -1 && fromIndex > -1 && toIndex !== fromIndex) {
                            [arranged[fromIndex], arranged[toIndex]] = [arranged[toIndex], arranged[fromIndex]];
                        }
                    } else if (dropZone && !dropTarget) {
                        const currentIndex = arranged.indexOf(word);
                        if (currentIndex > -1) {
                            arranged.splice(currentIndex, 1);
                            arranged.push(word);
                        }
                    }
                }

                this.state.userAnswers[qNum] = arranged;
                App.Navigation.updateStatus();
                App.Renderer.render();
            }
        }

                    return;
                }
                
                const reader = new FileReader();

        // ========== EXCEL MANAGER ==========
        class ExcelManager {
            constructor(state, navigation, renderer) {
                this.state = state;
                this.navigation = navigation;
                this.renderer = renderer;
            }

            export() {
                const wb = XLSX.utils.book_new();
                wb.Props = { 
                    Title: "HSK4 Exam Data", 
                    Subject: "HSK4 Questions", 
                    Author: "Gia Sư Hoa Ngữ Tân An", 
                    CreatedDate: new Date() 
                };

                const sections = [
                    { name: "听力 (1-45)", key: "listening", range: [1, 45] },
                    { name: "阅读 (46-85)", key: "reading", range: [46, 85] },
                    { name: "书写 (86-100)", key: "writing", range: [86, 100] }
                ];

                sections.forEach(section => {
                    const wsData = [[
                        "STT", "Phần", "Loại câu hỏi", "Nội dung câu hỏi", "Đoạn văn đọc hiểu (Passage)",
                        "Nội dung gốc (Script/录音)", "Phiên âm (Pinyin)", "Nghĩa tiếng Việt",
                        "Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D", "Đáp án E", "Đáp án F",
                        "Đáp án đúng", "Các từ (Arrange 86-95)", "Từ khóa hình (Picture 96-100)",
                        "Các câu (Order 56-65)", "Ghi chú"
                    ]];

                    const sectionQs = this.state.questions.filter(q => 
                        q.num >= section.range[0] && q.num <= section.range[1]
                    );

                    sectionQs.forEach(q => {
                        const strictType = getStrictType(q.num);
                        let wordsStr = '', pictureWordStr = '', sentencesStr = '';
                        
                        if (strictType === 'arrange' && q.words) wordsStr = q.words.join('，');
                        else if (strictType === 'picture') pictureWordStr = q.pictureWord || '';
                        else if (strictType === 'order' && q.sentences) sentencesStr = q.sentences.join('|');

                        wsData.push([
                            q.num, CONFIG.PARTS[q.part]?.name || "", CONFIG.TYPE_TO_EXCEL[strictType] || strictType,
                            q.statement || "", q.passage || "", q.script || "", q.pinyin || "",
                            q.vietnamese || "", q.options?.[0]?.text || "", q.options?.[1]?.text || "",
                            q.options?.[2]?.text || "", q.options?.[3]?.text || "", q.options?.[4]?.text || "",
                            q.options?.[5]?.text || "",
                            strictType === 'tf' ? (q.answer ? 'TRUE' : 'FALSE') : (q.answer || ""),
                            wordsStr, pictureWordStr, sentencesStr, ""
                        ]);
                    });

                    const ws = XLSX.utils.aoa_to_sheet(wsData);
                    ws['!cols'] = [
                        { wch: 6 }, { wch: 30 }, { wch: 25 }, { wch: 35 }, { wch: 50 },
                        { wch: 35 }, { wch: 30 }, { wch: 35 }, { wch: 20 }, { wch: 20 },
                        { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 15 },
                        { wch: 30 }, { wch: 20 }, { wch: 40 }, { wch: 15 }
                    ];
                    
                    XLSX.utils.book_append_sheet(wb, ws, section.name);
                });

                const now = new Date();
                const dateStr = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}`;
                XLSX.writeFile(wb, `HSK4_Exam_Data_${dateStr}.xlsx`);
            }

            handleImport(input) {
                const file = input.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        let importedCount = 0, updatedCount = 0;

                        workbook.SheetNames.forEach(sheetName => {
                            const worksheet = workbook.Sheets[sheetName];
                            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                            for (let i = 1; i < jsonData.length; i++) {
                                const row = jsonData[i];
                                if (!row || !row[0]) continue;

                                const num = parseInt(row[CONFIG.EXCEL_COLUMNS.NUM]);
                                if (!num || num < 1 || num > 100) continue;

                                const isNew = !this.state.getQuestion(num);
                                const q = this.state.getQuestion(num) || { num };
                                const strictType = getStrictType(num);
                                
                                q.type = strictType;
                                q.passage = row[CONFIG.EXCEL_COLUMNS.PASSAGE]?.toString() || "";
                                q.statement = row[CONFIG.EXCEL_COLUMNS.STATEMENT]?.toString() || "";
                                q.script = row[CONFIG.EXCEL_COLUMNS.SCRIPT]?.toString() || "";
                                q.pinyin = row[CONFIG.EXCEL_COLUMNS.PINYIN]?.toString() || "";
                                q.vietnamese = row[CONFIG.EXCEL_COLUMNS.VIETNAMESE]?.toString() || "";
                                q.section = num <= 45 ? 'listening' : num <= 85 ? 'reading' : 'writing';
                                q.part = num <= 10 ? 1 : num <= 25 ? 2 : num <= 45 ? 3 : num <= 55 ? 4 : num <= 65 ? 5 : num <= 85 ? 6 : num <= 95 ? 7 : 8;

                                // Options for MC and Fill
                                if (strictType === 'mc' || strictType === 'fill') {
                                    q.options = [];
                                    const labels = strictType === 'fill' ? ['A', 'B', 'C', 'D', 'E', 'F'] : ['A', 'B', 'C', 'D'];
                                    labels.forEach((label, idx) => {
                                        const colIndex = CONFIG.EXCEL_COLUMNS.OPT_A + idx;
                                        if (row[colIndex] && row[colIndex].toString().trim()) {
                                            q.options.push({ label, text: row[colIndex].toString() });
                                        }
                                    });
                                }

                                // Answer
                                if (row[CONFIG.EXCEL_COLUMNS.ANSWER] !== undefined) {
                                    const ans = row[CONFIG.EXCEL_COLUMNS.ANSWER].toString().trim();
                                    q.answer = strictType === 'tf' 
                                        ? (ans.toUpperCase() === 'TRUE' || ans === '1' || ans === 'true') 
                                        : ans;
                                }

                                // Special fields
                                if (strictType === 'arrange') {
                                    const wordsStr = row[CONFIG.EXCEL_COLUMNS.WORDS]?.toString() || '';
                                    if (wordsStr) q.words = wordsStr.split(/[，,]/).map(w => w.trim()).filter(Boolean);
                                    else if (!q.words) q.words = ['我', '喜欢', '学习', '汉语'];
                                } else if (strictType === 'picture') {
                                    q.pictureWord = row[CONFIG.EXCEL_COLUMNS.PICTURE_WORD]?.toString() || '';
                                } else if (strictType === 'order') {
                                    const sentencesStr = row[CONFIG.EXCEL_COLUMNS.SENTENCES]?.toString() || '';
                                    if (sentencesStr) q.sentences = sentencesStr.split('|').map(s => s.trim()).filter(Boolean);
                                    else if (!q.sentences) q.sentences = ['句子A', '句子B', '句子C'];
                                } else if (strictType === 'fill') {
                                    q.vocabSet = num <= 50 ? 46 : 51;
                                    q.vocabList = DataGenerator.getVocabList(num);
                                }

                                if (isNew) {
                                    this.state.questions.push(q);
                                    importedCount++;
                                } else {
                                    updatedCount++;
                                }
                            }
                        });

                        this.state.questions.sort((a, b) => a.num - b.num);
                        this.navigation.buildSidebar();
                        this.navigation.updateStatus();
                        this.renderer.render();
                        
                        alert(`Kết quả nhập Excel:\n- Thêm mới: ${importedCount} câu\n- Cập nhật: ${updatedCount} câu`);
                    } catch (err) {
                        alert('Lỗi nhập Excel: ' + err.message);
                        console.error(err);
                    }
                };
                reader.readAsArrayBuffer(file);
                input.value = '';
            }
        }

            renderHTMLExportSection() {

                    <div class="admin-btn-group">
