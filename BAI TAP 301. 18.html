形部件。"},{"p":"______（wǎng）前走","a":"往","e":"往前走 = đi về phía trước; 往含彳。"}],"challenge":{"prompt":"“行” 有哪两个读音？写出两个含有读音不同的“行”的词。","a":"xíng—行动；háng—银行","acc":["xíng行动háng银行","xíng—行动háng—银行","xíng:行动háng:银行","行动xíng银行háng","xíng 行动 háng 银行"],"e":"行常见两种读音：xíng，如 行动；háng，如 银行。答案开放，可写其他读音正确的词。","sample":true},"translations":[{"vi":"Xe lửa đến trễ rồi.","a":"火车晚点了。","acc":["火车晚点了","火车来晚了"],"e":"晚点 = đến/chạy trễ."},{"vi":"Máy bay từ Hà Nội đã đến chưa?","a":"从河内来的飞机到了吗？","acc":["从河内来的飞机到了吗","河内来的飞机到了吗","从河内来的飞机到没到"],"e":"从河内来的飞机 = máy bay đến từ Hà Nội; 到了吗 = đã đến chưa?"},{"vi":"Hiện giờ anh ấy đang ở thành phố Hồ Chí Minh.","a":"他现在在胡志明市。","acc":["他现在在胡志明市","现在他在胡志明市"],"e":"现在 + 在 + 地点。"},{"vi":"Em gái tôi sắp tốt nghiệp rồi.","a":"我妹妹快要毕业了。","acc":["我妹妹快要毕业了","我妹妹就要毕业了","我妹妹要毕业了"],"e":"快要/就要/要…了 = sắp…rồi."},{"vi":"Xe lửa sắp chạy rồi, mau lên đi!","a":"火车快要开了，快上车吧！","acc":["火车快要开了快上车吧","火车就要开了快上车吧","火车要开了快上车吧"],"e":"火车快要开了 = tàu sắp chạy; 快上车吧 = mau lên xe."},{"vi":"Chúng ta đi chụp hình trước đã, rồi lát nữa hãy quay lại đây ăn trưa.","a":"我们先去照相，一会儿再回来这儿吃午饭。","acc":["我们先去照相一会儿再回来这儿吃午饭","我们先去照相一会儿再回来吃午饭","我们先去照相再回来吃午饭","我们先去照相然后回来吃午饭"],"e":"先…再… = trước… rồi…; 一会儿 = lát nữa."},{"vi":"Cô ấy đến trường bằng xe buýt.","a":"她坐公共汽车去学校。","acc":["她坐公共汽车去学校","她坐公交车去学校","她乘公共汽车去学校"],"e":"坐公共汽车去学校 = đi xe buýt đến trường."},{"vi":"Khoảng ba giờ chiều tôi sẽ đến đón bạn.","a":"下午三点左右我来接你。","acc":["下午三点左右我来接你","我下午三点左右来接你","下午三点左右我去接你"],"e":"三点左右 = khoảng 3 giờ; 接你 = đón bạn."},{"vi":"Sao bạn biết hôm nay tôi sẽ đến?","a":"你怎么知道我今天要来？","acc":["你怎么知道我今天要来","你怎么知道我今天会来","你怎么知道我今天来"],"e":"怎么知道 = sao biết; 今天要来 = hôm nay sẽ đến."},{"vi":"Mary nói với tôi đó. (Dùng câu 是。。。的）","a":"是玛丽告诉我的。","acc":["是玛丽告诉我的","玛丽告诉我的"],"e":"是…的 强调动作执行者：是玛丽告诉我的。"}]};
const SECTION_COUNT=9, STORE='BAI_TAP_301_18_FINAL_V1', NOTE_STORE='BAI301_BAI18_NOTES_FINAL_V1';
const state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:：；“”‘’()（）—-]/g,'')}
function key(s,i){return s+'-'+i}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){} updateProgress()}
function setAns(s,i,v){state.answers[key(s,i)]=v;delete state.checked[key(s,i)];save()}
function accepted(v,arr){return (arr||[]).some(a=>norm(a)===norm(v))}
function radio(s,i,opts){let v=state.answers[key(s,i)]||'';return `<div class="options-horizontal">`+opts.map((o,j)=>`<label class="option"><input type="radio" name="q-${s}-${i}" value="${esc(o)}" ${norm(v)===norm(o)?'checked':''} onchange="setAns(${s},${i},this.value)"><span class="letter">${letters[j]}.</span><span class="option-text">${esc(o)}</span></label>`).join('')+'</div>'}
function feedback(s,i,it,sample=false){if(!state.checked[key(s,i)])return '<div class="feedback"></div>';let v=state.answers[key(s,i)]||'',arr=it.acc||[it.a],ok=accepted(v,arr);return `<div class="feedback show ${ok?'correct':(sample||it.sample?'sample':'wrong')}"><div class="status">${ok?'✓ Đúng':'△ Chưa khớp đáp án tham khảo'}</div>${ok?'':`<div>Đáp án tham khảo: <span class="correct-answer">${esc(it.a)}</span></div>`}<div><b>Giải thích:</b> ${esc(it.e||'')}</div></div>`}
function check(s,i){state.checked[key(s,i)]=true;save();renderSection();renderNav()}
function clearOne(s,i){delete state.answers[key(s,i)];delete state.checked[key(s,i)];save();renderSection();renderNav()}
function inputBox(s,i,ph=''){return `<input class="input-text" value="${esc(state.answers[key(s,i)]||'')}" placeholder="${esc(ph)}" oninput="setAns(${s},${i},this.value)">`}
function sectionNames(){return ['','熟读词语','用上面的词语填空','要/快要/就要…了','完成对话','写出动词的宾语','根据上下文填空','是…的','刂 / 彳 + 你想想','越汉翻译']}
function renderNav(){document.getElementById('sectionNav').innerHTML=Array.from({length:SECTION_COUNT},(_,i)=>i+1).map(s=>`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`).join('')}
function goSection(s){if(s<1||s>SECTION_COUNT)return;state.section=s;save();renderNav();renderSection()}
function renderStudy(){return `<div class="section-instruction"><strong>熟读词语 — Đọc thuộc những cụm từ bên dưới.</strong><div class="muted">Pinyin và nghĩa Việt là phần hỗ trợ học tập; chữ Hán và thứ tự cụm từ giữ theo nguồn Bài 18.</div></div>`+DATA.study.map(g=>`<div class="question-card"><div class="qtext"><b style="font-size:27px">${esc(g.head)}</b><div style="color:#1976d2">${esc(g.p)}</div><div>${esc(g.m)}</div><div style="margin-top:10px">${g.lines.map(x=>`<div style="padding:7px 0;border-top:1px dashed #e2e2e2"><b>${esc(x.cn)}</b><br><span style="color:#1976d2">${esc(x.p)}</span><br><span>${esc(x.m)}</span>${x.note?`<div class="source-note">${esc(x.note)}</div>`:''}</div>`).join('')}</div></div></div>`).join('')}
function renderFill2(){let h=`<div class="section-instruction"><strong>用上面的词语天空</strong><br>Dùng những từ/cụm từ ở trên điền vào chỗ trống.<div class="source-note">Nguồn DOCX ghi nguyên văn 天空; theo nội dung tiếng Việt và các câu có chỗ trống, ý của bài là 填空. Giao diện giữ chữ nguồn và chỉ giải thích, không sửa ngầm.</div> Theo sửa đổi đã duyệt, phần lựa chọn dùng radio hiển thị trực tiếp.<div class="word-bank">${DATA.fill2.options.map(x=>`<span class="word-chip">${esc(x)}</span>`).join('')}</div></div>`;DATA.fill2.data.forEach((it,i)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.s)}</div></div>${radio(2,i,DATA.fill2.options)}<div class="check-row"><button class="check-btn" onclick="check(2,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(2,${i})">Làm lại câu</button></div>${feedback(2,i,it)}</div>`});return h}
function renderPattern3(){return `<div class="section-instruction"><strong>用 “要…了 / 快要…了 / 就要…了” 完成句子</strong><br>Hoàn thành câu bằng ô nhập. Nguồn cho phép nhiều cách phù hợp nên hệ thống dùng đáp án tham khảo, không chấm cứng một mẫu duy nhất.</div>`+DATA.pattern3.map((it,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.s)}</div></div>${inputBox(3,i,'Nhập phần hoàn thành câu')}<div class="check-row"><button class="check-btn" onclick="check(3,${i})">Đối chiếu câu</button></div>${feedback(3,i,it,true)}</div>`).join('')}
function renderDialogue(){let idx=0,h=`<div class="section-instruction"><strong>完成对话 — Hoàn thành đối thoại.</strong></div>`;DATA.dialogue.forEach((g,gi)=>{let ids=[];let body=g.lines.map(line=>{let [sp,pre,slot,suf]=line;if(slot===null)return `<div><b>${esc(sp)}：</b>${esc(pre)}</div>`;let id=idx++;ids.push(id);return `<div><b>${esc(sp)}：</b>${esc(pre)} <span style="display:inline-block;min-width:260px">${inputBox(4,id)}</span>${esc(suf)}</div>`}).join('');h+=`<div class="question-card"><div class="qhead"><div class="qnum">${gi+1}</div><div class="qtext" style="width:100%;line-height:2.2">${body}</div></div><div class="check-row"><button class="check-btn" onclick="checkGroup4([${ids.join(',')}])">Kiểm tra đoạn</button></div>${ids.some(id=>state.checked[key(4,id)])?`<div class="feedback show sample">${ids.map((id,j)=>{let it=g.items[j],v=state.answers[key(4,id)]||'',ok=accepted(v,it.acc||[it.a]);return `<div style="margin:8px 0"><b>${ok?'✓':'△'} Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.a)}</span><br><b>Giải thích:</b> ${esc(it.e)}</div>`}).join('')}</div>`:''}</div>`});return h}
function checkGroup4(ids){ids.forEach(i=>state.checked[key(4,i)]=true);save();renderSection();renderNav()}
function objectFlat(){return DATA.objects.flatMap(g=>g.items.map(it=>({...it,verb:g.verb})))}
function renderObjects(){let flat=objectFlat(),k=0,h=`<div class="section-instruction"><strong>写出动词的宾语</strong><br>Điền tân ngữ thích hợp cho động từ. Đây là câu mở của nguồn nên giữ ô nhập; hệ thống chỉ đối chiếu với một số đáp án tham khảo thông dụng.</div>`;DATA.objects.forEach(g=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${esc(g.verb)}</div><div class="qtext" style="width:100%"><b>${esc(g.verb)}</b></div></div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">`;g.items.forEach(it=>{let i=k++;h+=`<div>${inputBox(5,i,'Nhập tân ngữ')}<div class="check-row"><button class="check-btn" onclick="check(5,${i})">Đối chiếu</button></div>${feedback(5,i,it,true)}</div>`});h+='</div></div>'});return h}
function renderContext6(){let h=`<div class="section-instruction"><strong>根据上下文的意思用词填空</strong><br>Dựa theo ngữ cảnh điền từ. Phần lựa chọn dùng radio hiển thị trực tiếp.<div class="word-bank">${DATA.context6.options.map(x=>`<span class="word-chip">${esc(x)}</span>`).join('')}</div></div><div class="question-card"><div class="passage">${esc(DATA.context6.source)}</div></div>`;DATA.context6.data.forEach((it,i)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">Chỗ trống ${i+1}</div></div>${radio(6,i,DATA.context6.options)}<div class="check-row"><button class="check-btn" onclick="check(6,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(6,${i})">Làm lại câu</button></div>${feedback(6,i,it)}</div>`});return h}
function renderShiDe(){let h=`<div class="section-instruction"><strong>用 “是…的” 把上面带序号的句子改成问句，并回答第4题</strong><br>Dùng 是…的 đổi các câu có số thành câu hỏi; riêng câu 4 phải viết cả câu hỏi và câu trả lời. Đây là phần tự viết nên dùng đáp án GPT tham khảo, không chấm cứng cách diễn đạt duy nhất.</div>`;DATA.shiDe.forEach((it,i)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.s)}</div></div>${inputBox(7,i,'Nhập câu hỏi')}<div class="check-row"><button class="check-btn" onclick="check(7,${i})">Đối chiếu câu</button></div>${feedback(7,i,it,true)}</div>`});let q=DATA.q4,qi=3,ai=4;h+=`<div class="question-card"><div class="qhead"><div class="qnum">4</div><div class="qtext">${esc(q.s)}</div></div><div style="margin-bottom:9px"><b>Câu hỏi:</b>${inputBox(7,qi,'Nhập câu hỏi')}</div><div><b>Trả lời câu 4:</b>${inputBox(7,ai,'Nhập câu trả lời')}</div><div class="check-row"><button class="check-btn" onclick="checkQ4()">Đối chiếu câu 4</button></div>${q4Feedback()}</div>`;return h}
function checkQ4(){state.checked[key(7,3)]=true;state.checked[key(7,4)]=true;save();renderSection();renderNav()}
function q4Feedback(){if(!state.checked[key(7,3)]&&!state.checked[key(7,4)])return '<div class="feedback"></div>';let q=DATA.q4,vq=state.answers[key(7,3)]||'',va=state.answers[key(7,4)]||'',okq=accepted(vq,q.qacc),oka=accepted(va,q.ansacc);return `<div class="feedback show ${okq&&oka?'correct':'sample'}"><div class="status">${okq&&oka?'✓ Khớp đáp án tham khảo':'△ Đối chiếu đáp án tham khảo'}</div><div><b>Câu hỏi tham khảo:</b> <span class="correct-answer">${esc(q.q)}</span></div><div><b>Trả lời tham khảo:</b> <span class="correct-answer">${esc(q.ans)}</span></div><div><b>Giải thích:</b> ${esc(q.e)}</div></div>`}
function renderRadical(){let h=`<div class="section-instruction"><strong>请写出含有偏旁 “刂” 或 “彳” 的汉子</strong><br>Viết chữ Hán theo Pinyin và cụm từ của nguồn.<div class="source-note">Nguồn DOCX ghi 汉子; theo nội dung bài tập phải hiểu là 汉字. Giao diện giữ nguyên chữ nguồn và chỉ chú thích.</div></div>`;DATA.radical.forEach((it,i)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.p)}</div></div>${inputBox(8,i,'Nhập 1 chữ Hán')}<div class="check-row"><button class="check-btn" onclick="check(8,${i})">Kiểm tra</button></div>${feedback(8,i,it)}</div>`});let i=DATA.radical.length,c=DATA.challenge;h+=`<div class="section-instruction"><strong>你想想</strong><br>${esc(c.prompt)}</div><div class="question-card"><div class="qhead"><div class="qnum">想</div><div class="qtext">${esc(c.prompt)}</div></div><textarea class="input-area" oninput="setAns(8,${i},this.value)">${esc(state.answers[key(8,i)]||'')}</textarea><div class="check-row"><button class="check-btn" onclick="check(8,${i})">Đối chiếu</button></div>${feedback(8,i,c,true)}</div>`;return h}
function renderTranslation(){return `<div class="section-instruction"><strong>越汉翻译练习 — Luyện dịch Việt → Hoa.</strong><br>Phần dịch đối chiếu với đáp án tham khảo; cách diễn đạt khác đúng ngữ pháp không bị coi mặc nhiên là sai.</div>`+DATA.translations.map((it,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAns(9,${i},this.value)">${esc(state.answers[key(9,i)]||'')}</textarea><div class="check-row"><button class="check-btn" onclick="check(9,${i})">Đối chiếu đáp án</button></div>${feedback(9,i,it,true)}</div>`).join('')}
function renderSection(){let s=state.section;document.getElementById('sectionBadge').textContent='Bài '+s;document.getElementById('sectionTitle').textContent=sectionNames()[s];let h=s===1?renderStudy():s===2?renderFill2():s===3?renderPattern3():s===4?renderDialogue():s===5?renderObjects():s===6?renderContext6():s===7?renderShiDe():s===8?renderRadical():renderTranslation();h+=`<div class="navigation-buttons"><button class="nav-btn" ${s===1?'disabled':''} onclick="goSection(${s-1})">← Bài trước</button><button class="nav-btn next" ${s===SECTION_COUNT?'disabled':''} onclick="goSection(${s+1})">Bài sau →</button></div>`;document.getElementById('contentBody').innerHTML=h}
function dialogueCount(){return DATA.dialogue.reduce((n,g)=>n+g.items.length,0)}
function itemCount(s){if(s===1)return 0;if(s===2)return DATA.fill2.data.length;if(s===3)return DATA.pattern3.length;if(s===4)return dialogueCount();if(s===5)return objectFlat().length;if(s===6)return DATA.context6.data.length;if(s===7)return DATA.shiDe.length+2;if(s===8)return DATA.radical.length+1;return DATA.translations.length}
function answeredCount(s){let n=0;for(let i=0;i<itemCount(s);i++)if(String(state.answers[key(s,i)]||'').trim())n++;return n}
function updateProgress(){let t=0,a=0;for(let s=1;s<=SECTION_COUNT;s++){t+=itemCount(s);a+=answeredCount(s)}let el=document.getElementById('progressText');if(el)el.textContent=a+'/'+t;let f=document.getElementById('progressFill');if(f)f.style.width=(t?a/t*100:0)+'%'}
function openAnswerCard(){document.getElementById('answerGrid').innerHTML=Array.from({length:SECTION_COUNT},(_,i)=>i+1).map(s=>`<div class="answer-cell ${answeredCount(s)===itemCount(s)&&itemCount(s)?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${sectionNames()[s]}<br><span class="muted">${itemCount(s)?answeredCount(s)+'/'+itemCount(s)+' đã làm':'Tài liệu đọc'}</span></div>`).join('');document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restoreProgress(show=false){try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x)Object.assign(state,x)}catch(e){}renderAll();if(show)alert('Đã khôi phục tiến độ (nếu có).')}
function restartExam(){if(!confirm('Làm lại toàn bộ Bài 18? Ghi chú vẫn được giữ.'))return;state.answers={};state.checked={};state.section=1;state.startAt=Date.now();save();renderAll()}
function submitExam(){let total=0,correct=0;function add(ok){total++;if(ok)correct++};DATA.fill2.data.forEach((it,i)=>add(accepted(state.answers[key(2,i)]||'',it.acc||[it.a])));DATA.pattern3.forEach((it,i)=>add(accepted(state.answers[key(3,i)]||'',it.acc||[it.a])));let d=0;DATA.dialogue.forEach(g=>g.items.forEach(it=>add(accepted(state.answers[key(4,d++)]||'',it.acc||[it.a]))));objectFlat().forEach((it,i)=>add(accepted(state.answers[key(5,i)]||'',it.acc||[it.a])));DATA.context6.data.forEach((it,i)=>add(norm(state.answers[key(6,i)]||'')===norm(it.a)));DATA.shiDe.forEach((it,i)=>add(accepted(state.answers[key(7,i)]||'',it.acc||[it.a])));add(accepted(state.answers[key(7,3)]||'',DATA.q4.qacc));add(accepted(state.answers[key(7,4)]||'',DATA.q4.ansacc));DATA.radical.forEach((it,i)=>add(norm(state.answers[key(8,i)]||'')===norm(it.a)));add(accepted(state.answers[key(8,DATA.radical.length)]||'',DATA.challenge.acc));DATA.translations.forEach((it,i)=>add(accepted(state.answers[key(9,i)]||'',it.acc||[it.a])));document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${total}</div><div style="text-align:center">Kết quả đối chiếu đáp án tham khảo.</div><div style="margin-top:14px;line-height:1.6" class="muted">Các câu hoàn thành, hội thoại, tân ngữ, 是…的 và dịch có thể có nhiều cách đúng; hệ thống chỉ dùng tập đáp án tham khảo được phân tích từ nguồn Bài 18.</div>`;document.getElementById('resultModal').classList.add('show')}
function openNoteEditor(){document.getElementById('rich-editor').innerHTML=localStorage.getItem(NOTE_STORE)||'';document.getElementById('note-editor-overlay').classList.add('show');document.body.classList.add('note-open')}
function closeNoteEditor(){document.getElementById('note-editor-overlay').classList.remove('show');document.body.classList.remove('note-open')}
function saveNotes(closeAfter=false){localStorage.setItem(NOTE_STORE,document.getElementById('rich-editor').innerHTML);if(closeAfter)closeNoteEditor()}
function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor').focus()}
function clearNoteEditor(){if(!confirm('Xóa toàn bộ ghi chú?'))return;document.getElementById('rich-editor').innerHTML='';saveNotes(false)}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
setInterval(()=>{let sec=Math.floor((Date.now()-state.startAt)/1000),m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');let e=document.getElementById('timerText');if(e)e.textContent='Thời gian '+m+':'+s},1000);
window.addEventListener('load',()=>{restoreProgress(false)});
</script></body></html>
