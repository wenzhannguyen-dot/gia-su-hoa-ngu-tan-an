<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gia Sư Hoa Ngữ Tân An | Giáo trình Tiếng Hoa Công xưởng</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
<style>
/* ── PALETTE ─────────────────────────────────────
   GREEN  #1b5e20  sidebar/topbar
   BLUE   #1565c0  chữ Hán, accent
   ORANGE #e65100  cam, active
   GRAY-D #4a5568
   GRAY-M #8a9ab0
   GRAY-L #d0d8e4
   BG     #f0f2f5
   WHITE  #ffffff
   BLACK  #111111
   ─────────────────────────────────────────────── */
:root {
  --green:   #1b5e20;
  --green-h: #2e7d32;
  --green-b: #2d5a30;
  --blue:    #1565c0;
  --orange:  #e65100;
  --gray-d:  #4a5568;
  --gray-m:  #8a9ab0;
  --gray-l:  #d0d8e4;
  --gray-bg: #f0f2f5;
  --white:   #ffffff;
  --black:   #111111;
  --SB: 240px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }

html, body, button, select, input, textarea {
  font-family: 'IBM Plex Sans', sans-serif;
}

body {
  background: var(--gray-bg);
  color: var(--black);
  min-height: 100%;
  font-size: 20px;
}

/* ══ SIDEBAR ══════════════════════════════════
   Key: position:fixed with px units only.
   Browser zoom scales the *page* (content area)
   but fixed elements in px stay at physical px.
   The sidebar width must ALSO be hardcoded px
   in #main margin-left — no CSS vars.
   ══════════════════════════════════════════ */
#sidebar {
  position: fixed;
  top: 70px; left: 0;
  width: 180px;
  height: calc(100% - 70px);
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid #d0d0d0;
  border-radius: 8px;
  color: var(--black);
  overflow-y: auto;
  overflow-x: hidden;
  z-index: 100;
  display: flex;
  flex-direction: column;
  margin: 10px;
}
#sidebar::-webkit-scrollbar { width: 3px; }
#sidebar::-webkit-scrollbar-thumb { background: #d0d0d0; }

.sb-logo { padding: 18px 16px 14px; border-bottom: 1px solid var(--green-b); }
.sb-logo-cn {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px; font-weight: 700; color: var(--white); letter-spacing: 1px;
}
.sb-logo-vn { font-size: 20px; color: var(--gray-m); margin-top: 3px; line-height: 1.4; }
.sb-progress { height: 2px; background: var(--green-b); margin-top: 10px; }
.sb-progress-fill { height: 100%; background: var(--orange); width: 0%; transition: width 0.4s; }
.sb-section { font-size: 16px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--white); padding: 12px 16px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tools-section { padding: 15px; background: #fafafa; border-top: 1px solid #e0e0e0; }
.tool-btn { width: 100%; padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 5px; background: #f8f9fa; color: #666666; cursor: pointer; font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; transition: all 0.15s; }
.tool-btn:last-child { margin-bottom: 0; }
.tool-btn:hover { background: #e3f2fd; border-color: #4472c4; color: #4472c4; }
.tool-btn.active { background: #e8f5e9; border-color: #2e7d32; color: #2e7d32; font-weight: 600; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 16px; cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.15s;
}
.nav-item:hover { background: var(--green-h); }
.nav-item.active { background: #0d2010; border-left-color: var(--orange); }

.nav-num {
  width: 22px; height: 22px; border-radius: 3px;
  background: var(--green-b); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700; color: var(--gray-m);
}
.nav-item.active .nav-num { background: var(--orange); color: var(--white); }
.nav-text { flex: 1; min-width: 0; }
.nav-cn { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--gray-l); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item.active .nav-cn { color: var(--white); }
.nav-vn { font-size: 20px; color: var(--gray-m); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ══ MAIN ════════════════════════════════════ */
#main {
  margin-left: 180px;
  width: calc(100% - 180px);
  min-height: 100vh;
  display: flex; flex-direction: column;
  padding-top: 70px;
}

#topbar {
  height: 70px; background: var(--green);
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  border-bottom: 1px solid var(--green-b);
}
#topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
#topbar-logo {
  width: 40px;
  height: 40px;
  border-radius: 4px;
}
#topbar-brand {
  display: flex;
  flex-direction: column;
}
#topbar-brand-cn {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px; 
  font-weight: 700; 
  color: var(--white);
  line-height: 1.2;
}
#topbar-brand-vn {
  font-size: 12px; 
  color: var(--gray-m);
  line-height: 1.2;
}
#topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
#topbar-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px; 
  font-weight: 600; 
  color: var(--white);
}

#content { padding: 24px 32px; width: 100%; flex: 1; }

/* ══ HOME HERO ═══════════════════════════════ */
.lesson-hero {
  background: var(--green); padding: 24px 28px;
  margin-bottom: 24px; border-radius: 6px;
}
.hero-label {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px; font-weight: 700; color: var(--orange);
  margin-bottom: 4px; line-height: 1.3;
}
.hero-cn {
  font-size: 20px; font-weight: 700; color: var(--white);
  margin-bottom: 4px; line-height: 1.3;
}
.hero-vn { font-size: 20px; color: var(--gray-m); }
.hero-tags { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; }
.tag { padding: 2px 8px; border: 1px solid var(--green-b); font-size: 20px; color: var(--gray-m); }

/* ══ SECTION TITLE ═══════════════════════════ */
.sec-title {
  font-size: 20px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--blue);
  border-bottom: 1px solid var(--gray-l);
  padding-bottom: 6px; margin: 24px 0 14px;
}

/* ══ VOCAB TABLE ════════════════════════════ */
.vocab-table { width: 100%; border-collapse: collapse; font-size: 20px; }
.vocab-table th {
  background: var(--green); color: var(--gray-l);
  padding: 9px 14px; text-align: left;
  font-size: 20px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600;
}
.vocab-table td { padding: 11px 14px; border-bottom: 1px solid var(--gray-l); vertical-align: middle; }
.vocab-table tr:last-child td { border-bottom: none; }
.vocab-table tr:hover td { background: #e8f5e9; }
.td-cn { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--blue); }
.td-py { color: var(--orange); font-style: italic; font-size: 20px; }
.td-vn { color: var(--gray-d); font-weight: 500; font-size: 20px; }
.td-ex { color: var(--gray-m); font-family: 'Noto Serif SC', serif; font-size: 20px; }

body.hide-pinyin .pat-expy { display: none !important; }
body.hide-pinyin .line-py { display: none !important; }
body.hide-pinyin .cmd-py { display: none !important; }
.ex-py { font-size:20px;color:var(--orange);font-style:italic;margin:2px 0 10px; }
body.hide-vietnamese .pat-exvn { display: none !important; }
body.hide-vietnamese .line-vn { display: none !important; }
body.hide-vietnamese .cmd-vn { display: none !important; }
body.hide-vietnamese .nav-vn { display: none !important; }
.ex-vn { font-size:20px;color:var(--gray-d);margin:2px 0 6px; }

/* ══ DIALOGUE ════════════════════════════════ */
.dialogue-box {
  background: var(--white); border: 1px solid var(--gray-l);
  border-radius: 6px; margin-bottom: 14px; overflow: hidden;
}
.dlg-header {
  background: var(--green); padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.dlg-title { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--white); font-weight: 600; }
.dlg-title-vn { font-size: 20px; color: var(--gray-m); margin-top: 2px; }
.dlg-controls { display: flex; gap: 6px; align-items: center; }
.dlg-btn {
  padding: 4px 12px; background: var(--blue); color: var(--white);
  border: none; font-size: 20px; font-weight: 700; cursor: pointer;
  transition: background 0.15s; border-radius: 3px;
}
.dlg-btn:hover { background: var(--orange); }
.dlg-speed {
  padding: 4px 8px; background: transparent;
  border: 1px solid var(--green-b); color: var(--gray-m); font-size: 20px; cursor: pointer;
}
.dlg-line {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--gray-l);
  cursor: pointer; transition: background 0.12s;
}
.dlg-line:last-child { border-bottom: none; }
.dlg-line:hover { background: var(--gray-bg); }
.dlg-line.playing { background: #e8f5e9; }
.speaker-badge { min-width: 64px; font-size: 20px; font-weight: 700; text-transform: uppercase; padding-top: 3px; flex-shrink: 0; }
.speaker-badge.male { color: var(--blue); }
.speaker-badge.female { color: var(--orange); }
.dlg-content { flex: 1; }
.line-cn { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--black); line-height: 1.6; }
.line-py { font-size: 20px; color: var(--orange); font-style: italic; margin-top: 2px; }
.line-vn { font-size: 20px; color: var(--gray-d); margin-top: 4px; line-height: 1.5; }
.dlg-play-btn { color: var(--gray-l); font-size: 20px; padding-top: 4px; flex-shrink: 0; background: none; border: none; cursor: pointer; }
.dlg-line:hover .dlg-play-btn { color: var(--blue); }
.dlg-line.playing .dlg-play-btn { color: var(--orange); }

/* Toggle pinyin */
.toggle-row { display: flex; align-items: center; gap: 8px; font-size: 20px; color: var(--gray-m); margin-bottom: 8px; }
.toggle { width: 34px; height: 18px; background: var(--gray-l); border-radius: 9px; cursor: pointer; position: relative; transition: background 0.2s; }
.toggle.on { background: var(--blue); }
.toggle::after { content: ''; position: absolute; width: 12px; height: 12px; background: var(--white); border-radius: 50%; top: 3px; left: 3px; transition: left 0.2s; }
.toggle.on::after { left: 19px; }

/* ══ PATTERNS ════════════════════════════════ */
.pattern-card { background: var(--white); padding: 14px 16px; margin-bottom: 8px; border: 1px solid var(--gray-l); border-radius: 6px; }
.pat-num { font-size: 20px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--orange); margin-bottom: 4px; }
.pat-cn { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--black); margin-bottom: 3px; }
.pat-cn span { color: var(--blue); font-weight: 700; }
.pat-vn { font-size: 20px; color: var(--gray-d); margin-bottom: 8px; }
.pat-ex { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--gray-d); background: var(--gray-bg); padding: 8px 12px; border-radius: 4px; }

/* ══ EXERCISE ════════════════════════════════ */
.exercise-box { background: var(--white); border: 1px solid var(--gray-l); border-radius: 6px; padding: 18px 20px; margin-bottom: 10px; }
.ex-type { font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--orange); margin-bottom: 10px; }
.lesson-block { margin-bottom: 24px; }
.lesson-header { font-size: 20px; font-weight: 700; color: var(--green); padding: 12px 16px; background: var(--green-b); border-radius: 6px; margin-bottom: 12px; }
.ex-q { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--black); margin-bottom: 14px; line-height: 1.6; }
.ex-q .blank { display: inline-block; min-width: 60px; border-bottom: 2px solid var(--orange); color: var(--orange); font-weight: 700; text-align: center; }
.ex-opts { display: flex; flex-wrap: wrap; gap: 8px; }
.ex-opt { padding: 7px 18px; border: 1px solid var(--gray-l); border-radius: 4px; background: var(--white); color: var(--gray-d); font-family: 'Noto Serif SC', serif; font-size: 20px; cursor: pointer; transition: all 0.15s; }
.ex-opt:hover { border-color: var(--blue); color: var(--blue); }
.ex-opt.correct { background: #e3f2fd; border-color: var(--blue); color: var(--blue); }
.ex-opt.wrong { background: #fff3e0; border-color: var(--orange); color: var(--orange); }

/* ══ REPORT ══════════════════════════════════ */
.report-box { background: var(--green); border: 1px solid var(--green-b); border-radius: 6px; padding: 16px 20px; margin-bottom: 16px; }
.report-title { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--gray-l); margin-bottom: 12px; font-weight: 600; border-bottom: 1px solid var(--green-b); padding-bottom: 8px; }
.report-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--green-b); font-size: 20px; color: var(--gray-m); }
.report-row:last-child { border-bottom: none; }
.report-val { font-weight: 700; }
.report-val.good { color: #64b5f6; }
.report-val.bad { color: var(--orange); }

/* ══ EMAIL ═══════════════════════════════════ */
.email-box { border: 1px solid var(--gray-l); border-radius: 6px; background: var(--white); overflow: hidden; }
.email-header { background: var(--green); padding: 10px 16px; }
.email-meta { font-size: 20px; color: var(--gray-m); margin-bottom: 3px; }
.email-subject { font-size: 20px; color: var(--white); font-weight: 600; }
.email-body { padding: 16px 18px; font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--gray-d); line-height: 2; white-space: pre-wrap; }

/* ══ FLOW ════════════════════════════════════ */
.flow-wrap { background: var(--white); border: 1px solid var(--gray-l); border-radius: 6px; padding: 18px 20px; display: flex; align-items: center; flex-wrap: wrap; gap: 0; }
.flow-step { text-align: center; }
.flow-num { width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: var(--white); font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 5px; }
.flow-cn { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--black); font-weight: 600; }
.flow-vn { font-size: 20px; color: var(--gray-m); margin-top: 3px; }
.flow-arrow { color: var(--orange); font-size: 20px; padding: 0 8px; margin-bottom: 12px; }

/* ══ COMMANDS ════════════════════════════════ */
.cmd-grid { display: flex; flex-wrap: wrap; gap: 1px; background: var(--gray-l); border: 1px solid var(--gray-l); border-radius: 6px; overflow: hidden; }
.cmd-item { background: var(--white); padding: 14px 16px; cursor: pointer; transition: background 0.12s; flex: 1; min-width: 140px; }
.cmd-item:hover { background: #e3f2fd; }
.cmd-cn { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--blue); font-weight: 600; }
.cmd-vn { font-size: 20px; color: var(--gray-d); margin-top: 5px; }

/* ══ HOME GRID ═══════════════════════════════ */
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1px; background: var(--gray-l); border: 1px solid var(--gray-l); border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
.home-card { background: var(--white); padding: 16px 18px; cursor: pointer; transition: background 0.12s; border-top: 2px solid transparent; }
.home-card:hover { background: #e3f2fd; border-top-color: var(--orange); }
.home-num { font-size: 20px; font-weight: 500; color: var(--gray-m); margin-bottom: 5px; }
.home-cn { font-family: 'Noto Serif SC', serif; font-size: 20px; font-weight: 700; color: var(--black); margin-bottom: 4px; }
.home-vn { font-size: 20px; color: var(--gray-d); margin-bottom: 10px; }
.home-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.home-tag { padding: 2px 7px; border: 1px solid var(--gray-l); border-radius: 3px; font-size: 20px; color: var(--gray-m); }

/* ══ APPENDIX ════════════════════════════════ */
.sign-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1px; background: var(--gray-l); border: 1px solid var(--gray-l); border-radius: 6px; overflow: hidden; }
.sign-card { background: var(--white); padding: 14px 16px; text-align: center; }
.sign-cn { font-family: 'Noto Serif SC', serif; font-size: 20px; font-weight: 600; color: var(--black); }
.sign-vn { font-size: 20px; color: var(--gray-d); margin-top: 3px; }
.sign-loc { font-size: 20px; color: var(--gray-m); margin-top: 4px; }
.num-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.num-tag { padding: 5px 12px; border: 1px solid var(--gray-l); background: var(--white); font-size: 20px; border-radius: 4px; }
.num-cn { color: var(--blue); font-family: 'Noto Serif SC', serif; font-size: 20px; }
.num-vn { color: var(--gray-d); font-size: 20px; }
.phrase-grid { display: flex; flex-wrap: wrap; gap: 1px; background: var(--gray-l); border: 1px solid var(--gray-l); border-radius: 6px; overflow: hidden; }
.phrase-item { background: var(--white); padding: 10px 14px; cursor: pointer; transition: background 0.12s; flex: 1; min-width: 160px; }
.phrase-item:hover { background: #e3f2fd; }
.phrase-cn { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--blue); }
.phrase-vn { font-size: 20px; color: var(--gray-m); margin-top: 3px; }

/* ══ HANZI PAGE ══════════════════════════════ */
.hanzi-section { background: var(--white); border: 1px solid var(--gray-l); border-radius: 6px; padding: 20px; margin-bottom: 14px; }
.hanzi-char-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 20px; }
.hz-btn { font-family: 'Noto Serif SC', serif; font-size: 20px; width: 38px; height: 38px; border: 1px solid var(--gray-l); background: var(--white); color: var(--black); cursor: pointer; transition: all 0.12s; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
.hz-btn:hover { border-color: var(--blue); color: var(--blue); }
.hz-btn.active { border-color: var(--blue); background: var(--blue); color: var(--white); }
.hz-btn-action { padding: 6px 14px; border: 1px solid var(--gray-l); background: var(--white); color: var(--gray-d); font-size: 20px; font-weight: 600; cursor: pointer; transition: all 0.12s; border-radius: 4px; }
.hz-btn-action:hover { background: var(--green); color: var(--white); border-color: var(--green); }
.hz-btn-action.primary { background: var(--blue); color: var(--white); border-color: var(--blue); }
.hz-btn-action.accent { background: var(--orange); color: var(--white); border-color: var(--orange); }
.hz-writer-area { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.hz-info { flex: 1; min-width: 160px; }
.hz-char-big { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--blue); line-height: 1; margin-bottom: 6px; }
.hz-controls { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.hz-hint-text { font-size: 20px; color: var(--gray-d); margin-top: 10px; padding: 8px 10px; border: 1px solid var(--gray-l); border-radius: 4px; background: var(--gray-bg); }

/* ══ AUDIO BAR ═══════════════════════════════ */
#audio-bar {
  position: fixed; bottom: 0; left: 180px; right: 0;
  height: 52px; background: var(--green);
  border-top: 1px solid var(--green-b);
  display: flex; align-items: center; padding: 0 20px; gap: 16px;
  z-index: 200; transform: translateY(100%); transition: transform 0.2s;
}
#audio-bar.visible { transform: translateY(0); }
.ab-text { flex: 1; min-width: 0; }
.ab-cn { font-family: 'Noto Serif SC', serif; font-size: 20px; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab-vn { font-size: 20px; color: var(--gray-m); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab-progress { width: 160px; height: 2px; background: var(--green-b); flex-shrink: 0; }
.ab-progress-fill { height: 100%; background: var(--orange); width: 0%; transition: width 0.1s linear; }
.ab-ctrl { display: flex; gap: 4px; }
.ab-btn { width: 30px; height: 30px; border: 1px solid var(--green-b); background: transparent; color: var(--gray-m); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; border-radius: 3px; transition: all 0.15s; }
.ab-btn:hover { background: var(--blue); border-color: var(--blue); color: var(--white); }

details summary { cursor: pointer; font-size: 20px; color: var(--gray-m); padding: 8px 0; list-style: none; display: flex; align-items: center; gap: 5px; }
details summary::-webkit-details-marker { display: none; }

function showPage(id) {
  // Password check for lessons 6+
  const lessonIds = ['l1','l2','l3','l4','l5','l6','l7','l8','l9','l10','l11','l12'];
  const idx = lessonIds.indexOf(id);
  if (idx >= 5) { // l6 onwards (index 5)
    const password = prompt('Nhập mật khẩu để truy cập bài học này:');
    if (password !== 'thaychiencs') {
      alert('Mật khẩu không đúng!');
      return;
    }
  }
  
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById('nav-' + id);
  if (nav) nav.classList.add('active');
  const c = document.getElementById('content');
  c.innerHTML = '';
  const progressFill = document.getElementById('progress-fill');
  if (progressFill) progressFill.style.width = idx >= 0 ? Math.round((idx+1)/lessonIds.length*100)+'%' : '0%';
  if (id === 'home') { renderHome(c); }
  else if (id === 'exercises') { renderExercises(c); }
  else if (id === 'appendix') { renderAppendix(c); }
  else if (id === 'hanzi') { renderHanzi(c); }
  else if (LESSONS[id]) { renderLesson(id, c, LESSONS[id]); }
  document.getElementById('sidebar').classList.remove('open');
}
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

  }
  if (L.patterns) {
    h += `<div class="sec-title">关键句型 — Mẫu câu then chốt</div>`;
    L.patterns.forEach(p => {
      h += `<div class="pattern-card"><div class="pat-num">${p.num}</div><div class="pat-cn">${p.cn}</div><div class="pat-vn">${p.vn}</div><div class="pat-ex">${p.ex}</div>${p.expy?`<div class="pat-expy">${p.expy}</div>`:''}${p.exvn?`<div style='font-size:20px;color:var(--gray-d);margin-top:3px;'>${p.exvn}</div>`:''}</div>`;

  if (L.exercises) {

    L.exercises.forEach((ex,ei) => {
      const q = ex.q.replace(ex.blank, `<span class="blank" id="bl-${id}-${ei}"></span>`);
      // Shuffle options with Fisher-Yates
      const opts = [...ex.options];
      for (let i = opts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [opts[i], opts[j]] = [opts[j], opts[i]];
      }
      const optBtns = opts.map(opt => {
        const safeOpt = opt.replace(/'/g, "\'");
        const safeAns = ex.answer.replace(/'/g, "\'");
        return `<button class="ex-opt" onclick="checkAns(this,'${safeOpt}','${safeAns}','bl-${id}-${ei}')">${opt}</button>`;

      h += `<div class="exercise-box"><div class="ex-q">${q}</div>${qvnHtml}${qpyHtml}<div class="ex-opts">${optBtns}</div></div>`;

  h += `</div>`;
  c.innerHTML = h;

function initHz(char) {
  currentHzChar = char;
  const wrap = document.getElementById('hz-canvas-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  const size = Math.min(180, window.innerWidth - 200);
  const div = document.createElement('div');
  div.id = 'hz-target';
  wrap.appendChild(div);
  const big = document.getElementById('hz-big');
  if (big) big.textContent = char;
  try {
    hanziInst = HanziWriter.create('hz-target', char, {
      width: size, height: size, padding: 10,
      strokeWidth: 2, radicalStrokeWidth: 2, outlineWidth: 1,
      showOutline: true,
      strokeColor: '#1565c0', outlineColor: '#d0d8e4', drawingColor: '#2e7d32', showCharacter: true,
      onLoadCharDataError: () => { wrap.innerHTML = `<div style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;border:1px solid var(--gray-l);border-radius:6px;font-family:'Noto Serif SC',serif;font-size: 20px;color:var(--blue);">${char}</div>`; }
    });
  } catch(e) {}
  const hint = document.getElementById('hz-hint');
  if (hint) hint.style.display = 'none';
}

function selectHz(char) {
  document.querySelectorAll('.hz-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('hbtn-' + char);
  if (btn) btn.classList.add('active');
  initHz(char);
}
function hzAnimate() { if (hanziInst) try { hanziInst.animateCharacter(); } catch(e){} }
function hzQuiz() {
  if (!hanziInst) return;
  const hint = document.getElementById('hz-hint');
  try {
    hanziInst.quiz({
      onMistake: () => { if(hint){hint.style.display='block';hint.style.color='var(--orange)';hint.textContent='Sai nét — thử lại.';} },
      onCorrectStroke: () => { if(hint){hint.style.display='block';hint.style.color='var(--blue)';hint.textContent='Đúng nét — tiếp tục!';} },
      onComplete: () => { if(hint){hint.style.display='block';hint.style.color='var(--blue)';hint.textContent='Hoàn thành chữ này!';} }
    });
    if(hint){ hint.style.display='block'; hint.style.color='var(--gray-d)'; hint.textContent='Hãy viết từng nét theo thứ tự...'; }
  } catch(e){}
}
function hzReset() {
  if (hanziInst) try { hanziInst.cancelQuiz(); hanziInst.showCharacter(); } catch(e){}
  const hint = document.getElementById('hz-hint');
  if (hint) hint.style.display = 'none';
}

function showHanziModal(word) {
  // Clean up
  const old = document.getElementById('hz-modal');
  if (old) { old.remove(); }
  modalWriters = [];

  const chars = [...word].filter(c => /[\u4e00-\u9fff]/.test(c));
  if (!chars.length) return;

  // Build overlay
  const overlay = document.createElement('div');
  overlay.id = 'hz-modal';
  overlay.style.cssText = [
    'position:fixed', 'top:0', 'left:0', 'right:0', 'bottom:0',
    'background:rgba(0,0,0,0.6)', 'z-index:9999',
    'display:flex', 'align-items:center', 'justify-content:center'
  ].join(';') + ';';
  overlay.addEventListener('click', e => { if (e.target === overlay) closeHanziModal(); });

  const box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:8px;padding:28px 32px;max-width:92vw;';

  // Title
  const ttl = document.createElement('div');
  ttl.style.cssText = 'font-family:"Noto Serif SC",serif;font-size:32px;color:#1565c0;margin-bottom:24px;letter-spacing:8px;font-weight:700;';
  ttl.textContent = word;
  box.appendChild(ttl);

  // Canvas row — one div per character
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:20px;flex-wrap:wrap;';

  chars.forEach((ch, idx) => {
    const col = document.createElement('div');
    col.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:8px;';

    const lbl = document.createElement('div');
    lbl.style.cssText = 'font-family:"Noto Serif SC",serif;font-size:20px;color:#4a5568;';
    lbl.textContent = ch;

    // Target div — HanziWriter will insert SVG here
    const target = document.createElement('div');
    target.id = 'mhz-' + idx;
    target.style.cssText = 'border:1px solid #d0d8e4;border-radius:6px;background:#f8f8f6;';

    col.appendChild(lbl);
    col.appendChild(target);
    row.appendChild(col);
  });
  box.appendChild(row);

  // Buttons
  const ctrl = document.createElement('div');
  ctrl.style.cssText = 'margin-top:22px;display:flex;gap:10px;';
  const btnPlay = document.createElement('button');
  btnPlay.innerHTML = '<i class="bi bi-play-fill"></i> Xem lại';
  btnPlay.style.cssText = 'padding:8px 20px;background:#1565c0;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:20px;font-weight:600;';
  btnPlay.onclick = () => modalPlayAll();
  const btnClose = document.createElement('button');
  btnClose.innerHTML = '<i class="bi bi-x-lg"></i> Đóng';
  btnClose.style.cssText = 'padding:8px 20px;background:#fff;color:#4a5568;border:1px solid #d0d8e4;border-radius:4px;cursor:pointer;font-size:20px;';
  btnClose.onclick = closeHanziModal;
  ctrl.appendChild(btnPlay);
  ctrl.appendChild(btnClose);
  box.appendChild(ctrl);

  overlay.appendChild(box);
  document.body.appendChild(overlay);

  // Init writers after browser has painted — use 100ms delay
  setTimeout(() => {
    let allReady = true;
    chars.forEach((ch, idx) => {
      const el = document.getElementById('mhz-' + idx);
      if (!el) { allReady = false; return; }
      try {
        const w = HanziWriter.create('mhz-' + idx, ch, {
          width: 180,
          height: 180,
          padding: 10,
          strokeWidth: 2,
          radicalStrokeWidth: 2,
          outlineWidth: 1,
          showOutline: true,
          strokeColor: '#1565c0',
          outlineColor: '#d0d8e4',
          radicalColor: '#e65100',
          showCharacter: true,
          strokeAnimationSpeed: 1,
          delayBetweenStrokes: 250,
          strokeFadeDuration: 300,
          renderer: 'svg',
          onLoadCharDataError: function(reason) {
            const el2 = document.getElementById('mhz-' + idx);
            if (el2) el2.innerHTML = '<div style="width:160px;height:160px;display:flex;align-items:center;justify-content:center;font-family:Noto Serif SC,serif;font-size:80px;color:#1565c0;">' + ch + '</div>';
          }
        });
        modalWriters.push(w);
      } catch(err) {
        modalWriters.push(null);
      }
    });
    // Start animation after writers init
    setTimeout(modalPlayAll, 400);
  }, 100);
}

function modalPlayAll() {
  let i = 0;
  function next() {
    if (i >= modalWriters.length) return;
    const w = modalWriters[i];
    i++;
    if (!w) { next(); return; }
    try {
      w.animateCharacter({ onComplete: function() { setTimeout(next, 350); } });
    } catch(e) { setTimeout(next, 500); }
  }
  next();
}

function closeHanziModal() {
  const m = document.getElementById('hz-modal');
  if (m) m.remove();
  modalWriters = [];
}

// ══════════════════════════════════════════════
// SPEECH
// ══════════════════════════════════════════════
function setSpeechRate(v) { speechRate = parseFloat(v); }

function speak(cn, vn, speaker, gender) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  isPlaying = false;
  const u = new SpeechSynthesisUtterance(cn);
  u.lang = 'zh-CN'; u.rate = speechRate;
  u.pitch = gender === 'female' ? 1.2 : gender === 'male' ? 0.85 : 1.0;
  const voices = window.speechSynthesis.getVoices();
  const zh = voices.find(v => v.lang && v.lang.startsWith('zh'));
  if (zh) u.voice = zh;
  showBar(cn, vn, speaker);
  startFakeProgress();
  u.onend = () => closeBar();
  window.speechSynthesis.speak(u);
}

function playDialogue(lessonId, di) {
  if (!LESSONS[lessonId]) return;
  window.speechSynthesis.cancel();
  dialogueQueue = LESSONS[lessonId].dialogues[di].lines.map((l,i) => ({...l, lessonId, di, li: i}));
  dlgIndex = 0; isPlaying = true;
  playNext();
}

function playNext() {
  if (!isPlaying || dlgIndex >= dialogueQueue.length) { isPlaying = false; closeBar(); return; }
  const line = dialogueQueue[dlgIndex];
  document.querySelectorAll('.dlg-line').forEach(el => el.classList.remove('playing'));
  const el = document.getElementById(`dl-${line.lessonId}-${line.di}-${line.li}`);
  if (el) { el.classList.add('playing'); el.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  showBar(line.cn, line.vn, line.speaker);
  startFakeProgress();
  if (!window.speechSynthesis) { dlgIndex++; setTimeout(playNext, 700); return; }
  const u = new SpeechSynthesisUtterance(line.cn);
  u.lang = 'zh-CN'; u.rate = speechRate;
  u.pitch = line.gender === 'female' ? 1.2 : 0.85;
  const voices = window.speechSynthesis.getVoices();
  const zh = voices.find(v => v.lang && v.lang.startsWith('zh'));
  if (zh) u.voice = zh;
  u.onend = () => { dlgIndex++; setTimeout(playNext, 500); };
  u.onerror = () => { dlgIndex++; setTimeout(playNext, 500); };
  window.speechSynthesis.speak(u);
}

function speakLine(lessonId, di, li) {
  const line = LESSONS[lessonId].dialogues[di].lines[li];
  window.speechSynthesis.cancel(); isPlaying = false;
  document.querySelectorAll('.dlg-line').forEach(el => el.classList.remove('playing'));
  const el = document.getElementById(`dl-${lessonId}-${di}-${li}`);
  if (el) el.classList.add('playing');
  speak(line.cn, line.vn, line.speaker, line.gender);
}

// ══════════════════════════════════════════════
// AUDIO BAR
// ══════════════════════════════════════════════
function showBar(cn, vn, speaker) {
  document.getElementById('ab-cn').textContent = (speaker ? speaker+'：' : '') + cn;
  document.getElementById('ab-vn').textContent = vn || '';
  document.getElementById('audio-bar').classList.add('visible');
  document.getElementById('ab-play').innerHTML = '<i class="bi bi-pause-fill"></i>';
}
function startFakeProgress() {
  clearInterval(fakeProgressTimer);
  let p = 0;
  const fill = document.getElementById('ab-fill');
  fill.style.width = '0%';
  fakeProgressTimer = setInterval(() => { p += 1.5; if (p > 98) { clearInterval(fakeProgressTimer); return; } fill.style.width = p+'%'; }, 80);
}
function closeBar() {
  clearInterval(fakeProgressTimer);
  document.getElementById('audio-bar').classList.remove('visible');
  document.getElementById('ab-fill').style.width = '0%';
  document.querySelectorAll('.dlg-line').forEach(el => el.classList.remove('playing'));
  isPlaying = false;
  window.speechSynthesis && window.speechSynthesis.cancel();
}
function togglePause() {
  if (!window.speechSynthesis) return;
  if (window.speechSynthesis.paused) { window.speechSynthesis.resume(); document.getElementById('ab-play').innerHTML = '<i class="bi bi-pause-fill"></i>'; }
  else { window.speechSynthesis.pause(); document.getElementById('ab-play').innerHTML = '<i class="bi bi-play-fill"></i>'; }
}
function prevLine() { if (isPlaying && dlgIndex > 0) { window.speechSynthesis.cancel(); dlgIndex = Math.max(0, dlgIndex-2); setTimeout(playNext, 100); } }
function nextLine() { if (isPlaying) { window.speechSynthesis.cancel(); dlgIndex++; setTimeout(playNext, 100); } }

// ══════════════════════════════════════════════
// EXERCISES
// ══════════════════════════════════════════════
function checkAns(btn, selected, correct, blankId) {
  const ok = selected.trim() === correct.trim();
  btn.classList.add(ok ? 'correct' : 'wrong');
  if (ok) { const bl = document.getElementById(blankId); if (bl) bl.textContent = correct; }
  else setTimeout(() => btn.classList.remove('wrong'), 1400);
}

// UTIL
// ══════════════════════════════════════════════
function esc(s) { return (s||'').replace(/'/g,"\\'"); }
window.speechSynthesis && window.speechSynthesis.addEventListener('voiceschanged', () => {});

// ══════════════════════════════════════════════
// TOGGLE FUNCTIONS
// ══════════════════════════════════════════════
let toggleStates = { pinyin: false, vietnamese: false };

function togglePinyin(btn) {
  toggleStates.pinyin = !toggleStates.pinyin;
  document.body.classList.toggle('hide-pinyin', toggleStates.pinyin);
  btn.classList.toggle('active', toggleStates.pinyin);
  const icon = btn.querySelector('i');
  if (icon) {
    icon.className = toggleStates.pinyin ? 'bi bi-eye' : 'bi bi-eye-slash';
  }
  btn.querySelector('span').textContent = toggleStates.pinyin ? 'Hiện Pinyin' : 'Ẩn/Hiện Pinyin';
}

function toggleVietnamese(btn) {
  toggleStates.vietnamese = !toggleStates.vietnamese;
  document.body.classList.toggle('hide-vietnamese', toggleStates.vietnamese);
  btn.classList.toggle('active', toggleStates.vietnamese);
  const icon = btn.querySelector('i');
  if (icon) {
    icon.className = toggleStates.vietnamese ? 'bi bi-eye' : 'bi bi-eye-slash';
  }
  btn.querySelector('span').textContent = toggleStates.vietnamese ? 'Hiện Nghĩa' : 'Ẩn/Hiện Nghĩa';
}

function openNoteEditor() {
  const notes = localStorage.getItem('congso-notes') || '';
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:2000;';
  modal.innerHTML = `
    <div style="background:white;border-radius:8px;padding:20px;width:90%;max-width:600px;max-height:80vh;display:flex;flex-direction:column;">
      <div style="font-size:18px;font-weight:600;margin-bottom:12px;"><i class="bi bi-journal-text"></i> Bảng ghi chú</div>
      <textarea id="note-textarea" style="flex:1;padding:12px;border:1px solid #ddd;border-radius:4px;font-size:16px;resize:none;min-height:300px;">${notes}</textarea>
      <div style="display:flex;gap:10px;margin-top:12px;justify-content:flex-end;">
        <button onclick="this.closest('div[style*=fixed]').remove()" style="padding:8px 16px;border:1px solid #ddd;background:white;border-radius:4px;cursor:pointer;">Đóng</button>
        <button onclick="saveNotes(this)" style="padding:8px 16px;background:var(--orange);color:white;border:none;border-radius:4px;cursor:pointer;">Lưu</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

function saveNotes(btn) {
  const textarea = document.getElementById('note-textarea');
  if (textarea) {
    localStorage.setItem('congso-notes', textarea.value);
    alert('Đã lưu ghi chú!');
    btn.closest('div[style*=fixed]').remove();
  }
}

  }
