const STORE='BAI_TAP_301_06_FINAL_V1';
const NOTE_STORE='BAI301_BAI06_NOTES_FINAL_V1';
const state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:（）()]/g,'')}
function key(sec,item){return sec+'-'+item}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function restoreProgress(show=false){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x){Object.assign(state,x);if(state.section>MAX_SECTION)state.section=1;renderAll();if(show)alert('Đã khôi phục tiến độ.')}else if(show)alert('Chưa có tiến độ đã lưu.')}catch(e){if(show)alert('Không thể khôi phục dữ liệu.')}}
function sectionNames(){return ['','Theo mẫu hoàn thành 2,3','Điền vào chỗ trống','Đổi thành câu hỏi','Hoàn thành đối thoại','Sửa câu sai','Viết chữ Hán','Điền động từ','Chữ có 日','Dịch Việt → Hoa']}
function acceptedList(it){return it.accepted||[it.answer||it.hanzi||it.cn]}
function itemAccepted(it,val){return acceptedList(it).some(a=>norm(a)===norm(val))}
function itemCount(sec){if(sec===2)return exercises[2].passage.filter(x=>x.type==='blank').length;if(sec===8)return exercises[8].data.length+exercises[8].think.length;return exercises[sec].data.length}
function answeredCount(sec){let n=0;for(let i=0;i<itemCount(sec);i++)if(String(state.answers[key(sec,i)]??'').trim())n++;return n}
function totalCount(){let n=0;for(let s=1;s<=MAX_SECTION;s++)n+=itemCount(s);return n}
function totalAnswered(){let n=0;for(let s=1;s<=MAX_SECTION;s++)n+=answeredCount(s);return n}
function renderNav(){let h='';for(let s=1;s<=MAX_SECTION;s++)h+=`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`;document.getElementById('sectionNav').innerHTML=h}
function goSection(s){state.section=Math.max(1,Math.min(MAX_SECTION,s));save();renderSection();renderNav()}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
function setAnswer(sec,i,v){state.answers[key(sec,i)]=v;delete state.checked[key(sec,i)];save();renderNav()}
function checkOne(sec,i){state.checked[key(sec,i)]=true;save();renderSection();renderNav()}
function feedback(sec,i,it,label='Đáp án tham khảo'){if(!state.checked[key(sec,i)])return '<div class="feedback"></div>';const v=state.answers[key(sec,i)]||'',ok=itemAccepted(it,v);return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div>${label}: <span class="correct-answer">${esc(it.answer||it.hanzi||it.cn)}</span></div><div><b>Giải thích:</b> ${esc(it.ex||'Đối chiếu cấu trúc và ngữ nghĩa với đáp án tham khảo.')}</div></div>`}
function renderModel(ex){let h=`<div class="section-instruction"><strong>Phiên âm những từ bên dưới và dựa vào 1 hoàn thành 2,3.</strong></div><div class="question-card"><div class="qhead"><div class="qnum">1</div><div class="qtext"><div class="hanzi-big" style="font-size:25px">${esc(ex.example)}</div><div class="muted" style="font-size:14px">${esc(ex.examplePinyin)}</div></div></div></div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(1,i)]||'',c=!!state.checked[key(1,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+2}</div><div class="qtext">${esc(it.prompt)} Viết câu theo mẫu.</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(1,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(1,${i})">Đối chiếu</button></div>${feedback(1,i,it)}</div>`});return h}
function fillItems(){return exercises[2].passage.filter(x=>x.type==='blank')}
function renderFill(ex){let h='<div class="section-instruction"><strong>Điền vào chỗ trống — chọn đáp án cho từng ô.</strong></div><div class="question-card"><div class="passage" style="line-height:2.8">';let i=0;ex.passage.forEach(t=>{if(t.type==='text')h+=esc(t.text);else if(t.type==='newline')h+='<br>'+esc(t.text);else{const idx=i++,v=state.answers[key(2,idx)]||'';h+=`<select class="blank-select" onchange="setAnswer(2,${idx},this.value)"><option value="">-- Chọn --</option>${t.options.map(o=>`<option value="${esc(o)}" ${norm(v)===norm(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`}});h+='</div></div>';fillItems().forEach((it,idx)=>{const c=!!state.checked[key(2,idx)],ok=itemAccepted(it,state.answers[key(2,idx)]||'');h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${idx+1}</div><div class="qtext">Chỗ trống ${idx+1}</div></div><div class="check-row"><button class="check-btn" onclick="checkOne(2,${idx})">Kiểm tra câu</button></div>${feedback(2,idx,it,'Đáp án')}</div>`});return h}
function renderTransform(ex){let h='<div class="section-instruction"><strong>Dùng “几、哪儿、谁、什么” để đổi thành câu hỏi.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(3,i)]||'',c=!!state.checked[key(3,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.original)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(3,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(3,${i})">Kiểm tra câu</button></div>${feedback(3,i,it)}</div>`});return h}
function renderDialogue(ex){let h='<div class="section-instruction"><strong>Hoàn thành đối thoại.</strong></div>';const groups=[...new Set(ex.data.map(x=>x.dialogue))];groups.forEach(g=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${g}</div><div class="qtext" style="width:100%">`;ex.data.forEach((it,i)=>{if(it.dialogue!==g)return;const v=state.answers[key(4,i)]||'';h+=`<div style="white-space:pre-line;margin-bottom:8px">${esc(it.prompt)}</div><input class="input-text" value="${esc(v)}" oninput="setAnswer(4,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(4,${i})">Kiểm tra câu</button></div>${feedback(4,i,it)}`});h+='</div></div></div>'});return h}
function renderError(ex){let h='<div class="section-instruction"><strong>Sửa câu sai — tự nhập câu sửa.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(5,i)]||'',c=!!state.checked[key(5,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="wrong-sentence">${esc(it.original.replace(/^\d+\.\s*/,''))}</div></div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(5,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(5,${i})">Kiểm tra câu</button></div>${errorFeedback(i,it)}</div>`});return h}
function errorFeedback(i,it){if(!state.checked[key(5,i)])return '<div class="feedback"></div>';const ok=itemAccepted(it,state.answers[key(5,i)]||'');return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div><b>Lỗi sai:</b> ${esc(it.error)}</div><div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span></div><div><b>Vì sao sửa:</b> ${esc(it.fix)}</div></div>`}
function renderHanzi(ex){let h='<div class="section-instruction"><strong>Viết chữ Hán dựa theo phiên âm.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(6,i)]||'',c=!!state.checked[key(6,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.pinyin)}</b></div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(6,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(6,${i})">Kiểm tra câu</button></div>${feedback(6,i,it)}</div>`});return h}
function renderVerb(ex){let h='<div class="section-instruction"><strong>Điền động từ thích hợp — chọn đáp án.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(7,i)]||'',c=!!state.checked[key(7,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><select class="blank-select" onchange="setAnswer(7,${i},this.value)"><option value="">-- Chọn --</option>${it.options.map(o=>`<option value="${esc(o)}" ${norm(v)===norm(o)?'selected':''}>${esc(o)}</option>`).join('')}</select> ${esc(it.object)}</div></div><div class="check-row"><button class="check-btn" onclick="checkOne(7,${i})">Kiểm tra câu</button></div>${feedback(7,i,it,'Động từ đúng')}</div>`});return h}
function renderRadical(ex){let h='<div class="section-instruction"><strong>Viết những chữ Hán có chứa thành phần “日”.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(8,i)]||'',c=!!state.checked[key(8,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">____ ${esc(it.prompt)}</div></div><input class="input-text" maxlength="1" value="${esc(v)}" oninput="setAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Kiểm tra câu</button></div>${feedback(8,i,it)}</div>`});h+='<div class="section-instruction" style="margin-top:22px"><strong>你想想</strong><br>“大” 有两个读音，你能写出含有不同读音的 “大” 字的词来吗？</div>';ex.think.forEach((it,j)=>{const i=ex.data.length+j,v=state.answers[key(8,i)]||'',c=!!state.checked[key(8,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${j+1}</div><div class="qtext">${esc(it.label)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Đối chiếu</button></div>${feedback(8,i,it)}</div>`});return h}
function translationOk(it,v){return (it.accepted||[it.cn]).some(a=>norm(a)===norm(v))}
function renderTranslation(ex){let h='<div class="section-instruction"><strong>Luyện dịch Việt → Hoa.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(9,i)]||'',c=!!state.checked[key(9,i)],ok=translationOk(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAnswer(9,${i},this.value)">${esc(v)}</textarea><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Đối chiếu đáp án</button></div>${translationFeedback(i,it)}</div>`});return h}
function translationFeedback(i,it){if(!state.checked[key(9,i)])return '<div class="feedback"></div>';const ok=translationOk(it,state.answers[key(9,i)]||'');return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div>Đáp án tham khảo: <span class="correct-answer">${esc(it.cn)}</span></div><div><b>Giải thích:</b> Câu khác mẫu vẫn có thể đúng nếu giữ đúng nghĩa và ngữ pháp; dùng đáp án này để đối chiếu.</div></div>`}
function renderSection(){const s=state.section,n=sectionNames(),ex=exercises[s];document.getElementById('sectionBadge').textContent='Bài '+s;document.getElementById('sectionTitle').textContent=n[s];let h=s===1?renderModel(ex):s===2?renderFill(ex):s===3?renderTransform(ex):s===4?renderDialogue(ex):s===5?renderError(ex):s===6?renderHanzi(ex):s===7?renderVerb(ex):s===8?renderRadical(ex):renderTranslation(ex);h+=`<div class="navigation-buttons"><button class="nav-btn" onclick="goSection(${Math.max(1,s-1)})" ${s===1?'disabled':''}>上一题 · Bài trước</button><button class="nav-btn next" onclick="goSection(${Math.min(MAX_SECTION,s+1)})" ${s===MAX_SECTION?'disabled':''}>下一题 · Bài sau</button></div>`;document.getElementById('contentBody').innerHTML=h;window.scrollTo(0,0)}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;document.getElementById('progressText').textContent=`${a}/${t}`;document.getElementById('progressFill').style.width=p+'%'}
function openAnswerCard(){let h='',n=sectionNames();for(let s=1;s<=MAX_SECTION;s++){let a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${esc(n[s])}<br><span class="muted">${a}/${t} đã làm</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restartExam(){if(!confirm('Xóa toàn bộ đáp án và làm lại từ đầu?'))return;try{localStorage.removeItem(STORE)}catch(e){}state.section=1;state.answers={};state.checked={};state.startAt=Date.now();state.fontLarge=false;renderAll()}
function submitExam(){let correct=0,objective=0;fillItems().forEach((it,i)=>{objective++;if(itemAccepted(it,state.answers[key(2,i)]||''))correct++});[3,4,5,6,7].forEach(sec=>exercises[sec].data.forEach((it,i)=>{objective++;if(itemAccepted(it,state.answers[key(sec,i)]||''))correct++}));exercises[8].data.forEach((it,i)=>{objective++;if(itemAccepted(it,state.answers[key(8,i)]||''))correct++});const pct=objective?Math.round(correct/objective*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${objective}</div><div style="text-align:center;font-weight:700">Kết quả phần có đáp án xác định: ${pct}%</div><div style="margin-top:15px;line-height:1.7"><b>Tiến độ toàn bài:</b> ${totalAnswered()}/${totalCount()}.<br><b>Bài 1, mục 你想想 và Bài 9:</b> dùng đáp án tham khảo để đối chiếu, không chấm máy móc một cách diễn đạt duy nhất.</div>`;document.getElementById('resultModal').classList.add('show')}
function tick(){const e=Math.floor((Date.now()-(state.startAt||Date.now()))/1000),m=Math.floor(e/60),ss=e%60;document.getElementById('timerText').textContent=`Thời gian ${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;document.getElementById('timerProgress').style.width=Math.min(100,(e%3600)/36)+'%'}
let noteSaveTimer=null;function openNoteEditor(){const o=document.getElementById('note-editor-overlay'),ed=document.getElementById('rich-editor');if(!o||!ed)return;try{const x=localStorage.getItem(NOTE_STORE);if(x!==null)ed.innerHTML=x}catch(e){}o.classList.add('show');document.body.classList.add('note-open');ed.focus()}function closeNoteEditor(){document.getElementById('note-editor-overlay')?.classList.remove('show');document.body.classList.remove('note-open')}function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor')?.focus();scheduleNoteAutosave()}function scheduleNoteAutosave(){clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>saveNotes(false),350)}function saveNotes(closeAfter=false){const ed=document.getElementById('rich-editor');if(!ed)return;try{localStorage.setItem(NOTE_STORE,ed.innerHTML)}catch(e){}if(closeAfter)closeNoteEditor()}function clearNoteEditor(){if(!confirm('Xóa toàn bộ ghi chú?'))return;const ed=document.getElementById('rich-editor');if(ed){ed.innerHTML='';ed.focus();scheduleNoteAutosave()}}
document.getElementById('rich-editor')?.addEventListener('input',scheduleNoteAutosave);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('note-editor-overlay')?.classList.contains('show'))closeNoteEditor()});restoreProgress(false);renderAll();setInterval(tick,1000);tick();
</script>
</body></html>
