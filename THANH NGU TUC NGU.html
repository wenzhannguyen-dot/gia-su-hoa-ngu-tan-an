{h:"笨鸟先飞早入林",p:"bèn niǎo xiān fēi zǎo rù lín",d:"Chậm nước hơn người, sớm khôn hơn người.",g:"Người kém cỏi phải cố gắng hơn, bắt đầu sớm hơn để bù đắp.",c:"我知道自己不如别人聪明,所以笨鸟先飞早入林,每天提前一小时到教室学习.",cp:"wǒ zhī dào zì jǐ bù rú bié rén cōng míng, suǒ yǐ bèn niǎo xiān fēi zǎo rù lín, měi tiān tí qián yī xiǎo shí dào jiào shì xué xí.",cd:"Tôi biết mình không thông minh bằng người khác, nên chim ngu bay trước vào rừng sớm, mỗi ngày đến lớp sớm một tiếng để học.",cat:"no-luc-kien-tri",hv:"Đần Điểu Tiên Phi Tảo Nhập Lâm"},
{h:"比上不足,比下有余",p:"bǐ shàng bù zú, bǐ xià yǒu yú",d:"So với trên thì kém, so với dưới thì hơn.",g:"So sánh tình hình của mình với người khác.",c:"我的工资不算高,但比上不足,比下有余,已经知足了.",cp:"wǒ de gōng zī bù suàn gāo, dàn bǐ shàng bù zú, bǐ xià yǒu yú, yǐ jīng zhī zú le.",cd:"Lương của tôi không cao, nhưng so với trên thì chưa đủ, so với dưới thì còn dư, đã biết đủ rồi.",cat:"cuoc-song",hv:"Tỷ Thượng Bất Túc, Tỷ Hạ Hữu Dư"},
{h:"冰冻三尺,非一日之寒",p:"bīng dòng sān chǐ, fēi yī rì zhī hán",d:"Đốm son làm nên vạn sự khó, ba ngày đông nước, một ngày sương.",g:"Vấn đề nghiêm trọng không hình thành trong một sớm một chiều, cần thời gian dài tích tụ.",c:"他的成绩下滑这么严重,冰冻三尺,非一日之寒,早就该注意了.",cp:"tā de chéng jì xià huá zhè me yán zhòng, bīng dòng sān chǐ, fēi yī rì zhī hán, zǎo jiù gāi zhù yì le.",cd:"Thành tích của cậu ấy tụt nghiêm trọng như vậy, băng đóng ba thước không phải một ngày lạnh, đã sớm nên chú ý rồi.",cat:"kinh-nghiem-bai-hoc",hv:"Băng Đông Tam Xích, Phi Nhất Nhật Chi Hàn"},
{h:"兵来将挡,水来土掩",p:"bīng lái jiàng dǎng, shuǐ lái tǔ yǎn",d:"Địch đến thì tướng chặn, nước đến thì đất chặn.",g:"Đối phó với khó khăn bằng cách hành động phù hợp.",c:"兵来将挡,水来土掩,遇到困难不要怕,总有解决办法.",cp:"bīng lái jiàng dǎng, shuǐ lái tǔ yǎn, yù dào kùn nán bú yào pà, zǒng yǒu jiě jué bàn fǎ.",cd:"Địch đến thì tướng chặn, nước đến thì đất chặn, gặp khó khăn đừng sợ, luôn có cách giải quyết.",cat:"canh-bao-khuyen-ran",hv:"Binh Lai Tướng Đảng, Thuỷ Lai Thổ Yểm"},
{h:"病来如山倒,病去如抽丝",p:"bìng lái rú shān dǎo, bìng qù rú chōu sī",d:"Bệnh đến như núi đổ, bệnh đi như kéo chỉ.",g:"Bệnh nặng đến nhanh nhưng khỏi thì chậm",c:"爷爷说病来如山倒,病去如抽丝,生病容易好病难啊.",cp:"yé yé shuō bìng lái rú shān dào, bìng qù rú chōu sī, shēng bìng róng yì hǎo bìng nán a.",cd:"Ông nói bệnh đến như núi đổ, bệnh đi như kéo chỉ, bệnh dễ đến khó đi.",cat:"cuoc-song",hv:"Bệnh Lai Như Sơn Đảo, Bệnh Khứ Như Trừu Ti"},
{h:"不吃苦中苦,难得甜上甜",p:"bù chī kǔ zhōng kǔ, nán dé tián shàng tián",d:"Có thực mới vực được đạo.",g:"Khổ luyện mới có thành quả tốt đẹp",c:"妈妈常说不吃苦中苦,难得甜上甜,年轻时多努力将来才有好生活.",cp:"mā mā cháng shuō bù chī kǔ zhōng kǔ, nán dé tián shàng tián, nián qīng shí duō nǔ lì jiāng lái cái yǒu hǎo shēng huó.",cd:"Mẹ thường nói không chịu khổ trung khổ, khó được ngọt thượng ngọt, trẻ tuổi cố gắng nhiều thì tương lai mới có cuộc sống tốt.",cat:"no-luc-kien-tri",hv:"Bất Cật Khổ Trung Khổ, Nan Đắc Điềm Thượng Điềm"},
{h:"不到黄河不死心",p:"bù dào huáng hé bù sǐ xīn",d:"Còn nước còn tát.",g:"Kiên quyết đến cùng",c:"他不到黄河不死心,非要亲自验证这个结果才肯罢休.",cp:"tā bú dào huáng hé bù sǐ xīn, fēi yào qīn zì yàn zhèng zhè ge jié guǒ cái kěn bà xiū.",cd:"Anh ấy không đến Hoàng Hà không chịu từ bỏ, nhất định phải tự mình xác minh kết quả mới chịu thôi.",cat:"no-luc-kien-tri",hv:"Bất Đáo Hoàng Hà Bất Tử Tâm"},
{h:"不经一事,不长一智",p:"bù jīng yī shì, bù zhǎng yī zhì",d:"Không trải qua một việc, không tăng một trí",g:"Kinh nghiệm giúp nâng cao trí thức",c:"不经一事,不长一智,上次失败的经历让我学到了很多.",cp:"bù jīng yī shì, bù zhǎng yī zhì, shàng cì shī bài de jīng lì ràng wǒ xué dào le hěn duō.",cd:"Không trải qua một việc, không tăng một trí, lần thất bại trước đã dạy tôi rất nhiều.",cat:"kinh-nghiem-bai-hoc",hv:"Bất Kinh Nhất Sự, Bất Trưởng Nhất Trí"},
{h:"不怕一万,只怕万一",p:"bù pà yī wàn, zhǐ pà wàn yī",d:"Không sợ một vạn, chỉ sợ một trong vạn",g:"Cẩn thận với những rủi ro dù ít",c:"出门记得带伞,不怕一万,只怕万一,天气预报说可能下雨.",cp:"chū mén jì de dài sǎn, bù pà yī wàn, zhǐ pà wàn yī, tiān qì yù bào shuō kě néng xià yǔ.",cd:"Ra ngoài nhớ mang ô, không sợ một vạn chỉ sợ một trong vạn, dự báo thời tiết nói có thể mưa.",cat:"canh-bao-khuyen-ran",hv:"Bất Phạ Nhất Vạn, Chỉ Phạ Vạn Nhất"},
{h:"不入虎穴,焉得虎子",p:"bù rù hǔ xué, yān dé hǔ zǐ",d:"Không vào hang hổ, sao có được hổ con",g:"Muốn thành công phải chấp nhận nguy hiểm",c:"不入虎穴,焉得虎子,想获得成功就必须敢于冒险.",cp:"bù rù hǔ xué, yān dé hǔ zi, xiǎng huò dé chéng gōng jiù bì xū gǎn yú mào xiǎn.",cd:"Không vào hang hổ, làm sao bắt được hổ con, muốn thành công phải dám mạo hiểm.",cat:"thanh-cong-that-bai",hv:"Bất Nhập Hổ Huyệt, Yên Đắc Hổ Tử"},
{h:"不听老人言,吃亏在眼前",p:"bù tīng lǎo rén yán, chī kuī zài yǎn qián",d:"Xưa nay người thương người lại có, người khôn cho ta trước cho ta sau.",g:"Lời khuyên của người lớn thường đúng",c:"当初不听老人言,吃亏在眼前,现在我后悔没听父母的建议.",cp:"dāng chū bù tīng lǎo rén yán, chī kuī zài yǎn qián, xiàn zài wǒ hòu huǐ méi tīng fù mǔ de jiàn yì.",cd:"Đầu không nghe lời người lớn, thiệt thòi ngay trước mắt, giờ tôi hối hận không nghe lời bố mẹ.",cat:"canh-bao-khuyen-ran",hv:"Bất Thính Lão Nhân Ngôn, Cật Khuy Tại Nhãn Tiền"},
{h:"不做亏心事,不怕鬼叫门",p:"bù zuò kuī xīn shì, bù pà guǐ jiào mén",d:"Một việc làm, gà trống nuôi.",g:"Làm việc tốt sẽ không lo bị khiển trách.",c:"我做事光明磊落,不做亏心事,不怕鬼叫门,半夜敲门也不慌.",cp:"wǒ zuò shì guāng míng lěi luò , bù zuò kuī xīn shì , bù pà guǐ jiào mén , bàn yè qiāo mén yě bù huāng .",cd:"Tôi làm việc quang minh chính đại, không làm chuyện thẹn lòng, không sợ ma gõ cửa, nửa đêm gõ cửa cũng không hoảng.",cat:"dao-duc-nhan-cach",hv:"Bất Tố Khuy Tâm Sự, Bất Phạ Quỷ Khiếu Môn"},
{h:"差之毫厘,失之千里",p:"chā zhī háo lí, shī zhī qiān lǐ",d:"Sai một chút, mất cả ngàn dặm.",g:"Sự sai sót nhỏ có thể dẫn đến hậu quả lớn.",c:"计算时一个小数点错了,差之毫厘,失之千里,结果完全不对.",cp:"jì suàn shí yí gè xiǎo shù diǎn cuò le , chā zhī háo lí , shī zhī qiān lǐ , jié guǒ wán quán bú duì .",cd:"Tính toán sai một dấu chấm thập phân, sai một ly đi một dặm, kết quả hoàn toàn không đúng.",cat:"canh-bao-khuyen-ran",hv:"Sai Chi Hào Ly, Thất Chi Thiên Lý"},
{h:"车到山前必有路,船到桥头自然直",p:"chē dào shān qián bì yǒu lù, chuán dào qiáo tóu zì rán zhí",d:"Xe đến trước núi ắt có đường, thuyền đến cầu ắt thẳng.",g:"Vấn đề sẽ có giải pháp khi đến thời điểm.",c:"车到山前必有路,船到桥头自然直,你不用担心,总会有办法的.",cp:"chē dào shān qián bì yǒu lù , chuán dào qiáo tóu zì rán zhí , nǐ bù yòng dān xīn , zǒng huì yǒu bàn fǎ de .",cd:"Xe đến trước núi ắt có đường, thuyền đến cầu ắt thẳng, bạn đừng lo, luôn có cách thôi.",cat:"cuoc-song",hv:"Xa Đáo Sơn Tiền Tất Hữu Lộ, Thuyền Đáo Kiều Đầu Tự Nhiên Trực"},
{h:"吃一堑,长一智",p:"chī yī qiàn, zhǎng yī zhì",d:"Rơi xuống một hố, sẽ thêm kinh nghiệm.",g:"Kinh nghiệm rút ra từ sai lầm.",c:"上次被骗了,吃一堑,长一智,这次我格外小心.",cp:"shàng cì bèi piàn le , chī yī qiàn , zhǎng yī zhì , zhè cì wǒ gé wài xiǎo xīn .",cd:"Lần trước bị lừa, ăn một vấp tăng một ngộ, lần này tôi đặc biệt cẩn thận.",cat:"kinh-nghiem-bai-hoc",hv:"Cật Nhất Tiệm, Trưởng Nhất Trí"},
{h:"重打锣鼓另开张",p:"zhòng dǎ luó gǔ lìng kāi zhāng",d:"Đánh trống lại mở cửa hàng.",g:"Bắt đầu lại từ đầu sau khi gặp thất bại.",c:"虽然这次失败了,但我们可以重打锣鼓另开张,重新开始.",cp:"suī rán zhè cì shī bài le , dàn wǒ men kě yǐ zhòng dǎ luó gǔ lìng kāi zhāng , chóng xīn kāi shǐ .",cd:"Tuy lần này thất bại, nhưng chúng ta có thể đánh trống lại mở hàng mới, bắt đầu lại từ đầu.",cat:"thanh-cong-that-bai",hv:"Trọng Đả La Cổ Lánh Khai Trương"},
{h:"出门问路,入乡问俗",p:"chū mén wèn lù, rù xiāng wèn sú",d:"Ra ngoài hỏi đường, đến nơi hỏi phong tục.",g:"Tìm hiểu kỹ thông tin trong môi trường mới.",c:"出门问路,入乡问俗,到了新地方要先了解当地习惯.",cp:"chū mén wèn lù , rù xiāng wèn sú , dào le xīn dì fāng yào xiān liǎo jiě dāng dì xí guàn .",cd:"Ra ngoài hỏi đường, vào làng hỏi tục, đến nơi mới phải trước tiên tìm hiểu thói quen địa phương.",cat:"kinh-nghiem-bai-hoc",hv:"Xuất Môn Vấn Lộ, Nhập Hương Vấn Tục"},
{h:"出水才见两腿泥",p:"chū shuǐ cái jiàn liǎng tuǐ ní",d:"Mới ra khỏi nước mới thấy chân dính bùn.",g:"Khi không còn trong tình huống khó khăn mới thấy rõ.",c:"项目结束了才知道问题在哪里,真是出水才见两腿泥.",cp:"xiàng mù jié shù le cái zhī dào wèn tí zài nǎ lǐ , zhēn shì chū shuǐ cái jiàn liǎng tuǐ ní .",cd:"Dự án kết thúc mới biết vấn đề ở đâu, đúng là ra khỏi nước mới thấy chân dính bùn.",cat:"kinh-nghiem-bai-hoc",hv:"Xuất Thuỷ Tài Kiến Lưỡng Thối Nê"},
{h:"初生牛犊不怕虎",p:"chū shēng niú dú bù pà hǔ",d:"Bò con mới sinh không sợ hổ.",g:"Người trẻ thường không sợ khó khăn.",c:"这个年轻人初生牛犊不怕虎,敢跟老板提出不同的意见.",cp:"zhè ge nián qīng rén chū shēng niú dú bù pà hǔ , gǎn gēn lǎo bǎn tí chū bù tóng de yì jiàn .",cd:"Thanh niên này bò con mới sinh không sợ hổ, dám đề xuất ý kiến khác với sếp.",cat:"no-luc-kien-tri",hv:"Sơ Sinh Ngưu Độc Bất Phạ Hổ"},
{h:"穿衣戴帽,各有所好",p:"chuān yī dài mào, gè yǒu suǒ hào",d:"Mặc áo đội mũ, mỗi người có sở thích riêng.",g:"Sở thích cá nhân là khác nhau.",c:"穿衣戴帽,各有所好,每个人有自己的审美标准.",cp:"chuān yī dài mào , gè yǒu suǒ hào , měi gè rén yǒu zì jǐ de shěn měi biāo zhǔn .",cd:"Mặc áo đội mũ, mỗi người có sở thích riêng, mỗi người có tiêu chuẩn thẩm mỹ riêng.",cat:"cuoc-song",hv:"Xuyên Y Đội Mạo, Các Hữu Sở Hiếu"},
{h:"春雨如油",p:"chūn yǔ rú yóu",d:"Mưa xuân như dầu.",g:"Mưa xuân rất quý giá, giúp mùa màng.",c:"农民看到春雨如油,心里特别高兴,因为庄稼可以好好生长了.",cp:"nóng mín kàn dào chūn yǔ rú yóu , xīn lǐ tè bié gāo xìng , yīn wèi zhuāng jià kě yǐ hǎo hǎo shēng zhǎng le .",cd:"Nông dân thấy mưa xuân như dầu, trong lòng đặc biệt vui mừng, vì cây lương thực có thể tốt tươi.",cat:"cuoc-song",hv:"Xuân Vũ Như Dầu"},
{h:"春不种,秋不收",p:"chūn bù zhòng, qiū bù shōu",d:"Xuân không trồng, thu không thu hoạch.",g:"Không chuẩn bị sớm thì không có thành quả.",c:"春不种,秋不收,如果现在不努力学习,将来怎么有好成绩呢？",cp:"chūn bù zhǒng , qiū bù shōu , rú guǒ xiàn zài bù nǔ lì xué xí , jiāng lái zěn me yǒu hǎo chéng jì ne ？",cd:"Xuân không gieo, thu không gặt, nếu bây giờ không chăm chỉ học tập, tương lai làm sao có thành tích tốt?",cat:"no-luc-kien-tri",hv:"Xuân Bất Chủng, Thu Bất Thu"},
{h:"此地无银三百两",p:"cǐ dì wú yín sān bǎi liǎng",d:"Nơi này không có ba trăm lượng bạc.",g:"Cố gắng che giấu điều gì đó thường bị phát hiện.",c:"他越是否认,越像此地无银三百两,大家反而更怀疑了.",cp:"tā yuè shì fǒu rèn , yuè xiàng cǐ dì wú yín sān bǎi liǎng , dà jiā fǎn ér gèng huái yí le .",cd:"Anh ấy càng phủ nhận, càng giống nơi này không có ba trăm lượng bạc, mọi người ngược lại càng nghi ngờ hơn.",cat:"dao-duc-nhan-cach",hv:"Thử Địa Vô Ngân Tam Bách Lượng"},
{h:"聪明一世,糊涂一时",p:"cōng míng yī shì, hú tú yī shí",d:"Thông minh cả đời, ngu ngơ một lúc.",g:"Ngay cả người thông minh cũng có lúc sai lầm.",c:"他聪明一世,糊涂一时,这么简单的问题居然答错了.",cp:"tā cōng míng yī shì , hú tú yī shí , zhè me jiǎn dān de wèn tí jū rán dá cuò le .",cd:"Anh ấy thông minh cả đời, hồ đồ một thời, vấn đề đơn giản như vậy lại trả lời sai.",cat:"canh-bao-khuyen-ran",hv:"Thông Minh Nhất Thế, Hồ Đồ Nhất Thời"},
{h:"大河有水小河满,大河无水小河干",p:"dà hé yǒu shuǐ xiǎo hé mǎn, dà hé wú shuǐ xiǎo hé gān",d:"Sông lớn có nước, sông nhỏ đầy; sông lớn không có nước, sông nhỏ khô cạn.",g:"Tình trạng của cái nhỏ phụ thuộc vào cái lớn.",c:"大河有水小河满,大河无水小河干,公司的效益好了,员工的福利才会好.",cp:"dà hé yǒu shuǐ xiǎo hé mǎn , dà hé wú shuǐ xiǎo hé gàn , gōng sī de xiào yì hǎo le , yuán gōng de fú lì cái huì hǎo .",cd:"Sông lớn có nước sông nhỏ đầy, sông lớn không nước sông nhỏ khô, hiệu quả công ty tốt, phúc lợ;i nhân viên mới tốt.",cat:"cuoc-song",hv:"Đại Hà Hữu Thuỷ Tiểu Hà Mãn, Đại Hà Vô Thuỷ Tiểu Hà Can"},
{h:"当局者迷,旁观者清",p:"dāng jú zhě mí, páng guān zhě qīng",d:"Người trong cuộc thì mờ mịt, người ngoài cuộc thì rõ ràng.",g:"Người không bị ảnh hưởng có cái nhìn rõ hơn.",c:"当局者迷,旁观者清,你陷在感情里看不清楚,朋友们都看得明白.",cp:"dāng jú zhě mí , páng guān zhě qīng , nǐ xiàn zài gǎn qíng lǐ kàn bù qīng chǔ , péng yǒu men dōu kàn dé míng bái .",cd:"Người trong cuộc thì mê, người ngoài cuộc thì rõ, bạn đắm chìm trong tình cảm không nhìn rõ, bạn bè đều thấy rõ ràng.",cat:"kinh-nghiem-bai-hoc",hv:"Đương Cục Giả Mê, Bàng Quan Giả Thanh"},
{h:"刀子嘴,豆腐心",p:"dāo zi zuǐ, dòu fu xīn",d:"Miệng như dao, lòng như đậu phụ.",g:"Nói thẳng nhưng lòng tốt bụng.",c:"李老师虽然刀子嘴,豆腐心,但对我们学生非常好.",cp:"lǐ lǎo shī suī rán dāo zi zuǐ , dòu fǔ xīn , dàn duì wǒ men xué shēng fēi cháng hǎo .",cd:"Thầy giáo Luy tuy miệng như dao lòng như đậu phụ, nhưng đối với học sinh chúng tôi rất tốt.",cat:"doi-nhan-xu-the",hv:"Đao Tử Chuỷ, Đậu Hủ Tâm"},
{h:"冬练三九,夏练三伏",p:"dōng liàn sān jiǔ, xià liàn sān fú",d:"Tập luyện trong mùa đông lạnh giá và mùa hè nóng bức.",g:"Khổ luyện trong mọi điều kiện thời tiết.",c:"运动员必须冬练三九,夏练三伏,才能取得好成绩.",cp:"yùn dòng yuán bì xū dōng liàn sān jiǔ , xià liàn sān fú , cái néng qǔ dé hǎo chéng jì .",cd:"Vận động viên phải tập đông tập hè, mới có thể đạt thành tích tốt.",cat:"no-luc-kien-tri",hv:"Đông Luyện Tam Cửu, Hạ Luyện Tam Phục"},
{h:"读不尽的书,走不完的路",p:"dú bù jìn de shū, zǒu bù wán de lù",d:"Sách không đọc hết, đường không đi hết.",g:"Học hỏi và trải nghiệm là vô hạn.",c:"读不尽的书,走不完的路,学习是一辈子的事.",cp:"dú bù jìn de shū , zǒu bù wán de lù , xué xí shì yī bèi zi de shì .",cd:"Sách đọc không hết, đường đi không xong, học tập là việc cả đời.",cat:"hoc-tap",hv:"Độc Bất Tận Đích Thư, Tẩu Bất Hoàn Đích Lộ"},
{h:"读万卷书,行万里路",p:"dú wàn juàn shū, xíng wàn lǐ lù",d:"Đọc mười ngàn cuốn sách, đi mười ngàn dặm đường.",g:"Kiến thức và kinh nghiệm là vô hạn.",c:"读万卷书,行万里路,理论和实践都很重要.",cp:"dú wàn juàn shū , xíng wàn lǐ lù , lǐ lùn hé shí jiàn dōu hěn zhòng yào .",cd:"Đọc vạn quyển sách, đi vạn dặm đường, lý luận và thực tiễn đều quan trọng.",cat:"hoc-tap",hv:"Độc Vạn Quyển Thư, Hành Vạn Lý Lộ"},
{h:"儿的生日,娘的苦日",p:"ér de shēng rì, niáng de kǔ rì",d:"Ngày sinh của con, ngày khổ của mẹ.",g:"Sự hy sinh của mẹ không thể đong đếm.",c:"儿的生日,娘的苦日,我每年生日都会给妈妈送礼物感谢她.",cp:"ér de shēng rì , niáng de kǔ rì , wǒ měi nián shēng rì dū huì gěi mā mā sòng lǐ wù gǎn xiè tā .",cd:"Ngày sinh của con, ngày khổ của mẹ, mỗi năm sinh nhật tôi đều tặng quà cho mẹ để cảm ơn.",cat:"gia-dinh",hv:"Nhi Đích Sinh Nhật, Nương Đích Khổ Nhật"},
{h:"儿行千里母担忧",p:"ér xíng qiān lǐ mǔ dān yōu",d:"Con đi ngàn dặm, mẹ lo lắng.",g:"Mẹ luôn lo lắng cho con dù ở xa.",c:"儿行千里母担忧,每次出远门,妈妈总是打电话关心我.",cp:"ér xíng qiān lǐ mǔ dān yōu , měi cì chū yuǎn mén , mā mā zǒng shì dǎ diàn huà guān xīn wǒ .",cd:"Con đi ngàn dặm mẹ lo lắng, mỗi lần đi xa, mẹ luôn gọi điện hỏi thăm tôi.",cat:"gia-dinh",hv:"Nhi Hành Thiên Lý Mẫu Đảm Ưu"},
{h:"耳听为虚,眼见为实",p:"ěr tīng wéi xū, yǎn jiàn wéi shí",d:"Nghe thì hư ảo, thấy thì thực.",g:"Trực tiếp thấy sẽ rõ hơn là nghe nói.",c:"耳听为虚,眼见为实,你要亲眼去看看才知道真相.",cp:"ěr tīng wèi xū , yǎn jiàn wèi shí , nǐ yào qīn yǎn qù kàn kàn cái zhī dào zhēn xiàng .",cd:"Nghe thì hư, thấy thì thực, bạn phải tự mắt nhìn thấy mới biết chân tướng.",cat:"kinh-nghiem-bai-hoc",hv:"Nhĩ Thính Vi Hư, Nhãn Kiến Vi Thực"},
{h:"饭后百步走,能活九十九",p:"fàn hòu bǎi bù zǒu, néng huó jiǔ shí jiǔ",d:"Ăn xong đi trăm bước, sống được chín mươi chín.",g:"Đi bộ sau khi ăn tốt cho sức khỏe.",c:"奶奶常说饭后百步走,能活九十九,所以她每天都坚持散步.",cp:"nǎi nǎi cháng shuō fàn hòu bǎi bù zǒu , néng huó jiǔ shí jiǔ , suǒ yǐ tā měi tiān dōu jiān chí sàn bù .",cd:"Bà thường nói ăn xong đi trăm bước sống được chín mươi chín, nên bà mỗi ngày đều kiên trì đi bộ.",cat:"cuoc-song",hv:"Phạn Hậu Bách Bộ Tẩu, Năng Hoạt Cửu Thập Cửu"},
{h:"放长线,钓大鱼",p:"fàng cháng xiàn, diào dà yú",d:"Thả dây dài, câu cá lớn.",g:"Cần kiên nhẫn để đạt được mục tiêu lớn.",c:"做生意要有耐心,放长线,钓大鱼,不能急于求成.",cp:"zuò shēng yì yào yǒu nài xīn , fàng zhǎng xiàn , diào dà yú , bù néng jí yú qiú chéng .",cd:"Làm ăn phải có kiên nhẫn, thả dây dài câu cá lớn, không thể cầu thành công nhanh.",cat:"no-luc-kien-tri",hv:"Phóng Trường Tuyến, Điếu Đại Ngư"},
{h:"千打雷,不下雨",p:"qiān dǎ léi, bù xià yǔ",d:"Ngàn tiếng sấm không có mưa.",g:"Lời hù dọa không có tác dụng.",c:"老板总是说要给我们涨工资,但千打雷,不下雨,一直没实现.",cp:"lǎo bǎn zǒng shì shuō yào gěi wǒ men zhǎng gōng zī , dàn qiān dǎ léi , bù xià yǔ , yì zhí méi shí xiàn .",cd:"Sếp luôn nói sẽ tăng lương, nhưng ngàn tiếng sấm không có mưa, mãi chưa thực hiện.",cat:"canh-bao-khuyen-ran",hv:"Thiên Đả Lôi, Bất Hạ Vũ"},
{h:"隔行如隔山",p:"gé háng rú gé shān",d:"Khác ngành nghề như khác núi.",g:"Khác lĩnh vực là rất khác nhau.",c:"隔行如隔山,虽然都是做技术的,但不同领域差别很大.",cp:"gé háng rú gé shān , suī rán dōu shì zuò jì shù de , dàn bù tóng lǐng yù chā bié hěn dà .",cd:"Khác ngành như khác núi, tuy đều làm kỹ thuật, nhưng lĩnh vực khác nhau chênh lệch rất lớn.",cat:"cong-viec",hv:"Cách Hàng Như Cách Sơn"},
{h:"功夫不负有心人",p:"gōng fū bù fù yǒu xīn rén",d:"Công sức không phụ người có lòng.",g:"Sự chăm chỉ sẽ được đền đáp.",c:"功夫不负有心人,经过三年的努力,他终于考上了理想的大学.",cp:"gōng fu bù fù yǒu xīn rén , jīng guò sān nián de nǔ lì , tā zhōng yú kǎo shàng le lǐ xiǎng de dà xué .",cd:"Công phu không phụ người có lòng, sau ba năm nỗ lực, cuối cùng anh ấy đỗ được đại học lý tưởng.",cat:"no-luc-kien-tri",hv:"Công Phu Bất Phụ Hữu Tâm Nhân"},
{h:"光阴似箭,一去不返",p:"guāng yīn shì jiàn, yī qù bù fǎn",d:"Thời gian như tên bắn, đi không trở lại.",g:"Thời gian trôi qua rất nhanh.",c:"光阴似箭,一去不返,我们要珍惜每一分每一秒.",cp:"guāng yīn sì jiàn , yī qù bù fǎn , wǒ men yào zhēn xī měi yī fēn měi yī miǎo .",cd:"Thời gian như tên bắn, đi không trở lại, chúng ta phải trân trọng từng phút từng giây.",cat:"thoi-gian-co-hoi",hv:"Quang Âm Tự Tiễn, Nhất Khứ Bất Phản"},
{h:"瓜熟蒂落,水到渠成",p:"guā shú dì luò, shuǐ dào qú chéng",d:"Bí chín tự rụng, nước đến thì thành dòng.",g:"Mọi việc sẽ đạt kết quả khi đến đúng thời điểm.",c:"瓜熟蒂落,水到渠成,只要努力够了,成功自然会来.",cp:"guā shú dì luò , shuǐ dào qú chéng , zhǐ yào nǔ lì gòu le , chéng gōng zì rán huì lái .",cd:"Bí chín tự rụng, nước đến thành dòng, chỉ cần cố gắng đủ, thành công tự nhiên đến.",cat:"thoi-gian-co-hoi",hv:"Qua Thục Đế Lạc, Thuỷ Đáo Cừ Thành"},
{h:"过了这个村,就没这个店了",p:"guò le zhè gè cūn, jiù méi zhè gè diàn le",d:"Qua làng này không còn quán này nữa.",g:"Cơ hội sẽ không trở lại.",c:"这个机会很难得,过了这个村,就没这个店了,你一定要抓住.",cp:"zhè ge jī huì hěn nán dé , guò le zhè ge cūn , jiù méi zhè ge diàn le , nǐ yí dìng yào zhuā zhù .",cd:"Cơ hội này rất hiếm, qua làng này không còn quán này, bạn nhất định phải nắm bắt.",cat:"thoi-gian-co-hoi",hv:"Quá Liễu Giá Cá Thôn, Tựu Một Giá Cá Điếm Liễu"},
{h:"海阔凭鱼跃,天高任鸟飞",p:"hǎi kuò píng yú yuè, tiān gāo rèn niǎo fēi",d:"Biển rộng cho cá nhảy, trời cao cho chim bay.",g:"Tự do và cơ hội rộng lớn.",c:"大学毕业了,海阔凭鱼跃,天高任鸟飞,你可以自由选择了.",cp:"dà xué bì yè le , hǎi kuò píng yú yuè , tiān gāo rèn niǎo fēi , nǐ kě yǐ zì yóu xuǎn zé le .",cd:"Tốt nghiệp đại học rồi, biển rộng cho cá nhảy, trời cao cho chim bay, bạn có thể tự do lựa chọn.",cat:"thoi-gian-co-hoi",hv:"Hải Khoát Bằng Ngư Dược, Thiên Cao Nhiệm Điểu Phi"},
{h:"行行出状元",p:"háng háng chū zhuàng yuán",d:"Mỗi ngành nghề đều có người xuất sắc.",g:"Mọi lĩnh vực đều có người giỏi.",c:"行行出状元,无论做什么工作,只要认真都能成功.",cp:"háng háng chū zhuàng yuán , wú lùn zuò shén me gōng zuò , zhǐ yào rèn zhēn dōu néng chéng gōng .",cd:"Hàng hàng xuất trạng nguyên, dù làm công việc gì, chỉ cần chăm chỉ đều có thể thành công.",cat:"cong-viec",hv:"Hàng Hàng Xuất Trạng Nguyên"},
{h:"喝水不忘挖井人",p:"hē shuǐ bù wàng wā jǐng rén",d:"Uống nước không quên người đào giếng.",g:"Nhớ ơn những người đã giúp đỡ.",c:"喝水不忘挖井人,我们今天的幸福生活离不开前辈的奋斗.",cp:"hē shuǐ bù wàng wā jǐng rén , wǒ men jīn tiān de xìng fú shēng huó lí bù kāi qián bèi de fèn dòu .",cd:"Uống nước không quên người đào giếng, cuộc sống hạnh phúc hôm nay không thể tách rờ;i sự phấn đấu của thế hệ trước.",cat:"dao-duc-nhan-cach",hv:"Húp Thuỷ Bất Vong Oạt Tỉnh Nhân"},
{h:"不管黑猫白猫,抓住老鼠就是好猫",p:"bù guǎn hēi māo bái māo, zhuā zhù lǎo shǔ jiù shì hǎo māo",d:"Không quan tâm mèo đen hay mèo trắng, bắt chuột là mèo tốt.",g:"Kết quả quan trọng hơn hình thức.",c:"不管黑猫白猫,抓住老鼠就是好猫,关键是看结果.",cp:"bù guǎn hēi māo bái māo , zhuā zhù lǎo shǔ jiù shì hǎo māo , guān jiàn shì kàn jié guǒ .",cd:"Không quan tâm mèo đen mèo trắng, bắt được chuột là mèo tốt, trọng điểm là xem kết quả.",cat:"cong-viec",hv:"Bất Quản Hắc Miêu Bạch Miêu, Trảo Trú Lão Thử Tựu Thị Hảo Miêu"},
{h:"黄金有价,知识无价",p:"huáng jīn yǒu jià, zhī shí wú jià",d:"Vàng có giá, kiến thức không có giá.",g:"Kiến thức là vô giá.",c:"黄金有价,知识无价,所以我一直坚持读书学习.",cp:"huáng jīn yǒu jià , zhī shí wú jià , suǒ yǐ wǒ yì zhí jiān chí dú shū xué xí .",cd:"Vàng có giá, tri thức vô giá, nên tôi luôn kiên trì đọc sách học tập.",cat:"hoc-tap",hv:"Hoàng Kim Hữu Giá, Tri Thức Vô Giá"},
{h:"活到老,学到老",p:"huó dào lǎo, xué dào lǎo",d:"Sống đến già, học đến già",g:"Học hỏi suốt đời",c:"活到老,学到老,爷爷七十岁了还在学用智能手机.",cp:"huó dào lǎo, xué dào lǎo, yé yé qī shí suì le hái zài xué yòng zhì néng shǒu jī.",cd:"Sống đến già học đến già, ông tôi bảy mươi tuổi còn học dùng điện thoại thông minh.",cat:"hoc-tap",hv:"Hoạt Đáo Lão, Học Đáo Lão"},
{h:"鸡蛋里挑骨头",p:"jī dàn lǐ tiāo gǔ tóu",d:"Tìm xương trong trứng gà",g:"Cố tình tìm lỗi trong những điều tốt",c:"他总喜欢鸡蛋里挑骨头,对别人的工作总是不满意.",cp:"tā zǒng xǐ huān jī dàn lǐ tiāo gǔ tou, duì bié rén de gōng zuò zǒng shì bù mǎn yì.",cd:"Anh ấy luôn thích tìm xương trong trứng gà, đối với công việc của người khác luôn không hài lòng.",cat:"doi-nhan-xu-the",hv:"Kê Đản Lý Khiêu Cốt Đầu"},
{h:"既来之,则安之",p:"jì lái zhī, zé ān zhī",d:"Đã đến thì phải an phận",g:"Chấp nhận hoàn cảnh khi đã đến nơi",c:"既来之,则安之,既然来了就好好适应这里的生活吧.",cp:"jì lái zhī, zé ān zhī, jì rán lái le jiù hǎo hǎo shì yìng zhè lǐ de shēng huó ba.",cd:"Đã đến thì phải an phận, đã đến rồi thì hãy thích ứng với cuộc sống ở đây thôi.",cat:"cuoc-song",hv:"Ký Lai Chi, Tắc An Chi"},
{h:"吉人自有天相",p:"jí rén zì yǒu tiān xiàng",d:"Người tốt thì trời có phúc",g:"Người tốt sẽ được trời phúc",c:"别担心,吉人自有天相,好人一定会有好报的.",cp:"bié dān xīn, jí rén zì yǒu tiān xiàng, hǎo rén yí dìng huì yǒu hǎo bào de.",cd:"Đừng lo, người tốt tự có trời phù hộ, người tốt nhất định có báo đáp tốt.",cat:"dao-duc-nhan-cach",hv:"Cát Nhân Tự Hữu Thiên Tướng"},
{h:"机不可失,时不再来",p:"jī bù kě shī, shí bù zài lái",d:"Cơ hội không thể mất, thời gian không trở lại",g:"Cần nắm bắt cơ hội ngay khi có",c:"机不可失,时不再来,这么好的机会你一定要抓住.",cp:"jī bù kě shī, shí bù zài lái, zhè me hǎo de jī huì nǐ yí dìng yào zhuā zhù.",cd:"Cơ hội không thể mất, thời gian không trở lại, cơ hội tốt như vậy bạn nhất định phải nắm bắt.",cat:"thoi-gian-co-hoi",hv:"Cơ Bất Khả Thất, Thời Bất Tái Lai"},
{h:"江山易改,禀性难移",p:"jiāng shān yì gǎi, bǐng xìng nán yí",d:"Núi sông dễ đổi, bản tính khó đổi",g:"Tính cách khó thay đổi hơn là hoàn cảnh",c:"江山易改,禀性难移,他那个急躁的性格怎么也改不了.",cp:"jiāng shān yì gǎi, bǐng xìng nán yí, tā nà ge jí zào de xìng gé zěn me yě gǎi bù liǎo.",cd:"Núi sông dễ đổi, bản tính khó dời, tính cách nóng vội của anh ấy thế nào cũng không sửa được.",cat:"dao-duc-nhan-cach",hv:"Giang Sơn Dị Cải, Bẩm Tính Nan Di"},
{h:"解铃还得系铃人",p:"jiě líng hái dé xì líng rén",d:"Người tháo chuông cũng phải là người buộc chuông",g:"Người gây ra vấn đề cũng phải giải quyết",c:"这个问题只有他自己能解决,解铃还得系铃人.",cp:"zhè ge wèn tí zhǐ yǒu tā zì jǐ néng jiě jué, jiě líng hái dé xì líng rén.",cd:"Vấn đề này chỉ có anh ấy tự mình mới giải quyết được, người thắt chuông phải là người tháo chuông.",cat:"kinh-nghiem-bai-hoc",hv:"Giải Linh Hoàn Đắc Hệ Linh Nhân"},
{h:"近朱者赤,近墨者黑",p:"jìn zhū zhě chì, jìn mò zhě hēi",d:"Gần gũi với đỏ sẽ thành đỏ, gần gũi với mực sẽ thành đen",g:"Gần gũi với người tốt sẽ thành tốt, gần người xấu sẽ thành xấu",c:"近朱者赤,近墨者黑,选择朋友一定要慎重.",cp:"jìn zhū zhě chì, jìn mò zhě hēi, xuǎn zé péng yǒu yí dìng yào shèn zhòng.",cd:"Gần chu sa đỏ, gần mực thì đen, chọn bạn bè nhất định phải thận trọng.",cat:"doi-nhan-xu-the",hv:"Cận Chu Giả Xích, Cận Mặc Giả Hắc"},
{h:"酒逢知己千杯少,话不投机半句多",p:"jiǔ féng zhī jǐ qiān bēi shǎo, huà bù tóu jī bàn jù duō",d:"Rượu gặp bạn tri kỷ thì ngàn ly cũng ít, nói chuyện không hợp thì nửa câu cũng nhiều.",g:"Với bạn bè tri kỷ, không bao giờ là đủ; còn với người không hợp, dù ít cũng nhiều.",c:"酒逢知己千杯少,话不投机半句多,跟志同道合的人聊天就是开心.",cp:"jiǔ féng zhī jǐ qiān bēi shǎo , huà bù tóu jī bàn jù duō , gēn zhì tóng dào hé de rén liáo tiān jiù shì kāi xīn .",cd:"Rượu gặp tri kỷ ngàn ly cũng ít, nói chuyện không hợp nửa câu cũng nhiều, trò chuyện với người chí hướng hợp nhau thật vui.",cat:"tinh-cam",hv:"Tửu Phùng Tri Kỷ Thiên Bôi Thiểu, Thoại Bất Đầu Cơ Bán Cú Đa"},
{h:"君子成人之美",p:"jūn zǐ chéng rén zhī měi",d:"Quân tử giúp người khác hoàn thiện.",g:"Quân tử khuyến khích và giúp người khác phát triển.",c:"君子成人之美,看到同事成功我们应该为他高兴.",cp:"jūn zǐ chéng rén zhī měi , kàn dào tóng shì chéng gōng wǒ men yīng gāi wèi tā gāo xìng .",cd:"Quân tử thành nhân chi mỹ, thấy đồng nghiệp thành công chúng ta nên vui mừng cho anh ấy.",cat:"dao-duc-nhan-cach",hv:"Quân Tử Thành Nhân Chi Mỹ"},
{h:"靠山吃山,靠水吃水",p:"kào shān chī shān, kào shuǐ chī shuǐ",d:"Dựa vào núi thì ăn núi, dựa vào nước thì ăn nước.",g:"Sống dựa vào nguồn tài nguyên hiện có.",c:"靠山吃山,靠水吃水,沿海地区的人们以渔业为生.",cp:"kào shān chī shān , kào shuǐ chī shuǐ , yán hǎi dì qū de rén men yǐ yú yè wéi shēng .",cd:"Dựa núi ăn núi, dựa nước ăn nước, người dân vùng duyên hải lấy nghề đánh cá làm sinh kế.",cat:"cuoc-song",hv:"Kháo Sơn Cật Sơn, Kháo Thuỷ Cật Thuỷ"},
{h:"苦海无边,回头是岸",p:"kǔ hǎi wú biān, huí tóu shì àn",d:"Biển khổ không bờ, quay đầu là bến.",g:"Tìm cách thoát khỏi tình huống khó khăn sẽ tìm thấy bình yên.",c:"苦海无边,回头是岸,只要你愿意改正,任何时候都不晚.",cp:"kǔ hǎi wú biān , huí tóu shì àn , zhǐ yào nǐ yuàn yì gǎi zhèng , rèn hé shí hòu dōu bù wǎn .",cd:"Biển khổ vô biên, quay đầu là bến, chỉ cần bạn nguyện ý sửa chính, lúc nào cũng không muộn.",cat:"canh-bao-khuyen-ran",hv:"Khổ Hải Vô Biên, Hồi Đầu Thị Ngạn"},
{h:"浪子回头金不换",p:"làng zǐ huí tóu jīn bù huàn",d:"Con trai lạc lối quay đầu thì vàng cũng không đổi.",g:"Sửa chữa sai lầm rất quý giá.",c:"浪子回头金不换,他从赌博的深渊走出来重新做人了.",cp:"làng zǐ huí tóu jīn bù huàn , tā cóng dǔ bó de shēn yuān zǒu chū lái chóng xīn zuò rén le .",cd:"Con hoang quay đầu vàng cũng không đổi, anh ấy từ vực thẳm cờ bạc đi ra, làm lại người mới.",cat:"dao-duc-nhan-cach",hv:"Lãng Tử Hồi Đầu Kim Bất Hoán"},
{h:"老将出马,一个顶俩",p:"lǎo jiāng chū mǎ, yī gè dǐng liǎ",d:"Lão tướng xuất trận, một người bằng hai.",g:"Người có kinh nghiệm làm việc hiệu quả.",c:"老将出马,一个顶俩,还是让王老师来处理这个问题吧.",cp:"lǎo jiàng chū mǎ , yí gè dǐng liǎ , hái shì ràng wáng lǎo shī lái chǔ lǐ zhè ge wèn tí ba .",cd:"Lão tướng xuất mã một bằng hai, vẫn là để thầy giáo Vương đến giải quyết vấn đề này thôi.",cat:"cong-viec",hv:"Lão Tương Xuất Mã, Nhất Cá Đỉnh Lưỡng"},
{h:"良药苦口利于病,忠言逆耳利于行",p:"liáng yào kǔ kǒu lì yú bìng, zhōng yán nì ěr lì yú xíng",d:"Thuốc tốt dù đắng nhưng có lợi cho bệnh, lời khuyên chân thành dù khó nghe nhưng có lợi cho hành động.",g:"Lời khuyên chân thành và thuốc tốt có thể khó nghe nhưng có lợi.",c:"良药苦口利于病,忠言逆耳利于行,你要虚心接受批评.",cp:"liáng yào kǔ kǒu lì yú bìng , zhōng yán nì ěr lì yú xíng , nǐ yào xū xīn jiē shòu pī píng .",cd:"Thuốc tốt đắng miệng lợi cho bệnh, lời hay khó nghe lợi cho làm, bạn phải khiêm tốn tiếp nhận phê bình.",cat:"canh-bao-khuyen-ran",hv:"Lương Dược Khổ Khẩu Lợi Ư Bệnh, Trung Ngôn Nghịch Nhĩ Lợi Ư Hành"},

{h:"路遥知马力,日久见人心",p:"lù yáo zhī mǎ lì, rì jiǔ jiàn rén xīn",d:"Đường dài mới biết sức ngựa, thời gian lâu mới thấy lòng người",g:"Thời gian và thử thách sẽ bộc lộ bản chất",c:"路遥知马力,日久见人心,相处久了才能知道一个人的真面目.",cp:"lù yáo zhī mǎ lì, rì jiǔ jiàn rén xīn, xiāng chǔ jiǔ le cái néng zhī dào yí gè rén de zhēn miàn mù.",cd:"Đường dài mới biết sức ngựa, thời gian lâu mới thấy lòng người, ở chung lâu mới biết được bộ mặt thật của một người.",cat:"doi-nhan-xu-the",hv:"Lộ Dao Tri Mã Lực, Nhật Cửu Kiến Nhân Tâm"},

{h:"每逢佳节倍思亲",p:"měi féng jiā jié bèi sī qīn",d:"Mỗi dịp lễ tết càng nhớ người thân.",g:"Dịp lễ tết thường làm ta nhớ về người thân.",c:"每逢佳节倍思亲,中秋节我特别想念远方的家人.",cp:"měi féng jiā jié bèi sī qīn , zhōng qiū jié wǒ tè bié xiǎng niàn yuǎn fāng de jiā rén .",cd:"Mỗi dịp tết đến càng nhớ người thân, Trung Thu tôi đặc biệt nhớ gia đình ở phương xa.",cat:"gia-dinh",hv:"Mỗi Phùng Giai Tiết Bội Tư Thân"},

{h:"磨刀不误砍柴工",p:"mó dāo bù wù kǎn chái gōng",d:"Mài dao không làm lỡ công việc chặt củi.",g:"Chuẩn bị kỹ lưỡng sẽ giúp công việc thuận lợi.",c:"磨刀不误砍柴工,先做好准备再开始工作.",cp:"mó dāo bù wù kǎn chái gōng , xiān zuò hǎo zhǔn bèi zài kāi shǐ gōng zuò .",cd:"Mài dao không lỗi chặt củi, trước hết chuẩn bị tốt rồi mới bắt đầu làm việc.",cat:"cong-viec",hv:"Ma Đao Bất Ngộ Khảm Sài Công"},

{h:"宁为玉碎,不为瓦全",p:"nìng wéi yù suì, bù wéi wǎ quán",d:"Thà cho ngọc vỡ chứ không chọn gạch nguyên vẹn.",g:"Sẵn sàng hy sinh để giữ phẩm giá.",c:"宁为玉碎,不为瓦全,他宁愿牺牲也不屈服.",cp:"nìng wéi yù suì , bù wéi wǎ quán , tā nìng yuàn xī shēng yě bù qū fú .",cd:"Thà ngọc nát không ngói toàn, anh ấy thà hy sinh cũng không khuất phục.",cat:"dao-duc-nhan-cach",hv:"Ninh Vi Ngọc Toái, Bất Vi Ngoã Toàn"},

{h:"便宜没好货,好货不便宜",p:"pián yí méi hǎo huò, hǎo huò bù pián yí",d:"Hàng rẻ không tốt, hàng tốt không rẻ.",g:"Giá cả phản ánh chất lượng hàng hóa.",c:"便宜没好货,好货不便宜,买衣服还是要看质量.",cp:"pián yi méi hǎo huò , hǎo huò bù biàn yí , mǎi yī fú hái shì yào kàn zhì liàng .",cd:"Hàng rẻ không tốt, hàng tốt không rẻ, mua quần áo vẫn phải xem chất lượng.",cat:"tien-bac-kinh-doanh",hv:"Tiện Nghi Một Hảo Hoá, Hảo Hoá Bất Tiện Nghi"},

{h:"千里送鹅毛,礼轻情意重",p:"qiān lǐ sòng é máo, lǐ qīng qíng yì zhòng",d:"Gửi lông ngỗng ngàn dặm, quà nhẹ nhưng tình cảm nặng.",g:"Tình cảm quý giá hơn giá trị vật chất.",c:"千里送鹅毛,礼轻情意重,朋友从远方寄来小礼物我很感动.",cp:"qiān lǐ sòng é máo , lǐ qīng qíng yì zhòng , péng yǒu cóng yuǎn fāng jì lái xiǎo lǐ wù wǒ hěn gǎn dòng .",cd:"Ngàn dặm gửi lông ngỗng, quà nhẹ tình nặng, bạn từ xa gửi món quà nhỏ tôi rất cảm động.",cat:"tinh-cam",hv:"Thiên Lý Tống Nga Mao, Lễ Khinh Tình Ý Trọng"},
{h:"千里之行,始于足下",p:"qiān lǐ zhī xíng, shǐ yú zú xià",d:"Cuộc hành trình ngàn dặm bắt đầu từ bước chân.",g:"Mọi việc lớn đều bắt đầu từ những bước nhỏ.",c:"千里之行,始于足下,实现目标要从第一步开始.",cp:"qiān lǐ zhī xíng , shǐ yú zú xià , shí xiàn mù biāo yào cóng dì yī bù kāi shǐ .",cd:"Hành trình ngàn dặm bắt đầu từ bước dưới chân, thực hiện mục tiêu phải từ bước đầu tiên.",cat:"no-luc-kien-tri",hv:"Thiên Lý Chi Hành, Thuỷ Ư Túc Hạ"},
{h:"前人种树,后人乘凉",p:"qián rén zhòng shù, hòu rén chéng liáng",d:"Người trước trồng cây, người sau hưởng bóng mát.",g:"Nhận lợi ích từ công sức của người đi trước.",c:"前人种树,后人乘凉,我们应该感谢前辈的努力.",cp:"qián rén zhǒng shù , hòu rén chéng liáng , wǒ men yīng gāi gǎn xiè qián bèi de nǔ lì .",cd:"Người trước trồng cây, người sau hưởng bóng mát, chúng ta nên cảm ơn sự nỗ lực của thế hệ trước.",cat:"kinh-nghiem-bai-hoc",hv:"Tiền Nhân Chủng Thụ, Hậu Nhân Thừa Lương"},
{h:"强将手下无弱兵",p:"qiáng jiàng shǒu xià wú ruò bīng",d:"Tướng giỏi không có binh lính yếu.",g:"Lãnh đạo giỏi sẽ có đội ngũ mạnh.",c:"强将手下无弱兵,跟着优秀的领导才能进步快.",cp:"qiáng jiàng shǒu xià wú ruò bīng , gēn zhe yōu xiù de lǐng dǎo cái néng jìn bù kuài .",cd:"Tướng mạnh dưới tay không có binh yếu, theo lãnh đạo xuất sắc mới tiến bộ nhanh.",cat:"cong-viec",hv:"Cường Tướng Thủ Hạ Vô Nhược Binh"},
{h:"巧妇难为无米之炊",p:"qiǎo fù nán wéi wú mǐ zhī chuī",d:"Bà nội trợ khéo không thể nấu ăn nếu không có gạo.",g:"Khó khăn nếu thiếu điều kiện cần thiết.",c:"巧妇难为无米之炊,没有资源再好的计划也实现不了.",cp:"qiǎo fù nán wéi wú mǐ zhī chuī , méi yǒu zī yuán zài hǎo de jì huà yě shí xiàn bù liǎo .",cd:"Người đàn bà khéo tay khó làm cơm không có gạo, không có tài nguyên kế hoạch tốt đến mấy cũng không thực hiện được.",cat:"cong-viec",hv:"Xảo Phụ Nan Vi Vô Mễ Chi Xuy"},
{h:"青出于蓝,而胜于蓝",p:"qīng chū yú lán, ér shèng yú lán",d:"Xanh từ cây chàm, nhưng hơn cây chàm.",g:"Con cái vượt trội hơn cha mẹ.",c:"青出于蓝,而胜于蓝,学生超过老师才是最好的结果.",cp:"qīng chū yú lán , ér shèng yú lán , xué shēng chāo guò lǎo shī cái shì zuì hǎo de jié guǒ .",cd:"Thanh xuất vu lam mà thắng vu lam, học trò vượt qua thầy mới là kết quả tốt nhất.",cat:"gia-dinh",hv:"Thanh Xuất Ư Lam, Nhi Thắng Ư Lam"},
{h:"情人眼里出西施",p:"qíng rén yǎn lǐ chū xī shī",d:"Trong mắt người yêu hiện ra Tây Thi.",g:"Tình yêu làm người ta thấy mọi thứ đẹp đẽ.",c:"情人眼里出西施,在他眼中,女朋友是最美的.",cp:"qíng rén yǎn lǐ chū xī shī , zài tā yǎn zhōng , nǚ péng yǒu shì zuì měi de .",cd:"Trong mắt người yêu xuất hiện Tây Thi, trong mắt anh ấy, bạn gái là đẹp nhất.",cat:"tinh-cam",hv:"Tình Nhân Nhãn Lý Xuất Tây Thi"},
{h:"人不可貌相,海水不可斗量",p:"rén bù kě mào xiàng, hǎi shuǐ bù kě dǒu liàng",d:"Người không thể đánh giá qua vẻ ngoài, biển không thể đo lượng.",g:"Đánh giá người phải dựa vào bản chất, không chỉ bề ngoài.",c:"人不可貌相,海水不可斗量,别小看那个年轻人.",cp:"rén bù kě mào xiàng , hǎi shuǐ bù kě dǒu liáng , bié xiǎo kàn nà ge nián qīng rén .",cd:"Người không thể nhìn mặt, nước biển không thể đo bằng đấu, đừng coi thường thanh niên đó.",cat:"doi-nhan-xu-the",hv:"Nhân Bất Khả Mạo Tướng, Hải Thuỷ Bất Khả Đẩu Lượng"},
{h:"人逢喜事精神爽",p:"rén féng xǐ shì jīng shén shuǎng",d:"Người gặp việc vui vẻ tinh thần thoải mái.",g:"Người gặp điều vui thường cảm thấy hạnh phúc.",c:"人逢喜事精神爽,听说升职了,他今天特别高兴.",cp:"rén féng xǐ shì jīng shén shuǎng , tīng shuō shēng zhí le , tā jīn tiān tè bié gāo xìng .",cd:"Người gặp hỷ sự tinh thần sảng khoái, nghe nói được thăng chức, hôm nay anh ấy đặc biệt vui.",cat:"cuoc-song",hv:"Nhân Phùng Hỷ Sự Tinh Thần Sảng"},
{h:"人活七十古来稀",p:"rén huó qī shí gǔ lái xī",d:"Sống đến bảy mươi là điều hiếm thấy từ xưa.",g:"Sống lâu là điều hiếm gặp.",c:"人活七十古来稀,爷爷今年八十了,身体还很硬朗.",cp:"rén huó qī shí gǔ lái xī , yé yé jīn nián bā shí le , shēn tǐ hái hěn yìng lǎng .",cd:"Người sống bảy mươi từ xưa đã hiếm, ông năm nay tám mươi tuổi, thân thể còn rất cứng cáp.",cat:"cuoc-song",hv:"Nhân Hoạt Thất Thập Cổ Lai Hy"},

{h:"人心换人心,八两换半斤",p:"rén xīn huàn rén xīn, bā liǎng huàn bàn jīn",d:"Người đổi lòng người, tám lượng đổi nửa cân.",g:"Lòng tin và sự đối xử nên công bằng.",c:"人心换人心,八两换半斤,你对别人真诚,别人也会对你好.",cp:"rén xīn huàn rén xīn , bā liǎng huàn bàn jīn , nǐ duì bié rén zhēn chéng , bié rén yě huì duì nǐ hǎo .",cd:"Lòng người đổi lòng người, tám lạng đổi nửa cân, bạn chân thành với người khác, người khác cũng sẽ tốt với bạn.",cat:"doi-nhan-xu-the",hv:"Nhân Tâm Hoán Nhân Tâm, Bát Lượng Hoán Bán Cân"},

// ===== STATE MANAGEMENT =====
const AppState = (function() {
  const state = {
    curTab: 'tucngu',
    curPage: 1,
    searchTxt: '',
    perPage: 12,
    bookmarks: new Set(),
    showPin: true,
    showMean: true,
    showEx: true,
    sideOpen: true,
    catFilter: null
  };

  return {
    get: (key) => state[key],
    set: (key, value) => { state[key] = value; },
    getState: () => ({ ...state }),
    updateState: (updates) => { Object.assign(state, updates); },
    initBookmarks: (saved) => { 
      if (saved) {
        try { state.bookmarks = new Set(JSON.parse(saved)); } 
        catch (e) { state.bookmarks = new Set(); }
      }
    },
    saveBookmarks: () => { 
      localStorage.setItem('bookmarks', JSON.stringify([...state.bookmarks])); 
    }
  };
})();

// ===== HELPERS =====
function $(id){return document.getElementById(id)}
function getData(){return AppState.get('curTab')==='tucngu'?tD:hD}
function getFiltered(){
var d=getData(),t=AppState.get('searchTxt').toLowerCase().trim();
var catFilter = AppState.get('catFilter');
if(catFilter)return catFilter;
if(!t)return d;
return d.filter(function(x){
return (x.h&&x.h.toLowerCase().indexOf(t)>-1)||
(x.p&&x.p.toLowerCase().indexOf(t)>-1)||
(x.d&&x.d.toLowerCase().indexOf(t)>-1)||
(x.g&&x.g.toLowerCase().indexOf(t)>-1)||
(x.c&&x.c.toLowerCase().indexOf(t)>-1)||
(x.cd&&x.cd.toLowerCase().indexOf(t)>-1)||
(x.hv&&x.hv.toLowerCase().indexOf(t)>-1)
});
}
function totalPages(){var n=getFiltered().length;return Math.max(1,Math.ceil(n/AppState.get('perPage')))}
function getPageItems(){var d=getFiltered(),s=(AppState.get('curPage')-1)*AppState.get('perPage');return d.slice(s,s+AppState.get('perPage'))}
function escHtml(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function isBM(h){return AppState.get('bookmarks').has(h)}

// ===== RENDER =====
function renderGrid(){
// Bảo vệ phân trang - đảm bảo curPage không vượt quá totalPages()
AppState.set('curPage', Math.min(AppState.get('curPage'), totalPages()));
var items=getPageItems(),grid=$('iGrid');
if(items.length===0){
grid.innerHTML='<div class="es"><span><i class="bi bi-search"></i></span><p>Không tìm thấy thành ngữ phù hợp</p></div>';
$('bPag').innerHTML='';
return;
}
var html='';
for(var i=0;i<items.length;i++){
var x=items[i],n=(AppState.get('curPage')-1)*AppState.get('perPage')+i+1;
html+='<div class="ic" data-idx="'+i+'">';
html+='<div class="ch2"><div class="ch3">'+escHtml(x.h)+'</div><div class="ca">';
html+='<button class="ib spk" data-idx="'+i+'" title="Phát âm"><i class="bi bi-volume-up"></i></button>';
html+='<button class="ib bmk'+(isBM(x.h)?' bm':'')+'" data-idx="'+i+'" title="Đánh dấu"><i class="bi bi-heart"></i></button></div></div>';
if(x.hv)html+='<div class="chv">'+escHtml(x.hv)+'</div>';
if(AppState.get('showPin'))html+='<div class="cp">'+escHtml(x.p)+'</div>';
if(AppState.get('showMean')){html+='<div class="cd">'+escHtml(x.d)+'</div>';html+='<div class="cg">'+escHtml(x.g)+'</div>'}
if(AppState.get('showEx')&&x.c){
html+='<div class="cv">';
html+='<div class="cc">'+escHtml(x.c)+'</div>';
if(x.cp)html+='<div class="cp2">'+escHtml(x.cp)+'</div>';
if(x.cd)html+='<div class="cd2">'+escHtml(x.cd)+'</div>';
html+='</div>';
}
html+='<div class="cf2"><span class="ci">#'+n+'</span><span class="cm">Nhấn để xem chi tiết <i class="bi bi-arrow-right"></i></span></div></div>';
}
grid.innerHTML=html;
renderBP();
attachCardEvents();
}

function renderBP(){
var tp=totalPages(),bp=$('bPag');
if(tp<=1){bp.innerHTML='';return}
var h='<button class="pb" id="pgPrev"><i class="bi bi-chevron-left"></i> Trang trước</button>';
h+='<div class="pds">';
for(var i=1;i<=tp;i++){h+='<button class="pg-num pd'+(i===AppState.get('curPage')?' a':'')+'" data-page="'+i+'">'+i+'</button>'}
h+='</div>';
h+='<button class="pb" id="pgNext">Trang sau <i class="bi bi-chevron-right"></i></button>';
bp.innerHTML=h;
attachPageEvents();
}

// UI Update functions - chia nhỏ từ updateUI()
function updatePageTitle(){
var tabNames={tucngu:'Tục Ngữ',thanhngu:'Thành Ngữ'};
$('secTitle').textContent=tabNames[AppState.get('curTab')];
}

function updateCounts(){
var d=getData();
$('itemBadge').textContent=d.length+' mục';
$('tCount').textContent=d.length+' thành ngữ';
}

function updatePagination(){
var tp=totalPages();
$('pageInfo').textContent='Trang '+AppState.get('curPage')+' / '+tp;
$('btnPrev').disabled=(AppState.get('curPage')===1);
$('btnNext').disabled=(AppState.get('curPage')===tp);
}

function updateUI(){
updatePageTitle();
updateCounts();
updatePagination();
}

function renderBM(){
var bl=$('bmList'),co=$('bmCount');
var bookmarks = AppState.get('bookmarks');
co.textContent=bookmarks.size;
if(bookmarks.size===0){
bl.innerHTML='<p class="no-bookmarks">Chưa có thành ngữ nào được đánh dấu</p>';
return;
}
var h='';
bookmarks.forEach(function(x){
var sx=escHtml(x);
h+='<div class="bm-item" data-bm="'+sx+'"><span class="t">'+sx+'</span>';
h+='<button class="x" data-delbm="'+sx+'"><i class="bi bi-x"></i></button></div>'
});
bl.innerHTML=h;
attachBMEvents();
}

// ===== EVENT HANDLERS =====
function attachCardEvents(){
document.querySelectorAll('.ic').forEach(function(card){
card.addEventListener('click',function(e){
if(e.target.closest('.ib'))return;
var idx=parseInt(this.getAttribute('data-idx'));
showDetail(idx);
});
});
document.querySelectorAll('.ib.spk').forEach(function(btn){
btn.addEventListener('click',function(e){
e.stopPropagation();
var idx=parseInt(this.getAttribute('data-idx'));
var d=getPageItems();
if(d[idx]&&window.speechSynthesis){
var u=new SpeechSynthesisUtterance(d[idx].h);
u.lang='zh-CN';u.rate=0.8;
window.speechSynthesis.speak(u);
}
});
});
document.querySelectorAll('.ib.bmk').forEach(function(btn){
btn.addEventListener('click',function(e){
e.stopPropagation();
var idx=parseInt(this.getAttribute('data-idx'));
var d=getPageItems();
if(!d[idx])return;
var h=d[idx].h;
var bookmarks = AppState.get('bookmarks');
if(bookmarks.has(h))bookmarks.delete(h);else bookmarks.add(h);
AppState.saveBookmarks();
this.classList.toggle('bm');
renderBM();
});
});
}

function attachPageEvents(){
var pp=$('pgPrev'),pn=$('pgNext');
if(pp)pp.addEventListener('click',function(){if(AppState.get('curPage')>1){AppState.set('curPage', AppState.get('curPage')-1);updateUI();renderGrid()}});
if(pn)pn.addEventListener('click',function(){if(AppState.get('curPage')<totalPages()){AppState.set('curPage', AppState.get('curPage')+1);updateUI();renderGrid()}});
document.querySelectorAll('.pg-num').forEach(function(btn){
btn.addEventListener('click',function(){
var page = parseInt(this.getAttribute('data-page'));
AppState.set('curPage', Math.min(page, totalPages()));
updateUI();renderGrid();
});
});
}

function attachBMEvents(){
document.querySelectorAll('.bm-item').forEach(function(item){
item.addEventListener('click',function(e){
if(e.target.closest('.x'))return;
var h=this.getAttribute('data-bm');
if(h){$('sInput').value=h;AppState.updateState({searchTxt: h, curPage: 1});$('cBtn').style.display='block';backToList();updateUI();renderGrid()}
});
});
document.querySelectorAll('.x[data-delbm]').forEach(function(btn){
btn.addEventListener('click',function(e){
e.stopPropagation();
var h=this.getAttribute('data-delbm');
if(h){var bookmarks = AppState.get('bookmarks'); bookmarks.delete(h); AppState.saveBookmarks(); renderBM();renderGrid()}
});
});
}

function showDetail(i){
var d=getPageItems(),x=d[i];
if(!x)return;
var h='';
h+='<div class="dh2"><div class="dht">'+escHtml(x.h)+'</div><div class="da">';
h+='<button class="ab" id="dSpk" title="Phát âm"><i class="bi bi-volume-up"></i></button>';
h+='<button class="ab'+(isBM(x.h)?' bm2':'')+'" id="dBmk" title="Đánh dấu"><i class="bi bi-heart"></i></button></div></div>';
if(x.hv)h+='<div class="dhv">'+escHtml(x.hv)+'</div>';
if(AppState.get('showPin'))h+='<div class="dp">'+escHtml(x.p)+'</div>';
if(AppState.get('showMean')){h+='<div class="ds"><h3><i class="bi bi-chat-quote"></i> Dịch nghĩa</h3><p>'+escHtml(x.d)+'</p></div>';h+='<div class="ds"><h3><i class="bi bi-lightbulb"></i> Giải thích</h3><p>'+escHtml(x.g)+'</p></div>'}
if(AppState.get('showEx')&&x.c){
h+='<div class="ds ex"><h3><i class="bi bi-pencil-square"></i> Ví dụ / Câu chuyện</h3>';
h+='<div class="cv" style="margin-top:10px">';
h+='<div class="cc">'+escHtml(x.c)+'</div>';
if(x.cp)h+='<div class="cp2">'+escHtml(x.cp)+'</div>';
if(x.cd)h+='<div class="cd2">'+escHtml(x.cd)+'</div>';
h+='</div></div>';
}
$('dCard').innerHTML=h;
$('lView').classList.add('hidden');
$('dView').classList.add('active');
$('mContent').scrollTop=0;

var spkBtn=$('dSpk'),bmkBtn=$('dBmk');
if(spkBtn)spkBtn.addEventListener('click',function(){
if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(x.h);u.lang='zh-CN';u.rate=0.8;window.speechSynthesis.speak(u)}
});
if(bmkBtn)bmkBtn.addEventListener('click',function(){
var bookmarks = AppState.get('bookmarks');
if(bookmarks.has(x.h))bookmarks.delete(x.h);else bookmarks.add(x.h);
AppState.saveBookmarks();
this.classList.toggle('bm2');
renderBM();
});
}

function backToList(){
$('lView').classList.remove('hidden');
$('dView').classList.remove('active');
}

// ===== TAB / TOOL / SEARCH =====
function switchTab(t){
AppState.updateState({curTab: t, curPage: 1, searchTxt: '', catFilter: null});
$('sInput').value='';
$('navTn').className='nav-item'+(t==='tucngu'?' active':'');
$('navThn').className='nav-item'+(t==='thanhngu'?' active':'');
updateUI();renderGrid();
// Bảo vệ phân trang
AppState.set('curPage', Math.min(AppState.get('curPage'), totalPages()));
}
function toggleSidebar(){var isOpen = !AppState.get('sideOpen'); AppState.set('sideOpen', isOpen);$('sBar').style.display=isOpen?'flex':'none'}
function toggleTool(t){
if(t==='pinyin'){var show = !AppState.get('showPin'); AppState.set('showPin', show);$('btnP').className='tool-btn'+(show?' on':'')}
else if(t==='meaning'){var show = !AppState.get('showMean'); AppState.set('showMean', show);$('btnM').className='tool-btn'+(show?' on':'')}
else if(t==='example'){var show = !AppState.get('showEx'); AppState.set('showEx', show);$('btnE').className='tool-btn'+(show?' on':'')}
renderGrid();
}
function handleSearch(){
AppState.updateState({searchTxt: $('sInput').value, catFilter: null, curPage: 1});
document.querySelectorAll('.nav-item[data-cat]').forEach(function(b){b.classList.remove('active')});
$('cBtn').style.display=AppState.get('searchTxt')?'block':'none';
updateUI();renderGrid();
// Bảo vệ phân trang
AppState.set('curPage', Math.min(AppState.get('curPage'), totalPages()));
}
function clearSearch(){
$('sInput').value='';
AppState.updateState({searchTxt: '', catFilter: null, curPage: 1});
document.querySelectorAll('.nav-item[data-cat]').forEach(function(b){b.classList.remove('active')});
$('cBtn').style.display='none';
updateUI();renderGrid();
// Bảo vệ phân trang
AppState.set('curPage', Math.min(AppState.get('curPage'), totalPages()));
}

// ===== SIDEBAR NAVIGATION =====
var accOpen=false;
$('accToggle').addEventListener('click',function(e){if(e.target.closest('.acc-content'))return;accOpen=!accOpen;var c=$('accContent'),i=$('accIcon');if(accOpen){c.style.display='block';i.style.transform='rotate(180deg)'}else{c.style.display='none';i.style.transform='rotate(0deg)'}});

function filterCategory(cat){AppState.updateState({curPage: 1, searchTxt: '', catFilter: null});$('sInput').value='';$('cBtn').style.display='none';var d=getData();var hasCat=d.some(function(x){return x.cat===cat});if(hasCat){var fd=d.filter(function(x){return x.cat===cat});AppState.set('catFilter', fd);$('itemBadge').textContent=fd.length+' mục'}else{AppState.set('catFilter', null);$('itemBadge').textContent=d.length+' mục'}updateUI();renderGrid();}

document.querySelectorAll('.nav-item[data-cat]').forEach(function(btn){btn.addEventListener('click',function(){var cat=this.getAttribute('data-cat');if(cat)filterCategory(cat);document.querySelectorAll('.nav-item[data-cat]').forEach(function(b){b.classList.remove('active')});this.classList.add('active');})});

// ===== INIT =====
$('mBtn').addEventListener('click',toggleSidebar);
$('navTn').addEventListener('click',function(){switchTab('tucngu');document.querySelectorAll('.nav-item[data-cat]').forEach(function(b){b.classList.remove('active')})});
$('navThn').addEventListener('click',function(){switchTab('thanhngu');document.querySelectorAll('.nav-item[data-cat]').forEach(function(b){b.classList.remove('active')})});

$('sInput').addEventListener('input',handleSearch);
$('cBtn').addEventListener('click',clearSearch);
$('btnPrev').addEventListener('click',function(){if(AppState.get('curPage')>1){AppState.set('curPage', AppState.get('curPage')-1);updateUI();renderGrid()}});
$('btnNext').addEventListener('click',function(){if(AppState.get('curPage')<totalPages()){AppState.set('curPage', AppState.get('curPage')+1);updateUI();renderGrid()}});
$('btnBack').addEventListener('click',backToList);
$('mContent').addEventListener('scroll',function(){var st=this.scrollTop;$('sTop').style.display=st>300?'flex':'none'});
$('sTop').addEventListener('click',function(){$('mContent').scrollTo({top:0,behavior:'smooth'})});

// Initialize bookmarks from localStorage
var saved=localStorage.getItem('bookmarks');
AppState.initBookmarks(saved);

// Đồng bộ bookmark giữa các tabs
window.addEventListener('storage', function(e) {
  if (e.key === 'bookmarks') {
    AppState.initBookmarks(e.newValue);
    updateUI();
    renderGrid();
  }
});

// Start - Đồng bộ trạng thái ban đầu
$('navTn').className='nav-item'+(AppState.get('curTab')==='tucngu'?' active':'');
$('navThn').className='nav-item'+(AppState.get('curTab')==='thanhngu'?' active':'');
updateUI();
renderGrid();
</script>
</body>
</html>
