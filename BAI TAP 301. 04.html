<script>
const exercises = [
            // 0: INTRO
            {
                type: 'intro',
                title: 'BÀI 04 - 您贵姓',
                content: `
                    <div class="text-center" style="padding: 40px 20px;">
                        <div style="font-size: 52px; color: var(--purple); margin-bottom: 20px; font-family: SimHei; font-weight: bold; text-shadow: 2px 2px 4px rgba(255,255,255,0.9);">您贵姓</div>
                        <h1 style="font-size: 28px; margin-bottom: 15px; color: var(--purple-dark); text-shadow: 1px 1px 2px rgba(255,255,255,0.9);">BÀI 04: NGÀI HỌ GÌ</h1>
                        <p style="font-size: 16px; color: var(--gray-dark); max-width: 500px; margin: 0 auto; line-height: 1.8; text-shadow: 1px 1px 2px rgba(255,255,255,0.9);">
                            GIA SƯ HOA NGỮ TÂN AN<br>
                            
                        </p>
                        <button class="btn btn-success" onclick="nextSlide()" style="margin-top: 30px; padding: 12px 30px; font-size: 16px;">Bắt đầu học →</button>
                    </div>
                `
            },

            // 1: Phiên âm cho những từ dưới đây (trang 2-3)
            // 9 từ: 姓Xìng 不Bù 很Hěn 叫Jiào 太Tài 都Dōu 是Shì 高兴Gāoxìng 也Yě
            {
                type: 'pinyin-input',
                title: 'Phiên âm cho những từ dưới đây',
                data: [
                    { hanzi: '姓', answer: 'Xìng', options: ['Xìng', 'Xíng', 'Xǐng', 'Xīng'] },
                    { hanzi: '不', answer: 'Bù', options: ['Bù', 'Bú', 'Bǔ', 'Bū'] },
                    { hanzi: '很', answer: 'Hěn', options: ['Hěn', 'Hén', 'Hèn', 'Hēn'] },
                    { hanzi: '叫', answer: 'Jiào', options: ['Jiào', 'Jiǎo', 'Jiāo', 'Jiáo'] },
                    { hanzi: '太', answer: 'Tài', options: ['Tài', 'Tái', 'Tǎi', 'Tāi'] },
                    { hanzi: '都', answer: 'Dōu', options: ['Dōu', 'Dóu', 'Dǒu', 'Dòu'] },
                    { hanzi: '是', answer: 'Shì', options: ['Shì', 'Shí', 'Shǐ', 'Shī'] },
                    { hanzi: '高兴', answer: 'Gāoxìng', options: ['Gāoxìng', 'Gáoxìng', 'Gāoxíng', 'Gǎoxìng'] },
                    { hanzi: '也', answer: 'Yě', options: ['Yě', 'Yé', 'Yè', 'Yē'] }
                ]
            },

            // 2: Phiên dịch cho những từ dưới đây (nguồn BAI 04.docx)
            {
                type: 'word-translate',
                title: 'Phiên dịch cho những từ dưới đây',
                data: [
                    { hanzi: '姓', pinyin: 'Xìng', sample: 'họ / mang họ', accepted: ['họ','mang họ'] },
                    { hanzi: '不', pinyin: 'Bù', sample: 'không', accepted: ['không'] },
                    { hanzi: '很', pinyin: 'Hěn', sample: 'rất', accepted: ['rất','lắm'] },
                    { hanzi: '叫', pinyin: 'Jiào', sample: 'gọi / tên là', accepted: ['gọi','gọi là','tên là'] },
                    { hanzi: '太', pinyin: 'Tài', sample: 'quá / rất', accepted: ['quá','rất'] },
                    { hanzi: '都', pinyin: 'Dōu', sample: 'đều', accepted: ['đều','tất cả đều'] },
                    { hanzi: '是', pinyin: 'Shì', sample: 'là', accepted: ['là'] },
                    { hanzi: '高兴', pinyin: 'Gāoxìng', sample: 'vui / vui vẻ', accepted: ['vui','vui vẻ'] },
                    { hanzi: '也', pinyin: 'Yě', sample: 'cũng', accepted: ['cũng'] }
                ]

function movePointerGhost(x,y){if(pointerArrange?.ghost){pointerArrange.ghost.style.left=x+'px';pointerArrange.ghost.style.top=y+'px'}}
function pointerArrangeMove(event){if(!pointerArrange)return;event.preventDefault();movePointerGhost(event.clientX,event.clientY);document.querySelectorAll('.arrange-answer-zone.drag-over,.arrange-bank-zone.drag-over').forEach(el=>el.classList.remove('drag-over'));const el=document.elementFromPoint(event.clientX,event.clientY);const zone=el?.closest?.('.arrange-answer-zone,.arrange-bank-zone');if(zone&&Number(zone.dataset.arrangeI)===pointerArrange.i)zone.classList.add('drag-over')}
function pointerInsertPos(zone,x,y){const items=[...zone.querySelectorAll('.answer-token')].filter(el=>Number(el.dataset.tokenJ)!==pointerArrange?.j);for(let k=0;k<items.length;k++){const r=items[k].getBoundingClientRect(),midY=r.top+r.height/2,midX=r.left+r.width/2;if(y<midY-4||(y<=r.bottom&&x<midX))return k}return items.length}
function pointerArrangeEnd(event){if(!pointerArrange)return;event.preventDefault();const p=pointerArrange;document.removeEventListener('pointermove',pointerArrangeMove);p.ghost?.remove();document.querySelectorAll('.arrange-answer-zone.drag-over,.arrange-bank-zone.drag-over').forEach(el=>el.classList.remove('drag-over'));const el=document.elementFromPoint(event.clientX,event.clientY);const answer=el?.closest?.('.arrange-answer-zone'),bank=el?.closest?.('.arrange-bank-zone');pointerArrange=null;if(answer&&Number(answer.dataset.arrangeI)===p.i){const pos=pointerInsertPos(answer,event.clientX,event.clientY);moveArrangeToken(p.i,p.j,'answer',pos)}else if(bank&&Number(bank.dataset.arrangeI)===p.i){moveArrangeToken(p.i,p.j,'bank')}}
function arrangeValue(i){return (state.answers[key(4,i)]||'').split('|||').filter(Boolean).map(x=>x.replace(/#\d+$/,'')).join('')}
function arrangeCardClass(i,ans){if(!state.checked[key(4,i)])return 'question-card';return 'question-card checked '+(norm(arrangeValue(i))===norm(ans)?'correct':'wrong')}
function checkArrange(i,ans){state.checked[key(4,i)]=true;save();renderSection();renderNav()}
function arrangeFeedback(i,ans){const c=state.checked[key(4,i)];if(!c)return '<div class="feedback"></div>';const ok=norm(arrangeValue(i))===norm(ans);return `<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div>${ok?'':`<div>Đáp án tham khảo: <span class="correct-answer">${esc(ans)}</span></div>`}<div><b>Giải thích:</b> ${explain(4,i)}</div></div>`}
function clearAnswer(sec,i){delete state.answers[key(sec,i)];delete state.checked[key(sec,i)];save();renderSection();renderNav()}
function dialogue4Items(){return exercises[5].data.filter(it=>it.options)}
function dialogue4Ok(i){const it=dialogue4Items()[i],v=state.answers[key(5,i)]||'';return it&&isAccepted(5,i,v,it.answer)}
function d4input(i,w=260){return `<input class="input-text" style="display:inline-block;max-width:${w}px;width:min(${w}px,70vw);margin:2px 4px" value="${esc(state.answers[key(5,i)]||'')}" oninput="setTextAnswer(5,${i},this.value)">`}
function dialogue4GroupFeedback(indices){if(!indices.some(i=>state.checked[key(5,i)]))return '<div class="feedback"></div>';const all=indices.every(i=>dialogue4Ok(i));let body=indices.map(i=>{const it=dialogue4Items()[i],ok=dialogue4Ok(i);return `<div style="margin:6px 0"><b>${i+1}.</b> ${ok?'✓': '△'} Đáp án tham khảo: <span class="correct-answer">${esc(it.answer)}</span><br><b>Giải thích:</b> ${explain(5,[0,2,4,6,8,9,11,12][i])}</div>`}).join('');return `<div class="feedback show ${all?'correct':'sample'}">${body}</div>`}
function checkDialogue4(indices){indices.forEach(i=>state.checked[key(5,i)]=true);save();renderSection();renderNav()}
function renderDialogue(ex){let h=`<div class="section-instruction"><strong>Hoàn thành đối thoại.</strong></div>`;
 h+=`<div class="question-card"><div class="qhead"><div class="qnum">1</div><div class="qtext dialogue-block"><div>A：${d4input(0)}？</div><div>B：他姓王。</div><div>A：${d4input(1)}？</div><div>B：不是老师，是大夫。</div></div></div><div class="check-row"><button class="check-btn" onclick="checkDialogue4([0,1])">Kiểm tra đoạn</button></div>${dialogue4GroupFeedback([0,1])}</div>`;
 h+=`<div class="question-card"><div class="qhead"><div class="qnum">2</div><div class="qtext dialogue-block"><div>A：${d4input(2)}？ <span class="dialogue-hint">（姐姐）</span></div><div>B：她身体很好。</div><div>A：${d4input(3)}？</div><div>B：她叫兰兰。</div></div></div><div class="check-row"><button class="check-btn" onclick="checkDialogue4([2,3])">Kiểm tra đoạn</button></div>${dialogue4GroupFeedback([2,3])}</div>`;
 h+=`<div class="question-card"><div class="qhead"><div class="qnum">3</div><div class="qtext dialogue-block"><div>A：${d4input(4)}？</div><div>B：我不认识那个人。${d4input(5,150)}？ <span class="dialogue-hint">（呢）</span></div><div>A：我也不认识。</div></div></div><div class="check-row"><button class="check-btn" onclick="checkDialogue4([4,5])">Kiểm tra đoạn</button></div>${dialogue4GroupFeedback([4,5])}</div>`;
 h+=`<div class="question-card"><div class="qhead"><div class="qnum">4</div><div class="qtext dialogue-block"><div>A：你 ${d4input(6)}？ <span class="dialogue-hint">（弟弟）</span></div><div>B：我认识你弟弟。${d4input(7)}？</div><div>A：他今天不来，明天来。</div></div></div><div class="check-row"><button class="check-btn" onclick="checkDialogue4([6,7])">Kiểm tra đoạn</button></div>${dialogue4GroupFeedback([6,7])}</div>`;
 return h}
function renderTransform(ex,sec,label){let h=`<div class="section-instruction"><strong>${label}</strong></div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(sec,i)]||'',c=state.checked[key(sec,i)],ok=isAccepted(sec,i,v,it.answer);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.original)}</div></div><input class="input-text" value="${esc(v)}" oninput="setTextAnswer(${sec},${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(${sec},${i},'${esc(it.answer)}')">Kiểm tra câu</button></div>${feedbackHtml(sec,i,it.answer)}</div>`});return h}

function renderErrorCorrect(ex){
  let h=`<div class="section-instruction"><strong>Sửa câu sai.</strong></div>`;
  ex.data.forEach((it,i)=>{
    const val=state.answers[key(7,i)]||'';
    const checked=!!state.checked[key(7,i)];
    const ok=isAccepted(7,i,val,it.answer);
    h+=`<div class="question-card ${checked?'checked '+(ok?'correct':'wrong'):''}">
      <div class="qhead">
        <div class="qnum">${i+1}</div>
        <div class="qtext"><div class="wrong-sentence">${esc(it.original.replace(/^\d+\.\s*/,''))}</div></div>
      </div>
      <input class="input-text" value="${esc(val)}" oninput="setTextAnswer(7,${i},this.value)">
      <div class="check-row"><button class="check-btn" onclick="checkErrorCorrect(${i})">Kiểm tra câu</button></div>
      ${errorCorrectFeedback(i,it)}
    </div>`;
  });
  return h;
}
function checkErrorCorrect(i){state.checked[key(7,i)]=true;save();renderSection();renderNav()}
function errorCorrectFeedback(i,it){
  if(!state.checked[key(7,i)])return `<div class="feedback" id="fb-7-${i}"></div>`;
  const val=state.answers[key(7,i)]||'';
  const ok=isAccepted(7,i,val,it.answer);
  return `<div class="feedback show ${ok?'correct':'sample'}" id="fb-7-${i}">
    <div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div>
    <div><b>Lỗi sai:</b> ${esc(it.error)}</div>
    <div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span></div>
    <div><b>Vì sao sửa như vậy:</b> ${esc(it.fix)}</div>
  </div>`;
}
function hanzi8Ok(i){const it=exercises[8].data[i];return norm(state.answers[key(8,i)]||'')===norm(it.hanzi)}
function renderHanzi(ex){const pieces=[
 ['我 ',0,' 王兰，她是 ',1,'。认识她我 ',2,' ',3,'。她爸爸，妈妈 ',4,' 都很好，',5,' ',6,' 很忙。']
 ][0];let h=`<div class="section-instruction"><strong>Viết chữ Hán dựa theo phiên âm.</strong></div><div class="question-card"><div class="passage" style="line-height:2.5">`;pieces.forEach(p=>{if(typeof p==='number'){const it=ex.data[p],v=state.answers[key(8,p)]||'';h+=`<span style="display:inline-flex;align-items:center;gap:4px"><span class="muted">(${esc(it.pinyin)})</span><input class="input-text" style="display:inline-block;width:110px;min-width:75px;padding:5px 7px" value="${esc(v)}" oninput="setTextAnswer(8,${p},this.value)"></span>`}else h+=esc(p)});h+='</div></div>';ex.data.forEach((it,i)=>{const c=state.checked[key(8,i)],ok=hanzi8Ok(i);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.pinyin)}</b></div></div><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i},'${esc(it.hanzi)}')">Kiểm tra câu</button></div>${feedbackHtml(8,i,it.hanzi)}</div>`});return h}
function setTextAnswer(sec,i,v){state.answers[key(sec,i)]=v;delete state.checked[key(sec,i)];save();renderNav()}
function renderChar(){const items=[{p:'Ma',ch:'吗'},{p:'Ne',ch:'呢'},{p:'Jiào',ch:'叫'},{p:'Hào',ch:'号'},{p:'Míng',ch:'名'}];let h=`<div class="section-instruction"><strong>Viết những chữ Hán có chứa thành phần 口.</strong></div>`;items.forEach((it,i)=>{const val=state.answers[key(9,i)]||'';h+=`<div class="${cardClass(9,i,it.ch)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.p)}</b></div></div><input class="input-text" value="${esc(val)}" maxlength="1" oninput="setTextAnswer(9,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i},'${it.ch}')">Kiểm tra câu</button></div>${feedbackHtml(9,i,it.ch)}</div>`});return h}
function translation10Ok(i){const it=exercises[10].data[i],v=state.answers[key(10,i)]||'';return (it.accepted||[it.cn]).some(a=>norm(a)===norm(v))}
function renderTranslation(ex){let h=`<div class="section-instruction"><strong>Luyện dịch Việt → Hoa.</strong></div>`;ex.data.forEach((it,i)=>{const val=state.answers[key(10,i)]||'',c=state.checked[key(10,i)],ok=translation10Ok(i);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setTextAnswer(10,${i},this.value)">${esc(val)}</textarea><div class="check-row"><button class="check-btn" onclick="checkTranslation(${i})">Đối chiếu đáp án</button></div>${translationFeedback(i,it.cn)}</div>`});return h}
function checkTranslation(i){state.checked[key(10,i)]=true;save();renderSection();renderNav()}
function translationFeedback(i,ans){if(!state.checked[key(10,i)])return '<div class="feedback"></div>';const ok=translation10Ok(i);return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div>Đáp án tham khảo: <span class="correct-answer">${esc(ans)}</span></div><div><b>Giải thích:</b> ${explain(10,i)}</div></div>`}
function renderSection(){const sec=state.section,ex=exercises[sec],names=sectionNames();document.getElementById('sectionBadge').textContent='Bài '+sec;document.getElementById('sectionTitle').textContent=names[sec];let h='';if(sec===1)h=renderPinyin(ex);else if(sec===2)h=renderWordTranslate(ex);else if(sec===3)h=renderFill(ex);else if(sec===4)h=renderArrange(ex);else if(sec===5)h=renderDialogue(ex);else if(sec===6)h=renderTransform(ex,6,'Đổi những câu bên dưới thành câu hỏi.');else if(sec===7)h=renderErrorCorrect(ex);else if(sec===8)h=renderHanzi(ex);else if(sec===9)h=renderChar();else if(sec===10)h=renderTranslation(ex);h+=`<div class="navigation-buttons"><button class="nav-btn" onclick="goSection(${Math.max(1,sec-1)})" ${sec===1?'disabled':''}>上一题 · Bài trước</button><button class="nav-btn next" onclick="goSection(${Math.min(10,sec+1)})" ${sec===10?'disabled':''}>下一题 · Bài sau</button></div>`;document.getElementById('contentBody').innerHTML=h;window.scrollTo(0,0)}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;const tx=document.getElementById('progressText'),fill=document.getElementById('progressFill');if(tx)tx.textContent=`${a}/${t}`;if(fill)fill.style.width=p+'%'}
function openAnswerCard(){let h='';const names=sectionNames();for(let s=1;s<=10;s++){const a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${esc(names[s])}<br><span class="muted">${a}/${t} đã làm</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restartExam(){if(!confirm('Xóa toàn bộ đáp án và làm lại từ đầu?'))return;try{localStorage.removeItem(STORE)}catch(e){}state.section=1;state.answers={};state.checked={};state.startAt=Date.now();state.fontLarge=false;renderAll()}
function submitExam(){let correct=0,objective=0,answered=totalAnswered(),total=totalCount();
 exercises[1].data.forEach((it,i)=>{objective++;if(isAccepted(1,i,state.answers[key(1,i)]||'',it.answer))correct++});
 fillBlankItems().forEach((it,i)=>{objective++;if(fillOk(i))correct++});
 exercises[4].data.forEach((it,i)=>{objective++;if(norm(arrangeValue(i))===norm(it.answer))correct++});
 dialogue4Items().forEach((it,i)=>{objective++;if(dialogue4Ok(i))correct++});
 exercises[6].data.forEach((it,i)=>{objective++;if(isAccepted(6,i,state.answers[key(6,i)]||'',it.answer))correct++});
 exercises[7].data.forEach((it,i)=>{objective++;if(isAccepted(7,i,state.answers[key(7,i)]||'',it.answer))correct++});
 exercises[8].data.forEach((it,i)=>{objective++;if(hanzi8Ok(i))correct++});
 ['吗','呢','叫','号','名'].forEach((it,i)=>{objective++;if(norm(state.answers[key(9,i)]||'')===norm(it))correct++});
 const pct=objective?Math.round(correct/objective*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${objective}</div><div style="text-align:center;font-weight:700">Kết quả phần có đáp án xác định: ${pct}%</div><div style="margin-top:15px;line-height:1.7"><b>Tiến độ toàn bài:</b> ${answered}/${total}.<br><b>Bài 2 và Bài 10:</b> là phần đối chiếu đáp án tham khảo; cách diễn đạt khác mẫu có thể vẫn đúng.</div>`;document.getElementById('resultModal').classList.add('show')}
function tick(){const e=Math.floor((Date.now()-(state.startAt||Date.now()))/1000),m=Math.floor(e/60),s=e%60;document.getElementById('timerText').textContent=`Thời gian ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('timerProgress').style.width=Math.min(100,(e%3600)/36)+'%'}
const NOTE_STORE='BAI301_BAI04_NOTES_V2_FULL_SOURCE';
let noteSaveTimer=null;
function openNoteEditor(){
  const overlay=document.getElementById('note-editor-overlay'),editor=document.getElementById('rich-editor');
  if(!overlay||!editor)return;
  try{const saved=localStorage.getItem(NOTE_STORE);if(saved!==null)editor.innerHTML=saved}catch(e){}
  overlay.classList.add('show');document.body.classList.add('note-open');editor.focus();
}
function closeNoteEditor(){
  const overlay=document.getElementById('note-editor-overlay');
  if(overlay)overlay.classList.remove('show');document.body.classList.remove('note-open');
}
function noteCommand(command,value=null){
  document.execCommand(command,false,value);document.getElementById('rich-editor')?.focus();scheduleNoteAutosave();
}
function scheduleNoteAutosave(){
  clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>saveNotes(false),350);
}
function saveNotes(closeAfter=false){
  const editor=document.getElementById('rich-editor');if(!editor)return;
  try{localStorage.setItem(NOTE_STORE,editor.innerHTML)}catch(e){}
  if(closeAfter)closeNoteEditor();
}
function clearNoteEditor(){
  if(!confirm('Xóa toàn bộ ghi chú?'))return;
  const editor=document.getElementById('rich-editor');if(editor){editor.innerHTML='';editor.focus();scheduleNoteAutosave()}
}
document.getElementById('rich-editor')?.addEventListener('input',scheduleNoteAutosave);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('note-editor-overlay')?.classList.contains('show'))closeNoteEditor()});
restoreProgress(false);renderAll();setInterval(tick,1000);tick();
</script>
