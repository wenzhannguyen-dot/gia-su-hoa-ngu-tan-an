</div></div><div class="check-row"><button class="check-btn" onclick="checkDialogueGroup(2)">Kiểm tra đoạn</button></div>${dialogueGroupFeedback(2)}</div>`}
function arrangeTokenId(i,j){return exercises[6].data[i].words[j]+'#'+j}
function arrangeSelected(i){return String(state.answers[key(6,i)]||'').split('|||').filter(Boolean)}
function setArrangeSelected(i,a){state.answers[key(6,i)]=a.join('|||');delete state.checked[key(6,i)];save();renderSection();renderNav()}
function beginArrangeDrag(event,i,j,from){window.arrangeDrag={i,j,from};event.currentTarget.classList.add('dragging');try{event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',String(j))}catch(e){}}
function endArrangeDrag(event){event?.currentTarget?.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));window.arrangeDrag=null}
function allowArrangeDrop(event,el){event.preventDefault();if(event.dataTransfer)event.dataTransfer.dropEffect='move';el?.classList.add('drag-over')}
function leaveArrangeDrop(event,el){if(!el)return;const r=el.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)el.classList.remove('drag-over')}
function moveArrangeToken(i,j,where,pos=null){let a=arrangeSelected(i),id=arrangeTokenId(i,j),old=a.indexOf(id);if(old>=0)a.splice(old,1);if(where==='answer'){let p=pos==null?a.length:Number(pos);p=Math.max(0,Math.min(Number.isFinite(p)?p:a.length,a.length));a.splice(p,0,id)}setArrangeSelected(i,a)}
function dropArrangeEnd(event,i){event.preventDefault();event.stopPropagation();event.currentTarget?.classList.remove('drag-over');const d=window.arrangeDrag;if(!d||d.i!==i)return;moveArrangeToken(i,d.j,'answer');window.arrangeDrag=null}
function dropArrangeAt(event,i,pos){event.preventDefault();event.stopPropagation();const d=window.arrangeDrag;if(!d||d.i!==i)return;let p=pos;if(d.from==='answer'){const a=arrangeSelected(i),id=arrangeTokenId(i,d.j),old=a.indexOf(id);if(old>=0&&old<pos)p=pos-1}moveArrangeToken(i,d.j,'answer',p);window.arrangeDrag=null}
function dropArrangeBank(event,i){event.preventDefault();event.stopPropagation();const d=window.arrangeDrag;if(!d||d.i!==i)return;moveArrangeToken(i,d.j,'bank');window.arrangeDrag=null}
let pointerArrange=null;function startPointerArrange(event,i,j,from){if(event.pointerType==='mouse')return;event.preventDefault();const src=event.currentTarget,ghost=src.cloneNode(true);ghost.removeAttribute('draggable');ghost.classList.add('arrange-drag-ghost');ghost.style.width=src.getBoundingClientRect().width+'px';document.body.appendChild(ghost);pointerArrange={i,j,from,ghost};movePointerGhost(event.clientX,event.clientY);document.addEventListener('pointermove',pointerArrangeMove,{passive:false});document.addEventListener('pointerup',pointerArrangeEnd,{passive:false,once:true});document.addEventListener('pointercancel',pointerArrangeEnd,{passive:false,once:true})}
function movePointerGhost(x,y){if(pointerArrange){pointerArrange.ghost.style.left=x+'px';pointerArrange.ghost.style.top=y+'px'}}
function pointerArrangeMove(event){if(!pointerArrange)return;event.preventDefault();movePointerGhost(event.clientX,event.clientY);document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));const zone=document.elementFromPoint(event.clientX,event.clientY)?.closest?.('.arrange-answer-zone,.arrange-bank-zone');if(zone&&Number(zone.dataset.arrangeI)===pointerArrange.i)zone.classList.add('drag-over')}
function pointerInsertPos(zone,x,y){const kids=[...zone.querySelectorAll('.arrange-token')];for(let i=0;i<kids.length;i++){const r=kids[i].getBoundingClientRect();if(y<r.top+r.height/2||(y<=r.bottom&&x<r.left+r.width/2))return i}return kids.length}
function pointerArrangeEnd(event){if(!pointerArrange)return;event.preventDefault();const p=pointerArrange;document.removeEventListener('pointermove',pointerArrangeMove);p.ghost?.remove();document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));const el=document.elementFromPoint(event.clientX,event.clientY),answer=el?.closest?.('.arrange-answer-zone'),bank=el?.closest?.('.arrange-bank-zone');pointerArrange=null;if(answer&&Number(answer.dataset.arrangeI)===p.i)moveArrangeToken(p.i,p.j,'answer',pointerInsertPos(answer,event.clientX,event.clientY));else if(bank&&Number(bank.dataset.arrangeI)===p.i)moveArrangeToken(p.i,p.j,'bank')}
function arrangeValue(i){return arrangeSelected(i).map(x=>x.replace(/#\d+$/,'')).join('')}
function arrangeOk(i){const v=norm(arrangeValue(i)),it=exercises[6].data[i];return it.answers.some(a=>norm(a)===v)}
function clearArrange(i){delete state.answers[key(6,i)];delete state.checked[key(6,i)];save();renderSection();renderNav()}
function renderArrange(ex){let h=`<div class="section-instruction"><strong>组词成句</strong><br>Sắp xếp từ thành câu.</div>`;ex.data.forEach((it,i)=>{const selected=arrangeSelected(i),c=state.checked[key(6,i)],ok=arrangeOk(i);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div></div><div class="arrange-answer-zone" data-arrange-i="${i}" ondragover="allowArrangeDrop(event,this)" ondragleave="leaveArrangeDrop(event,this)" ondrop="dropArrangeEnd(event,${i})">${selected.map((id,pos)=>{const j=Number((id.match(/#(\d+)$/)||[])[1]),t=it.words[j];return `<button type="button" class="token arrange-token answer-token" draggable="true" ondragstart="beginArrangeDrag(event,${i},${j},'answer')" ondragend="endArrangeDrag(event)" ondragover="allowArrangeDrop(event,this)" ondrop="dropArrangeAt(event,${i},${pos})" onpointerdown="startPointerArrange(event,${i},${j},'answer')">${esc(t)}</button>`}).join('')}</div><div class="arrange-separator"></div><div class="arrange-bank-zone" data-arrange-i="${i}" ondragover="allowArrangeDrop(event,this)" ondragleave="leaveArrangeDrop(event,this)" ondrop="dropArrangeBank(event,${i})">${it.words.map((t,j)=>selected.includes(arrangeTokenId(i,j))?'':`<button type="button" class="token arrange-token bank-token" draggable="true" ondragstart="beginArrangeDrag(event,${i},${j},'bank')" ondragend="endArrangeDrag(event)" onpointerdown="startPointerArrange(event,${i},${j},'bank')">${esc(t)}</button>`).join('')}</div><div class="check-row"><button class="check-btn" onclick="checkOne(6,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearArrange(${i})">Làm lại câu</button></div>${arrangeFeedback(i)}</div>`});return h}
function arrangeFeedback(i){if(!state.checked[key(6,i)])return '<div class="feedback"></div>';const it=exercises[6].data[i],ok=arrangeOk(i);return `<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div>${ok?'':`<div>Đáp án tham khảo: <span class="correct-answer">${esc(it.answer)}</span></div>`}<div><b>Giải thích:</b> ${esc(explanations[6][i])}</div></div>`}
function renderHanzi(ex,sec=7){let h=`<div class="section-instruction"><strong>根据拼音写出汉字</strong><br>Viết chữ Hán dựa theo phiên âm.</div>`;ex.data.forEach((it,i)=>{const c=state.checked[key(sec,i)],ok=same(sec,i,it.hanzi);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.pinyin)}</b></div></div><input class="input-text" value="${esc(state.answers[key(sec,i)]||'')}" oninput="setAnswer(${sec},${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(${sec},${i})">Kiểm tra câu</button></div>${feedback(sec,i,it.hanzi,explanations[sec][i])}</div>`});return h}
function renderRadical(ex){let h=`<div class="section-instruction"><strong>请写出含有偏旁“亻”的汉字</strong><br>Viết chữ Hán có chứa thiên bàng “亻”.</div>`;ex.data.forEach((it,i)=>{const c=state.checked[key(8,i)],ok=same(8,i,it.hanzi);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext radical-prompt">${esc(it.pinyin)}</div></div><input class="input-text" value="${esc(state.answers[key(8,i)]||'')}" oninput="setAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Kiểm tra câu</button></div>${feedback(8,i,it.hanzi,explanations[8][i])}</div>`});return h}
function translationOk(i){const it=exercises[9].data[i],v=state.answers[key(9,i)]||'';return (it.accepted||[it.cn]).some(a=>norm(a)===norm(v))}
function renderTranslation(ex){let h=`<div class="section-instruction"><strong>越汉翻译练习</strong><br>Luyện dịch Việt → Hoa.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(9,i)]||'',c=state.checked[key(9,i)],ok=translationOk(i);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAnswer(9,${i},this.value)">${esc(v)}</textarea><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Đối chiếu đáp án</button></div>${translationFeedback(i)}</div>`});return h}
function translationFeedback(i){if(!state.checked[key(9,i)])return '<div class="feedback"></div>';const it=exercises[9].data[i],ok=translationOk(i);return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div>Đáp án tham khảo: <span class="correct-answer">${esc(it.cn)}</span></div><div><b>Giải thích:</b> ${esc(explanations[9][i])}</div></div>`}
function renderSection(){const sec=state.section,ex=exercises[sec];document.getElementById('sectionBadge').textContent='Bài '+sec;document.getElementById('sectionTitle').textContent=sectionNames()[sec];let h='';if(sec===1)h=renderInitial(ex);else if(sec===2)h=renderYW(ex);else if(sec===3)h=renderPronunciation(ex);else if(sec===4)h=renderPinyinInput(ex);else if(sec===5)h=renderDialogue(ex);else if(sec===6)h=renderArrange(ex);else if(sec===7)h=renderHanzi(ex,7);else if(sec===8)h=renderRadical(ex);else if(sec===9)h=renderTranslation(ex);h+=`<div class="navigation-buttons"><button class="nav-btn" onclick="goSection(${Math.max(1,sec-1)})" ${sec===1?'disabled':''}>上一题 · Bài trước</button><button class="nav-btn next" onclick="goSection(${Math.min(9,sec+1)})" ${sec===9?'disabled':''}>下一题 · Bài sau</button></div>`;document.getElementById('contentBody').innerHTML=h;window.scrollTo(0,0)}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;document.getElementById('progressText').textContent=`${a}/${t}`;document.getElementById('progressFill').style.width=p+'%'}
function openAnswerCard(){let h='';for(let s=1;s<=9;s++){const a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br><span class="muted">${a}/${t}</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restartExam(){if(!confirm('重新答题？'))return;try{localStorage.removeItem(STORE)}catch(e){}state.section=1;state.answers={};state.checked={};state.startAt=Date.now();state.fontLarge=false;renderAll()}
function objectiveScore(){let correct=0,total=0;exercises[1].groups.forEach((g,i)=>{total++;if(initialOk(i))correct++});exercises[2].data.forEach((it,i)=>{total++;if(ywOk(i))correct++});exercises[3].data.forEach((it,i)=>{total++;if(same(3,i,it.answer))correct++});exercises[4].data.forEach((it,i)=>{total++;if(same(4,i,it.answer))correct++});exercises[5].data.forEach((it,i)=>{total++;if(dialogueOk(i))correct++});exercises[6].data.forEach((it,i)=>{total++;if(arrangeOk(i))correct++});exercises[7].data.forEach((it,i)=>{total++;if(same(7,i,it.hanzi))correct++});exercises[8].data.forEach((it,i)=>{total++;if(same(8,i,it.hanzi))correct++});return {correct,total}}
function submitExam(){const sc=objectiveScore(),pct=sc.total?Math.round(sc.correct/sc.total*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${sc.correct}/${sc.total}</div><div style="text-align:center;font-weight:700">Kết quả: ${pct}%</div><div style="margin-top:15px;line-height:1.7"><b>Tiến độ toàn bài:</b> ${totalAnswered()}/${totalCount()}.<br><b>Bài 9:</b> đối chiếu riêng với đáp án tham khảo vì câu dịch có thể có nhiều cách diễn đạt đúng.</div>`;document.getElementById('resultModal').classList.add('show')}
function tick(){const e=Math.floor((Date.now()-(state.startAt||Date.now()))/1000),m=Math.floor(e/60),ss=e%60;document.getElementById('timerText').textContent=`Thời gian ${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;document.getElementById('timerProgress').style.width=Math.min(100,(e%3600)/36)+'%'}
let noteSaveTimer=null;function openNoteEditor(){const overlay=document.getElementById('note-editor-overlay'),editor=document.getElementById('rich-editor');if(!overlay||!editor)return;try{const saved=localStorage.getItem(NOTE_STORE);if(saved!==null)editor.innerHTML=saved}catch(e){}overlay.classList.add('show');document.body.classList.add('note-open');editor.focus()}function closeNoteEditor(){document.getElementById('note-editor-overlay')?.classList.remove('show');document.body.classList.remove('note-open')}function noteCommand(cmd,val=null){document.execCommand(cmd,false,val);document.getElementById('rich-editor')?.focus();scheduleNoteAutosave()}function scheduleNoteAutosave(){clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>saveNotes(false,true),400)}function saveNotes(closeAfter=false,silent=false){const editor=document.getElementById('rich-editor');if(!editor)return;try{localStorage.setItem(NOTE_STORE,editor.innerHTML)}catch(e){}if(closeAfter)closeNoteEditor()}function clearNoteEditor(){if(confirm('Xóa tất cả ghi chú?')){document.getElementById('rich-editor').innerHTML='';saveNotes(false,true)}}
document.getElementById('rich-editor')?.addEventListener('input',scheduleNoteAutosave);window.addEventListener('load',()=>{restoreProgress(false);renderAll();setInterval(tick,1000);tick()});
</script>
