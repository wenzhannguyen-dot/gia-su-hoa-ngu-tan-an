const STORE='BAI_TAP_301_01_FINAL_V1';
const NOTE_STORE='BAI301_BAI01_NOTES_V1';
const state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:]/g,'')}
function key(sec,item){return sec+'-'+item}
function explain(sec,item){return (explanations[sec]&&explanations[sec][item])||''}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function restoreProgress(show=false){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x){Object.assign(state,x);renderAll();if(show)alert('已恢复答题。')}else if(show)alert('没有已保存的答题记录。')}catch(e){if(show)alert('无法恢复答题记录。')}}
function sectionNames(){return ['','Bổ sung thanh mẫu','Chọn cách đọc','Thanh 3 → thanh 2','Nửa thanh 3','Phiên âm','Hoàn thành đối thoại','Viết chữ Hán','Chữ có 也','Dịch Việt → Hoa']}
function itemCount(sec){if(sec===1)return exercises[1].groups.length;return exercises[sec].data.length}
function initialGroupAnswered(gi){return groupRange(gi).every(i=>String(state.answers[key(1,i)]||'').trim()!=='')}
function isAnswered(sec,i){if(sec===1)return initialGroupAnswered(i);if(sec===3||sec===4)return !!state.checked[key(sec,i)]||String(state.answers[key(sec,i)]||'').trim()!=='';if(sec===8){return String(state.answers[key(sec,i)+'-h']||'').trim()!==''||String(state.answers[key(sec,i)+'-p']||'').trim()!==''}return String(state.answers[key(sec,i)]??'').trim()!==''}
function answeredCount(sec){let n=0;for(let i=0;i<itemCount(sec);i++)if(isAnswered(sec,i))n++;return n}
function totalCount(){let n=0;for(let s=1;s<=9;s++)n+=itemCount(s);return n}
function totalAnswered(){let n=0;for(let s=1;s<=9;s++)n+=answeredCount(s);return n}
function renderNav(){let h='';for(let s=1;s<=9;s++)h+=`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`;document.getElementById('sectionNav').innerHTML=h}
function goSection(s){state.section=s;save();renderSection();renderNav()}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
function stableShuffle(arr,seed){const a=[...arr];let x=(seed+1)*2654435761>>>0;for(let i=a.length-1;i>0;i--){x=(x*1664525+1013904223)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function setAnswer(sec,i,v){state.answers[key(sec,i)]=v;delete state.checked[key(sec,i)];save();renderNav()}
function setSpecial(k,v){state.answers[k]=v;save();renderNav()}
function same(sec,i,ans){return norm(state.answers[key(sec,i)]||'')===norm(ans)}
function checkOne(sec,i){state.checked[key(sec,i)]=true;save();renderSection();renderNav()}
function feedback(sec,i,ans,customOk=null){if(!state.checked[key(sec,i)])return '<div class="feedback"></div>';const ok=customOk===null?same(sec,i,ans):customOk;return `<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div>${ok?'':`<div>Đáp án mục tiêu: <span class="correct-answer">${esc(ans)}</span></div>`}<div><b>Giải thích:</b> ${esc(explain(sec,i))}</div></div>`}
function cardClass(sec,i,okfn){if(!state.checked[key(sec,i)])return 'question-card';const ok=okfn();return 'question-card checked '+(ok?'correct':'wrong')}
function radioOptions(sec,i,options){const selected=state.answers[key(sec,i)]||'';return '<div class="options-list">'+options.map((o,j)=>`<label class="option"><input type="radio" name="q-${sec}-${i}" value="${esc(o)}" ${selected===o?'checked':''} onchange="setAnswer(${sec},${i},this.value)"><span class="letter">${letters[j]}.</span><span class="option-text">${esc(o)}</span></label>`).join('')+'</div>'}
function renderInitial(ex){let h=`<div class="section-instruction"><strong>Bổ sung hoàn chỉnh ba nhóm phụ âm dưới đây.</strong></div>`;let flat=0;ex.groups.forEach((g,gi)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${gi+1}</div><div class="qtext"><div class="initial-group"><span class="initial-fixed">${g.fixed}</span>`;g.answers.forEach((a,j)=>{const idx=flat++,v=state.answers[key(1,idx)]||'';h+=`<span>;</span><input class="initial-input" maxlength="2" value="${esc(v)}" oninput="setAnswer(1,${idx},this.value)">`});h+=`</div></div></div><div class="check-row"><button class="check-btn" onclick="checkInitialGroup(${gi})">Kiểm tra câu</button></div>${initialFeedback(gi)}</div>`});return h}
function groupRange(gi){return gi===0?[0,1,2]:gi===1?[3,4,5]:[6,7]}
function checkInitialGroup(gi){groupRange(gi).forEach(i=>state.checked[key(1,i)]=true);save();renderSection();renderNav()}
function initialFeedback(gi){const ids=groupRange(gi),checked=ids.every(i=>state.checked[key(1,i)]);if(!checked)return '<div class="feedback"></div>';const targets=exercises[1].groups[gi].answers,ok=ids.every((id,k)=>norm(state.answers[key(1,id)]||'')===norm(targets[k]));return `<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div>${ok?'':`<div>Đáp án: <span class="correct-answer">${exercises[1].groups[gi].fixed} – ${targets.join(' – ')}</span></div>`}<div><b>Giải thích:</b> ${esc(explain(1,gi))}</div></div>`}
function renderPronunciation(ex){let h=`<div class="section-instruction"><strong>Chọn âm chính xác.</strong></div>`;ex.data.forEach((it,i)=>{const ok=()=>same(2,i,it.answer);h+=`<div class="${cardClass(2,i,ok)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext chinese">${it.word}</div></div>${radioOptions(2,i,it.options)}<div class="check-row"><button class="check-btn" onclick="checkOne(2,${i})">Kiểm tra câu</button></div>${feedback(2,i,it.answer)}</div>`});return h}
function toneSelected(sec,i){return String(state.answers[key(sec,i)]||'').split('|||').filter(Boolean)}
function toggleTone(sec,i,sy){let a=toneSelected(sec,i),p=a.indexOf(sy);if(p>=0)a.splice(p,1);else a.push(sy);state.answers[key(sec,i)]=a.join('|||');delete state.checked[key(sec,i)];save();renderSection();renderNav()}
function toneOk(sec,i){const a=toneSelected(sec,i).slice().sort(),b=exercises[sec].data[i].answer.slice().sort();return a.length===b.length&&a.every((x,k)=>x===b[k])}
function renderTone(ex,sec){let h=`<div class="section-instruction"><strong>${esc(ex.title)}.</strong></div>`;ex.data.forEach((it,i)=>{const selected=toneSelected(sec,i);h+=`<div class="${cardClass(sec,i,()=>toneOk(sec,i))}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.text)}</div></div><div class="tone-row">${it.syllables.map(s=>`<label class="syllable-chip ${selected.includes(s)?'selected':''}"><input type="checkbox" ${selected.includes(s)?'checked':''} onchange="toggleTone(${sec},${i},'${esc(s)}')">${esc(s)}</label>`).join('')}</div><div class="check-row"><button class="check-btn" onclick="checkOne(${sec},${i})">Kiểm tra câu</button></div>${toneFeedback(sec,i)}</div>`});return h}
function toneFeedback(sec,i){if(!state.checked[key(sec,i)])return '<div class="feedback"></div>';const ok=toneOk(sec,i),ans=exercises[sec].data[i].answer;return `<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div>${ok?'':`<div>Âm tiết cần chọn: <span class="correct-answer">${ans.length?esc(ans.join(', ')):'Không có'}</span></div>`}<div><b>Giải thích:</b> ${esc(explain(sec,i))}</div></div>`}

function radicalFeedback(i){if(!state.checked[key(8,i)])return '<div class="feedback"></div>';const ok=radicalOk(i);return `<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div>${ok?'':`<div>Đáp án tham khảo: <span class="correct-answer">他 tā / 她 tā</span></div>`}<div><b>Giải thích:</b> ${esc(explain(8,i))}</div></div>`}
function translationOk(i){const it=exercises[9].data[i],v=state.answers[key(9,i)]||'';return (it.accepted||[it.cn]).some(a=>norm(a)===norm(v))}
function renderTranslation(ex){let h=`<div class="section-instruction"><strong>Luyện dịch Việt → Hoa.</strong></div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(9,i)]||'',c=state.checked[key(9,i)],ok=translationOk(i);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAnswer(9,${i},this.value)">${esc(v)}</textarea><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Đối chiếu đáp án</button></div>${translationFeedback(i)}</div>`});return h}
function translationFeedback(i){if(!state.checked[key(9,i)])return '<div class="feedback"></div>';const it=exercises[9].data[i],ok=translationOk(i);return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div>Đáp án tham khảo: <span class="correct-answer">${esc(it.cn)}</span></div><div><b>Giải thích:</b> ${esc(explain(9,i))}</div></div>`}
function renderSection(){const sec=state.section,ex=exercises[sec];document.getElementById('sectionBadge').textContent='Bài '+sec;document.getElementById('sectionTitle').textContent=sectionNames()[sec];let h='';if(sec===1)h=renderInitial(ex);else if(sec===2)h=renderPronunciation(ex);else if(sec===3||sec===4)h=renderTone(ex,sec);else if(sec===5)h=renderPinyin(ex);else if(sec===6)h=renderDialogue(ex);else if(sec===7)h=renderHanzi(ex);else if(sec===8)h=renderRadical(ex);else if(sec===9)h=renderTranslation(ex);h+=`<div class="navigation-buttons"><button class="nav-btn" onclick="goSection(${Math.max(1,sec-1)})" ${sec===1?'disabled':''}>上一题 · Bài trước</button><button class="nav-btn next" onclick="goSection(${Math.min(9,sec+1)})" ${sec===9?'disabled':''}>下一题 · Bài sau</button></div>`;document.getElementById('contentBody').innerHTML=h;window.scrollTo(0,0)}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;document.getElementById('progressText').textContent=`${a}/${t}`;document.getElementById('progressFill').style.width=p+'%'}
function openAnswerCard(){let h='';for(let s=1;s<=9;s++){const a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br><span class="muted">${a}/${t} đã làm</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restartExam(){if(!confirm('重新答题？'))return;try{localStorage.removeItem(STORE)}catch(e){}state.section=1;state.answers={};state.checked={};state.startAt=Date.now();state.fontLarge=false;renderAll()}
function objectiveScore(){let correct=0,total=0;
 // 1: each blank
 const targets=['p','m','f','t','n','l','k','h'];targets.forEach((a,i)=>{total++;if(norm(state.answers[key(1,i)]||'')===a)correct++});
 // 2
 exercises[2].data.forEach((it,i)=>{total++;if(same(2,i,it.answer))correct++});
 // 3,4 rows
 [3,4].forEach(sec=>exercises[sec].data.forEach((it,i)=>{total++;if(toneOk(sec,i))correct++}));
 //5
 exercises[5].data.forEach((it,i)=>{total++;if(same(5,i,it.answer))correct++});
 //6
 exercises[6].data.forEach((it,i)=>{total++;if(dialogueOk(i))correct++});
 //7
 exercises[7].data.forEach((it,i)=>{total++;if(hanziOk(i))correct++});
 //8
 exercises[8].data.forEach((it,i)=>{total++;if(radicalOk(i))correct++});
 return {correct,total};}
function submitExam(){const sc=objectiveScore(),pct=sc.total?Math.round(sc.correct/sc.total*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${sc.correct}/${sc.total}</div><div style="text-align:center;font-weight:700">Kết quả: ${pct}%</div><div style="margin-top:15px;line-height:1.7"><b>Tiến độ toàn bài:</b> ${totalAnswered()}/${totalCount()} mục đã làm.<br><b>Bài 9:</b> đối chiếu riêng với đáp án tham khảo vì câu dịch có thể có nhiều cách diễn đạt đúng.</div>`;document.getElementById('resultModal').classList.add('show')}
function tick(){const e=Math.floor((Date.now()-(state.startAt||Date.now()))/1000),m=Math.floor(e/60),ss=e%60;document.getElementById('timerText').textContent=`Thời gian ${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;document.getElementById('timerProgress').style.width=Math.min(100,(e%3600)/36)+'%'}
let noteSaveTimer=null;
function openNoteEditor(){const overlay=document.getElementById('note-editor-overlay'),editor=document.getElementById('rich-editor');if(!overlay||!editor)return;try{const saved=localStorage.getItem(NOTE_STORE);if(saved!==null)editor.innerHTML=saved}catch(e){}overlay.classList.add('show');document.body.classList.add('note-open');editor.focus()}
function closeNoteEditor(){const overlay=document.getElementById('note-editor-overlay');if(overlay)overlay.classList.remove('show');document.body.classList.remove('note-open')}
function noteCommand(cmd,val=null){document.execCommand(cmd,false,val);document.getElementById('rich-editor')?.focus();scheduleNoteAutosave()}
function scheduleNoteAutosave(){clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>saveNotes(false,true),400)}
function saveNotes(closeAfter=false,silent=false){const editor=document.getElementById('rich-editor');if(!editor)return;try{localStorage.setItem(NOTE_STORE,editor.innerHTML)}catch(e){}if(closeAfter)closeNoteEditor()}
function clearNoteEditor(){if(confirm('Xóa tất cả ghi chú?')){document.getElementById('rich-editor').innerHTML='';saveNotes(false,true)}}
document.getElementById('rich-editor')?.addEventListener('input',scheduleNoteAutosave);
window.addEventListener('load',()=>{restoreProgress(false);renderAll();setInterval(tick,1000);tick()});
</script>
</body></html>
