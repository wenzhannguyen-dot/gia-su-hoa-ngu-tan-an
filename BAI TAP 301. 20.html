 một chút.","a":"你说得太快了，我听不懂，请你说慢一点儿。","acc":["你说得太快了我听不懂请你说慢一点儿","你说得太快我听不懂请说慢一点儿"],"e":"说得太快 = nói quá nhanh; 听不懂 = nghe không hiểu."}]};
const SECTION_COUNT=8, STORE='BAI_TAP_301_20_FINAL_V1', NOTE_STORE='BAI301_BAI20_NOTES_FINAL_V1';
const state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:；/]/g,'')}
function key(s,i){return s+'-'+i}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function setAns(s,i,v){state.answers[key(s,i)]=v;delete state.checked[key(s,i)];save();renderNav()}
function accepted(v,arr){return (arr||[]).some(a=>norm(a)===norm(v))}
function isOk(it,v){return accepted(v,it.acc||[it.a])}
function feedback(s,i,it,sample=false){if(!state.checked[key(s,i)])return '<div class="feedback"></div>';let v=state.answers[key(s,i)]||'',ok=isOk(it,v);return `<div class="feedback show ${ok?'correct':(sample||it.sample?'sample':'wrong')}"><div class="status">${ok?'✓ Đúng':'△ Chưa khớp đáp án tham khảo'}</div>${ok?'':`<div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.a)}</span></div>`}<div><b>Giải thích:</b> ${esc(it.e||'')}</div></div>`}
function check(s,i){state.checked[key(s,i)]=true;save();renderSection();renderNav()}
function clearOne(s,i){delete state.answers[key(s,i)];delete state.checked[key(s,i)];save();renderSection();renderNav()}
function inputBox(s,i,ph='Nhập câu trả lời'){return `<input class="input-text" value="${esc(state.answers[key(s,i)]||'')}" placeholder="${esc(ph)}" oninput="setAns(${s},${i},this.value)">`}
function radio(s,i,opts){let v=state.answers[key(s,i)]||'';return `<div class="radio-choice-list" role="radiogroup">${opts.map((o,j)=>`<label class="radio-choice"><input type="radio" name="q-${s}-${i}" value="${esc(o)}" ${norm(v)===norm(o)?'checked':''} onchange="setAns(${s},${i},this.value)"><span>${letters[j]}. ${esc(o)}</span></label>`).join('')}</div>`}
function sectionNames(){return ['','一 · 熟读词语','二 · 选介词填空','三 · 找适当位置','四 · 完成对话（得）','五 · 改错句','七 · 上下文填空 + 选择','八 · 写汉字 + 你猜猜','九 · 越汉翻译']}
function renderNav(){document.getElementById('sectionNav').innerHTML=Array.from({length:SECTION_COUNT},(_,i)=>i+1).map(s=>`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`).join('')}
function goSection(s){if(s<1||s>SECTION_COUNT)return;state.section=s;save();renderNav();renderSection()}
function renderStudy(){return `<div class="section-instruction"><strong>熟读词语 — Đọc thuộc những cụm từ bên dưới.</strong><div class="muted">Pinyin và nghĩa tiếng Việt là phần hỗ trợ học tập bổ sung; chữ Hán và thứ tự cụm từ giữ theo nguồn Bài 20.</div><div class="source-note">Nguồn Bài 20 đánh số phần từ 五 nhảy thẳng sang 七, không có mục 六. Bản tương tác không tự tạo thêm nội dung; menu kỹ thuật có 8 phần theo đúng 8 phần thực tế.</div></div>`+DATA.study.map(g=>`<div class="question-card"><div class="qtext"><b style="font-size:27px">${esc(g.head)}</b><div style="color:#1976d2">${esc(g.p)}</div><div>${esc(g.m)}</div><div style="margin-top:10px">${g.lines.map(x=>`<div style="padding:7px 0;border-top:1px dashed #e2e2e2"><b>${esc(x.cn)}</b><br><span style="color:#1976d2">${esc(x.p)}</span><br><span>${esc(x.m)}</span></div>`).join('')}</div></div></div>`).join('')}
function prepFlat(){return DATA.prep.data.flatMap(x=>x.blanks)}
function renderPrep(){let h=`<div class="section-instruction"><strong>选介词填空</strong><br>Chọn giới từ điền vào chỗ trống. Theo sửa đổi đã duyệt, mọi lựa chọn dùng <b>radio hiển thị trực tiếp</b>, không dùng dropdown.<div class="word-bank">${DATA.prep.options.map(x=>`<span class="word-chip">${esc(x)}</span>`).join('')}</div></div>`;let idx=0;DATA.prep.data.forEach((g,gi)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${gi+1}</div><div class="qtext">${esc(g.s)}</div></div>`;g.blanks.forEach((it,j)=>{let i=idx++;h+=`<div style="margin:12px 0;padding-top:8px;border-top:1px dashed #e2e6e9"><b>Chỗ trống ${i+1}</b>${radio(2,i,DATA.prep.options)}<div class="check-row"><button class="check-btn" onclick="check(2,${i})">Kiểm tra</button><button class="clear-btn" onclick="clearOne(2,${i})">Làm lại</button></div>${feedback(2,i,it)}</div>`});h+='</div>'});return h}
function renderPositions(){return `<div class="section-instruction"><strong>给括号内的词找到适当的位置</strong><br>Tìm vị trí A/B/C/D thích hợp cho từ trong ngoặc.</div>`+DATA.positions.map((it,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.s)}</div></div>${radio(3,i,['A','B','C','D'])}<div class="check-row"><button class="check-btn" onclick="check(3,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(3,${i})">Làm lại câu</button></div>${feedback(3,i,it)}</div>`).join('')}
function dialogueFlat(){return DATA.dialogue.flatMap(g=>g.items)}
function renderDialogue(){let h=`<div class="section-instruction"><strong>完成对话（用上 “得”）</strong><br>Hoàn thành đối thoại, dùng 得 theo yêu cầu nguồn.<div class="source-note">Nguồn đồng thời có các câu “写的不太好 / 说的不错 / 我做的不好”. Bản tương tác giữ nguyên câu nguồn để đối chiếu; đáp án tham khảo giải thích theo cấu trúc 得 của chính tiêu đề mục.</div></div>`;let idx=0;DATA.dialogue.forEach((g,gi)=>{let ids=[];let body=g.lines.map(line=>{let [sp,pre,slot,suf]=line;if(slot===null)return `<div><b>${esc(sp)}：</b>${esc(pre)}</div>`;let id=idx++;ids.push(id);return `<div><b>${esc(sp)}：</b>${esc(pre)} <span style="display:inline-block;min-width:250px">${inputBox(4,id)}</span>${esc(suf)}</div>`}).join('');h+=`<div class="question-card"><div class="qhead"><div class="qnum">${gi+1}</div><div class="qtext" style="width:100%;line-height:2.2">${body}</div></div><div class="check-row"><button class="check-btn" onclick="checkGroup4([${ids.join(',')}])">Kiểm tra đoạn</button></div>${dialogueGroupFeedback(ids,g)}</div>`});return h}
function checkGroup4(ids){ids.forEach(i=>state.checked[key(4,i)]=true);save();renderSection();renderNav()}
function dialogueGroupFeedback(ids,g){if(!ids.some(i=>state.checked[key(4,i)]))return '<div class="feedback"></div>';let flat=dialogueFlat(),all=ids.every(i=>isOk(flat[i],state.answers[key(4,i)]||''));return `<div class="feedback show ${all?'correct':'sample'}">${ids.map((i,j)=>{let it=g.items[j],ok=isOk(it,state.answers[key(4,i)]||'');return `<div style="margin:8px 0"><b>${ok?'✓':'△'} Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.a)}</span><br><b>Giải thích:</b> ${esc(it.e)}</div>`}).join('')}</div>`}
function renderErrors(){return `<div class="section-instruction"><strong>改错句 — Sửa câu sai</strong><br>Nhập câu sửa. Sau khi kiểm tra sẽ hiện lỗi sai, đáp án tham khảo và lý do sửa.</div>`+DATA.errors.map((it,i)=>{let v=state.answers[key(5,i)]||'',c=state.checked[key(5,i)],ok=isOk(it,v);return `<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="wrong-sentence">${esc(it.orig)}</div></div></div>${inputBox(5,i,'Nhập câu đã sửa')}<div class="check-row"><button class="check-btn" onclick="check(5,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(5,${i})">Làm lại câu</button></div>${c?`<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div><b>Lỗi sai:</b> ${esc(it.err)}</div><div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.a)}</span></div><div><b>Vì sao sửa như vậy:</b> ${esc(it.fix)}</div></div>`:'<div class="feedback"></div>'}</div>`}).join('')}
function renderContext(){let h=`<div class="section-instruction"><strong>根据上下文意思用词填空，然后选择正确的项</strong><br>Dựa theo ngữ cảnh điền từ, sau đó chọn đáp án đúng.<div class="muted">Nguồn không cung cấp ngân hàng từ cho 14 chỗ trống; các phương án radio là phần hỗ trợ thao tác do GPT tạo từ ngữ cảnh, còn câu gốc được giữ nguyên.</div><div class="source-note">${esc(DATA.context.note)}</div></div><div class="question-card"><div class="passage" style="white-space:pre-line;line-height:2.3">${esc(DATA.context.source)}</div></div>`;DATA.context.fills.forEach((it,i)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">Chỗ trống ${i+1}</div></div>${radio(6,i,it.opts)}<div class="check-row"><button class="check-btn" onclick="check(6,${i})">Kiểm tra</button><button class="clear-btn" onclick="clearOne(6,${i})">Làm lại</button></div>${feedback(6,i,it)}</div>`});let off=DATA.context.fills.length;DATA.context.mc.forEach((it,j)=>{let i=off+j;h+=`<div class="question-card"><div class="qhead"><div class="qnum">${j+1}</div><div class="qtext">${esc(it.q)}</div></div>${radio(6,i,it.opts)}<div class="check-row"><button class="check-btn" onclick="check(6,${i})">Kiểm tra lựa chọn</button><button class="clear-btn" onclick="clearOne(6,${i})">Làm lại</button></div>${feedback(6,i,it)}</div>`});return h}
function radicalFlat(){return [...DATA.radical,...DATA.challenge]}
function renderRadical(){let h=`<div class="section-instruction"><strong>请写出含有偏旁 “刂” 或 “彳” 的汉子</strong><br>Giữ nguyên tiêu đề nguồn.<div class="source-note">Nội dung thực tế của mục này là 意、您、感、念、想、息、怎、然、点、热、照, không phù hợp với tiêu đề “刂 / 彳”. Bản tương tác không tự đổi tiêu đề; phần làm bài bám đúng Pinyin và cụm chữ mà nguồn cung cấp.</div></div>`;DATA.radical.forEach((it,i)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.p)}</div></div>${inputBox(7,i,'Nhập chữ Hán')}<div class="check-row"><button class="check-btn" onclick="check(7,${i})">Kiểm tra</button></div>${feedback(7,i,it)}</div>`});let off=DATA.radical.length;h+=`<div class="section-instruction"><strong>你猜猜</strong><br>${esc(DATA.challenge[0].p)}</div>`;DATA.challenge.forEach((it,j)=>{let i=off+j;h+=`<div class="question-card"><div class="qhead"><div class="qnum">${j===0?'字':'谁'}</div><div class="qtext">${esc(it.p)}</div></div>${inputBox(7,i)}<div class="check-row"><button class="check-btn" onclick="check(7,${i})">Kiểm tra</button></div>${feedback(7,i,it,true)}</div>`});return h}
function renderTranslation(){return `<div class="section-instruction"><strong>越汉翻译练习 — Luyện dịch Việt → Hoa</strong><br>Đối chiếu với đáp án tham khảo; câu khác đúng ngữ pháp không mặc nhiên bị coi là sai.</div>`+DATA.translations.map((it,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAns(8,${i},this.value)">${esc(state.answers[key(8,i)]||'')}</textarea><div class="check-row"><button class="check-btn" onclick="check(8,${i})">Đối chiếu đáp án</button><button class="clear-btn" onclick="clearOne(8,${i})">Làm lại câu</button></div>${feedback(8,i,it,true)}</div>`).join('')}
function renderSection(){let s=state.section;document.getElementById('sectionBadge').textContent='Bài '+s;document.getElementById('sectionTitle').textContent=sectionNames()[s];let h=s===1?renderStudy():s===2?renderPrep():s===3?renderPositions():s===4?renderDialogue():s===5?renderErrors():s===6?renderContext():s===7?renderRadical():renderTranslation();h+=`<div class="navigation-buttons"><button class="nav-btn" ${s===1?'disabled':''} onclick="goSection(${s-1})">← Bài trước</button><button class="nav-btn next" ${s===SECTION_COUNT?'disabled':''} onclick="goSection(${s+1})">Bài sau →</button></div>`;document.getElementById('contentBody').innerHTML=h}
function itemCount(s){if(s===1)return 0;if(s===2)return prepFlat().length;if(s===3)return DATA.positions.length;if(s===4)return dialogueFlat().length;if(s===5)return DATA.errors.length;if(s===6)return DATA.context.fills.length+DATA.context.mc.length;if(s===7)return radicalFlat().length;return DATA.translations.length}
function answeredCount(s){let n=0;for(let i=0;i<itemCount(s);i++)if(String(state.answers[key(s,i)]||'').trim())n++;return n}
function updateProgress(){let t=0,a=0;for(let s=1;s<=SECTION_COUNT;s++){t+=itemCount(s);a+=answeredCount(s)}document.getElementById('progressText').textContent=a+'/'+t;document.getElementById('progressFill').style.width=(t?a/t*100:0)+'%'}
function openAnswerCard(){document.getElementById('answerGrid').innerHTML=Array.from({length:SECTION_COUNT},(_,i)=>i+1).map(s=>`<div class="answer-cell ${answeredCount(s)===itemCount(s)&&itemCount(s)?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${esc(sectionNames()[s])}<br><span class="muted">${itemCount(s)?answeredCount(s)+'/'+itemCount(s)+' đã làm':'Tài liệu đọc'}</span></div>`).join('');document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restoreProgress(show=false){try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x)Object.assign(state,x)}catch(e){}renderAll();if(show)alert('Đã khôi phục tiến độ (nếu có).')}
function restartExam(){if(!confirm('Làm lại toàn bộ Bài 20? Ghi chú vẫn được giữ.'))return;state.answers={};state.checked={};state.section=1;state.startAt=Date.now();save();renderAll()}
function submitExam(){let total=0,correct=0;function add(it,s,i){total++;if(isOk(it,state.answers[key(s,i)]||''))correct++}prepFlat().forEach((it,i)=>add(it,2,i));DATA.positions.forEach((it,i)=>add(it,3,i));dialogueFlat().forEach((it,i)=>add(it,4,i));DATA.errors.forEach((it,i)=>add(it,5,i));DATA.context.fills.forEach((it,i)=>add(it,6,i));DATA.context.mc.forEach((it,j)=>add(it,6,DATA.context.fills.length+j));radicalFlat().forEach((it,i)=>add(it,7,i));DATA.translations.forEach((it,i)=>add(it,8,i));document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${total}</div><div style="text-align:center">Kết quả đối chiếu đáp án tham khảo.</div><div style="margin-top:12px;line-height:1.6"><b>Lưu ý:</b> hội thoại, sửa câu và dịch có thể có cách đúng khác đáp án mẫu.</div>`;document.getElementById('resultModal').classList.add('show')}
function openNoteEditor(){document.getElementById('rich-editor').innerHTML=localStorage.getItem(NOTE_STORE)||'';document.getElementById('note-editor-overlay').classList.add('show');document.body.classList.add('note-open')}
function closeNoteEditor(){document.getElementById('note-editor-overlay').classList.remove('show');document.body.classList.remove('note-open')}
function saveNotes(show=false){localStorage.setItem(NOTE_STORE,document.getElementById('rich-editor').innerHTML);if(show)alert('Đã lưu ghi chú.')}
function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor').focus()}
function clearNoteEditor(){document.getElementById('rich-editor').innerHTML=''}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
setInterval(()=>{let sec=Math.floor((Date.now()-state.startAt)/1000),m=String(Math.floor(sec/60)).padStart(2,'0'),ss=String(sec%60).padStart(2,'0');let e=document.getElementById('timerText');if(e)e.textContent='Thời gian '+m+':'+ss},1000);
window.addEventListener('load',()=>{restoreProgress(false)});
</script></body></html>
