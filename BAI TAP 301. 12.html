"},{"sentence":"他家离学校 ______。","answer":"不远也不近","ex":"Theo mẫu với cặp 远 / 近 → 不远也不近."},{"sentence":"那件衣服 ______。","answer":"不长也不短","ex":"Theo mẫu với cặp 长 / 短 → 不长也不短."},{"sentence":"我的钱买电脑 ______。","answer":"不多也不少","ex":"Nguồn chỉ cho câu trống; đáp án tham khảo tiếp tục áp dụng đúng mẫu 不A也不B bằng cặp 多 / 少."}]},{"type":"hanzi-fill","title":"用汉字填空 · Điền chữ Hán","wordBank":["冷","服","少","天","件","穿","在","作","累","上","馆","觉"],"data":[{"answer":"冷","ex":"天冷了 = trời lạnh rồi."},{"answer":"服","ex":"衣服 = quần áo."},{"answer":"少","ex":"衣服很少 = quần áo rất ít."},{"answer":"天","ex":"昨天 = hôm qua."},{"answer":"件","ex":"一件大衣 = một chiếc áo khoác."},{"answer":"天","ex":"今天 = hôm nay."},{"answer":"穿","ex":"穿在身上 = mặc trên người."},{"answer":"在","ex":"住在宾馆 = ở tại khách sạn."},{"answer":"作","ex":"工作 = công việc/làm việc."},{"answer":"累","ex":"很累 = rất mệt."},{"answer":"上","ex":"晚上 = buổi tối."},{"answer":"馆","ex":"宾馆 = khách sạn."},{"answer":"觉","ex":"睡觉 = ngủ."}],"pieces":["我来哈尔滨有四天了。这儿天",0,"了。我的衣",1,"很",2,"，昨",3,"去买了一",4,"大衣，今",5,"就",6,"在身上了。\n我住",7,"宾馆，上午、下午工",8,"很忙，很",9,"，晚",10,"回宾",11,"就想睡",12,"。"]},{"type":"radical","title":"木 / 阝 / 你猜猜","radical":[{"prompt":"手 Jī ___","answer":"机","ex":"手机 = điện thoại; 机 có bộ 木."},{"prompt":"Lóu ___","answer":"楼","ex":"楼 có bộ 木 ở bên trái."},{"prompt":"学 Xiào ___","answer":"校","ex":"学校 = trường học; 校 có bộ 木."},{"prompt":"Jú ___ 子","answer":"橘","ex":"橘子 = quýt; 橘 có bộ 木."},{"prompt":"怎么 Yàng ___","answer":"样","ex":"怎么样 = thế nào; 样 có bộ 木."},{"prompt":"Jí 了 ___","answer":"极","ex":"极了 = cực kỳ; 极 có bộ 木."},{"prompt":"Dōu ___","answer":"都","ex":"都 có 阝 ở bên phải (thành phần 邑)."},{"prompt":"Yóu ___ 局","answer":"邮","ex":"邮局 = bưu điện; 邮 có 阝 ở bên phải."}],"challenge":{"prompt":"“大口吃进小口”，是哪个汉字？","answer":"回","ex":"Một 口 lớn bao lấy một 口 nhỏ tạo thành chữ 回."}},{"type":"translation","title":"越汉翻译练习 · Dịch Việt → Hoa","data":[{"vi":"Hôm nay trời lạnh quá!","answer":"今天天气太冷了！","accepted":["今天太冷了","今天天气太冷了"],"ex":"太冷了 = lạnh quá."},{"vi":"Mary muốn đến cửa hàng mua một chiếc áo len.","answer":"玛丽想去商店买一件毛衣。","accepted":["玛丽想去商店买一件毛衣","玛丽要去商店买一件毛衣"],"ex":"想去商店买… = muốn đến cửa hàng mua…; 件 là lượng từ cho áo quần."},{"vi":"Tôi xem quyển sách kia một tí.","answer":"我看看那本书。","accepted":["我看看那本书","我看一看那本书","我看一下那本书"],"ex":"看看 / 看一看 / 看一下 đều diễn tả xem một chút."},{"vi":"Từ mới của bài học này không nhiều cũng không ít.","answer":"这一课的生词不多也不少。","accepted":["这一课的生词不多也不少","这课的生词不多也不少"],"ex":"不多也不少 = không nhiều cũng không ít."},{"vi":"Chiếc áo len kia mắc quá!","answer":"那件毛衣太贵了！","accepted":["那件毛衣太贵了","那件毛衣贵极了"],"ex":"太贵了 / 贵极了 đều diễn tả rất đắt."},{"vi":"Thứ ba đi được không?","answer":"星期二去可以吗？","accepted":["星期二去可以吗","星期二去行吗","星期二去可不可以"],"ex":"可以吗 / 行吗 hỏi có được không."},{"vi":"Tôi mặc thử chiếc áo kia được không?","answer":"我可以试试那件衣服吗？","accepted":["我可以试试那件衣服吗","我可以试穿一下那件衣服吗","我试试那件衣服可以吗"],"ex":"试试 / 试穿一下 = thử/mặc thử."},{"vi":"Cuốn sách này hay quá, tôi muốn đọc lại một chút nữa.","answer":"这本书好极了，我想再看一看。","accepted":["这本书好极了我想再看一看","这本书太好了我想再看一下","这本书很好我想再看一看"],"ex":"再 + động từ = làm lại/thêm một lần; 看一看 = xem/đọc một chút."},{"vi":"Bạn muốn uống đồ uống gì?","answer":"你想喝什么饮料？","accepted":["你想喝什么饮料","你要喝什么饮料","你想喝哪种饮料"],"ex":"什么饮料 = đồ uống gì."},{"vi":"Bộ phim đó không hay lắm, tôi không muốn xem.","answer":"那个电影不太好，我不想看。","accepted":["那个电影不太好我不想看","那部电影不太好我不想看"],"ex":"不太好 = không hay lắm; 不想看 = không muốn xem."}]}];
const STORE='BAI301_BAI12_PROGRESS_V1';
const NOTE_STORE='BAI301_BAI12_NOTES_V1';
const SECTION_COUNT=9;
let state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:]/g,'')}
function key(sec,i){return `${sec}-${i}`}
function acceptedFor(it){return [it.answer,...(it.accepted||[])].filter(Boolean)}
function isAccepted(it,v){return acceptedFor(it).some(a=>norm(a)===norm(v))}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function restoreProgress(showMsg=false){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&typeof x==='object')state={...state,...x};if(showMsg)alert(x?'Đã khôi phục tiến độ.':'Chưa có tiến độ đã lưu.')}catch(e){if(showMsg)alert('Không thể khôi phục dữ liệu.')}renderAll()}
function setAnswer(sec,i,v){state.answers[key(sec,i)]=v;delete state.checked[key(sec,i)];save();renderNav()}
function clearOne(sec,i){delete state.answers[key(sec,i)];delete state.checked[key(sec,i)];save();renderSection();renderNav()}
function checkOne(sec,i){state.checked[key(sec,i)]=true;save();renderSection();renderNav()}
function sectionNames(){return ['','熟读词语','Phiên âm + từ trái nghĩa','选词填空','写出动词','完成对话','仿照例句完成句子','用汉字填空','木 / 阝 / 你猜猜','Dịch Việt → Hoa']}
function dialogueFlat(){return exercises[4].groups.flatMap(g=>g.items)}
function radicalFlat(){const ex=exercises[7];return [...ex.radical,ex.challenge]}
function itemCount(sec){const ex=exercises[sec-1];if(sec===1)return 0;if(sec===2)return ex.pinyinItems.length+ex.matchItems.length;if(sec===5)return ex.groups.reduce((n,g)=>n+g.items.length,0);if(sec===8)return ex.radical.length+1;return ex.data?ex.data.length:0}
function answeredCount(sec){let n=0,t=itemCount(sec);for(let i=0;i<t;i++)if(String(state.answers[key(sec,i)]??'').trim())n++;return n}
function totalCount(){let n=0;for(let s=1;s<=SECTION_COUNT;s++)n+=itemCount(s);return n}
function totalAnswered(){let n=0;for(let s=1;s<=SECTION_COUNT;s++)n+=answeredCount(s);return n}
function renderNav(){let h='';for(let s=1;s<=SECTION_COUNT;s++)h+=`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`;document.getElementById('sectionNav').innerHTML=h}
function goSection(s){if(s<1||s>SECTION_COUNT)return;state.section=s;save();renderSection();renderNav()}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
function standardFeedback(sec,i,it,label='Đáp án tham khảo'){if(!state.checked[key(sec,i)])return '<div class="feedback"></div>';const ok=isAccepted(it,state.answers[key(sec,i)]||'');return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Đúng':'△ Chưa khớp đáp án tham khảo'}</div><div><b>${label}:</b> <span class="correct-answer">${esc(it.answer)}</span></div>${it.ex?`<div><b>Giải thích:</b> ${esc(it.ex)}</div>`:''}</div>`}
function cardClass(sec,i,it){if(!state.checked[key(sec,i)])return 'question-card';return 'question-card checked '+(isAccepted(it,state.answers[key(sec,i)]||'')?'correct':'wrong')}
function radioChoices(sec,i,options,val){return `<div class="radio-choice-list" role="radiogroup" aria-label="Lựa chọn câu ${i+1}">`+options.map(o=>{const value=typeof o==='string'?o:o.value,label=typeof o==='string'?o:o.label;return `<label class="radio-choice"><input type="radio" name="q-${sec}-${i}" value="${esc(value)}" ${norm(val)===norm(value)?'checked':''} onchange="setAnswer(${sec},${i},this.value)"><span>${esc(label)}</span></label>`}).join('')+'</div>'}
function renderRead(ex){let h=`<div class="section-instruction"><strong>熟读词语</strong><br>Đọc thuộc những cụm từ bên dưới.<div class="muted" style="margin-top:5px">Pinyin và nghĩa tiếng Việt là phần hỗ trợ học tập được bổ sung; chữ Hán và thứ tự cụm từ giữ theo nguồn Bài 12.</div></div><div class="phrase-grid">`;ex.groups.forEach(g=>{h+=`<div class="phrase-group"><div class="phrase-head">${esc(g.head)}</div><div class="phrase-head-pinyin">${esc(g.p)}</div><div class="phrase-head-meaning">${esc(g.m)}</div>${g.lines.map(x=>`<div class="phrase-line"><div class="phrase-cn">${esc(x.cn)}</div><div class="phrase-pinyin">${esc(x.p)}</div><div class="phrase-meaning">${esc(x.m)}</div></div>`).join('')}</div>`});return h+'</div>'}
function renderAntonym(ex){let h=`<div class="section-instruction"><strong>给下面的词注音，并给反义词连线</strong><br>Phiên âm và nối các từ trái nghĩa bên dưới.</div><div class="match-example"><b>Ví dụ nguồn:</b> ${esc(ex.example.left)} ${esc(ex.example.lp)} ↔ ${esc(ex.example.right)} ${esc(ex.example.rp)} <b>(${esc(ex.example.pair)})</b>. Ví dụ này không tính là câu làm.</div><div class="subsection-title">A. Phiên âm các từ còn lại</div><div class="pinyin-grid">`;ex.pinyinItems.forEach((it,i)=>{const v=state.answers[key(2,i)]||'';h+=`<div class="pinyin-card ${state.checked[key(2,i)]?(isAccepted(it,v)?'checked correct':'checked wrong'):''}"><div class="src-label">${esc(it.label)}</div><input class="input-text" value="${esc(v)}" placeholder="Nhập Pinyin" oninput="setAnswer(2,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(2,${i})">Kiểm tra</button></div>${standardFeedback(2,i,it)}</div>`});h+='</div><div class="subsection-title">B. Nối từ trái nghĩa</div>';const off=ex.pinyinItems.length;ex.matchItems.forEach((it,j)=>{const i=off+j,v=state.answers[key(2,i)]||'';h+=`<div class="${cardClass(2,i,it)}"><div class="qhead"><div class="qnum">${j+1}</div><div class="qtext">${esc(it.left)} ↔ ?</div></div>${radioChoices(2,i,ex.matchOptions,v)}<div class="check-row"><button class="check-btn" onclick="checkOne(2,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(2,${i})">Làm lại câu</button></div>${standardFeedback(2,i,it)}</div>`});return h}
function renderChoiceFill(ex){let h=`<div class="section-instruction"><strong>选词填空</strong><br>Chọn từ điền vào chỗ trống.<div class="word-bank">${ex.options.map(w=>`<span class="word-chip">${esc(w)}</span>`).join('')}</div></div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(3,i)]||'';h+=`<div class="${cardClass(3,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.sentence)}<div class="question-pinyin">${esc(it.pinyin||'')}</div></div></div>${radioChoices(3,i,ex.options,v)}<div class="check-row"><button class="check-btn" onclick="checkOne(3,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(3,${i})">Làm lại câu</button></div>${standardFeedback(3,i,it)}</div>`});return h}
function renderVerbWrite(ex){let h=`<div class="section-instruction"><strong>写出动词</strong><br>Điền động từ thích hợp. Đây là dạng viết động từ của nguồn nên dùng ô nhập, không tự đổi sang trắc nghiệm.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(4,i)]||'';h+=`<div class="${cardClass(4,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">______ ${esc(it.object)} <span class="muted">${esc(it.pinyin)}</span></div></div><input class="input-text" value="${esc(v)}" placeholder="Nhập động từ" oninput="setAnswer(4,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(4,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(4,${i})">Làm lại câu</button></div>${standardFeedback(4,i,it)}</div>`});return h}
function dInput(i,w=270){return `<input class="input-text" style="display:inline-block;width:min(${w}px,70vw);margin:2px 4px" value="${esc(state.answers[key(5,i)]||'')}" oninput="setAnswer(5,${i},this.value)">`}
function renderDialogue(ex){let h=`<div class="section-instruction"><strong>完成对话</strong><br>Hoàn thành đối thoại.</div>`;let offset=0;ex.groups.forEach((g,gi)=>{const inds=g.items.map((_,j)=>offset+j);let lines='';g.lines.forEach(line=>{const sp=line[0],before=line[1]||'',slot=typeof line[2]==='number'?line[2]:null,after=slot!==null?(line[3]||''):'';lines+=slot===null?`<div><b>${esc(sp)}：</b>${esc(before)}</div>`:`<div><b>${esc(sp)}：</b>${esc(before)}${dInput(inds[slot])}${esc(after)}</div>`});const checked=inds.some(i=>state.checked[key(5,i)]),all=inds.every((i,j)=>isAccepted(g.items[j],state.answers[key(5,i)]||''));let fb='';if(checked)fb=`<div class="feedback show ${all?'correct':'sample'}">`+g.items.map((it,j)=>`<div style="margin:7px 0"><b>${j+1}.</b> ${isAccepted(it,state.answers[key(5,inds[j])]||'')?'✓':'△'} Đáp án tham khảo: <span class="correct-answer">${esc(it.answer)}</span><br><b>Giải thích:</b> ${esc(it.ex)}</div>`).join('')+'</div>';h+=`<div class="question-card ${checked?'checked '+(all?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${gi+1}</div><div class="qtext dialogue-block">${lines}</div></div>${g.note?`<div class="source-note">${esc(g.note)}</div>`:''}<div class="check-row"><button class="check-btn" onclick="checkDialogue([${inds.join(',')}])">Kiểm tra đoạn</button></div>${fb}</div>`;offset+=g.items.length});return h}
function checkDialogue(inds){inds.forEach(i=>state.checked[key(5,i)]=true);save();renderSection();renderNav()}
function renderPattern(ex){let h=`<div class="section-instruction"><strong>仿照例句完成句子</strong><br>Dựa vào ví dụ hoàn thành câu.<div class="match-example"><b>例：</b> ${esc(ex.example)}</div></div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(6,i)]||'';h+=`<div class="${cardClass(6,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.sentence)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(6,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(6,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(6,${i})">Làm lại câu</button></div>${standardFeedback(6,i,it)}</div>`});return h}
function renderHanziFill(ex){let h=`<div class="section-instruction"><strong>用汉字填空</strong><br>Điền vào chỗ trống bằng chữ Hán. Theo quy tắc đã duyệt, phần điền này dùng radio hiển thị trực tiếp.<div class="word-bank">${ex.wordBank.map(w=>`<span class="word-chip">${esc(w)}</span>`).join('')}</div></div><div class="question-card"><div class="passage" style="line-height:2.8">`;ex.pieces.forEach(p=>{if(typeof p==='number')h+=`<span class="blank-display">(${p+1})</span>`;else h+=esc(p).replace(/\n/g,'<br>')});h+='</div></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(7,i)]||'';h+=`<div class="${cardClass(7,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">Chọn chữ Hán cho chỗ trống (${i+1})</div></div>${radioChoices(7,i,ex.wordBank,v)}<div class="check-row"><button class="check-btn" onclick="checkOne(7,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(7,${i})">Làm lại câu</button></div>${standardFeedback(7,i,it)}</div>`});return h}
function renderRadical(ex){const flat=radicalFlat();let h=`<div class="section-instruction"><strong>请写出含有偏旁 “木” 或 “阝” 的汉字</strong><br>Viết những chữ Hán có chứa thiên bàng 木 hoặc 阝.</div><div class="radical-grid">`;ex.radical.forEach((it,i)=>{const v=state.answers[key(8,i)]||'';h+=`<div class="${cardClass(8,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.prompt)}</div></div><input class="input-text" maxlength="1" value="${esc(v)}" oninput="setAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Kiểm tra</button></div>${standardFeedback(8,i,it)}</div>`});const ci=ex.radical.length,c=ex.challenge,v=state.answers[key(8,ci)]||'';h+=`</div><div class="section-instruction"><strong>你猜猜</strong><br>${esc(c.prompt)}</div><div class="${cardClass(8,ci,c)}"><div class="qhead"><div class="qnum">★</div><div class="qtext">${esc(c.prompt)}</div></div><input class="input-text" maxlength="1" value="${esc(v)}" oninput="setAnswer(8,${ci},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${ci})">Kiểm tra</button></div>${standardFeedback(8,ci,c)}</div>`;return h}
function renderTranslation(ex){let h=`<div class="section-instruction"><strong>越汉翻译练习</strong><br>Luyện dịch Việt → Hoa. Phần này đối chiếu với đáp án tham khảo, không coi mọi cách khác mẫu là sai.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(9,i)]||'';h+=`<div class="${cardClass(9,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAnswer(9,${i},this.value)">${esc(v)}</textarea><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Đối chiếu câu</button><button class="clear-btn" onclick="clearOne(9,${i})">Làm lại câu</button></div>${standardFeedback(9,i,it)}</div>`});return h}
function renderSection(){const s=state.section,ex=exercises[s-1];document.getElementById('sectionBadge').textContent=`Bài ${s}`;document.getElementById('sectionTitle').textContent=ex.title;let h='';if(s===1)h=renderRead(ex);else if(s===2)h=renderAntonym(ex);else if(s===3)h=renderChoiceFill(ex);else if(s===4)h=renderVerbWrite(ex);else if(s===5)h=renderDialogue(ex);else if(s===6)h=renderPattern(ex);else if(s===7)h=renderHanziFill(ex);else if(s===8)h=renderRadical(ex);else h=renderTranslation(ex);h+=`<div class="navigation-buttons"><button class="nav-btn" ${s===1?'disabled':''} onclick="goSection(${s-1})">← Bài trước</button><button class="nav-btn next" ${s===SECTION_COUNT?'disabled':''} onclick="goSection(${s+1})">Bài sau →</button></div>`;document.getElementById('contentBody').innerHTML=h}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;document.getElementById('progressText').textContent=`${a}/${t}`;document.getElementById('progressFill').style.width=p+'%'}
function openAnswerCard(){let h='',names=sectionNames();for(let s=1;s<=SECTION_COUNT;s++){const a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${esc(names[s])}<br><span class="muted">${t?`${a}/${t} đã làm`:'Tài liệu đọc'}</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restartExam(){if(!confirm('Xóa toàn bộ đáp án và làm lại từ đầu?'))return;try{localStorage.removeItem(STORE)}catch(e){}state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};renderAll()}
function sectionItems(sec){const ex=exercises[sec-1];if(sec===2)return [...ex.pinyinItems,...ex.matchItems];if(sec===5)return dialogueFlat();if(sec===8)return radicalFlat();return ex.data||[]}
function submitExam(){let correct=0,scored=0;for(let sec=2;sec<=SECTION_COUNT;sec++)sectionItems(sec).forEach((it,i)=>{scored++;if(isAccepted(it,state.answers[key(sec,i)]||''))correct++});const pct=scored?Math.round(correct/scored*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${scored}</div><div style="text-align:center;font-weight:700">Kết quả đối chiếu: ${pct}%</div><div style="margin-top:15px;line-height:1.7"><b>Tiến độ:</b> ${totalAnswered()}/${totalCount()} mục đã làm.<br><b>Lưu ý:</b> Các câu tự viết, hội thoại và dịch có thể có nhiều cách đúng; hệ thống dùng đáp án tham khảo được phân tích từ nguồn Bài 12, không phải đáp án có sẵn trong DOCX.</div>`;document.getElementById('resultModal').classList.add('show')}
function tick(){const e=Math.floor((Date.now()-(state.startAt||Date.now()))/1000),m=Math.floor(e/60),s=e%60;document.getElementById('timerText').textContent=`Thời gian ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('timerProgress').style.width=Math.min(100,(e%3600)/36)+'%'}
let noteSaveTimer=null;
function openNoteEditor(){const o=document.getElementById('note-editor-overlay'),ed=document.getElementById('rich-editor');if(!o||!ed)return;try{const x=localStorage.getItem(NOTE_STORE);if(x!==null)ed.innerHTML=x}catch(e){}o.classList.add('show');document.body.classList.add('note-open');ed.focus()}
function closeNoteEditor(){const o=document.getElementById('note-editor-overlay');if(o)o.classList.remove('show');document.body.classList.remove('note-open')}
function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor')?.focus();scheduleNoteAutosave()}
function scheduleNoteAutosave(){clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>saveNotes(false),350)}
function saveNotes(closeAfter=false){const ed=document.getElementById('rich-editor');if(!ed)return;try{localStorage.setItem(NOTE_STORE,ed.innerHTML)}catch(e){}if(closeAfter)closeNoteEditor()}
function clearNoteEditor(){if(!confirm('Xóa toàn bộ ghi chú?'))return;const ed=document.getElementById('rich-editor');if(ed){ed.innerHTML='';ed.focus();scheduleNoteAutosave()}}
document.getElementById('rich-editor')?.addEventListener('input',scheduleNoteAutosave);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('note-editor-overlay')?.classList.contains('show'))closeNoteEditor()});
restoreProgress(false);setInterval(tick,1000);tick();
</script>
</body></html>
