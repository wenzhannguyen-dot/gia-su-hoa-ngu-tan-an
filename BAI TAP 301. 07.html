const STORE='BAI_TAP_301_07_FINAL_V1';
const NOTE_STORE='BAI301_BAI07_NOTES_FINAL_V1';
const state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:（）()]/g,'')}
function key(sec,item){return sec+'-'+item}
function acceptedList(it){return it.accepted||[it.answer||it.hanzi||it.cn||it.sample]}
function itemAccepted(it,val){return acceptedList(it).some(a=>norm(a)===norm(val))}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function restoreProgress(show=false){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x){Object.assign(state,x);if(state.section>MAX_SECTION)state.section=1;renderAll();if(show)alert('Đã khôi phục tiến độ.')}else if(show)alert('Chưa có tiến độ đã lưu.')}catch(e){if(show)alert('Không thể khôi phục dữ liệu.')}}
function sectionNames(){return ['','Phiên âm','Dịch từ','Điền từ','Đổi thành câu hỏi','Sắp xếp câu','Hoàn thành đối thoại','不 / 没','Viết chữ Hán','Chữ có 月 / 宀','Dịch Việt → Hoa']}
function fillItems(){return exercises[3].passage.filter(x=>x.type==='blank')}
function itemCount(sec){if(sec===3)return fillItems().length;if(sec===9)return exercises[9].data.length+exercises[9].think.length;return exercises[sec].data.length}
function answeredCount(sec){let n=0;for(let i=0;i<itemCount(sec);i++)if(String(state.answers[key(sec,i)]??'').trim())n++;return n}
function totalCount(){let n=0;for(let s=1;s<=MAX_SECTION;s++)n+=itemCount(s);return n}
function totalAnswered(){let n=0;for(let s=1;s<=MAX_SECTION;s++)n+=answeredCount(s);return n}
function renderNav(){let h='';for(let s=1;s<=MAX_SECTION;s++)h+=`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`;document.getElementById('sectionNav').innerHTML=h}
function goSection(s){state.section=Math.max(1,Math.min(MAX_SECTION,s));save();renderSection();renderNav()}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
function setAnswer(sec,i,v){state.answers[key(sec,i)]=v;delete state.checked[key(sec,i)];save();renderNav()}
function checkOne(sec,i){state.checked[key(sec,i)]=true;save();renderSection();renderNav()}
function feedback(sec,i,it,label='Đáp án tham khảo'){if(!state.checked[key(sec,i)])return '<div class="feedback"></div>';const v=state.answers[key(sec,i)]||'',ok=itemAccepted(it,v);const ans=it.answer||it.hanzi||it.cn||it.sample;return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div>${label}: <span class="correct-answer">${esc(ans)}</span></div><div><b>Giải thích:</b> ${esc(it.ex||'Dùng đáp án tham khảo để đối chiếu cấu trúc và ngữ nghĩa.')}</div></div>`}
function renderPinyin(ex){let h='<div class="section-instruction"><strong>Phiên âm cho những từ dưới đây.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(1,i)]||'',c=!!state.checked[key(1,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="hanzi-big">${esc(it.hanzi)}</div></div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(1,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(1,${i})">Kiểm tra câu</button></div>${feedback(1,i,it,'Pinyin tham khảo')}</div>`});return h}
function wordTranslateOk(it,v){return (it.accepted||[it.sample]).some(a=>norm(a)===norm(v))}
function renderWordTranslate(ex){let h='<div class="section-instruction"><strong>Phiên dịch cho những từ dưới đây.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(2,i)]||'',c=!!state.checked[key(2,i)],ok=wordTranslateOk(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="hanzi-big" style="font-size:30px">${esc(it.hanzi)}</div><div class="muted">${esc(it.pinyin)}</div></div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(2,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(2,${i})">Đối chiếu</button></div>${wordFeedback(i,it)}</div>`});return h}
function wordFeedback(i,it){if(!state.checked[key(2,i)])return '<div class="feedback"></div>';const ok=wordTranslateOk(it,state.answers[key(2,i)]||'');return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div>Đáp án tham khảo: <span class="correct-answer">${esc(it.sample)}</span></div><div><b>Giải thích:</b> ${esc(it.ex)}</div></div>`}
function renderFill(ex){let h=`<div class="section-instruction"><strong>Dùng những từ ngữ trên điền vào chỗ trống — chọn đáp án.</strong><div class="word-bank">${ex.wordBank.map(w=>`<span class="word-chip">${esc(w)}</span>`).join('')}</div></div><div class="question-card"><div class="passage" style="line-height:2.8">`;let i=0;ex.passage.forEach(t=>{if(t.type==='text')h+=esc(t.text);else if(t.type==='newline')h+='<br>'+esc(t.text);else{const idx=i++,v=state.answers[key(3,idx)]||'',opts=t.options||ex.wordBank;h+=`<select class="blank-select" onchange="setAnswer(3,${idx},this.value)"><option value="">-- Chọn --</option>${opts.map(o=>`<option value="${esc(o)}" ${norm(v)===norm(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`}});h+='</div></div>';fillItems().forEach((it,idx)=>{const c=!!state.checked[key(3,idx)],ok=itemAccepted(it,state.answers[key(3,idx)]||'');h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${idx+1}</div><div class="qtext">Chỗ trống ${idx+1}</div></div><div class="check-row"><button class="check-btn" onclick="checkOne(3,${idx})">Kiểm tra câu</button></div>${feedback(3,idx,it,'Đáp án')}</div>`});return h}
function renderTransform(ex){let h='<div class="section-instruction"><strong>Đổi những câu có số thứ tự trong đoạn văn trên thành câu hỏi.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(4,i)]||'',c=!!state.checked[key(4,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.original)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(4,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(4,${i})">Đối chiếu</button></div>${feedback(4,i,it)}</div>`});return h}
function arrangeTokenId(i,j){return (exercises[5].data[i].words[j]||'')+'#'+j}
function arrangeSelected(i){return (state.answers[key(5,i)]||'').split('|||').filter(Boolean)}
function setArrangeSelected(i,a){state.answers[key(5,i)]=a.join('|||');delete state.checked[key(5,i)];save();renderSection();renderNav()}
function arrangeValue(i){return arrangeSelected(i).map(x=>x.replace(/#\d+$/,'')).join('')}
function arrangeOk(i,it){return [it.answer,...(it.accepted||[])].some(a=>norm(a)===norm(arrangeValue(i)))}
function arrangeCardClass(i,it){if(!state.checked[key(5,i)])return 'question-card';return 'question-card checked '+(arrangeOk(i,it)?'correct':'wrong')}
function renderArrange(ex){let h='<div class="section-instruction"><strong>Sắp xếp từ thành câu — kéo thả các thẻ từ.</strong></div>';ex.data.forEach((it,i)=>{const toks=it.words,selected=arrangeSelected(i);h+=`<div class="${arrangeCardClass(i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">Kéo các từ vào vùng đáp án theo đúng thứ tự.</div></div><div class="arrange-answer-zone" data-arrange-i="${i}" ondragover="allowArrangeDrop(event,this)" ondragleave="leaveArrangeDrop(event,this)" ondrop="dropArrangeEnd(event,${i})">${selected.map((id,pos)=>{const m=id.match(/#(\d+)$/),j=m?Number(m[1]):-1,t=j>=0?toks[j]:id.replace(/#\d+$/,'');return `<button type="button" class="token arrange-token answer-token" draggable="true" data-arrange-i="${i}" data-pos="${pos}" data-token-j="${j}" ondragstart="beginArrangeDrag(event,${i},${j},'answer')" ondragend="endArrangeDrag(event)" ondragover="allowArrangeDrop(event,this)" ondrop="dropArrangeAt(event,${i},${pos})" onpointerdown="startPointerArrange(event,${i},${j},'answer')">${esc(t)}</button>`}).join('')}</div><div class="arrange-separator"></div><div class="arrange-bank-zone" data-arrange-i="${i}" ondragover="allowArrangeDrop(event,this)" ondragleave="leaveArrangeDrop(event,this)" ondrop="dropArrangeBank(event,${i})">${toks.map((t,j)=>{const id=t+'#'+j;return selected.includes(id)?'':`<button type="button" class="token arrange-token bank-token" draggable="true" data-arrange-i="${i}" data-token-j="${j}" ondragstart="beginArrangeDrag(event,${i},${j},'bank')" ondragend="endArrangeDrag(event)" onpointerdown="startPointerArrange(event,${i},${j},'bank')">${esc(t)}</button>`}).join('')}</div><div class="check-row"><button class="check-btn" onclick="checkOne(5,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearArrange(${i})">Làm lại câu</button></div>${arrangeFeedback(i,it)}</div>`});return h}
function arrangeFeedback(i,it){if(!state.checked[key(5,i)])return '<div class="feedback"></div>';const ok=arrangeOk(i,it);return `<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div>${ok?'':`<div>Đáp án tham khảo: <span class="correct-answer">${esc(it.answer)}</span></div>`}<div><b>Giải thích:</b> ${esc(it.ex)}</div></div>`}
function clearArrange(i){delete state.answers[key(5,i)];delete state.checked[key(5,i)];save();renderSection();renderNav()}
let arrangeDrag=null;
function beginArrangeDrag(event,i,j,from){arrangeDrag={i,j,from};event.currentTarget.classList.add('dragging');try{event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',String(j))}catch(e){}}
function endArrangeDrag(event){event?.currentTarget?.classList.remove('dragging');document.querySelectorAll('.arrange-answer-zone.drag-over,.arrange-bank-zone.drag-over').forEach(el=>el.classList.remove('drag-over'));arrangeDrag=null}
function allowArrangeDrop(event,el){event.preventDefault();if(event.dataTransfer)event.dataTransfer.dropEffect='move';el?.classList?.add('drag-over')}
function leaveArrangeDrop(event,el){if(!el)return;const r=el.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)el.classList.remove('drag-over')}
function moveArrangeToken(i,j,where,pos=null){if(i<0||j<0)return;let a=arrangeSelected(i),id=arrangeTokenId(i,j),old=a.indexOf(id);if(old>=0)a.splice(old,1);if(where==='answer'){let p=pos==null?a.length:Number(pos);if(!Number.isFinite(p))p=a.length;p=Math.max(0,Math.min(p,a.length));a.splice(p,0,id)}setArrangeSelected(i,a)}
function dropArrangeEnd(event,i){event.preventDefault();event.stopPropagation();event.currentTarget?.classList.remove('drag-over');if(!arrangeDrag||arrangeDrag.i!==i)return;moveArrangeToken(i,arrangeDrag.j,'answer');arrangeDrag=null}
function dropArrangeAt(event,i,pos){event.preventDefault();event.stopPropagation();if(!arrangeDrag||arrangeDrag.i!==i)return;let p=pos;if(arrangeDrag.from==='answer'){const a=arrangeSelected(i),id=arrangeTokenId(i,arrangeDrag.j),old=a.indexOf(id);if(old>=0&&old<pos)p=pos-1}moveArrangeToken(i,arrangeDrag.j,'answer',p);arrangeDrag=null}
function dropArrangeBank(event,i){event.preventDefault();event.stopPropagation();if(!arrangeDrag||arrangeDrag.i!==i)return;moveArrangeToken(i,arrangeDrag.j,'bank');arrangeDrag=null}
let pointerArrange=null;
function startPointerArrange(event,i,j,from){if(event.pointerType==='mouse')return;event.preventDefault();const src=event.currentTarget,ghost=src.cloneNode(true);ghost.removeAttribute('draggable');ghost.classList.add('arrange-drag-ghost');ghost.style.width=src.getBoundingClientRect().width+'px';document.body.appendChild(ghost);pointerArrange={i,j,from,ghost};movePointerGhost(event.clientX,event.clientY);document.addEventListener('pointermove',pointerArrangeMove,{passive:false});document.addEventListener('pointerup',pointerArrangeEnd,{passive:false,once:true});document.addEventListener('pointercancel',pointerArrangeEnd,{passive:false,once:true})}
function movePointerGhost(x,y){if(pointerArrange?.ghost){pointerArrange.ghost.style.left=x+'px';pointerArrange.ghost.style.top=y+'px'}}
function pointerArrangeMove(event){if(!pointerArrange)return;event.preventDefault();movePointerGhost(event.clientX,event.clientY);document.querySelectorAll('.arrange-answer-zone.drag-over,.arrange-bank-zone.drag-over').forEach(el=>el.classList.remove('drag-over'));const el=document.elementFromPoint(event.clientX,event.clientY),zone=el?.closest?.('.arrange-answer-zone,.arrange-bank-zone');if(zone&&Number(zone.dataset.arrangeI)===pointerArrange.i)zone.classList.add('drag-over')}
function pointerInsertPos(zone,x,y,j){const items=[...zone.querySelectorAll('.answer-token')].filter(el=>Number(el.dataset.tokenJ)!==j);for(let k=0;k<items.length;k++){const r=items[k].getBoundingClientRect();if(y<r.top+r.height/2||(y<=r.bottom&&x<r.left+r.width/2))return k}return items.length}
function pointerArrangeEnd(event){if(!pointerArrange)return;event.preventDefault();const p=pointerArrange;document.removeEventListener('pointermove',pointerArrangeMove);p.ghost?.remove();document.querySelectorAll('.arrange-answer-zone.drag-over,.arrange-bank-zone.drag-over').forEach(el=>el.classList.remove('drag-over'));const el=document.elementFromPoint(event.clientX,event.clientY),answer=el?.closest?.('.arrange-answer-zone'),bank=el?.closest?.('.arrange-bank-zone');pointerArrange=null;if(answer&&Number(answer.dataset.arrangeI)===p.i){moveArrangeToken(p.i,p.j,'answer',pointerInsertPos(answer,event.clientX,event.clientY,p.j))}else if(bank&&Number(bank.dataset.arrangeI)===p.i)moveArrangeToken(p.i,p.j,'bank')}
function renderDialogue(ex){let h='<div class="section-instruction"><strong>Hoàn thành đối thoại.</strong></div>';const groups=[...new Set(ex.data.map(x=>x.dialogue))];groups.forEach(g=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${g}</div><div class="qtext" style="width:100%">`;ex.data.forEach((it,i)=>{if(it.dialogue!==g)return;const v=state.answers[key(6,i)]||'';h+=`<div style="white-space:pre-line;margin-bottom:8px">${esc(it.prompt)}</div><input class="input-text" value="${esc(v)}" oninput="setAnswer(6,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(6,${i})">Đối chiếu</button></div>${feedback(6,i,it)}`});h+='</div></div></div>'});return h}
function renderBuMei(ex){let h='<div class="section-instruction"><strong>Dùng 不 hoặc 没 điền vào chỗ trống — chọn đáp án.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(7,i)]||'',c=!!state.checked[key(7,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.sentence)}</div></div><select class="blank-select" onchange="setAnswer(7,${i},this.value)"><option value="">-- Chọn --</option>${it.options.map(o=>`<option value="${esc(o)}" ${norm(v)===norm(o)?'selected':''}>${esc(o)}</option>`).join('')}</select><div class="check-row"><button class="check-btn" onclick="checkOne(7,${i})">Kiểm tra câu</button></div>${feedback(7,i,it,'Đáp án')}</div>`});return h}
function renderHanzi(ex){let h='<div class="section-instruction"><strong>Viết chữ Hán dựa theo phiên âm.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(8,i)]||'',c=!!state.checked[key(8,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.pinyin)}</b></div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Kiểm tra câu</button></div>${feedback(8,i,it)}</div>`});return h}
function renderRadical(ex){let h='<div class="section-instruction"><strong>Viết những chữ Hán có chứa thành phần “月” hoặc “宀”.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(9,i)]||'',c=!!state.checked[key(9,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.prompt)}</div></div><input class="input-text" maxlength="1" value="${esc(v)}" oninput="setAnswer(9,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Kiểm tra câu</button></div>${feedback(9,i,it)}</div>`});h+='<div class="section-instruction" style="margin-top:22px"><strong>你猜猜</strong><br>“两个月” 是一个什么字？</div>';ex.think.forEach((it,j)=>{const i=ex.data.length+j,v=state.answers[key(9,i)]||'',c=!!state.checked[key(9,i)],ok=itemAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">?</div><div class="qtext">${esc(it.prompt)}</div></div><input class="input-text" maxlength="1" value="${esc(v)}" oninput="setAnswer(9,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Đối chiếu</button></div>${feedback(9,i,it)}</div>`});return h}
function translationOk(it,v){return (it.accepted||[it.cn]).some(a=>norm(a)===norm(v))}
function renderTranslation(ex){let h='<div class="section-instruction"><strong>Luyện dịch Việt → Hoa.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(10,i)]||'',c=!!state.checked[key(10,i)],ok=translationOk(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAnswer(10,${i},this.value)">${esc(v)}</textarea><div class="check-row"><button class="check-btn" onclick="checkOne(10,${i})">Đối chiếu đáp án</button></div>${translationFeedback(i,it)}</div>`});return h}
function translationFeedback(i,it){if(!state.checked[key(10,i)])return '<div class="feedback"></div>';const ok=translationOk(it,state.answers[key(10,i)]||'');return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div>Đáp án tham khảo: <span class="correct-answer">${esc(it.cn)}</span></div><div><b>Giải thích:</b> Câu khác mẫu vẫn có thể đúng nếu giữ đúng nghĩa và ngữ pháp; dùng đáp án này để đối chiếu.</div></div>`}
function renderSection(){const s=state.section,n=sectionNames(),ex=exercises[s];document.getElementById('sectionBadge').textContent='Bài '+s;document.getElementById('sectionTitle').textContent=n[s];let h=s===1?renderPinyin(ex):s===2?renderWordTranslate(ex):s===3?renderFill(ex):s===4?renderTransform(ex):s===5?renderArrange(ex):s===6?renderDialogue(ex):s===7?renderBuMei(ex):s===8?renderHanzi(ex):s===9?renderRadical(ex):renderTranslation(ex);h+=`<div class="navigation-buttons"><button class="nav-btn" onclick="goSection(${Math.max(1,s-1)})" ${s===1?'disabled':''}>上一题 · Bài trước</button><button class="nav-btn next" onclick="goSection(${Math.min(MAX_SECTION,s+1)})" ${s===MAX_SECTION?'disabled':''}>下一题 · Bài sau</button></div>`;document.getElementById('contentBody').innerHTML=h;window.scrollTo(0,0)}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;document.getElementById('progressText').textContent=`${a}/${t}`;document.getElementById('progressFill').style.width=p+'%'}
function openAnswerCard(){let h='',n=sectionNames();for(let s=1;s<=MAX_SECTION;s++){let a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${esc(n[s])}<br><span class="muted">${a}/${t} đã làm</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restartExam(){if(!confirm('Xóa toàn bộ đáp án và làm lại từ đầu?'))return;try{localStorage.removeItem(STORE)}catch(e){}state.section=1;state.answers={};state.checked={};state.startAt=Date.now();state.fontLarge=false;renderAll()}
function submitExam(){let correct=0,objective=0;[1,4,6,7,8].forEach(sec=>exercises[sec].data.forEach((it,i)=>{objective++;if(itemAccepted(it,state.answers[key(sec,i)]||''))correct++}));fillItems().forEach((it,i)=>{objective++;if(itemAccepted(it,state.answers[key(3,i)]||''))correct++});exercises[5].data.forEach((it,i)=>{objective++;if(arrangeOk(i,it))correct++});exercises[9].data.forEach((it,i)=>{objective++;if(itemAccepted(it,state.answers[key(9,i)]||''))correct++});const pct=objective?Math.round(correct/objective*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${objective}</div><div style="text-align:center;font-weight:700">Kết quả phần có đáp án xác định: ${pct}%</div><div style="margin-top:15px;line-height:1.7"><b>Tiến độ toàn bài:</b> ${totalAnswered()}/${totalCount()}.<br><b>Bài 2, câu hỏi mở ở Bài 4/6, mục 你猜猜 và Bài 10:</b> dùng đáp án tham khảo để đối chiếu, không chấm máy móc một cách diễn đạt duy nhất.</div>`;document.getElementById('resultModal').classList.add('show')}
function tick(){const e=Math.floor((Date.now()-(state.startAt||Date.now()))/1000),m=Math.floor(e/60),ss=e%60;document.getElementById('timerText').textContent=`Thời gian ${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;document.getElementById('timerProgress').style.width=Math.min(100,(e%3600)/36)+'%'}
let noteSaveTimer=null;function openNoteEditor(){const o=document.getElementById('note-editor-overlay'),ed=document.getElementById('rich-editor');if(!o||!ed)return;try{const x=localStorage.getItem(NOTE_STORE);if(x!==null)ed.innerHTML=x}catch(e){}o.classList.add('show');document.body.classList.add('note-open');ed.focus()}function closeNoteEditor(){document.getElementById('note-editor-overlay')?.classList.remove('show');document.body.classList.remove('note-open')}function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor')?.focus();scheduleNoteAutosave()}function scheduleNoteAutosave(){clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>saveNotes(false),350)}function saveNotes(closeAfter=false){const ed=document.getElementById('rich-editor');if(!ed)return;try{localStorage.setItem(NOTE_STORE,ed.innerHTML)}catch(e){}if(closeAfter)closeNoteEditor()}function clearNoteEditor(){if(!confirm('Xóa toàn bộ ghi chú?'))return;const ed=document.getElementById('rich-editor');if(ed){ed.innerHTML='';ed.focus();scheduleNoteAutosave()}}
document.getElementById('rich-editor')?.addEventListener('input',scheduleNoteAutosave);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('note-editor-overlay')?.classList.contains('show'))closeNoteEditor()});restoreProgress(false);renderAll();setInterval(tick,1000);tick();
</script>
</body></html>
