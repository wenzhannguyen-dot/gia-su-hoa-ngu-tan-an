function goSection(s){if(s<1||s>SECTION_COUNT)return;state.section=s;save();renderNav();renderSection()}
function renderStudy(){return `<div class="section-instruction"><strong>熟读词语 — Đọc thuộc những cụm từ bên dưới.</strong><div class="muted">Pinyin và nghĩa Việt là phần hỗ trợ học tập bổ sung; cụm chữ Hán giữ theo nguồn Bài 15.</div></div>`+DATA.study.map(g=>`<div class="question-card"><div class="qtext"><b style="font-size:27px">${g.head}</b><div style="color:#1976d2">${g.p}</div><div>${g.m}</div><div style="margin-top:10px">${g.lines.map(x=>`<div style="padding:7px 0;border-top:1px dashed #e2e2e2"><b>${x.cn}</b><br><span style="color:#1976d2">${x.p}</span><br><span>${x.m}</span></div>`).join('')}</div></div></div>`).join('')}
function renderPart2(){let h=`<div class="section-instruction"><strong>给下面的词注音，然后选词填空。</strong></div>`;DATA.pinyin.forEach((x,i)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${x.hanzi}</b></div></div>${inputBox(2,i)}<div class="check-row"><button class="check-btn" onclick="check(2,${i})">Kiểm tra câu</button></div>${fb(2,i,x.answer,x.accepted,x.ex)}</div>`});h+=`<div class="section-instruction"><strong>选词填空 — Chọn từ điền vào chỗ trống.</strong></div>`;DATA.choices.forEach((x,i)=>{let k=i+DATA.pinyin.length;h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${x.source}</div></div>${radio(2,k,x.options,x.answer)}<div class="check-row"><button class="check-btn" onclick="check(2,${k})">Kiểm tra câu</button></div>${fb(2,k,x.answer,[x.answer],x.ex)}</div>`});return h}
function arrSel(i){return (state.answers[key(3,i)]||'').split('|||').filter(Boolean)}
function setArr(i,a){state.answers[key(3,i)]=a.join('|||');delete state.checked[key(3,i)];save();renderSection()}
function renderArrange(){return `<div class="section-instruction"><strong>组词成句 — Sắp xếp từ thành câu.</strong></div>`+DATA.arrange.map((x,i)=>{let sel=arrSel(i),used={};sel.forEach(t=>used[t]=(used[t]||0)+1);let remain=x.words.map((t,j)=>({t,j,id:t+'#'+j})).filter(o=>!sel.includes(o.id));let val=sel.map(z=>z.replace(/#\d+$/,'')).join('');let ok=accepted(val,x.accepted||[x.answer]);return `<div class="question-card ${state.checked[key(3,i)]?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div></div><div class="arrange-answer-zone" ondragover="event.preventDefault()" ondrop="dropEnd(event,${i})">${sel.map(id=>{let j=+id.match(/#(\d+)$/)[1],t=x.words[j];return `<button class="token arrange-token answer-token" draggable="true" ondragstart="dragTok(event,${i},${j},'a')">${t}</button>`}).join('')}</div><div class="arrange-bank-zone" ondragover="event.preventDefault()" ondrop="dropBank(event,${i})">${remain.map(o=>`<button class="token arrange-token" draggable="true" ondragstart="dragTok(event,${i},${o.j},'b')" onclick="moveTok(${i},${o.j},true)">${o.t}</button>`).join('')}</div><div class="check-row"><button class="check-btn" onclick="check(3,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="setArr(${i},[])">Làm lại câu</button></div>${fb(3,i,x.answer,x.accepted||[x.answer],x.ex)}</div>`}).join('')}
let drag=null;function dragTok(e,i,j,from){drag={i,j,from};try{e.dataTransfer.setData('text/plain',String(j))}catch(_){}}function moveTok(i,j,toAns){let a=arrSel(i),id=DATA.arrange[i].words[j]+'#'+j;a=a.filter(x=>x!==id);if(toAns)a.push(id);setArr(i,a)}function dropEnd(e,i){e.preventDefault();if(drag&&drag.i===i)moveTok(i,drag.j,true);drag=null}function dropBank(e,i){e.preventDefault();if(drag&&drag.i===i)moveTok(i,drag.j,false);drag=null}
function renderDialogue(){let idx=0,h=`<div class="section-instruction"><strong>完成对话 — Hoàn thành đối thoại.</strong></div>`;DATA.dialogue.forEach((g,gi)=>{let ids=[];let body=g.lines.map(line=>{let [sp,pre,loc,suf]=line;if(loc===null)return `<div><b>${sp}：</b>${pre}</div>`;let id=idx++;ids.push(id);return `<div><b>${sp}：</b>${pre} <span style="display:inline-block;min-width:260px">${inputBox(4,id)}</span>${suf}</div>`}).join('');h+=`<div class="question-card"><div class="qhead"><div class="qnum">${gi+1}</div><div class="qtext" style="width:100%;line-height:2.2">${body}</div></div><div class="check-row"><button class="check-btn" onclick="checkGroup4([${ids.join(',')}])">Kiểm tra đoạn</button></div>${ids.some(id=>state.checked[key(4,id)])?`<div class="feedback show sample">${ids.map((id,j)=>{let it=g.items[j],v=state.answers[key(4,id)]||'',ok=accepted(v,it.accepted||[it.answer]);return `<div style="margin:8px 0"><b>${ok?'✓':'△'} Đáp án tham khảo:</b> <span class="correct-answer">${it.answer}</span><br><b>Giải thích:</b> ${it.ex}</div>`}).join('')}</div>`:''}</div>`});return h}
function checkGroup4(ids){ids.forEach(i=>state.checked[key(4,i)]=true);save();renderSection();renderNav()}
function renderHanzi(){return `<div class="section-instruction"><strong>根据拼音写出汉字。</strong></div>`+DATA.hanzi.map((x,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${x.p}</b></div></div>${inputBox(5,i)}<div class="check-row"><button class="check-btn" onclick="check(5,${i})">Kiểm tra câu</button></div>${fb(5,i,x.answer,x.accepted,x.ex)}</div>`).join('')}
function renderContext(){let h=`<div class="section-instruction"><strong>根据上下文的意思用词填空。</strong></div><div class="question-card"><div class="passage">${DATA.contextSource}</div></div>`;DATA.context.forEach((x,i)=>{h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">Chỗ trống ${i+1}</div></div>${radio(6,i,x.options,x.answer)}<div class="check-row"><button class="check-btn" onclick="check(6,${i})">Kiểm tra câu</button></div>${fb(6,i,x.answer,[x.answer],x.ex)}</div>`});return h}
function renderRadical(){let h=`<div class="section-instruction"><strong>请写出含有偏旁 “纟”或 “人” 的汉子。</strong></div>`;DATA.radical.forEach((x,i)=>h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${x.prompt}</div></div>${inputBox(7,i)}<div class="check-row"><button class="check-btn" onclick="check(7,${i})">Kiểm tra câu</button></div>${fb(7,i,x.answer,[x.answer],x.ex)}</div>`);let ci=DATA.radical.length,c=DATA.challenge;h+=`<div class="section-instruction"><strong>你猜猜</strong><div>${c.prompt}</div></div><div class="question-card"><div class="qhead"><div class="qnum">猜</div></div>${inputBox(7,ci)}<div class="check-row"><button class="check-btn" onclick="check(7,${ci})">Kiểm tra câu</button></div>${fb(7,ci,c.answer,c.accepted,c.ex)}</div>`;return h}
function renderTranslation(){return `<div class="section-instruction"><strong>越汉翻译练习 — Luyện dịch Việt → Hoa.</strong></div>`+DATA.translations.map((x,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${x.vi}</div></div><textarea class="input-area" oninput="setAns(8,${i},this.value)">${esc(state.answers[key(8,i)]||'')}</textarea><div class="check-row"><button class="check-btn" onclick="check(8,${i})">Đối chiếu đáp án</button></div>${fb(8,i,x.answer,x.accepted,x.ex,true)}</div>`).join('')}
function renderSection(){let s=state.section;document.getElementById('sectionBadge').textContent='Bài '+s;document.getElementById('sectionTitle').textContent=sectionNames()[s];let h=s===1?renderStudy():s===2?renderPart2():s===3?renderArrange():s===4?renderDialogue():s===5?renderHanzi():s===6?renderContext():s===7?renderRadical():renderTranslation();h+=`<div class="navigation-buttons"><button class="nav-btn" ${s===1?'disabled':''} onclick="goSection(${s-1})">← Bài trước</button><button class="nav-btn next" ${s===SECTION_COUNT?'disabled':''} onclick="goSection(${s+1})">Bài sau →</button></div>`;document.getElementById('contentBody').innerHTML=h}
function itemCount(s){if(s===1)return 0;if(s===2)return DATA.pinyin.length+DATA.choices.length;if(s===3)return DATA.arrange.length;if(s===4)return DATA.dialogue.reduce((n,g)=>n+g.items.length,0);if(s===5)return DATA.hanzi.length;if(s===6)return DATA.context.length;if(s===7)return DATA.radical.length+1;return DATA.translations.length}
function answeredCount(s){let n=0;for(let i=0;i<itemCount(s);i++)if(String(state.answers[key(s,i)]||'').trim())n++;return n}
function updateProgress(){let t=0,a=0;for(let s=1;s<=SECTION_COUNT;s++){t+=itemCount(s);a+=answeredCount(s)}let el=document.getElementById('progressText');if(el)el.textContent=a+'/'+t;let f=document.getElementById('progressFill');if(f)f.style.width=(t?a/t*100:0)+'%'}
function openAnswerCard(){document.getElementById('answerGrid').innerHTML=Array.from({length:SECTION_COUNT},(_,i)=>i+1).map(s=>`<div class="answer-cell ${answeredCount(s)===itemCount(s)&&itemCount(s)?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${sectionNames()[s]}<br><span class="muted">${itemCount(s)?answeredCount(s)+'/'+itemCount(s)+' đã làm':'Tài liệu đọc'}</span></div>`).join('');document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restoreProgress(show=false){try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x)Object.assign(state,x)}catch(e){}renderAll();if(show)alert('Đã khôi phục tiến độ (nếu có).')}
function restartExam(){if(!confirm('Làm lại toàn bộ Bài 15? Ghi chú vẫn được giữ.'))return;state.answers={};state.checked={};state.section=1;state.startAt=Date.now();save();renderAll()}
function submitExam(){let total=0,correct=0;function add(ok){total++;if(ok)correct++};DATA.pinyin.forEach((x,i)=>add(accepted(state.answers[key(2,i)]||'',x.accepted)));DATA.choices.forEach((x,i)=>add(norm(state.answers[key(2,i+5)]||'')===norm(x.answer)));DATA.arrange.forEach((x,i)=>{let v=arrSel(i).map(z=>z.replace(/#\d+$/,'')).join('');add(accepted(v,x.accepted||[x.answer]))});let d=0;DATA.dialogue.forEach(g=>g.items.forEach(it=>add(accepted(state.answers[key(4,d++)]||'',it.accepted||[it.answer]))));DATA.hanzi.forEach((x,i)=>add(accepted(state.answers[key(5,i)]||'',x.accepted)));DATA.context.forEach((x,i)=>add(norm(state.answers[key(6,i)]||'')===norm(x.answer)));DATA.radical.forEach((x,i)=>add(norm(state.answers[key(7,i)]||'')===norm(x.answer)));add(accepted(state.answers[key(7,DATA.radical.length)]||'',DATA.challenge.accepted));DATA.translations.forEach((x,i)=>add(accepted(state.answers[key(8,i)]||'',x.accepted)));document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${total}</div><div style="text-align:center">Kết quả đối chiếu đáp án tham khảo.</div>`;document.getElementById('resultModal').classList.add('show')}
function openNoteEditor(){document.getElementById('rich-editor').innerHTML=localStorage.getItem(NOTE_STORE)||'';document.getElementById('note-editor-overlay').classList.add('show');document.body.classList.add('note-open')}function closeNoteEditor(){document.getElementById('note-editor-overlay').classList.remove('show');document.body.classList.remove('note-open')}function saveNotes(show=false){localStorage.setItem(NOTE_STORE,document.getElementById('rich-editor').innerHTML);if(show)alert('Đã lưu ghi chú.')}function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor').focus()}function clearNoteEditor(){document.getElementById('rich-editor').innerHTML=''}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
setInterval(()=>{let sec=Math.floor((Date.now()-state.startAt)/1000),m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');let e=document.getElementById('timerText');if(e)e.textContent='Thời gian '+m+':'+s},1000);
window.addEventListener('load',()=>{restoreProgress(false)});
</script></body></html>
