const SECTION_COUNT=9;
const STORE='BAI_TAP_301_14_FINAL_V1';
const NOTE_STORE='BAI301_BAI14_NOTES_FINAL_V1';
const state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:]/g,'')}
function key(s,i){return s+'-'+i}
function isAccepted(it,v){if(it?.soft)return false;return (it?.accepted||[it?.answer||'']).some(a=>norm(a)===norm(v))}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function setAnswer(s,i,v){state.answers[key(s,i)]=v;delete state.checked[key(s,i)];save();renderNav()}
function checkOne(s,i){state.checked[key(s,i)]=true;save();renderSection();renderNav()}
function clearOne(s,i){delete state.answers[key(s,i)];delete state.checked[key(s,i)];save();renderSection();renderNav()}
function sectionNames(){return ['','熟读词语','注音 + 选词填空','完成对话','词语位置','写出动词的宾语','根据上下文填空','改错句','攵/金 + 你看看','越汉翻译']}
function renderNav(){let h='';for(let s=1;s<=SECTION_COUNT;s++)h+=`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`;document.getElementById('sectionNav').innerHTML=h}
function goSection(s){if(s<1||s>SECTION_COUNT)return;state.section=s;save();renderSection();renderNav()}
function radioChoices(sec,i,opts,v){return `<div class="radio-options">`+opts.map((o,j)=>`<label class="radio-option"><input type="radio" name="q-${sec}-${i}" value="${esc(o)}" ${norm(v)===norm(o)?'checked':''} onchange="setAnswer(${sec},${i},this.value)"><span><b>${letters[j]}.</b> ${esc(o)}</span></label>`).join('')+`</div>`}
function itemCount(sec){
 if(sec===1)return 0;
 if(sec===2)return DATA.pinyin.length+DATA.choices.length;
 if(sec===3)return DATA.dialogue.reduce((n,g)=>n+g.items.length,0);
 if(sec===4)return DATA.positions.length;
 if(sec===5)return DATA.objects.length;
 if(sec===6)return DATA.contextFill.length;
 if(sec===7)return DATA.errors.length;
 if(sec===8)return DATA.radical.length+DATA.challenge.length;
 return DATA.translations.length
}
function answeredCount(sec){let n=0,t=itemCount(sec);for(let i=0;i<t;i++)if(String(state.answers[key(sec,i)]??'').trim())n++;return n}
function totalCount(){let n=0;for(let s=1;s<=SECTION_COUNT;s++)n+=itemCount(s);return n}
function totalAnswered(){let n=0;for(let s=1;s<=SECTION_COUNT;s++)n+=answeredCount(s);return n}
function standardFeedback(sec,i,it,softOpen=false){
 if(!state.checked[key(sec,i)])return '<div class="feedback"></div>';
 const v=state.answers[key(sec,i)]||'';
 if(it.soft)return `<div class="feedback show sample"><div class="status">△ Nguồn mơ hồ – không chấm cứng</div><div>${esc(it.note||'DOCX không đủ căn cứ để xác định một đáp án duy nhất.')}</div></div>`;
 const ok=isAccepted(it,v);
 const cls=softOpen?(ok?'correct':'sample'):(ok?'correct':'wrong');
 const status=softOpen?(ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'):(ok?'✓ Đúng':'✗ Chưa đúng');
 return `<div class="feedback show ${cls}"><div class="status">${status}</div>${(!ok||softOpen)?`<div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span></div>`:''}<div><b>Giải thích:</b> ${esc(it.ex||'')}</div></div>`
}
function cardClass(sec,i,it,softOpen=false){
 if(!state.checked[key(sec,i)])return 'question-card';
 if(it.soft)return 'question-card checked';
 const ok=isAccepted(it,state.answers[key(sec,i)]||'');
 return 'question-card checked '+(ok?'correct':(softOpen?'':'wrong'))
}

 DATA.study.forEach(g=>{h+=`<div class="phrase-group"><div class="phrase-head">${esc(g.head)}</div><div class="phrase-head-pinyin">${esc(g.p)}</div><div class="phrase-head-meaning">${esc(g.m)}</div>`;g.lines.forEach(x=>h+=`<div class="phrase-line"><div class="phrase-cn">${esc(x.cn)}</div><div class="phrase-pinyin">${esc(x.p)}</div><div class="phrase-meaning">${esc(x.m)}</div></div>`);h+='</div>'});return h+'</div>'
}

 DATA.choices.forEach((it,j)=>{const i=DATA.pinyin.length+j,v=state.answers[key(2,i)]||'';h+=`<div class="${cardClass(2,i,it)}"><div class="qhead"><div class="qnum">${esc(it.label)}</div><div class="qtext">${esc(it.source)}</div></div>${radioChoices(2,i,it.options,v)}<div class="check-row"><button class="check-btn" onclick="checkOne(2,${i})">${it.soft?'Xem ghi chú nguồn':'Kiểm tra câu'}</button><button class="clear-btn" onclick="clearOne(2,${i})">Làm lại câu</button></div>${standardFeedback(2,i,it)}</div>`});return h

function dInput(sec,i,w=260){return `<input class="input-text" style="display:inline-block;max-width:${w}px;width:min(${w}px,72vw);margin:2px 4px" value="${esc(state.answers[key(sec,i)]||'')}" oninput="setAnswer(${sec},${i},this.value)">`}
function dialogueItems(){return DATA.dialogue.flatMap(g=>g.items)}
function renderDialogue(){
 let h=`<div class="section-instruction"><strong>完成对话 · Hoàn thành đối thoại</strong><br>Tự nhập nội dung; sau khi kiểm tra mới hiện đáp án GPT tham khảo và giải thích.</div>`;let off=0;
 DATA.dialogue.forEach((g,gi)=>{let local=0;const lines=g.lines.map(row=>{const [sp,pre,slot,post]=row;if(slot===null)return `<div><b>${sp}：</b>${esc(pre)}</div>`;const idx=off+slot;local=Math.max(local,slot+1);return `<div><b>${sp}：</b>${esc(pre)}${dInput(3,idx)}${esc(post||'')}</div>`}).join('');const inds=g.items.map((_,j)=>off+j);const checked=inds.some(i=>state.checked[key(3,i)]);const all=inds.every((i,j)=>isAccepted(g.items[j],state.answers[key(3,i)]||''));let fb='<div class="feedback"></div>';if(checked)fb=`<div class="feedback show ${all?'correct':'sample'}">`+g.items.map((it,j)=>{const i=off+j,ok=isAccepted(it,state.answers[key(3,i)]||'');return `<div style="margin:6px 0"><b>${j+1}.</b> ${ok?'✓':'△'} <b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span><br><b>Giải thích:</b> ${esc(it.ex)}</div>`}).join('')+`</div>`;h+=`<div class="question-card ${checked?'checked '+(all?'correct':''):''}"><div class="qhead"><div class="qnum">${gi+1}</div><div class="qtext dialogue-block">${lines}</div></div><div class="check-row"><button class="check-btn" onclick="checkDialogue([${inds.join(',')}])">Kiểm tra đoạn</button></div>${fb}</div>`;off+=g.items.length});return h
}

 let h=`<div class="section-instruction"><strong>给括号内的词找到适当的位置</strong><br>Chọn vị trí A/B/C/D đúng như nguồn; radio hiển thị trực tiếp.</div>`;

}
function renderRadical(){
 let h=`<div class="section-instruction"><strong>请写出含有偏旁 “攵” 或 “金” 的汉字</strong><br>Viết chữ Hán theo đúng các chỗ trống của nguồn.</div>`;
 DATA.radical.forEach((it,i)=>{const v=state.answers[key(8,i)]||'';h+=`<div class="${cardClass(8,i,it)}"><div class="qhead"><div class="qnum">${esc(it.label)}</div><div class="qtext">${esc(it.prompt)}</div></div><input class="input-text" maxlength="2" value="${esc(v)}" oninput="setAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Kiểm tra câu</button></div>${standardFeedback(8,i,it)}</div>`});
 h+=`<div class="subsection-title">***你看看***</div><div class="section-instruction">指出每组汉字不一样的部分，然后在横线上写一个汉字，与给出的汉字组成一个词。<br>Phần “quan sát điểm khác nhau” giữ đúng yêu cầu nguồn; ô nhập bên dưới thực hiện phần “viết thêm một chữ để tạo thành từ”. Đáp án là GPT tham khảo vì DOCX không có đáp án.</div>`;
 let off=DATA.radical.length;
 DATA.challenge.forEach((it,j)=>{const i=off+j,v=state.answers[key(8,i)]||'',checked=state.checked[key(8,i)],ok=isAccepted(it,v);h+=`<div class="question-card ${checked?'checked '+(ok?'correct':''):''}"><div class="qhead"><div class="qnum">${esc(it.group)}</div><div class="qtext"><span class="hanzi-big" style="font-size:28px">${esc(it.base)}</span> + ______</div></div><input class="input-text" maxlength="1" value="${esc(v)}" oninput="setAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Đối chiếu đáp án</button></div>${checked?`<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span> → ${esc(it.word)}</div><div><b>Giải thích:</b> ${esc(it.ex)}</div></div>`:'<div class="feedback"></div>'}</div>`});return h
}
function renderTranslation(){
 let h=`<div class="section-instruction"><strong>越汉翻译练习</strong><br>Luyện dịch Việt → Hoa. DOCX không có đáp án; phần dưới dùng đáp án GPT tham khảo và không coi mọi cách diễn đạt khác là sai tuyệt đối.</div>`;
 DATA.translations.forEach((it,i)=>{const v=state.answers[key(9,i)]||'',checked=state.checked[key(9,i)],ok=isAccepted(it,v);h+=`<div class="question-card ${checked?'checked '+(ok?'correct':''):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAnswer(9,${i},this.value)">${esc(v)}</textarea><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Đối chiếu đáp án</button></div>${standardFeedback(9,i,it,true)}</div>`});return h
}
function renderSection(){const s=state.section;document.getElementById('sectionBadge').textContent=`Bài ${s}`;document.getElementById('sectionTitle').textContent=sectionNames()[s];let h='';if(s===1)h=renderStudy();else if(s===2)h=renderPart2();else if(s===3)h=renderDialogue();else if(s===4)h=renderPositions();else if(s===5)h=renderObjects();else if(s===6)h=renderContextFill();else if(s===7)h=renderErrors();else if(s===8)h=renderRadical();else h=renderTranslation();h+=`<div class="navigation-buttons"><button class="nav-btn" ${s===1?'disabled':''} onclick="goSection(${s-1})">← Bài trước</button><button class="nav-btn next" ${s===SECTION_COUNT?'disabled':''} onclick="goSection(${s+1})">Bài sau →</button></div>`;document.getElementById('contentBody').innerHTML=h}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;document.getElementById('progressText').textContent=`${a}/${t}`;document.getElementById('progressFill').style.width=p+'%'}
function openAnswerCard(){let h='',names=sectionNames();for(let s=1;s<=SECTION_COUNT;s++){const a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${esc(names[s])}<br><span class="muted">${t?`${a}/${t} đã làm`:'Tài liệu đọc'}</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restoreProgress(show=false){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x){Object.assign(state,x);renderAll();if(show)alert('Đã khôi phục tiến độ.')}else if(show)alert('Chưa có tiến độ đã lưu.')}catch(e){if(show)alert('Không thể khôi phục dữ liệu.')}}
function restartExam(){if(!confirm('Làm lại toàn bộ bài? Ghi chú sẽ được giữ nguyên.'))return;state.section=1;state.answers={};state.checked={};state.startAt=Date.now();state.fontLarge=false;save();renderAll()}
function scoreItems(sec){
 if(sec===2)return [...DATA.pinyin.map((x,i)=>({it:x,i})),...DATA.choices.map((x,j)=>({it:x,i:DATA.pinyin.length+j})).filter(x=>!x.it.soft)];
 if(sec===3)return dialogueItems().map((it,i)=>({it,i}));
 if(sec===4)return DATA.positions.map((it,i)=>({it,i}));
 if(sec===5)return DATA.objects.map((it,i)=>({it,i}));
 if(sec===6)return DATA.contextFill.map((it,i)=>({it,i}));
 if(sec===7)return DATA.errors.map((it,i)=>({it,i}));
 if(sec===8)return [...DATA.radical,...DATA.challenge].map((it,i)=>({it,i}));
 return DATA.translations.map((it,i)=>({it,i}))
}
function submitExam(){let correct=0,total=0;for(let sec=2;sec<=9;sec++)scoreItems(sec).forEach(({it,i})=>{total++;if(isAccepted(it,state.answers[key(sec,i)]||''))correct++});const pct=total?Math.round(correct/total*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${total}</div><div style="text-align:center"><b>${pct}%</b></div><p class="muted" style="text-align:center;margin-top:10px">4 ô của câu 6 Bài 2 không được tính điểm vì DOCX nguồn không đủ căn cứ xác định đáp án duy nhất. Các câu hội thoại, tân ngữ mở, 你看看 và dịch chỉ đối chiếu theo đáp án tham khảo.</p>`;document.getElementById('resultModal').classList.add('show')}
function noteCommand(cmd,val=null){document.getElementById('rich-editor').focus();try{document.execCommand(cmd,false,val)}catch(e){}}
function openNoteEditor(){try{document.getElementById('rich-editor').innerHTML=localStorage.getItem(NOTE_STORE)||''}catch(e){}document.getElementById('note-editor-overlay').classList.add('show');document.body.classList.add('note-open')}
function closeNoteEditor(){document.getElementById('note-editor-overlay').classList.remove('show');document.body.classList.remove('note-open')}
function saveNotes(show=false){try{localStorage.setItem(NOTE_STORE,document.getElementById('rich-editor').innerHTML);if(show)alert('Đã lưu ghi chú.')}catch(e){}}
function clearNoteEditor(){if(confirm('Xóa toàn bộ nội dung ghi chú?'))document.getElementById('rich-editor').innerHTML=''}
function updateTimer(){const sec=Math.floor((Date.now()-state.startAt)/1000),m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');document.getElementById('timerText').textContent=`Thời gian ${m}:${s}`}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
window.addEventListener('load',()=>{restoreProgress(false);renderAll();setInterval(updateTimer,1000);updateTimer()});

</script>
</body>
</html>
