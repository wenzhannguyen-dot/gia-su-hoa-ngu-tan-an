name: Repair HSK08 online audio
on:
  push:
    paths:
      - .github/workflows/hsk08-online-audio-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch HTML audio clock and seeking
        shell: python
        run: |
          from pathlib import Path
          p = Path("H5GS08TT.html")
          s = p.read_text(encoding="utf-8")
          old1 = """  studySound.currentTime=segment.start;
           if(request!==studyAudioRequest||segment!==studySegment)return;
           await studySound.play();"""
          # allow original indentation to remain exact
          needle = "  studySound.currentTime=segment.start;\n   if(request!==studyAudioRequest||segment!==studySegment)return;\n   await studySound.play();"
          replacement = """  studySound.currentTime=segment.start;
             // Wait for HTTP range seeking to finish before playback.
             if(studySound.seeking){
              await new Promise((resolve,reject)=>{
               const timeout=setTimeout(()=>{cleanup();resolve()},10000);
               const cleanup=()=>{clearTimeout(timeout);studySound.removeEventListener('seeked',done);studySound.removeEventListener('error',fail)};
               const done=()=>{cleanup();resolve()};
               const fail=()=>{cleanup();reject(new Error('Không tải được đoạn âm thanh'))};
               studySound.addEventListener('seeked',done,{once:true});
               studySound.addEventListener('error',fail,{once:true});
              });
             }
             if(request!==studyAudioRequest||segment!==studySegment)return;
             await studySound.play();"""
          replacement = "\n".join(("  studySound.currentTime=segment.start;",) + tuple("   "+x for x in replacement.splitlines()[2:]))
          if needle in s:
            s=s.replace(needle,replacement,1)
          elif 'if(studySound.seeking)' not in s:
            raise RuntimeError("Audio seek anchor changed; patch stopped")
          a="(listeningDeadline?Math.max(0,Math.ceil((listeningDeadline-Date.now())/1000)):1706)"
          b="(Math.max(0,Math.ceil((Number.isFinite(studySound.duration)?studySound.duration:1706)-(Number.isFinite(studySound.currentTime)?studySound.currentTime:0))))"
          if a in s:s=s.replace(a,b,1)
          elif b not in s:raise RuntimeError("Clock anchor changed")
          a="(!listeningDeadline?'（未播放）':'')"
          b="(studySound.paused?'（暂停）':'')"
          if a in s:s=s.replace(a,b,1)
          elif b not in s:raise RuntimeError("Clock label anchor changed")
          a="if(part==='listening'&&listeningDeadline){studyStop();questionIndex=ORIGINAL.questions.findIndex(q=>q.ids[0]>=36);loadQuestion(d);return}"
          b="if(part==='listening'){return} // Wait for real audio playback rather than wall clock"
          if a in s:s=s.replace(a,b,1)
          elif b not in s:raise RuntimeError("Listening transition anchor changed")
          p.write_text(s,encoding="utf-8")
      - name: Commit only corrected HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add H5GS08TT.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix HSK08 playback timing on GitHub Pages"
            git push
          fi
