function goSection(s){if(s<1||s>SECTION_COUNT)return;state.section=s;save();renderNav();renderSection()}
function renderStudy(){return `<div class="section-instruction"><strong>熟读词语 — Đọc thuộc những cụm từ bên dưới.</strong><div class="muted">Pinyin và nghĩa Việt là phần hỗ trợ học tập bổ sung; chữ Hán và thứ tự cụm từ giữ theo nguồn Bài 17.</div><div class="source-note">Nguồn ghi Pinyin “~ zhǎng” cho 最长; trong nghĩa “dài nhất”, 长 đọc <b>cháng</b>. Phần hỗ trợ hiển thị <b>zuì cháng</b> và công khai điểm khác này, không sửa ngầm nguồn.</div></div><div class="read-grid">`+DATA.study.map(g=>`<div class="read-group"><div class="read-head">${esc(g.head)}</div><div class="read-pinyin">${esc(g.p)}</div><div class="read-meaning">${esc(g.m)}</div>${g.lines.map(x=>`<div class="read-line"><div class="read-cn">${esc(x.cn)}</div><div class="read-pinyin">${esc(x.p)}</div><div class="read-meaning">${esc(x.m)}</div></div>`).join('')}</div>`).join('')+'</div>'}
function renderVerbs(){return `<div class="section-instruction"><strong>请写出动词 — Điền động từ thích hợp.</strong><div class="muted">Nguồn yêu cầu viết động từ nên giữ ô nhập, không đổi sang trắc nghiệm.</div></div>`+DATA.verbs.map((x,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">______ <b>${esc(x.obj)}</b> <span class="muted">${esc(x.p)}</span></div></div>${inp(2,i,'Nhập động từ')}<div class="check-row"><button class="check-btn" onclick="check(2,${i})">Đối chiếu</button><button class="clear-btn" onclick="clearOne(2,${i})">Làm lại câu</button></div>${fb(2,i,x.a,x.acc,x.e,true)}</div>`).join('')}
function renderLaQu(){return `<div class="section-instruction"><strong>用“来”或“去”填空 — Dùng 来 hoặc 去 điền vào chỗ trống.</strong></div>`+DATA.laqu.map((x,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(x.s)}</div></div>${radio(3,i,['来','去'])}<div class="check-row"><button class="check-btn" onclick="check(3,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(3,${i})">Làm lại câu</button></div>${fb(3,i,x.a,[x.a],x.e,false)}</div>`).join('')}
function renderHaishi(){return `<div class="section-instruction"><strong>用“还是”提问 — Đặt câu hỏi với 还是.</strong><div class="muted">Nguồn không kèm đáp án chính thức; hệ thống dùng câu GPT tham khảo và chấp nhận các cách đúng tương đương.</div></div>`+DATA.haishi.map((x,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>B：</b>${esc(x.b)}</div></div>${inp(4,i,'Nhập câu hỏi với 还是')}<div class="check-row"><button class="check-btn" onclick="check(4,${i})">Đối chiếu</button><button class="clear-btn" onclick="clearOne(4,${i})">Làm lại câu</button></div>${fb(4,i,x.a,x.acc,x.e,true)}</div>`).join('')}
function renderContext(){let h=`<div class="section-instruction"><strong>根据上下文的意思用词填空 — Dựa theo ngữ cảnh điền từ.</strong><div class="muted">Nguồn không cho sẵn ngân hàng từ; các lựa chọn được xây từ chính ngữ cảnh và từ vựng đã học, nhưng câu nguồn được giữ nguyên để đối chiếu.</div></div><div class="question-card"><div class="passage">${esc(DATA.context_source)}</div></div>`;DATA.context.forEach((x,i)=>h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(x.label)}</div></div>${radio(5,i,x.o)}<div class="check-row"><button class="check-btn" onclick="check(5,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(5,${i})">Làm lại câu</button></div>${fb(5,i,x.a,[x.a],x.e,false)}</div>`);return h}
function renderQuestions(){return `<div class="section-instruction"><strong>用“怎么样，谁，什么（时候），还是”把上面带序号的句子改成问句。</strong><div class="muted">Đáp án là mẫu tham khảo vì nguồn không cung cấp đáp án chính thức.</div></div>`+DATA.questions.map((x,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(x.src)}</div></div>${inp(6,i,'Nhập câu hỏi')}<div class="check-row"><button class="check-btn" onclick="check(6,${i})">Đối chiếu</button><button class="clear-btn" onclick="clearOne(6,${i})">Làm lại câu</button></div>${fb(6,i,x.a,x.acc,x.e,true)}</div>`).join('')}
function renderLocations(){let ex=DATA.locations_example,h=`<div class="section-instruction"><strong>说话人在哪儿？请连线 — Người nói đang ở đâu?</strong><div class="word-bank">${['里边','上边','外边','下边'].map(x=>`<span class="word-chip">${x}</span>`).join('')}</div></div><div class="match-example"><b>Ví dụ nguồn:</b> ${esc(ex.s)} <span class="muted">${esc(ex.p)}</span> → <b>${ex.a}</b><br><span class="muted">${esc(ex.note)}</span></div>`;DATA.locations.forEach((x,i)=>h+=`<div class="question-card"><div class="qhead"><div class="qnum">${x.n}</div><div class="qtext">${esc(x.s)}<div class="question-pinyin">${esc(x.p)}</div></div></div>${radio(7,i,['里边','上边','外边','下边'])}<div class="check-row"><button class="check-btn" onclick="check(7,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(7,${i})">Làm lại câu</button></div>${fb(7,i,x.a,[x.a],x.e,false)}</div>`);return h}
function renderRadical(){let h=`<div class="section-instruction"><strong>请写出含有偏旁“口”的汉字</strong><div class="source-note">Nguồn ghi “口”, nhưng bốn chữ mục tiêu 回、园、国、图 về bộ thủ chuẩn đều dùng khung bao <b>囗 (wéi, bộ vi)</b>. Bản tương tác giữ nguyên 4 mục nguồn và công khai điểm khác này, không âm thầm thay đề.</div></div>`;DATA.radical.forEach((x,i)=>h+=`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(x.pr)}</div></div>${inp(8,i,'Nhập 1 chữ Hán')}<div class="check-row"><button class="check-btn" onclick="check(8,${i})">Kiểm tra</button></div>${fb(8,i,x.a,[x.a],x.e,true)}</div>`);let ci=DATA.radical.length,c=DATA.challenge;h+=`<div class="section-instruction"><strong>你猜猜</strong><div>${esc(c.prompt)}</div></div><div class="question-card"><div class="qhead"><div class="qnum">猜</div></div>${inp(8,ci,'Nhập chữ Hán')}<div class="check-row"><button class="check-btn" onclick="check(8,${ci})">Kiểm tra</button></div>${fb(8,ci,c.a,[c.a],c.e,true)}</div>`;return h}
function renderTrans(){return `<div class="section-instruction"><strong>越汉翻译练习 — Luyện dịch Việt → Hoa.</strong><div class="muted">Dùng đáp án tham khảo; câu dịch đúng tương đương không nên bị xem là sai tuyệt đối.</div></div>`+DATA.trans.map((x,i)=>`<div class="question-card"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(x[0])}</div></div><textarea class="input-area" oninput="setAns(9,${i},this.value)">${esc(state.answers[key(9,i)]||'')}</textarea><div class="check-row"><button class="check-btn" onclick="check(9,${i})">Đối chiếu</button><button class="clear-btn" onclick="clearOne(9,${i})">Làm lại câu</button></div>${fb(9,i,x[1],x[2],'Đây là đáp án tham khảo từ nội dung nguồn Bài 17 và kiến thức ngôn ngữ; có thể có cách dịch đúng tương đương.',true)}</div>`).join('')}
function renderSection(){let s=state.section;sectionBadge.textContent='Bài '+s;sectionTitle.textContent=sectionNames()[s];let h=s===1?renderStudy():s===2?renderVerbs():s===3?renderLaQu():s===4?renderHaishi():s===5?renderContext():s===6?renderQuestions():s===7?renderLocations():s===8?renderRadical():renderTrans();h+=`<div class="navigation-buttons"><button class="nav-btn" ${s===1?'disabled':''} onclick="goSection(${s-1})">← Bài trước</button><button class="nav-btn next" ${s===SECTION_COUNT?'disabled':''} onclick="goSection(${s+1})">Bài sau →</button></div>`;contentBody.innerHTML=h}
function itemCount(s){if(s===1)return 0;if(s===2)return DATA.verbs.length;if(s===3)return DATA.laqu.length;if(s===4)return DATA.haishi.length;if(s===5)return DATA.context.length;if(s===6)return DATA.questions.length;if(s===7)return DATA.locations.length;if(s===8)return DATA.radical.length+1;return DATA.trans.length}
function answeredCount(s){let n=0;for(let i=0;i<itemCount(s);i++)if(String(state.answers[key(s,i)]||'').trim())n++;return n}
function updateProgress(){let t=0,a=0;for(let s=1;s<=SECTION_COUNT;s++){t+=itemCount(s);a+=answeredCount(s)};progressText.textContent=a+'/'+t;progressFill.style.width=(t?a/t*100:0)+'%'}
function openAnswerCard(){answerGrid.innerHTML=Array.from({length:SECTION_COUNT},(_,i)=>i+1).map(s=>`<div class="answer-cell ${answeredCount(s)===itemCount(s)&&itemCount(s)?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${sectionNames()[s]}<br><span class="muted">${itemCount(s)?answeredCount(s)+'/'+itemCount(s)+' đã làm':'Tài liệu đọc'}</span></div>`).join('');answerModal.classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restoreProgress(show=false){try{let x=JSON.parse(localStorage.getItem(STORE)||'null');if(x)Object.assign(state,x)}catch(e){}renderAll();if(show)alert('Đã khôi phục tiến độ (nếu có).')}
function restartExam(){if(!confirm('Làm lại toàn bộ Bài 17? Ghi chú vẫn được giữ.'))return;state.answers={};state.checked={};state.section=1;state.startAt=Date.now();save();renderAll()}
function submitExam(){let total=0,correct=0;function add(ok){total++;if(ok)correct++}
 DATA.verbs.forEach((x,i)=>add(accepted(state.answers[key(2,i)]||'',x.acc)));
 DATA.laqu.forEach((x,i)=>add(norm(state.answers[key(3,i)]||'')===norm(x.a)));
 DATA.haishi.forEach((x,i)=>add(accepted(state.answers[key(4,i)]||'',x.acc)));
 DATA.context.forEach((x,i)=>add(norm(state.answers[key(5,i)]||'')===norm(x.a)));
 DATA.questions.forEach((x,i)=>add(accepted(state.answers[key(6,i)]||'',x.acc)));
 DATA.locations.forEach((x,i)=>add(norm(state.answers[key(7,i)]||'')===norm(x.a)));
 DATA.radical.forEach((x,i)=>add(norm(state.answers[key(8,i)]||'')===norm(x.a))); add(norm(state.answers[key(8,DATA.radical.length)]||'')===norm(DATA.challenge.a));
 DATA.trans.forEach((x,i)=>add(accepted(state.answers[key(9,i)]||'',x[2])));
 resultBody.innerHTML=`<div class="result-score">${correct}/${total}</div><div style="text-align:center">Kết quả đối chiếu đáp án tham khảo.</div><div class="muted" style="margin-top:12px">Các câu viết, đặt câu hỏi và dịch có thể có nhiều cách đúng; điểm này chỉ so với tập đáp án tham khảo.</div>`;resultModal.classList.add('show')}
function openNoteEditor(){richEditor=document.getElementById('rich-editor');richEditor.innerHTML=localStorage.getItem(NOTE_STORE)||'';document.getElementById('note-editor-overlay').classList.add('show');document.body.classList.add('note-open')}
function closeNoteEditor(){document.getElementById('note-editor-overlay').classList.remove('show');document.body.classList.remove('note-open')}
function saveNotes(closeAfter=false){localStorage.setItem(NOTE_STORE,document.getElementById('rich-editor').innerHTML);if(closeAfter)closeNoteEditor()}
function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor').focus()}
function clearNoteEditor(){if(confirm('Xóa toàn bộ ghi chú?'))document.getElementById('rich-editor').innerHTML=''}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
setInterval(()=>{let sec=Math.floor((Date.now()-state.startAt)/1000),m=String(Math.floor(sec/60)).padStart(2,'0'),ss=String(sec%60).padStart(2,'0');if(timerText)timerText.textContent='Thời gian '+m+':'+ss},1000);
window.addEventListener('load',()=>{restoreProgress(false)}); 

</script></body></html>
