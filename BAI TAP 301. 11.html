const STORE='BAI301_BAI11_PROGRESS_V2_RADIO';
const NOTE_STORE='BAI301_BAI11_NOTES_V1';
let state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};
const SECTION_COUNT=9;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:]/g,'')}
function key(sec,i){return `${sec}-${i}`}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function restoreProgress(showMsg=false){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&typeof x==='object'){state={...state,...x};if(showMsg)alert('Đã khôi phục tiến độ.')}}catch(e){}renderAll()}
function setAnswer(sec,i,v){state.answers[key(sec,i)]=v;delete state.checked[key(sec,i)];save();renderNav()}
function acceptedFor(it){return [it.answer,...(it.accepted||[])].filter(Boolean)}
function isAccepted(it,v){return acceptedFor(it).some(a=>norm(a)===norm(v))}
function sectionNames(){return ['','Đọc cụm từ','Điền từ','Hoàn thành đối thoại','Động từ trùng điệp','Sửa câu sai','Viết chữ Hán','Điền chữ Hán','贝 / 夕 / 考考你','Dịch Việt → Hoa']}
function itemCount(sec){const ex=exercises[sec-1];if(sec===1)return 0;if(sec===3)return ex.groups.reduce((n,g)=>n+g.items.length,0);if(sec===8)return ex.radical.length+ex.challenge.length;return ex.data?ex.data.length:0}
function dialogueFlat(){return exercises[2].groups.flatMap(g=>g.items)}
function radicalFlat(){const ex=exercises[7];return [...ex.radical,...ex.challenge.map(x=>({...x,ex:'Chữ này thuộc nhóm các chữ đã học có chứa thành phần 亻 theo yêu cầu 考考你 của nguồn.'}))]}
function answeredCount(sec){let n=0,t=itemCount(sec);for(let i=0;i<t;i++)if(String(state.answers[key(sec,i)]??'').trim())n++;return n}
function totalCount(){let n=0;for(let s=1;s<=SECTION_COUNT;s++)n+=itemCount(s);return n}
function totalAnswered(){let n=0;for(let s=1;s<=SECTION_COUNT;s++)n+=answeredCount(s);return n}
function renderNav(){let h='';for(let s=1;s<=SECTION_COUNT;s++)h+=`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`;document.getElementById('sectionNav').innerHTML=h}
function goSection(s){if(s<1||s>SECTION_COUNT)return;state.section=s;save();renderSection();renderNav()}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
function clearOne(sec,i){delete state.answers[key(sec,i)];delete state.checked[key(sec,i)];save();renderSection();renderNav()}
function checkOne(sec,i){state.checked[key(sec,i)]=true;save();renderSection();renderNav()}
function standardFeedback(sec,i,it,label='Đáp án tham khảo'){
 if(!state.checked[key(sec,i)])return `<div class="feedback" id="fb-${sec}-${i}"></div>`;
 const ok=isAccepted(it,state.answers[key(sec,i)]||'');
 return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Đúng':'△ Chưa khớp đáp án tham khảo'}</div><div><b>${label}:</b> <span class="correct-answer">${esc(it.answer)}</span></div>${it.ex?`<div><b>Giải thích:</b> ${esc(it.ex)}</div>`:''}</div>`
}
function cardClass(sec,i,it){if(!state.checked[key(sec,i)])return 'question-card';return 'question-card checked '+(isAccepted(it,state.answers[key(sec,i)]||'')?'correct':'wrong')}

const phraseLineSupport={
 '要|……要多少':{p:'yào duōshao',m:'muốn / cần bao nhiêu'},
 '要|……几斤/瓶/...':{p:'yào jǐ jīn / píng / ...',m:'muốn mấy cân / mấy chai / ...'},
 '要|……苹果/...':{p:'yào píngguǒ / ...',m:'muốn táo / ...'},
 '要|...... 喝可乐':{p:'yào hē kělè',m:'muốn uống Coca-Cola'},
 '别的|……东西':{p:'biéde dōngxi',m:'đồ / thứ khác'},
 '别的|……地方':{p:'biéde dìfang',m:'nơi / chỗ khác'},
 '别的|……老师':{p:'biéde lǎoshī',m:'giáo viên khác'},
 '别的|……语言':{p:'biéde yǔyán',m:'ngôn ngữ khác'},
 '种|一……':{p:'yì zhǒng',m:'một loại'},
 '种|这……':{p:'zhè zhǒng',m:'loại này'},
 '种|那……':{p:'nà zhǒng',m:'loại đó / loại kia'},
 '种|很多……':{p:'hěn duō zhǒng',m:'rất nhiều loại'},
 '多|很……':{p:'hěn duō',m:'rất nhiều'},
 '多|不……':{p:'bù duō',m:'không nhiều'},
 '多|……了一块钱':{p:'duō le yí kuài qián',m:'nhiều / hơn thêm một đồng'},
 '多|……好啊':{p:'duō hǎo a',m:'tốt biết bao / tốt quá'},
 '还|……喝/吃/...':{p:'hái hē / chī / ...',m:'còn uống / ăn / ...'},
 '还|……去/来/...':{p:'hái qù / lái / ...',m:'còn đi / đến / ...'},
 '还|……看/听/...':{p:'hái kàn / tīng / ...',m:'còn xem / nghe / ...'},
 '还|……要':{p:'hái yào',m:'còn muốn / còn cần'}
};
function radioChoices(sec,i,options,val){return `<div class="radio-choice-list" role="radiogroup" aria-label="Lựa chọn câu ${i+1}">`+options.map(o=>`<label class="radio-choice"><input type="radio" name="q-${sec}-${i}" value="${esc(o)}" ${norm(val)===norm(o)?'checked':''} onchange="setAnswer(${sec},${i},this.value)"><span>${esc(o)}</span></label>`).join('')+`</div>`}
function renderReadPhrases(ex){let h=`<div class="section-instruction"><strong>熟读词语</strong><br>Đọc thuộc những cụm từ bên dưới.<div class="muted" style="margin-top:5px">Pinyin và nghĩa tiếng Việt là phần hỗ trợ học tập do GPT bổ sung; cụm chữ Hán giữ theo nguồn Bài 11.</div></div><div class="phrase-grid">`;ex.groups.forEach(g=>{const hs=phraseHeadSupport[g.head]||{p:'',m:''};h+=`<div class="phrase-group"><div class="phrase-head">${esc(g.head)}</div><div class="phrase-head-pinyin">${esc(hs.p)}</div><div class="phrase-head-meaning">${esc(hs.m)}</div>${g.lines.map(x=>{const z=phraseLineSupport[g.head+'|'+x]||{p:'',m:''};return `<div class="phrase-line"><div class="phrase-cn">${esc(x)}</div><div class="phrase-pinyin">${esc(z.p)}</div><div class="phrase-meaning">${esc(z.m)}</div></div>`}).join('')}</div>`});h+='</div>';return h}
function renderFill(ex){let h=`<div class="section-instruction"><strong>用上面的词填空</strong><br>Dùng những từ ngữ trên điền vào chỗ trống.<div class="word-bank">${ex.wordBank.map(w=>`<span class="word-chip">${esc(w)}</span>`).join('')}</div></div>`;h+=`<div class="question-card"><div class="passage" style="line-height:2.8">`;ex.pieces.forEach(p=>{if(typeof p==='number'){h+=`<span class="blank-display">(${p+1})</span>`}else h+=p.startsWith('<br>')?'<br>'+esc(p.slice(4)):esc(p)});h+='</div></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(2,i)]||'';h+=`<div class="${cardClass(2,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">Chọn từ cho chỗ trống (${i+1})</div></div>${radioChoices(2,i,ex.wordBank,v)}<div class="check-row"><button class="check-btn" onclick="checkOne(2,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(2,${i})">Làm lại câu</button></div>${standardFeedback(2,i,it)}</div>`});return h}
function dInput(flatIndex,w=260){return `<input class="input-text" style="display:inline-block;width:min(${w}px,70vw);margin:2px 4px" value="${esc(state.answers[key(3,flatIndex)]||'')}" oninput="setAnswer(3,${flatIndex},this.value)">`}
function renderDialogue(ex){let h=`<div class="section-instruction"><strong>完成对话</strong><br>Hoàn thành đối thoại.</div>`;let offset=0;ex.groups.forEach((g,gi)=>{const inds=g.items.map((_,j)=>offset+j);let lineHtml='';g.lines.forEach(line=>{const sp=line[0],before=line[1]||'',slot=typeof line[2]==='number'?line[2]:null,after=(slot!==null?line[3]:'')||'';if(slot!==null)lineHtml+=`<div><b>${esc(sp)}：</b>${esc(before)}${dInput(inds[slot])}${esc(after)}</div>`;else lineHtml+=`<div><b>${esc(sp)}：</b>${esc(before)}</div>`});const checked=inds.some(i=>state.checked[key(3,i)]),all=inds.every((i,j)=>isAccepted(g.items[j],state.answers[key(3,i)]||''));let fb='';if(checked){fb=`<div class="feedback show ${all?'correct':'sample'}">`+g.items.map((it,j)=>`<div style="margin:7px 0"><b>${j+1}.</b> ${isAccepted(it,state.answers[key(3,inds[j])]||'')?'✓':'△'} Đáp án tham khảo: <span class="correct-answer">${esc(it.answer)}</span><br><b>Giải thích:</b> ${esc(it.ex)}</div>`).join('')+'</div>'}h+=`<div class="question-card ${checked?'checked '+(all?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${gi+1}</div><div class="qtext dialogue-block">${lineHtml}</div></div><div class="check-row"><button class="check-btn" onclick="checkDialogue([${inds.join(',')}])">Kiểm tra đoạn</button></div>${fb}</div>`;offset+=g.items.length});return h}
function checkDialogue(inds){inds.forEach(i=>state.checked[key(3,i)]=true);save();renderSection();renderNav()}
function renderRedup(ex){let h=`<div class="section-instruction"><strong>用动词重叠形式完成句子</strong><br>Dùng hình thức trùng điệp của động từ để hoàn thành câu.<div class="word-bank">${ex.wordBank.map(w=>`<span class="word-chip">${esc(w)}</span>`).join('')}</div></div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(4,i)]||'';h+=`<div class="${cardClass(4,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.sentence)}</div></div>${radioChoices(4,i,ex.wordBank,v)}<div class="check-row"><button class="check-btn" onclick="checkOne(4,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(4,${i})">Làm lại câu</button></div>${standardFeedback(4,i,it)}</div>`});return h}
function renderError(ex){let h=`<div class="section-instruction"><strong>改错句</strong><br>Sửa câu sai.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(5,i)]||'',checked=!!state.checked[key(5,i)],ok=isAccepted(it,v);h+=`<div class="question-card ${checked?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="wrong-sentence">${esc(it.original)}</div></div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(5,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(5,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(5,${i})">Làm lại câu</button></div>${checked?`<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div><b>Lỗi sai:</b> ${esc(it.error)}</div><div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span></div><div><b>Vì sao sửa như vậy:</b> ${esc(it.fix)}</div></div>`:''}</div>`});return h}
function renderHanzi(ex){let h=`<div class="section-instruction"><strong>根据拼音写出汉字</strong><br>Viết chữ Hán dựa theo phiên âm.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(6,i)]||'';h+=`<div class="${cardClass(6,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.pinyin)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(6,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(6,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(6,${i})">Làm lại câu</button></div>${standardFeedback(6,i,it)}</div>`});return h}
function renderHanziFill(ex){let h=`<div class="section-instruction"><strong>用汉字填空</strong><br>Điền vào chỗ trống bằng chữ Hán.<div class="word-bank">${ex.wordBank.map(w=>`<span class="word-chip">${esc(w)}</span>`).join('')}</div></div><div class="question-card"><div class="passage" style="line-height:2.8">`;ex.pieces.forEach(p=>{if(typeof p==='number')h+=`<span class="blank-display">(${p+1})</span>`;else h+=esc(p)});h+='</div></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(7,i)]||'';h+=`<div class="${cardClass(7,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">Chọn chữ Hán cho chỗ trống (${i+1})</div></div>${radioChoices(7,i,ex.wordBank,v)}<div class="check-row"><button class="check-btn" onclick="checkOne(7,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(7,${i})">Làm lại câu</button></div>${standardFeedback(7,i,it)}</div>`});return h}
function renderRadical(ex){const flat=radicalFlat();let h=`<div class="section-instruction"><strong>请写出含有偏旁 “贝” 或 “夕” 的汉子</strong><br>Viết những chữ Hán có chứa thiên bàng 贝 hoặc 夕.</div><div class="radical-grid">`;ex.radical.forEach((it,i)=>{const v=state.answers[key(8,i)]||'';h+=`<div class="${cardClass(8,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.prompt)}</div></div><input class="input-text" maxlength="1" value="${esc(v)}" oninput="setAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Kiểm tra</button></div>${standardFeedback(8,i,it)}</div>`});h+='</div><div class="section-instruction"><strong>考考你</strong><br>Trong nguồn: 15 chữ có chứa thành phần 亻, mỗi chữ 4 điểm, tổng 60 điểm.</div><div class="radical-grid">';const base=ex.radical.length;ex.challenge.forEach((it,j)=>{const i=base+j,v=state.answers[key(8,i)]||'',x=flat[i];h+=`<div class="${cardClass(8,i,x)}"><div class="qhead"><div class="qnum">${j+1}</div><div class="qtext">${esc(it.prompt)}</div></div><input class="input-text" maxlength="1" value="${esc(v)}" oninput="setAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Kiểm tra</button></div>${standardFeedback(8,i,x)}</div>`});let score=ex.challenge.reduce((n,it,j)=>n+(isAccepted(it,state.answers[key(8,base+j)]||'')?4:0),0);h+=`</div><div class="challenge-score">Điểm 考考你 hiện tại: ${score}/60</div>`;return h}
function renderTranslation(ex){let h=`<div class="section-instruction"><strong>越汉翻译练习</strong><br>Luyện dịch Việt → Hoa.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(9,i)]||'';h+=`<div class="${cardClass(9,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAnswer(9,${i},this.value)">${esc(v)}</textarea><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Đối chiếu câu</button><button class="clear-btn" onclick="clearOne(9,${i})">Làm lại câu</button></div>${standardFeedback(9,i,it)}</div>`});return h}
function renderSection(){const s=state.section,ex=exercises[s-1];document.getElementById('sectionBadge').textContent=`Bài ${s}`;document.getElementById('sectionTitle').textContent=ex.title;let h='';if(s===1)h=renderReadPhrases(ex);else if(s===2)h=renderFill(ex);else if(s===3)h=renderDialogue(ex);else if(s===4)h=renderRedup(ex);else if(s===5)h=renderError(ex);else if(s===6)h=renderHanzi(ex);else if(s===7)h=renderHanziFill(ex);else if(s===8)h=renderRadical(ex);else h=renderTranslation(ex);h+=`<div class="navigation-buttons"><button class="nav-btn" ${s===1?'disabled':''} onclick="goSection(${s-1})">← Bài trước</button><button class="nav-btn next" ${s===SECTION_COUNT?'disabled':''} onclick="goSection(${s+1})">Bài sau →</button></div>`;document.getElementById('contentBody').innerHTML=h}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;document.getElementById('progressText').textContent=`${a}/${t}`;document.getElementById('progressFill').style.width=p+'%'}
function openAnswerCard(){let h='',names=sectionNames();for(let s=1;s<=SECTION_COUNT;s++){let a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${esc(names[s])}<br><span class="muted">${t?`${a}/${t} đã làm`:'Tài liệu đọc'}</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restartExam(){if(!confirm('Xóa toàn bộ đáp án và làm lại từ đầu?'))return;try{localStorage.removeItem(STORE)}catch(e){}state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};renderAll()}
function submitExam(){let correct=0,scored=0;for(let sec=2;sec<=SECTION_COUNT;sec++){let items=[];if(sec===3)items=dialogueFlat();else if(sec===8)items=radicalFlat();else items=exercises[sec-1].data||[];items.forEach((it,i)=>{scored++;if(isAccepted(it,state.answers[key(sec,i)]||''))correct++})}const pct=scored?Math.round(correct/scored*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${scored}</div><div style="text-align:center;font-weight:700">Kết quả đối chiếu: ${pct}%</div><div style="margin-top:15px;line-height:1.7"><b>Tiến độ:</b> ${totalAnswered()}/${totalCount()} mục đã làm.<br><b>Lưu ý:</b> Hội thoại, sửa câu và dịch có thể có nhiều cách diễn đạt đúng; hệ thống đối chiếu với đáp án tham khảo GPT được phân tích từ nội dung Bài 11. Hai điểm bất thường “近/斤” và “500元” được giữ và giải thích theo đúng nguồn.</div>`;document.getElementById('resultModal').classList.add('show')}
function tick(){const e=Math.floor((Date.now()-(state.startAt||Date.now()))/1000),m=Math.floor(e/60),s=e%60;document.getElementById('timerText').textContent=`Thời gian ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('timerProgress').style.width=Math.min(100,(e%3600)/36)+'%'}
let noteSaveTimer=null;
function openNoteEditor(){const o=document.getElementById('note-editor-overlay'),ed=document.getElementById('rich-editor');if(!o||!ed)return;try{const x=localStorage.getItem(NOTE_STORE);if(x!==null)ed.innerHTML=x}catch(e){}o.classList.add('show');document.body.classList.add('note-open');ed.focus()}
function closeNoteEditor(){const o=document.getElementById('note-editor-overlay');if(o)o.classList.remove('show');document.body.classList.remove('note-open')}
function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor')?.focus();scheduleNoteAutosave()}
function scheduleNoteAutosave(){clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>saveNotes(false),350)}
function saveNotes(closeAfter=false){const ed=document.getElementById('rich-editor');if(!ed)return;try{localStorage.setItem(NOTE_STORE,ed.innerHTML)}catch(e){}if(closeAfter)closeNoteEditor()}
function clearNoteEditor(){if(!confirm('Xóa toàn bộ ghi chú?'))return;const ed=document.getElementById('rich-editor');if(ed){ed.innerHTML='';ed.focus();scheduleNoteAutosave()}}
document.getElementById('rich-editor')?.addEventListener('input',scheduleNoteAutosave);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('note-editor-overlay')?.classList.contains('show'))closeNoteEditor()});
restoreProgress(false);setInterval(tick,1000);tick();
</script>
</body></html>
