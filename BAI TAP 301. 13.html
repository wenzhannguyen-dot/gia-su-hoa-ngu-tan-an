function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:（）()“”"']/g,'')}
function key(sec,i){return sec+'-'+i}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function setAnswer(sec,i,v){state.answers[key(sec,i)]=v;delete state.checked[key(sec,i)];save();renderNav()}
function isAccepted(it,val){return (it.accepted||[it.answer]).some(a=>norm(a)===norm(val))}
function sectionNames(){return ['','熟读词语','选择正确答案','组词成句','完成对话','改错句','根据拼音写汉字','用汉字填空','扌 / 你看看','越汉翻译']}
function itemCount(sec){
 if(sec===1)return 0;
 if(sec===2)return DATA.choice.length;
 if(sec===3)return DATA.arrange.length;
 if(sec===4)return DATA.dialogue.reduce((n,g)=>n+g.items.length,0);
 if(sec===5)return DATA.errors.length;
 if(sec===6)return DATA.hanzi.length;
 if(sec===7)return DATA.hanziFill.items.length;
 if(sec===8)return DATA.radical.length;
 if(sec===9)return DATA.translations.length;
 return 0
}
function answeredCount(sec){let n=0;for(let i=0;i<itemCount(sec);i++)if(String(state.answers[key(sec,i)]??'').trim())n++;return n}
function totalCount(){let t=0;for(let s=1;s<=SECTION_COUNT;s++)t+=itemCount(s);return t}
function totalAnswered(){let t=0;for(let s=1;s<=SECTION_COUNT;s++)t+=answeredCount(s);return t}
function renderNav(){let h='';for(let s=1;s<=SECTION_COUNT;s++)h+=`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`;document.getElementById('sectionNav').innerHTML=h}
function goSection(s){if(s<1||s>SECTION_COUNT)return;state.section=s;save();renderSection();renderNav()}
function radioChoices(sec,i,opts,v){return `<div class="radio-options">`+opts.map((o,j)=>`<label class="radio-option"><input type="radio" name="q-${sec}-${i}" value="${esc(o)}" ${norm(v)===norm(o)?'checked':''} onchange="setAnswer(${sec},${i},this.value)"><span><b>${letters[j]}.</b> ${esc(o)}</span></label>`).join('')+`</div>`}
function standardFeedback(sec,i,it){if(!state.checked[key(sec,i)])return '<div class="feedback"></div>';const v=state.answers[key(sec,i)]||'',ok=isAccepted(it,v);return `<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div>${ok?'':`<div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span></div>`}<div><b>Giải thích:</b> ${esc(it.ex||'')}</div></div>`}
function cardClass(sec,i,it){if(!state.checked[key(sec,i)])return 'question-card';return 'question-card checked '+(isAccepted(it,state.answers[key(sec,i)]||'')?'correct':'wrong')}
function checkOne(sec,i){state.checked[key(sec,i)]=true;save();renderSection();renderNav()}
function clearOne(sec,i){delete state.answers[key(sec,i)];delete state.checked[key(sec,i)];save();renderSection();renderNav()}
function renderStudy(){
 let h=`<div class="section-instruction"><strong>熟读词语</strong><br>Đọc thuộc những cụm từ bên dưới. Pinyin trong nguồn được giữ; nghĩa Việt là phần hỗ trợ đã được duyệt.</div>
 <div class="source-note"><b>Đối chiếu nguồn:</b> DOCX ghi tiêu đề Trung “第十三课：需要（三）：我想买毛衣”, nhưng dòng Việt lại ghi “Bài 13: Nhu cầu (3): Phải chuyển xe”. Hệ thống giữ nguyên bất nhất này, không tự đổi tiêu đề nguồn.</div><div class="read-grid">`;
 DATA.study.forEach(g=>{h+=`<div class="read-group"><div class="read-head">${esc(g.head)}</div><div class="read-pinyin">${esc(g.p)}</div><div class="read-meaning">${esc(g.m)}</div>`;g.lines.forEach(x=>h+=`<div class="read-line"><div class="read-cn">${esc(x.cn)}</div><div class="read-pinyin">${esc(x.p)}</div><div class="read-meaning">→ ${esc(x.m)}</div></div>`);h+='</div>'});return h+'</div>'
}
function renderChoice(){
 let h=`<div class="section-instruction"><strong>选择正确的答案，在括号内打“V”</strong><br>Chọn đáp án đúng. Theo sửa đổi đã duyệt, lựa chọn dùng radio button hiển thị trực tiếp.</div>`;
 DATA.choice.forEach((it,i)=>{const v=state.answers[key(2,i)]||'';h+=`<div class="${cardClass(2,i,it)}"><div class="qhead"><div class="qnum">${esc(it.label)}</div><div class="qtext">${esc(it.source)}</div></div>${radioChoices(2,i,it.options,v)}<div class="check-row"><button class="check-btn" onclick="checkOne(2,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(2,${i})">Làm lại câu</button></div>${standardFeedback(2,i,it)}</div>`});return h
}
function arrangeTokenId(i,j){return DATA.arrange[i].words[j]+'#'+j}
function arrangeSelected(i){return (state.answers[key(3,i)]||'').split('|||').filter(Boolean)}
function setArrange(i,a){state.answers[key(3,i)]=a.join('|||');delete state.checked[key(3,i)];save();renderSection();renderNav()}
function arrangeValue(i){return arrangeSelected(i).map(x=>x.replace(/#\d+$/,'')).join('')}
function arrangeOk(i){const it=DATA.arrange[i],v=norm(arrangeValue(i));return [it.answer,...(it.accepted||[])].some(a=>norm(a)===v)}
let dragInfo=null;
function beginDrag(e,i,j,from){dragInfo={i,j,from};e.currentTarget.classList.add('dragging');try{e.dataTransfer.setData('text/plain',String(j));e.dataTransfer.effectAllowed='move'}catch(_){}}
function endDrag(e){e.currentTarget?.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));dragInfo=null}
function allowDrop(e,el){e.preventDefault();el?.classList.add('drag-over')}
function moveToken(i,j,to,pos=null){let a=arrangeSelected(i),id=arrangeTokenId(i,j),old=a.indexOf(id);if(old>=0)a.splice(old,1);if(to==='answer'){let p=pos==null?a.length:Math.max(0,Math.min(Number(pos),a.length));a.splice(p,0,id)}setArrange(i,a)}
function dropEnd(e,i){e.preventDefault();e.stopPropagation();if(dragInfo&&dragInfo.i===i)moveToken(i,dragInfo.j,'answer');dragInfo=null}
function dropBank(e,i){e.preventDefault();e.stopPropagation();if(dragInfo&&dragInfo.i===i)moveToken(i,dragInfo.j,'bank');dragInfo=null}
function renderArrange(){
 let h=`<div class="section-instruction"><strong>组词成句（有的词可以用两次）</strong><br>Sắp xếp từ thành câu. Kéo từ ngân hàng lên vùng đáp án; có thể kéo trở lại.</div>`;
 DATA.arrange.forEach((it,i)=>{const sel=arrangeSelected(i),checked=state.checked[key(3,i)],ok=arrangeOk(i);h+=`<div class="question-card ${checked?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div></div><div class="arrange-answer-zone" ondragover="allowDrop(event,this)" ondrop="dropEnd(event,${i})">${sel.map(id=>{const j=Number((id.match(/#(\d+)$/)||[])[1]),t=it.words[j];return `<button type="button" class="token arrange-token answer-token" draggable="true" ondragstart="beginDrag(event,${i},${j},'answer')" ondragend="endDrag(event)" onclick="moveToken(${i},${j},'bank')">${esc(t)}</button>`}).join('')}</div><div class="arrange-separator"></div><div class="arrange-bank-zone" ondragover="allowDrop(event,this)" ondrop="dropBank(event,${i})">${it.words.map((t,j)=>sel.includes(arrangeTokenId(i,j))?'':`<button type="button" class="token arrange-token" draggable="true" ondragstart="beginDrag(event,${i},${j},'bank')" ondragend="endDrag(event)" onclick="moveToken(${i},${j},'answer')">${esc(t)}</button>`).join('')}</div><div class="check-row"><button class="check-btn" onclick="state.checked[key(3,${i})]=true;save();renderSection()">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(3,${i})">Làm lại câu</button></div>${checked?`<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div>${ok?'':`<div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span></div>`}<div><b>Giải thích:</b> ${esc(it.ex)}</div></div>`:'<div class="feedback"></div>'}</div>`});return h
}
function dInput(sec,i,w=280){return `<input class="input-text" style="display:inline-block;width:min(${w}px,70vw);max-width:${w}px;margin:2px 4px" value="${esc(state.answers[key(sec,i)]||'')}" oninput="setAnswer(${sec},${i},this.value)">`}
function renderDialogue(){
 let h=`<div class="section-instruction"><strong>完成对话</strong><br>Hoàn thành đối thoại. Đây là dạng tự viết nên giữ ô nhập.</div>`,off=0;
 DATA.dialogue.forEach((g,gi)=>{const inds=g.items.map((_,j)=>off+j);let lines='';g.lines.forEach(line=>{const sp=line[0],txt=line[1]||'',slot=line[2];if(slot===null)lines+=`<div><b>${esc(sp)}：</b>${esc(txt)}</div>`;else lines+=`<div><b>${esc(sp)}：</b>${esc(txt)}${dInput(4,inds[slot])}${esc(line[3]||'')}</div>`});const checked=inds.some(i=>state.checked[key(4,i)]),all=inds.every((i,j)=>isAccepted(g.items[j],state.answers[key(4,i)]||''));let fb='';if(checked)fb=`<div class="feedback show ${all?'correct':'sample'}">`+g.items.map((it,j)=>`<div style="margin:7px 0"><b>${j+1}.</b> ${isAccepted(it,state.answers[key(4,inds[j])]||'')?'✓':'△'} <b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span><br><b>Giải thích:</b> ${esc(it.ex)}</div>`).join('')+`</div>`;h+=`<div class="question-card ${checked?'checked '+(all?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${gi+1}</div><div class="qtext dialogue-block">${lines}</div></div><div class="check-row"><button class="check-btn" onclick="checkDialogue([${inds.join(',')}])">Kiểm tra đoạn</button></div>${fb}</div>`;off+=g.items.length});return h
}
function checkDialogue(inds){inds.forEach(i=>state.checked[key(4,i)]=true);save();renderSection();renderNav()}
function renderErrors(){
 let h=`<div class="section-instruction"><strong>改错句 · Sửa câu sai</strong><br>Tự nhập câu sửa; sau khi kiểm tra mới hiện lỗi, đáp án tham khảo và lý do.</div>`;
 DATA.errors.forEach((it,i)=>{const v=state.answers[key(5,i)]||'',checked=state.checked[key(5,i)],ok=isAccepted(it,v);h+=`<div class="question-card ${checked?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="wrong-sentence">${esc(it.original)}</div></div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(5,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(5,${i})">Kiểm tra câu</button></div>${checked?`<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div><b>Lỗi sai:</b> ${esc(it.error)}</div><div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span></div><div><b>Vì sao sửa như vậy:</b> ${esc(it.fix)}</div></div>`:'<div class="feedback"></div>'}</div>`});return h
}
function renderHanzi(){
 let h=`<div class="section-instruction"><strong>根据拼音写出汉字</strong><br>Viết chữ Hán dựa theo phiên âm.</div>`;
 DATA.hanzi.forEach((it,i)=>{const v=state.answers[key(6,i)]||'';h+=`<div class="${cardClass(6,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.p)}</b></div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(6,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(6,${i})">Kiểm tra câu</button></div>${standardFeedback(6,i,it)}</div>`});return h
}
function renderHanziFill(){
 let h=`<div class="section-instruction"><strong>用汉字填空</strong><br>Điền chữ Hán. Theo sửa đổi đã duyệt, mỗi chỗ trống dùng radio hiển thị trực tiếp.</div><div class="source-raw"><b>Câu nguồn DOCX:</b><br>${esc(DATA.hanziFill.source)}</div><div class="source-note"><b>Riêng chỗ (11):</b> nguồn ghi “往(11)____西去”, tạo lặp nếu điền 西. Vùng thao tác bên dưới dùng “往(11)____去” để câu có thể làm được; đây là hiệu chỉnh kỹ thuật được công khai, không sửa ngầm.</div><div class="question-card"><div class="passage">${esc(DATA.hanziFill.interactive)}</div></div>`;
 DATA.hanziFill.items.forEach((it,i)=>{const v=state.answers[key(7,i)]||'';h+=`<div class="${cardClass(7,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">Chọn chữ Hán cho chỗ trống (${i+1})</div></div>${radioChoices(7,i,it.options,v)}<div class="check-row"><button class="check-btn" onclick="checkOne(7,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(7,${i})">Làm lại câu</button></div>${standardFeedback(7,i,it)}</div>`});return h
}
function renderRadical(){
 let h=`<div class="section-instruction"><strong>请写出含有偏旁 “扌” 的汉字</strong><br>Viết những chữ Hán có chứa thiên bàng 扌.</div>`;
 DATA.radical.forEach((it,i)=>{const v=state.answers[key(8,i)]||'';h+=`<div class="${cardClass(8,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.prompt)}</div></div><input class="input-text" maxlength="2" value="${esc(v)}" oninput="setAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Kiểm tra câu</button></div>${standardFeedback(8,i,it)}</div>`});
 h+=`<div class="subsection-title">***你看看***</div><div class="section-instruction">指出每组汉字不一样的部分，然后给汉字注音。<br>Quan sát phần khác nhau của từng nhóm rồi ghi chú. Pinyin dưới đây được giữ đúng như nguồn; phần “khác nhau” là hoạt động quan sát nên không chấm cứng.</div>
 <div class="challenge-card"><div class="chars">1. 问 <i>wèn</i>　　间 <i>jiān</i></div><input class="input-text" placeholder="Ghi phần khác nhau bạn quan sát được"></div>
 <div class="challenge-card"><div class="chars">2. 我 <i>wǒ</i>　　找 <i>zhǎo</i></div><input class="input-text" placeholder="Ghi phần khác nhau bạn quan sát được"></div>
 <div class="challenge-card"><div class="chars">3. 员 <i>yuán</i>　　货 <i>huò</i>　　贵 <i>guì</i></div><input class="input-text" placeholder="Ghi phần khác nhau bạn quan sát được"></div>`;
 return h
}
function renderTranslation(){
 let h=`<div class="section-instruction"><strong>越汉翻译练习</strong><br>Luyện dịch Việt → Hoa. Các câu dùng đáp án GPT tham khảo vì DOCX không có đáp án.</div>`;
 DATA.translations.forEach((it,i)=>{const v=state.answers[key(9,i)]||'',checked=state.checked[key(9,i)],ok=isAccepted(it,v);h+=`<div class="question-card ${checked?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAnswer(9,${i},this.value)">${esc(v)}</textarea><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Đối chiếu đáp án</button></div>${checked?`<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span></div><div><b>Giải thích:</b> ${esc(it.ex)}</div></div>`:'<div class="feedback"></div>'}</div>`});return h
}
function renderSection(){const s=state.section;document.getElementById('sectionBadge').textContent=`Bài ${s}`;document.getElementById('sectionTitle').textContent=sectionNames()[s];let h='';if(s===1)h=renderStudy();else if(s===2)h=renderChoice();else if(s===3)h=renderArrange();else if(s===4)h=renderDialogue();else if(s===5)h=renderErrors();else if(s===6)h=renderHanzi();else if(s===7)h=renderHanziFill();else if(s===8)h=renderRadical();else h=renderTranslation();h+=`<div class="navigation-buttons"><button class="nav-btn" ${s===1?'disabled':''} onclick="goSection(${s-1})">← Bài trước</button><button class="nav-btn next" ${s===SECTION_COUNT?'disabled':''} onclick="goSection(${s+1})">Bài sau →</button></div>`;document.getElementById('contentBody').innerHTML=h}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;document.getElementById('progressText').textContent=`${a}/${t}`;document.getElementById('progressFill').style.width=p+'%'}
function openAnswerCard(){let h='',names=sectionNames();for(let s=1;s<=SECTION_COUNT;s++){const a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${esc(names[s])}<br><span class="muted">${t?`${a}/${t} đã làm`:'Tài liệu đọc'}</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restoreProgress(show=false){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x){Object.assign(state,x);renderAll();if(show)alert('Đã khôi phục tiến độ.')}else if(show)alert('Chưa có tiến độ đã lưu.')}catch(e){if(show)alert('Không thể khôi phục dữ liệu.')}}
function restartExam(){if(!confirm('Làm lại toàn bộ bài? Ghi chú sẽ được giữ nguyên.'))return;state.section=1;state.answers={};state.checked={};state.startAt=Date.now();state.fontLarge=false;save();renderAll()}
function submitExam(){let correct=0,total=0;for(let sec=2;sec<=9;sec++){if(sec===3){DATA.arrange.forEach((it,i)=>{total++;if(arrangeOk(i))correct++});continue}const arr=sec===2?DATA.choice:sec===4?DATA.dialogue.flatMap(g=>g.items):sec===5?DATA.errors:sec===6?DATA.hanzi:sec===7?DATA.hanziFill.items:sec===8?DATA.radical:DATA.translations;arr.forEach((it,i)=>{total++;if(isAccepted(it,state.answers[key(sec,i)]||''))correct++})}const pct=total?Math.round(correct/total*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${total}</div><div style="text-align:center"><b>${pct}%</b></div><p class="muted" style="text-align:center;margin-top:10px">Các câu dịch/hội thoại mở được đối chiếu theo đáp án tham khảo; cách diễn đạt khác vẫn có thể đúng.</p>`;document.getElementById('resultModal').classList.add('show')}
function noteCommand(cmd,val=null){document.getElementById('rich-editor').focus();try{document.execCommand(cmd,false,val)}catch(e){}}
function openNoteEditor(){try{document.getElementById('rich-editor').innerHTML=localStorage.getItem(NOTE_STORE)||''}catch(e){}document.getElementById('note-editor-overlay').classList.add('show');document.body.classList.add('note-open')}
function closeNoteEditor(){document.getElementById('note-editor-overlay').classList.remove('show');document.body.classList.remove('note-open')}
function saveNotes(show=false){try{localStorage.setItem(NOTE_STORE,document.getElementById('rich-editor').innerHTML);if(show)alert('Đã lưu ghi chú.')}catch(e){}}
function clearNoteEditor(){if(confirm('Xóa toàn bộ nội dung ghi chú?'))document.getElementById('rich-editor').innerHTML=''}
function updateTimer(){const sec=Math.floor((Date.now()-state.startAt)/1000),m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');document.getElementById('timerText').textContent=`Thời gian ${m}:${s}`}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
window.addEventListener('load',()=>{restoreProgress(false);renderAll();setInterval(updateTimer,1000);updateTimer()});

</script>
</body>
</html>
