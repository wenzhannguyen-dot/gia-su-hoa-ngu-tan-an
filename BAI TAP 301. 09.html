const STORE='BAI301_BAI09_PROGRESS_V1';
const NOTE_STORE='BAI301_BAI09_NOTES_V1';
const letters=['A','B','C','D'];
let state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:]/g,'')}
function key(sec,i){return `${sec}-${i}`}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function restoreProgress(showMsg=false){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&typeof x==='object'){state={...state,...x};if(showMsg)alert('Đã khôi phục tiến độ.')}}catch(e){}renderAll()}
function setAnswer(sec,i,v){state.answers[key(sec,i)]=v;delete state.checked[key(sec,i)];save();renderNav()}
function acceptedFor(it){return [it.answer,...(it.accepted||[])].filter(Boolean)}
function isAccepted(it,v){return acceptedFor(it).some(a=>norm(a)===norm(v))}
function sectionNames(){return ['','Phiên âm','Dịch từ','Điền từ','Đổi thành câu hỏi','几 / 多少','Ghép từ hoàn thành câu','Tìm vị trí','Viết chữ Hán','Chữ có 辶','Dịch Việt → Hoa']}
function itemCount(sec){
 const ex=exercises[sec-1];
 if(sec===6)return ex.data.length;
 if(sec===9)return ex.data.length+1;
 return ex.data?ex.data.length:0;
}
function answeredCount(sec){
 const ex=exercises[sec-1];
 if(sec===6){let n=0;ex.data.forEach((it,i)=>{if(state.answers[key(6,i)+'-p']&&state.answers[key(6,i)+'-a'])n++});return n}
 let n=0,t=itemCount(sec);for(let i=0;i<t;i++)if(String(state.answers[key(sec,i)]??'').trim())n++;return n
}
function totalCount(){let n=0;for(let s=1;s<=10;s++)n+=itemCount(s);return n}
function totalAnswered(){let n=0;for(let s=1;s<=10;s++)n+=answeredCount(s);return n}
function renderNav(){let h='';for(let s=1;s<=10;s++)h+=`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`;document.getElementById('sectionNav').innerHTML=h}
function goSection(s){state.section=s;save();renderSection();renderNav()}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
function clearOne(sec,i){
 delete state.answers[key(sec,i)]; delete state.answers[key(sec,i)+'-p']; delete state.answers[key(sec,i)+'-a']; delete state.checked[key(sec,i)]; save(); renderSection(); renderNav()
}
function checkOne(sec,i){state.checked[key(sec,i)]=true;save();renderSection();renderNav()}
function cardClass(sec,i,it){
 if(!state.checked[key(sec,i)])return 'question-card';
 let ok=false;
 if(sec===6){ok=state.answers[key(sec,i)+'-p']===it.place && state.answers[key(sec,i)+'-a']===it.action}
 else if(sec===7){ok=(state.answers[key(sec,i)]||'')===it.answer}
 else ok=isAccepted(it,state.answers[key(sec,i)]||'');
 return 'question-card checked '+(ok?'correct':'wrong')
}
function standardFeedback(sec,i,it,label='Đáp án tham khảo'){
 if(!state.checked[key(sec,i)])return `<div class="feedback" id="fb-${sec}-${i}"></div>`;
 const v=state.answers[key(sec,i)]||'',ok=isAccepted(it,v);
 return `<div class="feedback show ${ok?'correct':'sample'}" id="fb-${sec}-${i}"><div class="status">${ok?'✓ Đúng':'△ Chưa khớp đáp án tham khảo'}</div><div><b>${label}:</b> <span class="correct-answer">${esc(it.answer)}</span></div>${it.ex?`<div><b>Giải thích:</b> ${esc(it.ex)}</div>`:''}</div>`
}
function selectOptions(arr,val,placeholder='-- Chọn --'){return `<option value="">${placeholder}</option>`+arr.map(x=>`<option value="${esc(x)}" ${val===x?'selected':''}>${esc(x)}</option>`).join('')}

function renderPinyin(ex){
 let h=`<div class="section-instruction"><strong>给下面的词注音</strong><br>Phiên âm cho những từ dưới đây</div>`;
 ex.data.forEach((it,i)=>{const v=state.answers[key(1,i)]||'';h+=`<div class="${cardClass(1,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="hanzi-big">${esc(it.hanzi)}</div></div><select class="input-text" onchange="setAnswer(1,${i},this.value)">${selectOptions(it.options,v,'-- Chọn phiên âm --')}</select><div class="check-row"><button class="check-btn" onclick="checkOne(1,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(1,${i})">Làm lại câu</button></div>${standardFeedback(1,i,it,'Đáp án tham khảo')}</div>`});return h
}
function renderWordTranslate(ex){
 let h=`<div class="section-instruction"><strong>给下面的词翻译</strong><br>Phiên dịch cho những từ dưới đây</div>`;
 ex.data.forEach((it,i)=>{const v=state.answers[key(2,i)]||'';h+=`<div class="${cardClass(2,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.hanzi)}</b> <span class="muted">${esc(it.pinyin)}</span></div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(2,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(2,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(2,${i})">Làm lại câu</button></div>${standardFeedback(2,i,it)}</div>`});return h
}
function renderFill(ex){
 let h=`<div class="section-instruction"><strong>用上面的词填空</strong><br>Dùng những từ ngữ trên điền vào chỗ trống.</div><div class="question-card"><div class="word-bank">${ex.wordBank.map(w=>`<span class="word-chip">${esc(w)}</span>`).join('')}</div></div>`;
 ex.data.forEach((it,i)=>{const v=state.answers[key(3,i)]||'';h+=`<div class="${cardClass(3,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.before)} <select class="input-text" style="display:inline-block;width:auto;min-width:130px" onchange="setAnswer(3,${i},this.value)">${selectOptions(ex.wordBank,v,'-- 选择 --')}</select> ${esc(it.after)}</div></div><div class="check-row"><button class="check-btn" onclick="checkOne(3,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(3,${i})">Làm lại câu</button></div>${standardFeedback(3,i,it)}</div>`});return h
}
function renderTransform(ex){
 let h=`<div class="section-instruction"><strong>把上面带序号的句子改成问句</strong><br>Đổi những câu có số thứ tự trong đoạn văn trên thành câu hỏi.</div>`;
 ex.data.forEach((it,i)=>{const v=state.answers[key(4,i)]||'';h+=`<div class="${cardClass(4,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.original)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(4,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(4,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(4,${i})">Làm lại câu</button></div>${standardFeedback(4,i,it)}</div>`});return h
}
function renderJiDuoshao(ex){
 let h=`<div class="section-instruction"><strong>用 “几” 或 “多少” 提问</strong><br>Dùng “几” hoặc “多少” đặt câu hỏi.</div>`;
 ex.data.forEach((it,i)=>{const v=state.answers[key(5,i)]||'';h+=`<div class="${cardClass(5,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>A：</b> ______？<br><b>B：</b> ${esc(it.answerText)}<br><span class="muted">${esc(it.pinyin)}</span></div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(5,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(5,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(5,${i})">Làm lại câu</button></div>${standardFeedback(5,i,it)}</div>`});return h
}
function renderPairComplete(ex){
 let h=`<div class="section-instruction"><strong>请在后面两组词语中找出适当的词语完成句子</strong><br>Tìm từ ngữ thích hợp trong hai nhóm phía sau để hoàn thành câu.</div>`;
 h+=`<div class="question-card"><div class="qhead"><div class="qnum">1</div><div class="qtext"><b>${esc(ex.example)}</b></div></div><div class="word-bank">${ex.places.map(w=>`<span class="word-chip">${esc(w)}</span>`).join('')}</div><div class="word-bank">${ex.actions.map(w=>`<span class="word-chip">${esc(w)}</span>`).join('')}</div></div>`;
 ex.data.forEach((it,i)=>{const vp=state.answers[key(6,i)+'-p']||'',va=state.answers[key(6,i)+'-a']||'';const checked=!!state.checked[key(6,i)],ok=vp===it.place&&va===it.action;h+=`<div class="question-card ${checked?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${it.num}</div><div class="qtext">我去 <select class="input-text" style="display:inline-block;width:auto;min-width:115px" onchange="state.answers[key(6,${i})+'-p']=this.value;delete state.checked[key(6,${i})];save();renderNav()">${selectOptions(ex.places,vp,'-- 地点 --')}</select> <select class="input-text" style="display:inline-block;width:auto;min-width:115px" onchange="state.answers[key(6,${i})+'-a']=this.value;delete state.checked[key(6,${i})];save();renderNav()">${selectOptions(ex.actions,va,'-- 动作 --')}</select>。</div></div><div class="check-row"><button class="check-btn" onclick="checkOne(6,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(6,${i})">Làm lại câu</button></div>${checked?`<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Đúng':'△ Chưa khớp đáp án tham khảo'}</div><div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span></div><div><b>Giải thích:</b> ${esc(it.ex)}</div></div>`:''}</div>`});return h
}
function renderPosition(ex){
 let h=`<div class="section-instruction"><strong>给括号内的词找到适当的位置</strong><br>Tìm vị trí thích hợp cho từ trong ngoặc.</div>`;
 ex.data.forEach((it,i)=>{const v=state.answers[key(7,i)]||'',checked=!!state.checked[key(7,i)],ok=v===it.answer;h+=`<div class="question-card ${checked?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.sentence)} <b>（${esc(it.word)}）</b></div></div><div class="options-horizontal">${letters.map(L=>`<label class="option"><input type="radio" name="pos-${i}" value="${L}" ${v===L?'checked':''} onchange="setAnswer(7,${i},this.value)"><span class="letter">${L}</span></label>`).join('')}</div><div class="check-row"><button class="check-btn" onclick="checkOne(7,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(7,${i})">Làm lại câu</button></div>${checked?`<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Đúng':'△ Chưa đúng vị trí'}</div><div><b>Đáp án:</b> ${it.answer} → <span class="correct-answer">${esc(it.result)}</span></div><div><b>Giải thích:</b> ${esc(it.ex)}</div></div>`:''}</div>`});return h
}
function renderHanzi(ex){
 let h=`<div class="section-instruction"><strong>根据拼音写出汉字</strong><br>Viết chữ Hán dựa theo phiên âm.</div>`;
 ex.data.forEach((it,i)=>{const v=state.answers[key(8,i)]||'';h+=`<div class="${cardClass(8,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.pinyin)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(8,${i})">Làm lại câu</button></div>${standardFeedback(8,i,it)}</div>`});return h
}
function renderRadical(ex){
 let h=`<div class="section-instruction"><strong>请写出含有偏旁 “辶” 的汉子</strong><br>Viết những chữ Hán có chứa thiên bàng “辶”.</div>`;
 ex.data.forEach((it,i)=>{const v=state.answers[key(9,i)]||'';h+=`<div class="${cardClass(9,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.prompt)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(9,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(9,${i})">Làm lại câu</button></div>${standardFeedback(9,i,it)}</div>`});
 const i=ex.data.length,it=ex.challenge,v=state.answers[key(9,i)]||'';h+=`<div class="${cardClass(9,i,it)}"><div class="qhead"><div class="qnum">你猜猜</div><div class="qtext">${esc(it.prompt)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(9,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Kiểm tra câu</button><button class="clear-btn" onclick="clearOne(9,${i})">Làm lại câu</button></div>${standardFeedback(9,i,it)}</div>`;return h
}
function renderTranslation(ex){
 let h=`<div class="section-instruction"><strong>越汉翻译练习</strong><br>Luyện dịch Việt → Hoa.</div>`;
 ex.data.forEach((it,i)=>{const v=state.answers[key(10,i)]||'';h+=`<div class="${cardClass(10,i,it)}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAnswer(10,${i},this.value)">${esc(v)}</textarea><div class="check-row"><button class="check-btn" onclick="checkOne(10,${i})">Đối chiếu câu</button><button class="clear-btn" onclick="clearOne(10,${i})">Làm lại câu</button></div>${standardFeedback(10,i,it)}</div>`});return h
}
function renderSection(){
 const s=state.section,ex=exercises[s-1];document.getElementById('sectionBadge').textContent=`Bài ${s}`;document.getElementById('sectionTitle').textContent=ex.title;
 let h='';
 if(s===1)h=renderPinyin(ex);
 else if(s===2)h=renderWordTranslate(ex);
 else if(s===3)h=renderFill(ex);
 else if(s===4)h=renderTransform(ex);
 else if(s===5)h=renderJiDuoshao(ex);
 else if(s===6)h=renderPairComplete(ex);
 else if(s===7)h=renderPosition(ex);
 else if(s===8)h=renderHanzi(ex);
 else if(s===9)h=renderRadical(ex);
 else h=renderTranslation(ex);
 h+=`<div class="navigation-buttons"><button class="nav-btn" ${s===1?'disabled':''} onclick="goSection(${s-1})">← Bài trước</button><button class="nav-btn next" ${s===10?'disabled':''} onclick="goSection(${s+1})">Bài sau →</button></div>`;
 document.getElementById('contentBody').innerHTML=h
}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;document.getElementById('progressText').textContent=`${a}/${t}`;document.getElementById('progressFill').style.width=p+'%'}
function openAnswerCard(){let h='',names=sectionNames();for(let s=1;s<=10;s++){let a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${esc(names[s])}<br><span class="muted">${a}/${t} đã làm</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restartExam(){if(!confirm('Xóa toàn bộ đáp án và làm lại từ đầu?'))return;try{localStorage.removeItem(STORE)}catch(e){}state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};renderAll()}
function submitExam(){
 let correct=0,scored=0;
 for(let sec=1;sec<=10;sec++){
  const ex=exercises[sec-1];
  if(sec===6){ex.data.forEach((it,i)=>{scored++;if(state.answers[key(6,i)+'-p']===it.place&&state.answers[key(6,i)+'-a']===it.action)correct++});continue}
  if(sec===9){ex.data.forEach((it,i)=>{scored++;if(isAccepted(it,state.answers[key(9,i)]||''))correct++});scored++;if(isAccepted(ex.challenge,state.answers[key(9,ex.data.length)]||''))correct++;continue}
  ex.data.forEach((it,i)=>{scored++;if(sec===7){if((state.answers[key(7,i)]||'')===it.answer)correct++}else if(isAccepted(it,state.answers[key(sec,i)]||''))correct++})
 }
 const pct=scored?Math.round(correct/scored*100):0;
 document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${scored}</div><div style="text-align:center;font-weight:700">Kết quả đối chiếu: ${pct}%</div><div style="margin-top:15px;line-height:1.7"><b>Tiến độ:</b> ${totalAnswered()}/${totalCount()} mục đã làm.<br><b>Lưu ý:</b> Các bài đặt câu hỏi và dịch có thể có nhiều cách diễn đạt đúng; hệ thống đối chiếu với đáp án tham khảo GPT đã phân tích.</div>`;
 document.getElementById('resultModal').classList.add('show')
}
function tick(){const e=Math.floor((Date.now()-(state.startAt||Date.now()))/1000),m=Math.floor(e/60),s=e%60;document.getElementById('timerText').textContent=`Thời gian ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('timerProgress').style.width=Math.min(100,(e%3600)/36)+'%'}
let noteSaveTimer=null;
function openNoteEditor(){const o=document.getElementById('note-editor-overlay'),ed=document.getElementById('rich-editor');if(!o||!ed)return;try{const x=localStorage.getItem(NOTE_STORE);if(x!==null)ed.innerHTML=x}catch(e){}o.classList.add('show');document.body.classList.add('note-open');ed.focus()}
function closeNoteEditor(){const o=document.getElementById('note-editor-overlay');if(o)o.classList.remove('show');document.body.classList.remove('note-open')}
function noteCommand(c,v=null){document.execCommand(c,false,v);document.getElementById('rich-editor')?.focus();scheduleNoteAutosave()}
function scheduleNoteAutosave(){clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>saveNotes(false),350)}
function saveNotes(closeAfter=false){const ed=document.getElementById('rich-editor');if(!ed)return;try{localStorage.setItem(NOTE_STORE,ed.innerHTML)}catch(e){}if(closeAfter)closeNoteEditor()}
function clearNoteEditor(){if(!confirm('Xóa toàn bộ ghi chú?'))return;const ed=document.getElementById('rich-editor');if(ed){ed.innerHTML='';ed.focus();scheduleNoteAutosave()}}
document.getElementById('rich-editor')?.addEventListener('input',scheduleNoteAutosave);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('note-editor-overlay')?.classList.contains('show'))closeNoteEditor()});
restoreProgress(false);setInterval(tick,1000);tick();

</script>
</body></html>
