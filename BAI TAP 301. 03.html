function toggleU(i,j){let a=getUSelected(i),p=a.indexOf(j);if(p>=0)a.splice(p,1);else a.push(j);a.sort((x,y)=>x-y);state.answers[key(2,i)]=a.join(',');delete state.checked[key(2,i)];save();renderSection();renderNav()}
function uOk(i){const a=getUSelected(i),b=exercises[2].data[i].answer;return a.length===b.length&&a.every((x,k)=>x===b[k])}
function uFeedback(i){if(!state.checked[key(2,i)])return '<div class="feedback"></div>';const it=exercises[2].data[i],ok=uOk(i);const ans=it.answer.length?it.answer.map(j=>it.syllables[j]).join('、'):'Không có âm tiết ü';return `<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div>${ok?'':`<div>Đáp án: <span class="correct-answer">${esc(ans)}</span></div>`}<div><b>Giải thích:</b> ${esc(explanations[2][i])}</div></div>`}
function renderUmlaut(ex){let h=`<div class="section-instruction"><strong>找出有“u: (uy)” 的音节，在音节下画 “——”</strong><br>Tìm và gạch dưới những chữ có âm tiết “u: (uy)”.</div>`;ex.data.forEach((it,i)=>{const sel=getUSelected(i),c=state.checked[key(2,i)],ok=uOk(i);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="syllable-row">${it.syllables.map((s,j)=>`<button type="button" class="syllable-chip ${sel.includes(j)?'selected':''}" onclick="toggleU(${i},${j})">${esc(s)}</button>`).join('')}</div></div></div><div class="check-row"><button class="check-btn" onclick="checkOne(2,${i})">Kiểm tra câu</button></div>${uFeedback(i)}</div>`});return h}
function renderTone(ex){let h=`<div class="section-instruction"><strong>请在“不”和“一”的上边标上声调</strong><br>Chỉ ra thanh điệu “不” và “一”.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(3,i)]||'',c=state.checked[key(3,i)],ok=same(3,i,it.answer);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="tone-word">${esc(it.word)}</div></div></div><input class="input-text" style="max-width:180px" value="${esc(v)}" oninput="setAnswer(3,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(3,${i})">Kiểm tra câu</button></div>${feedback(3,i,it.answer,explanations[3][i])}</div>`});return h}
function renderPinyinInput(ex){let h=`<div class="section-instruction"><strong>给下面的词注音</strong><br>Phiên âm cho những từ dưới đây.</div>`;ex.data.forEach((it,i)=>{const c=state.checked[key(4,i)],ok=same(4,i,it.answer);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext hanzi-big">${esc(it.hanzi)}</div></div><input class="input-text" value="${esc(state.answers[key(4,i)]||'')}" oninput="setAnswer(4,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(4,${i})">Kiểm tra câu</button></div>${feedback(4,i,it.answer,explanations[4][i])}</div>`});return h}
function dialogueOk(i){const it=exercises[5].data[i],v=norm(state.answers[key(5,i)]||'');return it.accepted.some(a=>norm(a)===v)}
function dinput(i,w=220){return `<input class="dialogue-input" style="width:${w}px" value="${esc(state.answers[key(5,i)]||'')}" oninput="setAnswer(5,${i},this.value)">`}
function checkDialogueGroup(g){exercises[5].data.forEach((it,i)=>{if(it.group===g)state.checked[key(5,i)]=true});save();renderSection();renderNav()}
function dialogueGroupClass(g){const ids=exercises[5].data.map((x,i)=>x.group===g?i:-1).filter(i=>i>=0);const checked=ids.every(i=>state.checked[key(5,i)]);if(!checked)return 'question-card';const ok=ids.every(dialogueOk);return 'question-card checked '+(ok?'correct':'wrong')}
function dialogueGroupFeedback(g){const ids=exercises[5].data.map((x,i)=>x.group===g?i:-1).filter(i=>i>=0);if(!ids.some(i=>state.checked[key(5,i)]))return '<div class="feedback"></div>';return `<div class="feedback show">${ids.map(i=>{const it=exercises[5].data[i],ok=dialogueOk(i);return `<div class="dialogue-feedback-row ${ok?'ok':'bad'}"><b>${esc(it.label)}. ${ok?'✓ Đúng':'✗ Chưa đúng'}</b>${ok?'':` · Đáp án tham khảo: <span class="correct-answer">${esc(it.answer)}</span>`}<br>${esc(it.ex)}</div>`}).join('')}</div>`}
function renderDialogue(ex){return `<div class="section-instruction"><strong>完成对话</strong><br>Hoàn thành đối thoại.</div>
<div class="${dialogueGroupClass(1)}"><div class="qhead"><div class="qnum">1</div><div class="qtext dialogue-block"><div class="dialogue-line">A：今天10月31号吗？ <span class="dialogue-hint">Jīntiān 10 yuè 31 hào ma?</span></div><div class="dialogue-line">B：不，${dinput(0,280)}。 <span class="dialogue-hint">（11.1）</span></div></div></div><div class="check-row"><button class="check-btn" onclick="checkDialogueGroup(1)">Kiểm tra câu</button></div>${dialogueGroupFeedback(1)}</div>
<div class="${dialogueGroupClass(2)}"><div class="qhead"><div class="qnum">2</div><div class="qtext dialogue-block"><div class="dialogue-line">A：明天你爸爸，妈妈来吗？ <span class="dialogue-hint">Míngtiān nǐ bàba, māmā lái ma?</span></div><div class="dialogue-line">B：我爸爸 ${dinput(1,150)}，我妈妈 ${dinput(2,170)}。 <span class="dialogue-hint">（不 Bù）</span></div></div></div><div class="check-row"><button class="check-btn" onclick="checkDialogueGroup(2)">Kiểm tra câu</button></div>${dialogueGroupFeedback(2)}</div>
<div class="${dialogueGroupClass(3)}"><div class="qhead"><div class="qnum">3</div><div class="qtext dialogue-block"><div class="dialogue-line">A：我 ${dinput(3,220)}，${dinput(4,160)}？ <span class="dialogue-hint">（呢 Ne）</span></div><div class="dialogue-line">B：我身体也很好，谢谢！ <span class="dialogue-hint">Wǒ shēntǐ yě hěn hǎo, xièxiè!</span></div></div></div><div class="check-row"><button class="check-btn" onclick="checkDialogueGroup(3)">Kiểm tra câu</button></div>${dialogueGroupFeedback(3)}</div>
<div class="${dialogueGroupClass(4)}"><div class="qhead"><div class="qnum">4</div><div class="qtext dialogue-block"><div class="dialogue-line">A：我工作很忙，也很累，${dinput(5,160)}？ <span class="dialogue-hint">Wǒ gōngzuò hěn máng, yě hěn lèi</span></div><div class="dialogue-line">B：我 ${dinput(6,300)}。 <span class="dialogue-hint">（不 Bù，太 Tài）</span></div></div></div><div class="check-row"><button class="check-btn" onclick="checkDialogueGroup(4)">Kiểm tra câu</button></div>${dialogueGroupFeedback(4)}</div>
<div class="${dialogueGroupClass(5)}"><div class="qhead"><div class="qnum">5</div><div class="qtext dialogue-block"><div class="dialogue-line">A：明年你哥哥来，你 ${dinput(7,180)}？ <span class="dialogue-hint">（呢 Ne）</span></div><div class="dialogue-line">B：我妹妹工作很忙，她不来。 <span class="dialogue-hint">Wǒ mèimei gōngzuò hěn máng, tā bù lái.</span></div></div></div><div class="check-row"><button class="check-btn" onclick="checkDialogueGroup(5)">Kiểm tra câu</button></div>${dialogueGroupFeedback(5)}</div>`}
function setPosition(i,j,v){state.answers[`6-${i}-${j}`]=v;delete state.checked[key(6,i)];save();renderNav()}
function positionOk(i){return exercises[6].data[i].words.every((w,j)=>String(state.answers[`6-${i}-${j}`]||'')===w.answer)}
function positionOptions(i,j){return `<div class="options-horizontal">${['A','B','C','D'].map(x=>`<label class="option tone-choice"><input type="radio" name="pos-${i}-${j}" value="${x}" ${state.answers[`6-${i}-${j}`]===x?'checked':''} onchange="setPosition(${i},${j},this.value)"><span class="letter">${x}</span></label>`).join('')}</div>`}
function positionFeedback(i){if(!state.checked[key(6,i)])return '<div class="feedback"></div>';const it=exercises[6].data[i],ok=positionOk(i),ans=it.words.map(w=>`${w.word} = ${w.answer}`).join('；');return `<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div>${ok?'':`<div>Đáp án: <span class="correct-answer">${esc(ans)}</span></div>`}<div>句子：<span class="correct-answer">${esc(it.sample)}</span></div><div><b>Giải thích:</b> ${esc(explanations[6][i])}</div></div>`}
function renderPosition(ex){let h=`<div class="section-instruction"><strong>给括号内的词找到适当的位置</strong><br>Tìm vị trí thích hợp cho từ trong ngoặc.</div>`;ex.data.forEach((it,i)=>{const c=state.checked[key(6,i)],ok=positionOk(i);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext" style="width:100%"><div class="position-sentence">${esc(it.sentence)}</div><div class="pinyin-grid-label">${esc(it.pinyin)}</div><div class="position-groups">${it.words.map((w,j)=>`<div class="position-group"><span class="position-label">（${esc(w.word)}）</span>${positionOptions(i,j)}</div>`).join('')}</div></div></div><div class="check-row"><button class="check-btn" onclick="checkOne(6,${i})">Kiểm tra câu</button></div>${positionFeedback(i)}</div>`});return h}
function hanziSentenceOk(i){const it=exercises[7].data[i],v=state.answers[key(7,i)]||'';return (it.accepted||[it.hanzi]).some(a=>norm(a)===norm(v))}
function hanziSentenceFeedback(i){if(!state.checked[key(7,i)])return '<div class="feedback"></div>';const it=exercises[7].data[i],ok=hanziSentenceOk(i);return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Đúng':'△ Chưa khớp đáp án tham khảo'}</div><div>Đáp án tham khảo: <span class="correct-answer">${esc(it.hanzi)}</span></div><div><b>Giải thích:</b> ${esc(explanations[7][i])}</div></div>`}
function renderHanzi(ex,sec){let h=`<div class="section-instruction"><strong>根据拼音写出汉字</strong><br>Viết chữ Hán dựa theo phiên âm.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(sec,i)]||'',c=state.checked[key(sec,i)],ok=hanziSentenceOk(i);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.pinyin)}</div></div><input class="input-text" value="${esc(v)}" oninput="setAnswer(${sec},${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(${sec},${i})">Kiểm tra câu</button></div>${hanziSentenceFeedback(i)}</div>`});return h}
function renderRadical(ex){let h=`<div class="section-instruction"><strong>请写出含有偏旁“女”的汉子</strong><br>Viết những chữ Hán có chứa thiên bàng “女”.</div>`;ex.data.forEach((it,i)=>{const c=state.checked[key(8,i)],ok=same(8,i,it.hanzi);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext radical-prompt">${esc(it.pinyin)}</div></div><input class="input-text" value="${esc(state.answers[key(8,i)]||'')}" oninput="setAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Kiểm tra câu</button></div>${feedback(8,i,it.hanzi,explanations[8][i])}</div>`});return h}
function translationOk(i){const it=exercises[9].data[i],v=norm(state.answers[key(9,i)]||'');return (it.accepted||[it.cn]).some(a=>norm(a)===v)}
function renderTranslation(ex){let h=`<div class="section-instruction"><strong>越汉翻译练习</strong><br>Luyện dịch Việt Hoa.</div>`;ex.data.forEach((it,i)=>{const v=state.answers[key(9,i)]||'',c=state.checked[key(9,i)],ok=translationOk(i);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setAnswer(9,${i},this.value)">${esc(v)}</textarea><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Đối chiếu đáp án</button></div>${translationFeedback(i)}</div>`});return h}
function translationFeedback(i){if(!state.checked[key(9,i)])return '<div class="feedback"></div>';const it=exercises[9].data[i],ok=translationOk(i);return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div>Đáp án tham khảo: <span class="correct-answer">${esc(it.cn)}</span></div><div><b>Giải thích:</b> ${esc(explanations[9][i])}</div></div>`}
function renderSection(){const sec=state.section,ex=exercises[sec];document.getElementById('sectionBadge').textContent='Bài '+sec;document.getElementById('sectionTitle').textContent=sectionNames()[sec];let h='';if(sec===1)h=renderInitial(ex);else if(sec===2)h=renderUmlaut(ex);else if(sec===3)h=renderTone(ex);else if(sec===4)h=renderPinyinInput(ex);else if(sec===5)h=renderDialogue(ex);else if(sec===6)h=renderPosition(ex);else if(sec===7)h=renderHanzi(ex,7);else if(sec===8)h=renderRadical(ex);else if(sec===9)h=renderTranslation(ex);h+=`<div class="navigation-buttons"><button class="nav-btn" onclick="goSection(${Math.max(1,sec-1)})" ${sec===1?'disabled':''}>上一题 · Bài trước</button><button class="nav-btn next" onclick="goSection(${Math.min(9,sec+1)})" ${sec===9?'disabled':''}>下一题 · Bài sau</button></div>`;document.getElementById('contentBody').innerHTML=h;window.scrollTo(0,0)}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;document.getElementById('progressText').textContent=`${a}/${t}`;document.getElementById('progressFill').style.width=p+'%'}
function openAnswerCard(){let h='';for(let s=1;s<=9;s++){const a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br><span class="muted">${a}/${t}</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restartExam(){if(!confirm('重新答题？'))return;try{localStorage.removeItem(STORE)}catch(e){}state.section=1;state.answers={};state.checked={};state.startAt=Date.now();state.fontLarge=false;renderAll()}
function objectiveScore(){let correct=0,total=0;exercises[1].groups.forEach((g,i)=>{total++;if(initialOk(i))correct++});exercises[2].data.forEach((it,i)=>{total++;if(uOk(i))correct++});exercises[3].data.forEach((it,i)=>{total++;if(same(3,i,it.answer))correct++});exercises[4].data.forEach((it,i)=>{total++;if(same(4,i,it.answer))correct++});exercises[5].data.forEach((it,i)=>{total++;if(dialogueOk(i))correct++});exercises[6].data.forEach((it,i)=>{total++;if(positionOk(i))correct++});exercises[7].data.forEach((it,i)=>{total++;if(hanziSentenceOk(i))correct++});exercises[8].data.forEach((it,i)=>{total++;if(same(8,i,it.hanzi))correct++});return {correct,total}}
function submitExam(){const sc=objectiveScore(),pct=sc.total?Math.round(sc.correct/sc.total*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${sc.correct}/${sc.total}</div><div style="text-align:center;font-weight:700">Kết quả: ${pct}%</div><div style="margin-top:15px;line-height:1.7"><b>Tiến độ toàn bài:</b> ${totalAnswered()}/${totalCount()}.<br><b>Bài 9:</b> đối chiếu riêng với đáp án tham khảo vì câu dịch có thể có nhiều cách diễn đạt đúng.</div>`;document.getElementById('resultModal').classList.add('show')}
function tick(){const e=Math.floor((Date.now()-(state.startAt||Date.now()))/1000),m=Math.floor(e/60),ss=e%60;document.getElementById('timerText').textContent=`Thời gian ${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;document.getElementById('timerProgress').style.width=Math.min(100,(e%3600)/36)+'%'}
let noteSaveTimer=null;function openNoteEditor(){const overlay=document.getElementById('note-editor-overlay'),editor=document.getElementById('rich-editor');if(!overlay||!editor)return;try{const saved=localStorage.getItem(NOTE_STORE);if(saved!==null)editor.innerHTML=saved}catch(e){}overlay.classList.add('show');document.body.classList.add('note-open');editor.focus()}function closeNoteEditor(){document.getElementById('note-editor-overlay')?.classList.remove('show');document.body.classList.remove('note-open')}function noteCommand(cmd,val=null){document.execCommand(cmd,false,val);document.getElementById('rich-editor')?.focus();scheduleNoteAutosave()}function scheduleNoteAutosave(){clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>saveNotes(false,true),400)}function saveNotes(closeAfter=false,silent=false){const editor=document.getElementById('rich-editor');if(!editor)return;try{localStorage.setItem(NOTE_STORE,editor.innerHTML)}catch(e){}if(closeAfter)closeNoteEditor()}function clearNoteEditor(){if(confirm('Xóa tất cả ghi chú?')){document.getElementById('rich-editor').innerHTML='';saveNotes(false,true)}}
document.getElementById('rich-editor')?.addEventListener('input',scheduleNoteAutosave);window.addEventListener('load',()=>{restoreProgress(false);renderAll();setInterval(tick,1000);tick()});
</script>
</body></html>
