const STORE='BAI_TAP_301_05_FINAL_V1';
const NOTE_STORE='BAI301_BAI05_NOTES_FINAL_V1';
const state={section:1,answers:{},checked:{},startAt:Date.now(),fontLarge:false};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[\s，。！？、；：,.!?;:]/g,'')}
function key(sec,item){return sec+'-'+item}
function explain(sec,item){return (explanations[sec]&&explanations[sec][item])||'Đối chiếu cấu trúc, nghĩa và trật tự từ với đáp án tham khảo.'}
function acceptedAnswers(sec,item,ans){return accepted[key(sec,item)]||[ans]}
function isAccepted(sec,item,val,ans){return acceptedAnswers(sec,item,ans).some(a=>norm(a)===norm(val))}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}updateProgress()}
function restoreProgress(show=false){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x){Object.assign(state,x);if(state.section>MAX_SECTION)state.section=1;renderAll();if(show)alert('Đã khôi phục tiến độ.')}else if(show)alert('Chưa có tiến độ đã lưu.')}catch(e){if(show)alert('Không thể khôi phục dữ liệu.')}}
function sectionNames(){return ['','Phiên âm','Dịch từ','Điền từ','Đổi thành câu hỏi','Hoàn thành đối thoại','Sửa câu sai','Viết chữ Hán','Chữ có 讠','Dịch Việt → Hoa']}
function fillItems(){return exercises[3].passage.filter(x=>x.type==='blank')}
function itemCount(sec){if(sec===3)return fillItems().length;return exercises[sec].data.length}
function answeredCount(sec){let n=0;for(let i=0;i<itemCount(sec);i++)if(String(state.answers[key(sec,i)]??'').trim())n++;return n}
function totalCount(){let t=0;for(let s=1;s<=MAX_SECTION;s++)t+=itemCount(s);return t}
function totalAnswered(){let n=0;for(let s=1;s<=MAX_SECTION;s++)n+=answeredCount(s);return n}
function renderNav(){let h='';for(let s=1;s<=MAX_SECTION;s++)h+=`<div class="nav-item ${state.section===s?'active':''}" onclick="goSection(${s})"><span>Bài ${s}</span></div>`;document.getElementById('sectionNav').innerHTML=h}
function goSection(s){state.section=Math.max(1,Math.min(MAX_SECTION,s));save();renderSection();renderNav()}
function renderAll(){renderNav();renderSection();updateProgress();document.body.classList.toggle('font-large',!!state.fontLarge)}
function setTextAnswer(sec,i,v){state.answers[key(sec,i)]=v;delete state.checked[key(sec,i)];save();renderNav()}
function checkOne(sec,i){state.checked[key(sec,i)]=true;save();renderSection();renderNav()}
function basicFeedback(sec,i,ans,label='Đáp án tham khảo'){if(!state.checked[key(sec,i)])return '<div class="feedback"></div>';const v=state.answers[key(sec,i)]||'',ok=isAccepted(sec,i,v,ans);return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div>${label}: <span class="correct-answer">${esc(ans)}</span></div><div><b>Giải thích:</b> ${esc(explain(sec,i))}</div></div>`}
function renderPinyin(ex){let h='<div class="section-instruction"><strong>Phiên âm cho những từ dưới đây.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(1,i)]||'',c=!!state.checked[key(1,i)],ok=isAccepted(1,i,v,it.answer);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="hanzi-big">${esc(it.hanzi)}</div></div></div><input class="input-text" value="${esc(v)}" oninput="setTextAnswer(1,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(1,${i})">Kiểm tra câu</button></div>${basicFeedback(1,i,it.answer)}</div>`});return h}
function wordTranslateAccepted(it,val){return (it.accepted||[it.sample]).some(a=>norm(a)===norm(val))}
function renderWordTranslate(ex){let h='<div class="section-instruction"><strong>Phiên dịch cho những từ dưới đây.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(2,i)]||'',c=!!state.checked[key(2,i)],ok=wordTranslateAccepted(it,v);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="hanzi-big" style="font-size:30px">${esc(it.hanzi)}</div><div class="muted">${esc(it.pinyin)}</div></div></div><input class="input-text" value="${esc(v)}" oninput="setTextAnswer(2,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(2,${i})">Đối chiếu đáp án</button></div>${wordFeedback(i,it)}</div>`});return h}
function wordFeedback(i,it){if(!state.checked[key(2,i)])return '<div class="feedback"></div>';const ok=wordTranslateAccepted(it,state.answers[key(2,i)]||'');return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div>Đáp án tham khảo: <span class="correct-answer">${esc(it.sample)}</span></div><div><b>Giải thích:</b> ${esc(explain(2,i))}</div></div>`}
function fillOk(i){const it=fillItems()[i];return it&&norm(state.answers[key(3,i)]||'')===norm(it.answer)}
function renderFill(ex){let h=`<div class="section-instruction"><strong>${esc(ex.title||'Điền vào chỗ trống')}</strong>${ex.wordBank?`<div class="word-bank">${ex.wordBank.map(w=>`<span class="word-chip">${esc(w)}</span>`).join('')}</div>`:''}</div><div class="question-card"><div class="passage" style="line-height:2.6">`;let idx=0;ex.passage.forEach(t=>{if(t.type==='text')h+=esc(t.text);else if(t.type==='newline')h+='<br>'+esc(t.text||'');else if(t.type==='blank'){const i=idx++,v=state.answers[key(3,i)]||'',opts=(t.options||ex.wordBank||[]);h+=`<select class="blank-select" onchange="setTextAnswer(3,${i},this.value)"><option value="">-- Chọn --</option>${opts.map(o=>`<option value="${esc(o)}" ${norm(v)===norm(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`}});h+='</div></div>';fillItems().forEach((it,i)=>{const c=!!state.checked[key(3,i)],ok=fillOk(i);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">Chỗ trống ${i+1}</div></div><div class="check-row"><button class="check-btn" onclick="checkOne(3,${i})">Kiểm tra câu</button></div>${fillFeedback(i,it)}</div>`});return h}
function fillFeedback(i,it){if(!state.checked[key(3,i)])return '<div class="feedback"></div>';const ok=fillOk(i);return `<div class="feedback show ${ok?'correct':'wrong'}"><div class="status">${ok?'✓ Đúng':'✗ Chưa đúng'}</div>${ok?'':`<div>Đáp án tham khảo: <span class="correct-answer">${esc(it.answer)}</span></div>`}<div><b>Giải thích:</b> ${esc(explain(3,it.id))}</div></div>`}
function renderTransform(ex){let h='<div class="section-instruction"><strong>Dùng “什么、哪儿、谁” để đổi những câu có số thứ tự thành câu hỏi.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(4,i)]||'',c=!!state.checked[key(4,i)],ok=isAccepted(4,i,v,it.answer);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.original)}</div></div><input class="input-text" value="${esc(v)}" oninput="setTextAnswer(4,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(4,${i})">Kiểm tra câu</button></div>${basicFeedback(4,i,it.answer)}</div>`});return h}
function renderDialogue(ex){let h='<div class="section-instruction"><strong>Hoàn thành đối thoại.</strong></div>';const groups=[...new Set(ex.data.map(it=>it.dialogue))];groups.forEach(g=>{const indices=[];ex.data.forEach((it,i)=>{if(it.dialogue===g)indices.push(i)});h+=`<div class="question-card"><div class="qhead"><div class="qnum">${g}</div><div class="qtext dialogue-block">`;indices.forEach(i=>{const it=ex.data[i];h+=`<div style="margin-bottom:14px"><div style="white-space:pre-line;margin-bottom:8px">${esc(it.prompt)}</div><input class="input-text" value="${esc(state.answers[key(5,i)]||'')}" oninput="setTextAnswer(5,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(5,${i})">Kiểm tra câu</button></div>${basicFeedback(5,i,it.answer)}</div>`});h+='</div></div></div>'});return h}
function renderError(ex){let h='<div class="section-instruction"><strong>Sửa câu sai.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(6,i)]||'',c=!!state.checked[key(6,i)],ok=isAccepted(6,i,v,it.answer);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><div class="wrong-sentence">${esc(it.original.replace(/^\d+\.\s*/,''))}</div></div></div><input class="input-text" value="${esc(v)}" oninput="setTextAnswer(6,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(6,${i})">Kiểm tra câu</button></div>${errorFeedback(i,it)}</div>`});return h}
function errorFeedback(i,it){if(!state.checked[key(6,i)])return '<div class="feedback"></div>';const ok=isAccepted(6,i,state.answers[key(6,i)]||'',it.answer);return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div><b>Lỗi sai:</b> ${esc(it.error)}</div><div><b>Đáp án tham khảo:</b> <span class="correct-answer">${esc(it.answer)}</span></div><div><b>Vì sao sửa như vậy:</b> ${esc(it.fix)}</div></div>`}
function renderHanzi(ex){let h='<div class="section-instruction"><strong>Viết chữ Hán dựa theo phiên âm.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(7,i)]||'',c=!!state.checked[key(7,i)],ok=isAccepted(7,i,v,it.hanzi);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.pinyin)}</b></div></div><input class="input-text" value="${esc(v)}" oninput="setTextAnswer(7,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(7,${i})">Kiểm tra câu</button></div>${basicFeedback(7,i,it.hanzi)}</div>`});return h}
function renderChar(ex){let h='<div class="section-instruction"><strong>Viết những chữ Hán có chứa thiên bàng “讠”.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(8,i)]||'',c=!!state.checked[key(8,i)],ok=isAccepted(8,i,v,it.hanzi);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext"><b>${esc(it.pinyin)}</b></div></div><input class="input-text" maxlength="1" value="${esc(v)}" oninput="setTextAnswer(8,${i},this.value)"><div class="check-row"><button class="check-btn" onclick="checkOne(8,${i})">Kiểm tra câu</button></div>${basicFeedback(8,i,it.hanzi)}</div>`});return h}
function translationOk(i){const it=exercises[9].data[i],v=state.answers[key(9,i)]||'';return (it.accepted||[it.cn]).some(a=>norm(a)===norm(v))}
function renderTranslation(ex){let h='<div class="section-instruction"><strong>Luyện dịch Việt → Hoa.</strong></div>';ex.data.forEach((it,i)=>{const v=state.answers[key(9,i)]||'',c=!!state.checked[key(9,i)],ok=translationOk(i);h+=`<div class="question-card ${c?'checked '+(ok?'correct':'wrong'):''}"><div class="qhead"><div class="qnum">${i+1}</div><div class="qtext">${esc(it.vi)}</div></div><textarea class="input-area" oninput="setTextAnswer(9,${i},this.value)">${esc(v)}</textarea><div class="check-row"><button class="check-btn" onclick="checkOne(9,${i})">Đối chiếu đáp án</button></div>${translationFeedback(i,it)}</div>`});return h}
function translationFeedback(i,it){if(!state.checked[key(9,i)])return '<div class="feedback"></div>';const ok=translationOk(i);return `<div class="feedback show ${ok?'correct':'sample'}"><div class="status">${ok?'✓ Khớp đáp án tham khảo':'△ Chưa khớp đáp án tham khảo'}</div><div>Đáp án tham khảo: <span class="correct-answer">${esc(it.cn)}</span></div><div><b>Giải thích:</b> ${esc(explain(9,i))}</div></div>`}
function renderSection(){const sec=state.section,ex=exercises[sec],names=sectionNames();document.getElementById('sectionBadge').textContent='Bài '+sec;document.getElementById('sectionTitle').textContent=names[sec];let h='';if(sec===1)h=renderPinyin(ex);else if(sec===2)h=renderWordTranslate(ex);else if(sec===3)h=renderFill(ex);else if(sec===4)h=renderTransform(ex);else if(sec===5)h=renderDialogue(ex);else if(sec===6)h=renderError(ex);else if(sec===7)h=renderHanzi(ex);else if(sec===8)h=renderChar(ex);else if(sec===9)h=renderTranslation(ex);h+=`<div class="navigation-buttons"><button class="nav-btn" onclick="goSection(${Math.max(1,sec-1)})" ${sec===1?'disabled':''}>上一题 · Bài trước</button><button class="nav-btn next" onclick="goSection(${Math.min(MAX_SECTION,sec+1)})" ${sec===MAX_SECTION?'disabled':''}>下一题 · Bài sau</button></div>`;document.getElementById('contentBody').innerHTML=h;window.scrollTo(0,0)}
function updateProgress(){const a=totalAnswered(),t=totalCount(),p=t?Math.round(a/t*100):0;document.getElementById('progressText').textContent=`${a}/${t}`;document.getElementById('progressFill').style.width=p+'%'}
function openAnswerCard(){let h='',names=sectionNames();for(let s=1;s<=MAX_SECTION;s++){const a=answeredCount(s),t=itemCount(s);h+=`<div class="answer-cell ${a===t&&t?'done':''}" onclick="closeModal('answerModal');goSection(${s})"><b>Bài ${s}</b><br>${esc(names[s])}<br><span class="muted">${a}/${t} đã làm</span></div>`}document.getElementById('answerGrid').innerHTML=h;document.getElementById('answerModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function toggleFont(){state.fontLarge=!state.fontLarge;document.body.classList.toggle('font-large',state.fontLarge);save()}
function restartExam(){if(!confirm('Xóa toàn bộ đáp án và làm lại từ đầu?'))return;try{localStorage.removeItem(STORE)}catch(e){}state.section=1;state.answers={};state.checked={};state.startAt=Date.now();state.fontLarge=false;renderAll()}
function submitExam(){let correct=0,objective=0,answered=totalAnswered(),total=totalCount();
 exercises[1].data.forEach((it,i)=>{objective++;if(isAccepted(1,i,state.answers[key(1,i)]||'',it.answer))correct++});
 fillItems().forEach((it,i)=>{objective++;if(fillOk(i))correct++});
 exercises[4].data.forEach((it,i)=>{objective++;if(isAccepted(4,i,state.answers[key(4,i)]||'',it.answer))correct++});
 exercises[5].data.forEach((it,i)=>{objective++;if(isAccepted(5,i,state.answers[key(5,i)]||'',it.answer))correct++});
 exercises[6].data.forEach((it,i)=>{objective++;if(isAccepted(6,i,state.answers[key(6,i)]||'',it.answer))correct++});
 exercises[7].data.forEach((it,i)=>{objective++;if(norm(state.answers[key(7,i)]||'')===norm(it.hanzi))correct++});
 exercises[8].data.forEach((it,i)=>{objective++;if(norm(state.answers[key(8,i)]||'')===norm(it.hanzi))correct++});
 const pct=objective?Math.round(correct/objective*100):0;document.getElementById('resultBody').innerHTML=`<div class="result-score">${correct}/${objective}</div><div style="text-align:center;font-weight:700">Kết quả phần có đáp án xác định: ${pct}%</div><div style="margin-top:15px;line-height:1.7"><b>Tiến độ toàn bài:</b> ${answered}/${total}.<br><b>Bài 2 và Bài 9:</b> là phần đối chiếu đáp án tham khảo; cách diễn đạt khác mẫu có thể vẫn đúng.</div>`;document.getElementById('resultModal').classList.add('show')}
function tick(){const e=Math.floor((Date.now()-(state.startAt||Date.now()))/1000),m=Math.floor(e/60),s=e%60;document.getElementById('timerText').textContent=`Thời gian ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('timerProgress').style.width=Math.min(100,(e%3600)/36)+'%'}
let noteSaveTimer=null;
function openNoteEditor(){const overlay=document.getElementById('note-editor-overlay'),editor=document.getElementById('rich-editor');if(!overlay||!editor)return;try{const saved=localStorage.getItem(NOTE_STORE);if(saved!==null)editor.innerHTML=saved}catch(e){}overlay.classList.add('show');document.body.classList.add('note-open');editor.focus()}
function closeNoteEditor(){document.getElementById('note-editor-overlay')?.classList.remove('show');document.body.classList.remove('note-open')}
function noteCommand(command,value=null){document.execCommand(command,false,value);document.getElementById('rich-editor')?.focus();scheduleNoteAutosave()}
function scheduleNoteAutosave(){clearTimeout(noteSaveTimer);noteSaveTimer=setTimeout(()=>saveNotes(false),350)}
function saveNotes(closeAfter=false){const editor=document.getElementById('rich-editor');if(!editor)return;try{localStorage.setItem(NOTE_STORE,editor.innerHTML)}catch(e){}if(closeAfter)closeNoteEditor()}
function clearNoteEditor(){if(!confirm('Xóa toàn bộ ghi chú?'))return;const editor=document.getElementById('rich-editor');if(editor){editor.innerHTML='';editor.focus();scheduleNoteAutosave()}}
document.getElementById('rich-editor')?.addEventListener('input',scheduleNoteAutosave);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('note-editor-overlay')?.classList.contains('show'))closeNoteEditor()});
restoreProgress(false);renderAll();setInterval(tick,1000);tick();
</script>
</body></html>
